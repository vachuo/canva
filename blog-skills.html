<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">The Skills Paradox: More Schooling, Flat Literacy</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Adults have spent more years in education than ever, yet in most rich countries their literacy has stalled or fallen. The explanation says a great deal about how skills are built and kept.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 6 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #0D9488">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 8px">
<img src="assets/img/cac9841562397b7ca613a7ffcdd03071.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/e1b79eb4952f14718c70fb2b72622cc1.svg" alt="" style="display: block; height: 97%; width: auto">
</div>
</figure>

<p style="margin: 0">For half a century, the default answer to the question of skills has been more schooling. On that measure the world has succeeded: in almost every country, today’s adults have spent more years in education than their parents. So the results of the OECD’s second Survey of Adult Skills, published in December 2024, came as a shock. Across the participating countries, average adult literacy improved significantly over the previous decade in only two, Finland and Denmark. In most others it stagnated or declined. Declines were concentrated among adults who already had weaker skills, so the gap between the most and least proficient widened in many countries.</p>
<p style="margin: 0">More schooling, flat literacy. Resolving that paradox requires taking seriously three uncomfortable ideas about how skills work.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Skills decay when they are not used</h2>
<p style="margin: 0">A qualification is a snapshot of what someone could do on the day they earned it. Skills, unlike certificates, depreciate. Research using adult skills surveys consistently finds that proficiency is associated not only with education but with how often people read, write and calculate at work and in daily life. Adults whose jobs and habits demand little reading lose ground; those who keep reading complex material retain and build it. The shift from long-form reading towards short, fragmented content is one plausible contributor to the recent declines, though the evidence on causes is still developing.</p>
<p style="margin: 0">The implication for education is direct. Teaching a skill is not enough; learners must come to use it habitually, because they find it valuable, long after the course is over.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Far transfer is rare</h2>
<p style="margin: 0">The second idea concerns transfer. Many education programmes promise general cognitive gains: learn chess, music or brain-training games and become a better thinker in general. Giovanni Sala and Fernand Gobet reviewed the experimental evidence and found little support for this kind of far transfer. Practice improves performance on the trained task and closely related ones, but benefits rarely spread to distant domains.</p>
<p style="margin: 0">This does not mean that general abilities cannot be developed. It means they are built through a wide range of specific experiences, each practised in context, rather than through a single shortcut. Reading comprehension, for instance, depends heavily on background knowledge of the topic. A strategy for “finding the main idea” is of limited help to a reader who knows nothing about the subject.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">A qualification records what someone could do once. A skill is what they can still do today.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Practice must be deliberate</h2>
<p style="margin: 0">The third idea is that time on task is not the same as practice. K. Anders Ericsson and colleagues introduced the concept of deliberate practice: focused effort on specific weaknesses, at the edge of current ability, with immediate feedback and repetition. Later work, including a meta-analysis by Brooke Macnamara, David Hambrick and Frederick Oswald, found that deliberate practice explains less of the variation in performance than its strongest advocates claimed, and much less in some domains than others. But the core insight survives. Unstructured exposure produces plateaus. Structured, feedback-rich practice keeps people improving.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">AI cuts both ways</h2>
<p style="margin: 0">Generative AI raises the stakes on all three ideas. Used well, it can provide the timely, targeted feedback that deliberate practice demands, at a scale no human workforce could match. Used carelessly, it removes the effort through which skills are formed and maintained. In a field experiment in Turkish high schools, Hamsa Bastani and colleagues found that students given unrestricted access to a general AI chatbot did better on practice problems but worse on later exams taken without it, while a version designed as a tutor, which gave hints rather than answers, largely avoided that harm. Surveys of knowledge workers similarly suggest that higher confidence in AI tools is associated with less critical thinking effort.</p>
<p style="margin: 0">The risk is skill atrophy at population scale: a generation that can produce acceptable work with AI but cannot read closely, write clearly or check a calculation without it.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Recording skills that are real</h2>
<p style="margin: 0">Policy is moving towards recognising skills in smaller, more current units. The Council of the European Union’s 2022 Recommendation on micro-credentials set out common standards for certifying shorter learning experiences. That is useful, but only if the credentials measure durable capability rather than course attendance, and only if they can be refreshed as skills change.</p>
<p style="margin: 0">Vachuo’s design reflects these lessons. The loop schedules retrieval and spaced practice so that skills are used, not merely taught. AI support is designed to give hints before answers and to fade as competence grows. And the Report Card records evidence of what a learner can do now, with dates, so that a skill shown three years ago is not mistaken for a skill held today. The paradox of more schooling and flat literacy is, in the end, a reminder that education is measured by what people can still do, not by how long they sat in class.</p>

<script>
DC.component("Blog-skills", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
    return { uiTheme: t, uiDark: d, uiLight: !d, uiOn: d ? 'true' : 'false', uiToggle: this._uiFlip, uiTrack: d ? '#1D4ED8' : '#8A8F96', uiKnob: d ? '19px' : '3px' };
  }
  themeOff() { try { window.removeEventListener('storage', this._uiSync); } catch (e) {} }
  constructor(props) { super(props); this.state = { pct: 0, top: false, sh: false, copied: '' }; }
  componentDidMount() {
    this._s = () => { if (this._r) return; this._r = requestAnimationFrame(() => { this._r = 0; const y = window.scrollY || 0, max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight), pct = Math.min(100, Math.round((y / max) * 100)); if (pct !== this.state.pct || (y > 900) !== this.state.top || (y > 8) !== this.state.sh) this.setState({ pct, top: y > 900, sh: y > 8 }); }); };
    window.addEventListener('scroll', this._s, { passive: true });
  }
  componentWillUnmount() { this.themeOff(); window.removeEventListener('scroll', this._s); clearTimeout(this._t); }
  copy() { const done = (m) => { this.setState({ copied: m }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ copied: '' }), 2400); }; try { navigator.clipboard.writeText(window.location.href).then(() => done('Link copied'), () => done('Copy failed')); } catch (e) { done('Copy failed'); } }
  renderVals() { return Object.assign(this.themeVals(), this.pageVals()); }
  pageVals() {
    return { progress: this.state.pct + '%', headShadow: this.state.sh ? '0 10px 30px -18px rgba(20,22,26,0.35)' : 'none', showTop: this.state.top, toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }), copyLabel: this.state.copied || 'Copy link', copyLink: () => this.copy(), social: ['LinkedIn', 'Facebook', 'Instagram', 'X', 'TikTok', 'YouTube', 'WhatsApp Channel', 'Threads', 'Spotify', 'Apple Podcasts'] };
  }
}
return Component;
});
