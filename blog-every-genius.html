<article style="max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 24px) 72px; display: flex; flex-direction: column; gap: 22px; font-size: 20px; line-height: 1.65; color: #23272E">

<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #E4ECFD; color: #1E40AF">Equality of minds</span>
<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Honour Every Genius: Gatto, Jacotot and the Equality of Minds</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">In 1818 Joseph Jacotot, a French teacher exiled in Belgium, faced a class of Flemish-speaking students who knew no French, while he knew no Flemish. He handed them a bilingual edition of a French novel and asked them, through an interpreter, to learn the French for themselves. They did.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 8 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 8px">
<img src="assets/img/cc13f9d919b0933cc82b960722e0d690.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/3131eb41702479241dc132be8c19c769.svg" alt="" style="display: block; height: 97%; width: auto">
</div>
</figure>

<p style="margin: 0">Jacotot’s students read the French text against the Flemish, sentence by sentence, and before long were writing about the book in French. Nobody had explained a single rule of grammar to them. Jacotot drew a conclusion that unsettled him: he had taught them nothing they could not have learned without him. All he had done was insist that they pay attention and keep going.</p>
<p style="margin: 0">In <i>The Ignorant Schoolmaster</i> (1987) the philosopher Jacques Rancière turned the story into a principle. Equality of intelligence is not a goal to be reached at the end of a good education; it is the assumption you start from. The trouble with explanation, however kind, is that it teaches the pupil a second lesson underneath the first: that understanding comes from someone who already knows.</p>
<figure class="ix" aria-label="Game · The Jacotot test"><h3>Game · The Jacotot test</h3><p class="lede">Nobody will explain this. Read the passage, then work out what the Kiswahili words mean from the English beside them, the way Jacotot’s students learned French from one book.<br><span style="display: block; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 15px; line-height: 1.6; color: #14161A">Mvua ilinyesha usiku kucha. <i>The rain fell all night.</i><br>Asubuhi, shamba lilikuwa na maji mengi. <i>In the morning, the farm had a lot of water.</i><br>Bibi alipima mvua kwa kipimo chake. <i>Grandmother measured the rain with her gauge.</i></span></p><template data-if="{{jcLive}}"><div class="ixcard" style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: #62676F"><span>Question {{jcN}}</span><span>Score {{jcScore}}</span></div><p style="font-size: 18px; line-height: 1.4; font-weight: 600">{{jcQ}}</p><div class="ixrow"><template data-for="{{jcChoices}}" data-as="c"><button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></template></div><template data-if="{{jcPicked}}"><p role="status" style="font-size: 15px">{{jcWhy}}</p><button type="button" class="ixb go" onClick="{{jcNext}}" style="align-self: flex-start">Next</button></template></div></template><template data-if="{{jcDone}}"><div class="ixcard" style="display: flex; flex-direction: column; gap: 8px"><p style="font-size: 22px; font-weight: 600">You scored {{jcScore}}</p><p>{{jcVerdict}}</p><button type="button" class="ixb" onClick="{{jcReset}}" style="align-self: flex-start">Play again</button></div></template></figure>
<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Genius is common</h2>
<p style="margin: 0">John Taylor Gatto reached the same place from a New York classroom. In <i>Weapons of Mass Instruction</i> (2008) he argued that genius is common, as common as dirt, and that schooling suppresses it far more often than it reveals it. He told the story of David Farragut, given command of a captured ship at twelve, not to suggest that children should go to sea, but to show how much responsibility young people can carry when nobody has decided in advance that they cannot.</p>
<p style="margin: 0">“Honour every genius” is our slogan because of these two men. It is not a promise that every child will be extraordinary at everything. It is a refusal to start from any other assumption.</p>
<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What it changes</h2>
<p style="margin: 0">Starting from equal intelligence changes small things. Vachuo labels a piece of work, never a child: “Not yet” instead of “Below”. The learner says how sure she is before the model does. Socrates has an Ignorant mode, after Jacotot, in which it gives her a text or a table of numbers and never explains it, asking only what she sees, what she thinks of it and what she makes of it.</p>
<p style="margin: 0">Rancière would still be suspicious of us. A tutor that knows the answer is still a master. We think the right response is not to pretend otherwise, but to let the learner ask, at any moment, “Where are you taking me?”</p>
