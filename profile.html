<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Connects profile</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Profile">
<div style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif; box-sizing: border-box; padding: {{rootPad}}">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<template data-if="{{embedded}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<button type="button" onClick="{{goBack}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to Connects</button>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Connects / {{catLabel}} / {{name}}</span>
</div>
</template>

<template data-if="{{standalone}}">
<section aria-labelledby="dir-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="dir-h" style="margin: 0; font-size: 20px; font-weight: 600">Profiles on Connects</h2>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">Pick any person, place, event or group to preview its page</span>
</div>
<template data-for="{{dir}}" data-as="g">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="flex: none; width: 132px; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{g.ink}}">{{g.label}}</span>
<template data-for="{{g.items}}" data-as="o">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 500; cursor: pointer">{{o.label}}</button>
</template>
</div>
</template>
</section>
</template>

<section aria-labelledby="p-name" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 24px; overflow: hidden">
<div aria-hidden="true" style="position: relative; height: 168px; overflow: hidden; background: {{band}}">
<span style="position: absolute; width: 520px; height: 520px; right: -150px; top: -330px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.35)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -380px; top: -700px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.22)"></span>
<span style="position: absolute; width: 260px; height: 260px; right: 8%; top: -60px; border-radius: 50%; background: rgba(255,255,255,0.10)"></span>
<svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 6%; top: 10px"><path d="{{icon}}"/></svg>
</div>
<div style="padding: 0 clamp(18px, 3vw, 32px) 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px">
<div style="flex: none; margin-top: -56px; width: 112px; height: 112px; border-radius: 50%; border: 5px solid #FFFFFF; box-sizing: border-box; overflow: hidden; background: {{tint}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -14px rgba(20,22,26,0.5)">
<template data-if="{{hasFace}}"><img src="{{face}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top"></template>
<template data-if="{{hasInitials}}"><span aria-hidden="true" style="font-size: 44px; font-weight: 600; color: {{ink}}">{{initials}}</span></template>
<template data-if="{{hasIcon}}"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"/></svg></template>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 10px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{ink}}">{{catLabel}} · {{subLabel}}</span>
<h1 id="p-name" style="margin: 0; font-size: clamp(32px, 3.6vw, 46px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">{{name}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.45; color: #3F444C">{{role}}</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: {{liveBg}}; color: {{liveFg}}; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{liveDot}}"></span>{{liveText}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: #F4F4EF; color: #3F444C; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>{{where}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg>{{verified}}</span>
<template data-if="{{hasMine}}"><span style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: #E4ECFD; color: #1E40AF; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 11l2 2 4-4"/></svg>{{mine}}</span></template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{ctaGo}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: none; background: {{band}}; color: {{bandFg}}; font-family: Geist, system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{cta}}</button>
<button type="button" aria-pressed="{{followPressed}}" onClick="{{toggleFollow}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid {{followBd}}; background: {{followBg}}; color: {{followFg}}; font-family: Geist, system-ui, sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer">{{followLabel}}</button>
<template data-if="{{hasHost}}"><button type="button" onClick="{{openHost}}" style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer">{{hostLabel}}</button></template>
</div>
</div>
</section>

<div role="group" aria-label="Profile sections" style="display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #E2E2DA; padding-bottom: 10px">
<template data-for="{{tabs}}" data-as="t">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">{{t.label}}</button>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<template data-if="{{tabOverview}}">
<section aria-labelledby="ov-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="ov-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{aboutTitle}}</h2>
<template data-for="{{about}}" data-as="a"><p style="margin: 0; font-size: 18px; line-height: 1.6; color: #23272E">{{a}}</p></template>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; padding-top: 4px">
<template data-for="{{facts}}" data-as="f">
<div style="border-radius: 14px; background: #F4F4EF; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{f.k}}</span><span style="font-size: 17px; line-height: 1.35">{{f.v}}</span></div>
</template>
</div>
</section>
<section aria-labelledby="of-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="of-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{offersTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
<template data-for="{{offers}}" data-as="o">
<li style="border: 1px solid #ECECE6; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 600; line-height: 1.3">{{o.t}}</span><span style="font-size: 16px; line-height: 1.45; color: #3F444C">{{o.d}}</span></li>
</template>
</ul>
</section>
<template data-if="{{hasNotes}}">
<section aria-labelledby="lg-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 id="lg-h" style="margin: 0 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Logged by learners</h2>
<template data-for="{{notes}}" data-as="n">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 0; border-top: 1px solid #ECECE6"><span style="flex: none; min-width: 120px; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: {{ink}}">{{n.who}}</span><span style="flex: 1 1 260px; font-size: 17px; line-height: 1.45">{{n.text}}</span></div>
</template>
<p style="margin: 4px 0 0; font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">Entries are evidence learners chose to log. Nothing here is a rating.</p>
</section>
</template>
</template>

<template data-if="{{tabSchedule}}">
<section aria-labelledby="sc-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="sc-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{schedTitle}}</h2>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">{{spotsText}}</span>
</div>
<div role="group" aria-label="Week at a glance" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<template data-for="{{week}}" data-as="w">
<div style="border-radius: 12px; padding: 10px 4px; text-align: center; background: {{w.bg}}; color: {{w.fg}}; border: 1px solid {{w.bd}}; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{w.d}}</span><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 11px">{{w.t}}</span></div>
</template>
</div>
<template data-if="{{notSent}}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{slots}}" data-as="s">
<li style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid {{s.bd}}; background: {{s.bg}}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 600">{{s.date}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">{{s.time}} · {{s.label}}</span></span>
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.btnBd}}; background: {{s.btnBg}}; color: {{s.btnFg}}; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{s.btn}}</button>
</li>
</template>
</ul>
<template data-if="{{picking}}">
<div style="border-radius: 16px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 17px; line-height: 1.5"><b style="font-weight: 600">{{reqTitle}}</b></p>
<label for="req-msg" style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">A note for {{shortName}} (optional)</label>
<textarea id="req-msg" rows="3" value="{{msg}}" onChange="{{setMsg}}" placeholder="{{msgHint}}" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; font-family: Geist, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #14161A; resize: vertical"></textarea>
<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; line-height: 1.5; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z"/></svg>Because you’re under 18, this goes to your parent first. Nothing is confirmed until they approve it.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{sendReq}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #1D4ED8; color: #FFFFFF; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{sendLabel}}</button>
<button type="button" onClick="{{cancelReq}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Cancel</button>
</div>
</div>
</template>
</template>
<template data-if="{{sent}}">
<div role="status" style="border-radius: 16px; background: #DDF4F1; border: 1px solid #8FD3C9; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 19px; font-weight: 600; color: #115E59">Sent to your parent for approval</p>
<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #134E4A">{{sentText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{undoReq}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #8FD3C9; background: #FFFFFF; color: #115E59; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Withdraw request</button></div>
</div>
</template>
</section>
</template>

<template data-if="{{tabMap}}">
<section aria-labelledby="mp-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="mp-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">How this counts on your map</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #3F444C">Time here can count as evidence for these skills, if you choose to log it. Your current estimates:</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="{{skills}}" data-as="k">
<li style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid #ECECE6">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 18px; font-weight: 600">{{k.name}} <span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 500; color: #62676F">{{k.subj}}</span></span><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 14px">{{k.score}}</span></span>
<span aria-hidden="true" style="position: relative; height: 8px; border-radius: 4px; background: #ECECE6; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.pct}}%; border-radius: 4px; background: {{k.bar}}"></span></span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">{{k.note}}</span>
</li>
</template>
</ul>
<a href="map.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E4ECFD; color: #1E40AF; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-decoration: none">Open My map</a>
</section>
</template>

<template data-if="{{tabSafety}}">
<section aria-labelledby="sf-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="sf-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Safety and visiting</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{safety}}" data-as="s">
<li style="display: flex; gap: 12px; align-items: flex-start; font-size: 17.5px; line-height: 1.45"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>{{s}}</li>
</template>
</ul>
<div style="border-radius: 14px; background: #F4F4EF; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Where you meet</span><span style="font-size: 17px; line-height: 1.45">{{meets}}</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{reportGo}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #F9A826; background: #FEF1D9; color: #92400E; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Report a concern</button>
<span role="status" style="font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #115E59">{{reportText}}</span>
</div>
</section>
</template>
</div>

<aside aria-label="At a glance" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="gl-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="gl-h" style="margin: 0; font-size: 20px; font-weight: 600">{{hoursTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-for="{{hours}}" data-as="h">
<li style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid #ECECE6; font-family: Geist, system-ui, sans-serif; font-size: 13.5px"><span style="font-weight: 600">{{h.days}}</span><span style="text-align: right; color: #3F444C">{{h.time}}<br><span style="color: #62676F">{{h.label}}</span></span></li>
</template>
</ul>
<p style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Times are Nairobi time. Status updates live.</p>
</section>
<template data-if="{{hasMap}}">
<section aria-labelledby="loc-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="loc-h" style="margin: 0; font-size: 20px; font-weight: 600">{{locTitle}}</h2>

      ws.forEach((w) => {
