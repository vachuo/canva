<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">

<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{tdOpen}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #DC2626; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer" title="A timed lesson or debate with Socrates, full screen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v12H3zM8 21h8M12 16.5V21"/></svg>Teach / Debate</button>
<span role="timer" aria-live="off" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #3F444C">{{timerText}}</span>
<button type="button" aria-pressed="{{pausedA}}" onClick="{{togglePause}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">{{pauseLabel}}</button>
</div>
</div>
</header>

<dc-import name="Approvals" area="tutor" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<section aria-labelledby="loop-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<h2 id="loop-h" style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">The loop, on Ratios</h2>
<div style="display: flex; align-items: center; gap: 6px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F; margin-right: 6px">{{loopMeta}}</span>
<button type="button" aria-label="Previous step" onClick="{{stepPrev}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<button type="button" aria-label="Next step" onClick="{{stepNext}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button type="button" aria-expanded="{{stepOpenA}}" onClick="{{toggleStep}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 13px; font-weight: 500; cursor: pointer">{{stepToggleLabel}}</button>
</div>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{loop}}" data-as="s">
<li><button type="button" aria-pressed="{{s.pressed}}" aria-current="{{s.current}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}; box-shadow: {{s.ring}}; cursor: pointer"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; opacity: 0.8">{{s.n}}</span>{{s.name}}<template data-if="{{s.done}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></template></button></li>
</template>
</ol>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #ECECE6; overflow: hidden"><div style="width: {{loopPct}}%; height: 100%; background: #1D4ED8; transition: width .5s ease"></div></div>

<template data-if="{{stepOpen}}">
<div class="fadein" style="border-top: 1px solid #ECECE6; padding-top: 16px; display: flex; flex-direction: column; gap: 14px">

<span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: {{st.sbg}}; color: {{st.sfg}}; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{st.status}}</span>
<h3 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">{{st.n}} · {{st.name}}</h3>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{st.when}}</span>
</div>
<p style="margin: 0; font-size: 17.5px; line-height: 1.5; color: #3F444C; max-width: 860px">{{st.what}}</p>

<template data-if="{{s1}}">
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
<ol style="flex: 3 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<template data-for="{{diagItems}}" data-as="d">

<span style="flex: 1; min-width: 0; font-size: 14px">{{d.q}}</span>
<span style="flex: none; font-size: 12px; color: #62676F">{{d.skill}}</span>
<span style="flex: none; min-width: 64px; text-align: right; font-size: 12.5px; font-weight: 600; color: {{d.rc}}">{{d.res}}</span>
</button></li>
</template>
</ol>
<div style="flex: 2 1 300px; min-width: 0; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Item {{di.n}} · {{di.skill}}</span>
<p style="margin: 0; font-size: 19px; line-height: 1.35; font-weight: 600">{{di.q}}</p>
<p style="margin: 0; font-size: 16px">Amani answered <b>{{di.ans}}</b> in {{di.time}}.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">{{di.revealed}}</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600"><span style="padding: 6px 12px; border-radius: 999px; background: #E4ECFD; color: #1E40AF">Placed: Ratios, Level 6</span><span style="padding: 6px 12px; border-radius: 999px; background: #FEF1D9; color: #92400E">Gap: Equivalent fractions, 61%</span><span style="padding: 6px 12px; border-radius: 999px; background: #DDF4F1; color: #115E59">Strong: Unit rates, 86%</span></div>
</template>

<template data-if="{{s2}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px">
<template data-for="{{planDays}}" data-as="d">
<div style="border-radius: 14px; background: #FAFAF7; border: 1px solid #ECECE6; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 120px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #62676F">{{d.day}}</span>
<template data-for="{{d.items}}" data-as="it">
<div style="border-radius: 10px; padding: 8px 10px; background: {{it.bg}}; border: 1px solid {{it.bd}}; opacity: {{it.op}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; line-height: 1.25; text-decoration: {{it.strike}}">{{it.title}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #3F444C">{{it.meta}}</span></div>
</template>

<template data-if="{{chatMicNote}}"><p role="status" style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #92400E">{{micMsgShort}}</p></template>
<div role="group" aria-label="Quick actions" style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{quick}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{chips}}" data-as="c"><button type="button" onClick="{{c.say}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{c.t}}</button></template>

<aside aria-labelledby="thinking" style="flex: 2 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="thinking" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">What Socrates is thinking</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">Always visible to you. Nothing here is a grade, and you can challenge any of it.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What it noticed</span>
<p aria-live="polite" style="margin: 0; background: #FAFAF7; border: 1px solid #ECECE6; border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.5">{{noticed}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Most likely why</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<template data-for="{{causes}}" data-as="c">
<li style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span style="font-size: 14px; line-height: 1.4">{{c.label}}</span><span style="flex: none; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #3F444C">{{c.p}}</span></div>
<div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #ECECE6"><div style="height: 6px; border-radius: 3px; width: {{c.w}}; background: {{c.bar}}; transition: width .5s ease"></div></div>
<span style="font-size: 12.5px; color: #62676F">{{c.kind}}</span>
</li>
</template>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What it’s trying</span>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #3F444C; line-height: 1.45">
<template data-for="{{trying}}" data-as="t"><li style="color: {{t.c}}; font-weight: {{t.w}}">{{t.text}}</li></template>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: #FAFAF7; border: 1px solid #ECECE6">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 14px; font-weight: 600">Proportional reasoning</span><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px">{{estFrom}} → <span style="color: {{estColor}}; font-weight: 500">{{estTo}}</span></span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">How sure Socrates is that you’ve got this skill. One answer moved it; it moves back the moment you show it.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-expanded="{{contestOpen}}" onClick="{{toggleContest}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1D4ED8; background: #FFFFFF; color: #1E40AF; font-size: 14px; font-weight: 600; cursor: pointer">That’s not what happened</button>
<button type="button" onClick="{{explainOther}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Explain it another way</button>
<button type="button" aria-expanded="{{ndutaA}}" onClick="{{toggleNduta}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #8FD3C9; background: #DDF4F1; color: #115E59; font-size: 14px; font-weight: 600; cursor: pointer">Bring in Nduta</button>
</div>
<template data-if="{{contest}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="contest" style="font-size: 13.5px; font-weight: 600">Tell Vachuo what it missed</label>
<textarea id="contest" rows="3" value="{{contestText}}" onChange="{{setContest}}" placeholder="I typed 15 by mistake. I meant 7.5." style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 16px; line-height: 1.5; color: #14161A; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{sendContest}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Send to Vachuo</button>
<span role="status" style="font-size: 13px; color: {{contestColor}}">{{contestMsg}}</span>
</div>
</div>
</template>
</aside>
</div>

<template data-if="{{nduta}}">
<dc-import name="Messages" contact="nduta" viewer="learner" embedded="{{ true }}" ui-theme="{{uiTheme}}" on-close="{{toggleNduta}}" on-profile="{{noop}}"></dc-import>
</template>

; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Open My tutor, the full conversation" title="Open My tutor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></a></template><button type="button" class="sf-hb" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Start a new conversation" title="New conversation" onClick="{{sfNew}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg></button><button type="button" class="sf-hb" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Close Socrates" title="Close" onClick="{{sfClose}}">×</button></div><div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #ECECE6; background: #FBFBF8"><span style="font-size: 12.5px; color: #62676F">Want a full lesson or a timed debate?</span><a href="session.html#teach" onClick="{{sfTeach}}" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: #DC2626; color: #FFFFFF; font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap" title="A timed lesson or debate with Socrates, full screen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v12H3zM8 21h8M12 16.5V21"/></svg>Teach / Debate</a></div><div id="sf-log" aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><template data-for="{{sfMsgs}}" data-as="m"><template data-if="{{m.isDiv}}"><div role="separator" style="display: flex; align-items: center; gap: 10px; color: #62676F; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span>{{m.divText}}<span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span></div></template><template data-if="{{m.isTyping}}"><div role="status" aria-label="Socrates is thinking" class="sf-dots" style="align-self: flex-start; padding: 12px 14px; border-radius: 14px; background: #F4F7FE"><span></span><span></span><span></span></div></template><template data-if="{{m.isMsg}}"><div style="align-self: {{m.align}}; max-width: 90%; display: flex; flex-direction: column; align-items: {{m.align}}; gap: 2px"><div id="{{m.domId}}" style="padding: 9px 12px; border-radius: 14px; background: {{m.bg}}; font-size: 14px; line-height: 1.5; color: #14161A"><template data-if="{{m.hasQ}}"><button type="button" class="vq" onClick="{{m.qGo}}" aria-label="{{m.qAria}}"><span class="vq-w">↩ Replying to {{m.qWho}}:</span><span class="vq-t">{{m.qText}}</span></button></template>{{m.text}}</div><template data-if="{{m.canReply}}"><button type="button" class="vq-rb" onClick="{{m.replyGo}}" aria-label="{{m.replyAria}}">↩ Reply</button></template></div></template></template></div><div style="flex: none; padding: 10px 14px 12px; border-top: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 8px"><div role="group" aria-label="Quick actions" class="sf-chips" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px"><template data-for="{{sfChips}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer">{{c.label}}</button></template></div><template data-if="{{sfBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{sfBarWho}}:</span><span class="vq-t">{{sfBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{sfBarX}}">×</button></div></template><div style="display: flex; gap: 8px"><label for="sf-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{sfPh}}</label><input id="sf-input" value="{{sfDraft}}" onChange="{{sfSet}}" onKeyDown="{{sfInKey}}" placeholder="{{sfPh}}" autocomplete="off" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" aria-label="Send to Socrates" onClick="{{sfSend}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div><span style="font-size: 12px; line-height: 1.45; color: #62676F">{{sfNote}}</span></div></section></template></div>
<template data-if="{{tdOn}}">
<section class="td" role="dialog" aria-modal="true" aria-labelledby="td-h" onKeyDown="{{tdKey}}">
<div class="bar"><img class="face {{tdFaceCls}}" src="{{tdFace}}" alt=""><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><h2 id="td-h" style="margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tdTitle}}</h2><span style="font-size: 12.5px; color: #B5B9BF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tdSub}}</span></div>
<template data-if="{{tdRunning}}"><span class="ph" style="font-size: 12.5px; color: #B5B9BF; white-space: nowrap">{{tdPhaseLabel}}</span><span role="timer" aria-live="off" class="clock {{tdClockCls}}" title="Time left in this session">{{tdClock}}</span></template>
<button type="button" class="tdb" onClick="{{tdVoiceToggle}}" aria-pressed="{{tdVoiceA}}" title="Socrates speaks aloud">🔊 Voice</button><button type="button" class="tdb quiet" onClick="{{tdClose}}" aria-label="End and close">✕ End</button></div>

<template data-if="{{tdPick}}"><div style="flex: 1; overflow: auto; padding: 28px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 22px; max-width: 980px; width: 100%; margin: 0 auto; box-sizing: border-box">
<div><p style="margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #F9A826">Teach / Debate</p><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 4vw, 44px); line-height: 1.05; font-weight: 600">Pick a mode.</h3><p style="margin: 8px 0 0; color: #B5B9BF; font-size: 16px">Six ways to learn with Socrates. Debate keeps a clock because the format needs one; the others have no clock unless you choose one, and when a clock runs out you can keep going.</p></div>
<div class="two" style="display: flex; gap: 14px"><button type="button" class="mode" aria-pressed="{{tdIsTeach}}" onClick="{{tdModeTeach}}" style="flex: 1"><span style="font-size: 30px">🧑‍🏫</span><span style="font-size: 22px; font-weight: 700">Teach</span><span style="color: #B5B9BF; font-size: 15px; line-height: 1.45">A lesson on the board, step by step. Socrates asks first and explains only if you want it. Say “let me try” at any point.</span></button>
<button type="button" class="mode" aria-pressed="{{tdIsDebate}}" onClick="{{tdModeDebate}}" style="flex: 1"><span style="font-size: 30px">🎙️</span><span style="font-size: 22px; font-weight: 700">Debate</span><span style="color: #B5B9BF; font-size: 15px; line-height: 1.45">Argue a motion against Socrates in timed rounds, or take a short oral test. Pick the topic or let Socrates choose.</span></button></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px"><template data-for="{{tdMoreModes}}" data-as="m"><button type="button" class="mode" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="padding: 14px 16px"><span style="font-size: 22px">{{m.icon}}</span><span style="font-size: 17px; font-weight: 700">{{m.label}}</span><span style="color: #B5B9BF; font-size: 13.5px; line-height: 1.45">{{m.d}}</span></button></template></div>

<template data-if="{{tdIsTeachB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">WHAT SHOULD SOCRATES TEACH?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLessons}}" data-as="l"><button type="button" class="tdb" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}"><span style="display: block; font-size: 11.5px; color: #B5B9BF">{{l.subj}}</span>{{l.t}}</button></template></div>
<label for="td-ct" style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">OR DESCRIBE IT YOURSELF</label><input id="td-ct" class="tdin" value="{{tdCustomT}}" onChange="{{tdSetCustomT}}" placeholder="e.g. Photosynthesis for a 10-year-old, or long division with remainders" autocomplete="off" style="max-width: 640px"><span style="font-size: 12.5px; color: #8A94A6">{{tdCustomTNote}}</span>
<span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<template data-if="{{tdIsDebateB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">FORMAT</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="tdb" aria-pressed="{{tdFmtDebA}}" onClick="{{tdFmtDeb}}">Debate · opening, rebuttal, closing</button><button type="button" class="tdb" aria-pressed="{{tdFmtOralA}}" onClick="{{tdFmtOral}}">Oral test · five questions</button></div>
<span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">TOPIC</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="tdb" aria-pressed="{{tdAutoA}}" onClick="{{tdAuto}}">🎲 Let Socrates choose</button><template data-for="{{tdMotions}}" data-as="m"><button type="button" class="tdb" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}">{{m.t}}</button></template></div>
<label for="td-cm" style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">OR WRITE YOUR OWN TOPIC</label><input id="td-cm" class="tdin" value="{{tdCustomM}}" onChange="{{tdSetCustomM}}" placeholder="e.g. School uniforms should be optional" autocomplete="off" style="max-width: 640px"><span style="font-size: 12.5px; color: #8A94A6">{{tdCustomMNote}}</span>
<template data-if="{{tdFmtIsDeb}}"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">YOUR SIDE</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdSides}}" data-as="s"><button type="button" class="tdb" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}">{{s.label}}</button></template></div></template>
<span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<template data-if="{{tdIsIgnB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">WHAT WILL YOU LOOK AT?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdThings}}" data-as="x"><button type="button" class="tdb" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}">{{x.t}}</button></template></div><span style="font-size: 12.5px; color: #8A94A6">Socrates won’t explain it. It only asks what you see, what you think of it and what you make of it, and checks your claims against the thing itself. After Jacques Rancière’s ignorant schoolmaster.</span><span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<template data-if="{{tdIsOpenB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">A QUESTION WITH NO ANSWER KEY</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdOQs}}" data-as="x"><button type="button" class="tdb" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}">{{x.t}}</button></template></div><label for="td-oq" style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">OR ASK YOUR OWN</label><input id="td-oq" class="tdin" value="{{tdCustomO}}" onChange="{{tdSetCustomO}}" placeholder="e.g. Is it fair that big families pay the same school fees?" autocomplete="off" style="max-width: 640px"><span style="font-size: 12.5px; color: #8A94A6">Socrates says plainly that it doesn’t know the answer. You’ll be asked for a reason, the other side, and what would change your mind.</span><span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<template data-if="{{tdIsBackB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">WHAT WILL YOU TEACH SOCRATES?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLessons}}" data-as="l"><button type="button" class="tdb" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}"><span style="display: block; font-size: 11.5px; color: #B5B9BF">{{l.subj}}</span>{{l.t}}</button></template></div><span style="font-size: 12.5px; color: #8A94A6">Socrates plays a confused student. You do the explaining. If you can teach it, you have it.</span><span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<template data-if="{{tdIsSemB}}"><div class="card"><span style="font-size: 13px; font-weight: 700; color: #B5B9BF">WHAT WILL THE CIRCLE DISCUSS?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdTexts}}" data-as="x"><button type="button" class="tdb" aria-pressed="{{x.pressed}}" onClick="{{x.pick}}">{{x.t}}</button></template></div><span style="font-size: 12.5px; color: #8A94A6">A practice circle with Tomás, 13, and Neema, 11. Socrates facilitates and speaks least. In the Agora, the circle is real people.</span><span style="font-size: 13px; font-weight: 700; color: #B5B9BF; margin-top: 6px">HOW LONG?</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{tdLens}}" data-as="n"><button type="button" class="tdb" aria-pressed="{{n.pressed}}" onClick="{{n.pick}}">{{n.label}}</button></template></div></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" class="tdb go" onClick="{{tdStart}}" style="min-height: 48px; padding: 0 22px; font-size: 16px">{{tdStartLabel}}</button><span style="font-size: 13px; color: #B5B9BF">{{tdStartNote}}</span></div></div></template>

<template data-if="{{tdRunning}}"><div class="two" style="flex: 1; min-height: 0; display: flex; gap: 14px; padding: 14px 16px; box-sizing: border-box">
<div style="flex: 3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 10px"><div class="meter" aria-hidden="true"><span style="width: {{tdProg}}"></span></div>
<div class="board" aria-live="polite" aria-label="Board"><template data-for="{{tdBoard}}" data-as="b"><div class="ln {{b.cls}}">{{b.t}}</div></template></div>
<div class="card" style="flex-direction: row; align-items: flex-start; gap: 12px"><img class="face {{tdFaceCls}}" src="{{tdFace}}" alt="" style="width: 40px; height: 40px"><p class="cap" style="margin: 0; flex: 1">{{tdCap}}</p></div></div>
<div style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px"><div class="card" style="flex: 1; min-height: 0"><span style="font-size: 12.5px; font-weight: 700; color: #B5B9BF">{{tdLogTitle}}</span><div class="log" id="td-log"><template data-for="{{tdLog}}" data-as="m"><div class="msg {{m.cls}}">{{m.t}}</div></template></div></div>
<div role="group" aria-label="Question Socrates" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{tdMeta}}" data-as="c"><button type="button" class="tdb quiet" onClick="{{c.go}}" style="min-height: 34px; font-size: 12.5px">{{c.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{tdChips}}" data-as="c"><button type="button" class="tdb" onClick="{{c.go}}" style="min-height: 36px; font-size: 13px">{{c.label}}</button></template></div>
<template data-if="{{tdInterimOn}}"><p style="margin: 0; font-size: 13.5px; color: #B5B9BF; font-style: italic">{{tdInterim}}</p></template>

<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: {{c.tint}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 600"><template data-if="{{c.hasFace}}"><img src="{{c.face}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top"></template><template data-if="{{c.noFace}}">{{c.ini}}</template></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2">{{c.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #62676F"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>{{c.status}}</span>
</div>
<template data-if="{{c.hasProfile}}"><button type="button" onClick="{{c.profile}}" style="flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer">Profile</button></template>
<template data-if="{{canClose}}"><button type="button" aria-label="Close messages" onClick="{{close}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></template>
</header>
<p style="flex: none; margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #F4F7FE; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; line-height: 1.4; color: #1E40AF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>{{c.safety}}</p>

<div role="log" aria-live="polite" aria-label="Conversation" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FAFAF7">
<template data-for="{{msgs}}" data-as="m">
<template data-if="{{m.isDay}}"><div style="align-self: center; font-size: 12px; font-weight: 500; color: #62676F; padding: 2px 10px; border-radius: 999px; background: #ECECE6">{{m.day}}</div></template>
<template data-if="{{m.isMsg}}">
<div style="display: flex; flex-direction: column; align-items: {{m.align}}; gap: 3px">
<template data-if="{{m.showWho}}"><span style="font-size: 12px; font-weight: 600; color: #62676F; padding: 0 4px">{{m.who}}</span></template>
<div id="{{m.domId}}" style="max-width: 82%; padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere"><template data-if="{{m.hasQ}}"><button type="button" class="vq" onClick="{{m.qGo}}" aria-label="{{m.qAria}}"><span class="vq-w">↩ Replying to {{m.qWho}}:</span><span class="vq-t">{{m.qText}}</span></button></template>{{m.text}}<template data-if="{{m.hasFile}}"><span style="display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: {{m.fileBg}}; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>{{m.file}}</span></template><template data-if="{{m.hasImg}}"><img src="{{m.img}}" alt="{{m.file}}" style="display: block; margin-top: 8px; max-width: 220px; max-height: 180px; border-radius: 10px; object-fit: cover"></template></div>
<template data-if="{{m.hasSlots}}">
<div role="group" aria-label="Suggested times" style="display: flex; flex-wrap: wrap; gap: 6px; max-width: 82%">
<template data-for="{{m.slots}}" data-as="s"><button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 500; cursor: pointer">{{s.label}}</button></template>
</div>
</template>
<span style="display: flex; align-items: center; gap: 2px"><span style="font-size: 11.5px; color: #8A8F96; padding: 0 4px">{{m.time}}</span><template data-if="{{m.canReply}}"><button type="button" class="vq-rb" onClick="{{m.replyGo}}" aria-label="{{m.replyAria}}">↩ Reply</button></template></span>
</div>
</template>
</template>
<template data-if="{{typing}}"><div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 13.5px; color: #62676F"><span aria-hidden="true" style="display: flex; gap: 3px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8A8F96"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #A3A8AE"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #CFCFC6"></span></span>{{typingText}}</div></template>
<div ref="{{endRef}}" style="height: 1px; flex: none"></div>
</div>

<div style="flex: none; border-top: 1px solid #E2E2DA; background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Quick replies" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<template data-for="{{quick}}" data-as="q"><button type="button" onClick="{{q.send}}" style="flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #93BBF3; background: #F4F7FE; color: #1E40AF; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap">{{q.label}}</button></template>
</div>
<template data-if="{{hasPending}}"><div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #F4F4EF; font-size: 13px; color: #3F444C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{pendingName}}</span><button type="button" aria-label="Remove attachment" onClick="{{clearPending}}" style="border: none; background: transparent; color: #62676F; cursor: pointer; font-size: 13px; min-height: 28px">Remove</button></div></template>
<template data-if="{{mqBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{mqBarWho}}:</span><span class="vq-t">{{mqBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{mqBarX}}">×</button></div></template>
<div style="display: flex; align-items: flex-end; gap: 8px">
<label style="position: relative; flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: flex; align-items: center; justify-content: center; cursor: pointer" title="Attach a file"><input type="file" aria-label="Attach a file" onChange="{{attach}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></label>
<label for="msg-draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message {{c.first}}</label>
<textarea id="msg-draft" rows="1" value="{{draft}}" onInput="{{setDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; min-height: 44px; max-height: 120px; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4; resize: vertical"></textarea>
<button type="button" onClick="{{send}}" aria-label="Send message" style="flex: none; height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>Send</button>
</div>
</div>
</section>
</div>
<template data-if="{{standalone}}">
<footer lang="{{svChromeLang}}" dir="{{svDir}}" style="margin-top: 56px; padding-top: 12px; border-top: 1px solid #E2E2DA; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F"><nav aria-label="{{svT.policies}}" style="display: flex; flex-wrap: wrap; gap: 0 18px"><a href="mailto:hello@vachuo.com?subject=Help" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.help}}</a><a href="privacy.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.privacy}}</a><a href="terms.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.terms}}</a><a href="mailto:hello@vachuo.com" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.contact}}</a></nav><span style="margin-left: auto">© 2026 Vachuo™</span><div style="position: relative"><button type="button" aria-haspopup="true" aria-expanded="{{svLangOpen}}" aria-label="{{svT.langMenu}}" onClick="{{svLangToggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{svLangName}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{svLangOpen}}"><div class="vlang-list" role="menu" aria-label="{{svT.langMenu}}" style="position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 70; width: 250px; max-height: 340px; overflow-y: auto; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5)"><template data-for="{{svLangs}}" data-as="l"><button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: {{l.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{l.name}}</span><span style="font-size: 11.5px; color: #62676F">{{l.sub}}</span></span><span aria-hidden="true" style="color: #1D4ED8; font-weight: 700">{{l.mark}}</span></button></template></div></template></div></footer>
</template>
</div>
