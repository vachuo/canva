<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.fadein{animation:fadein .35s ease}@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.livedot{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translateY(-6px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:eyes 4.6s infinite}@keyframes eyes{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.mouth{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.talk .mouth{animation:talk .17s ease-in-out infinite alternate}@keyframes talk{from{transform:scale(1,.45)}to{transform:scale(1.05,1.9)}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center}
.talk .ring{animation:ring 1.6s ease-out infinite}.talk .r2{animation-delay:.8s}@keyframes ring{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.talk .ant{animation:ant .4s ease-in-out infinite alternate}@keyframes ant{to{fill:#FFFFFF}}
.fi{opacity:0;animation:fi .5s ease forwards}@keyframes fi{to{opacity:1}}
.dw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dw 1.3s ease forwards}@keyframes dw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:fi .5s ease forwards,pulse 1.2s ease-in-out 1.7s infinite}@keyframes pulse{50%{opacity:.35}}
.wave{display:inline-flex;align-items:center;gap:3px;height:18px}.wave i{display:block;width:3px;height:6px;border-radius:2px;background:currentColor;animation:wv .9s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}@keyframes wv{50%{height:18px}}
.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#9A9E95;animation:dt 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{50%{transform:translateY(-4px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.fadein,.livedot,.bob,.eyes,.talk .mouth,.talk .ring,.talk .ant,.pulse,.wave i,.dots i,.pop{animation:none}.fi{animation:none;opacity:1}.dw{animation:none;stroke-dashoffset:0}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>

<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Live room<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div><a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a><a href="clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a><a href="showcase.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0zM5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a></div>

t-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: #62676F"><a href="today.html" style="font-weight: 500">Today</a><span aria-hidden="true">/</span><span>Math · Level 6</span><span aria-hidden="true">/</span><span>Ratios from recipes</span></p>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(28px, 3vw, 38px); line-height: 1.1; letter-spacing: -0.015em; font-weight: 600">Scaling a chapati recipe</h1>
<div style="display: flex; align-items: center; gap: 10px">
<span role="timer" aria-live="off" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #3F444C">{{timerText}}</span>
<button type="button" aria-pressed="{{pausedA}}" onClick="{{togglePause}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">{{pauseLabel}}</button>
</div>
</div>
</header>

<dc-import name="Approvals" area="tutor" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<section aria-labelledby="loop-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<h2 id="loop-h" style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">The loop, on Ratios</h2>
<div style="display: flex; align-items: center; gap: 6px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F; margin-right: 6px">{{loopMeta}}</span>
<button type="button" aria-label="Previous step" onClick="{{stepPrev}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<button type="button" aria-label="Next step" onClick="{{stepNext}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button type="button" aria-expanded="{{stepOpenA}}" onClick="{{toggleStep}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 13px; font-weight: 500; cursor: pointer">{{stepToggleLabel}}</button>
</div>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{loop}}" data-as="s">
<li><button type="button" aria-pressed="{{s.pressed}}" aria-current="{{s.current}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}; box-shadow: {{s.ring}}; cursor: pointer"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; opacity: 0.8">{{s.n}}</span>{{s.name}}<template data-if="{{s.done}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></template></button></li>
</template>
</ol>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #ECECE6; overflow: hidden"><div style="width: {{loopPct}}%; height: 100%; background: #1D4ED8; transition: width .5s ease"></div></div>

<template data-if="{{stepOpen}}">
<div class="fadein" style="border-top: 1px solid #ECECE6; padding-top: 16px; display: flex; flex-direction: column; gap: 14px">

</div>

<button type="button" aria-pressed="{{listeningA}}" onClick="{{listen}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 20px 0 14px; border-radius: 999px; border: none; background: {{micBg}}; color: {{micFg}}; font-size: 15px; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>{{micLabel}}<template data-if="{{listening}}"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></template></button>

<span aria-hidden="true" style="width: 1px; height: 28px; background: #CFCFC6"></span>
<button type="button" aria-pressed="{{voiceOffA}}" aria-label="{{muteAria}}" onClick="{{toggleVoice}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; cursor: pointer; display: flex; align-items: center; justify-content: center"><template data-if="{{voiceOn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></template><template data-if="{{voiceOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></template></button>
<label for="tvol" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Socrates volume</label>
<input id="tvol" type="range" min="0" max="100" value="{{vol100}}" onChange="{{setVol}}" style="width: 110px; accent-color: #1D4ED8">
<button type="button" aria-label="{{rateAria}}" onClick="{{cycleRate}}" style="min-width: 54px; min-height: 40px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; cursor: pointer">{{rateText}}</button>

<button type="button" onClick="{{stopTalk}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Stop</button>
</div>
<template data-if="{{listening}}"><p aria-live="polite" style="margin: 0; padding: 0 6px; font-size: 18px; font-style: italic; color: #1E40AF">{{interimShown}}</p></template>

</div>
</template>

</div>
</div>
</template>

<template data-for="{{inks}}" data-as="c"><button type="button" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 30px; height: 30px; border-radius: 50%; border: 3px solid {{c.ring}}; background: {{c.hex}}; cursor: pointer"></button></template>
<button type="button" onClick="{{padUndoChat}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 13px; cursor: pointer">Undo</button>

</div>
</div>
</template>
</template>

<div style="margin-top: auto; border-top: 1px solid #ECECE6; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 10px">
<label for="answer" style="font-size: 13px; font-weight: 600; color: #3F444C">Your answer</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<input id="answer" type="text" value="{{draft}}" onChange="{{setDraft}}" onKeyDown="{{draftKey}}" placeholder="{{placeholder}}" style="flex: 1 1 260px; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A">
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Draw it" aria-pressed="{{padOpenA}}" onClick="{{openDraw}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid {{drawBd}}; background: {{drawBg}}; color: #3F444C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
<button type="button" aria-label="Say it" aria-pressed="{{listeningA}}" onClick="{{listen}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid {{sayBd}}; background: {{sayBg}}; color: {{sayFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
<button type="button" aria-label="Send" onClick="{{sendDraft}}" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #F9A826; color: #14161A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
</div>
</div>
<template data-if="{{chatMicNote}}"><p role="status" style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #92400E">{{micMsgShort}}</p></template>
<div role="group" aria-label="Quick actions" style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{quick}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{chips}}" data-as="c"><button type="button" onClick="{{c.say}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{c.t}}</button></template>
</div>
</div>
</section>

<aside aria-labelledby="thinking" style="flex: 2 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="thinking" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">What Socrates is thinking</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">Always visible to you. Nothing here is a grade, and you can challenge any of it.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What it noticed</span>
<p aria-live="polite" style="margin: 0; background: #FAFAF7; border: 1px solid #ECECE6; border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.5">{{noticed}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Most likely why</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<template data-for="{{causes}}" data-as="c">
<li style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span style="font-size: 14px; line-height: 1.4">{{c.label}}</span><span style="flex: none; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #3F444C">{{c.p}}</span></div>
<div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #ECECE6"><div style="height: 6px; border-radius: 3px; width: {{c.w}}; background: {{c.bar}}; transition: width .5s ease"></div></div>
<span style="font-size: 12.5px; color: #62676F">{{c.kind}}</span>
</li>
</template>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What it’s trying</span>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #3F444C; line-height: 1.45">
<template data-for="{{trying}}" data-as="t"><li style="color: {{t.c}}; font-weight: {{t.w}}">{{t.text}}</li></template>
</ol>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: #FAFAF7; border: 1px solid #ECECE6">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 14px; font-weight: 600">Proportional reasoning</span><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px">{{estFrom}} → <span style="color: {{estColor}}; font-weight: 500">{{estTo}}</span></span></div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">How sure Socrates is that you’ve got this skill. One answer moved it; it moves back the moment you show it.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-expanded="{{contestOpen}}" onClick="{{toggleContest}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1D4ED8; background: #FFFFFF; color: #1E40AF; font-size: 14px; font-weight: 600; cursor: pointer">That’s not what happened</button>
<button type="button" onClick="{{explainOther}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Explain it another way</button>
<button type="button" aria-expanded="{{ndutaA}}" onClick="{{toggleNduta}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #8FD3C9; background: #DDF4F1; color: #115E59; font-size: 14px; font-weight: 600; cursor: pointer">Bring in Nduta</button>
</div>
<template data-if="{{contest}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="contest" style="font-size: 13.5px; font-weight: 600">Tell Vachuo what it missed</label>
<textarea id="contest" rows="3" value="{{contestText}}" onChange="{{setContest}}" placeholder="I typed 15 by mistake. I meant 7.5." style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 16px; line-height: 1.5; color: #14161A; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{sendContest}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Send to Vachuo</button>
<span role="status" style="font-size: 13px; color: {{contestColor}}">{{contestMsg}}</span>
</div>
</div>
</template>
</aside>
</div>

<template data-if="{{nduta}}">
<dc-import name="Messages" contact="nduta" viewer="learner" embedded="{{ true }}" ui-theme="{{uiTheme}}" on-close="{{toggleNduta}}" on-profile="{{noop}}"></dc-import>
</template>

</div>

 data-if="{{svLangOpen}}"><div class="vlang-list" role="menu" aria-label="{{svT.langMenu}}" style="position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 70; width: 250px; max-height: 340px; overflow-y: auto; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5)"><template data-for="{{svLangs}}" data-as="l"><button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: {{l.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{l.name}}</span><span style="font-size: 11.5px; color: #62676F">{{l.sub}}</span></span><span aria-hidden="true" style="color: #1D4ED8; font-weight: 700">{{l.mark}}</span></button></template></div></template></div></footer>
