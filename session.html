<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · My tutor</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.fadein{animation:fadein .35s ease}@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.livedot{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translateY(-6px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:eyes 4.6s infinite}@keyframes eyes{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.mouth{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.talk .mouth{animation:talk .17s ease-in-out infinite alternate}@keyframes talk{from{transform:scale(1,.45)}to{transform:scale(1.05,1.9)}}
.ring{opacity:0;transform-box:fill-box;transform-origin:center}
.talk .ring{animation:ring 1.6s ease-out infinite}.talk .r2{animation-delay:.8s}@keyframes ring{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.talk .ant{animation:ant .4s ease-in-out infinite alternate}@keyframes ant{to{fill:#FFFFFF}}
.fi{opacity:0;animation:fi .5s ease forwards}@keyframes fi{to{opacity:1}}
.dw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dw 1.3s ease forwards}@keyframes dw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:fi .5s ease forwards,pulse 1.2s ease-in-out 1.7s infinite}@keyframes pulse{50%{opacity:.35}}
.wave{display:inline-flex;align-items:center;gap:3px;height:18px}.wave i{display:block;width:3px;height:6px;border-radius:2px;background:currentColor;animation:wv .9s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}@keyframes wv{50%{height:18px}}
.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#9A9E95;animation:dt 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{50%{transform:translateY(-4px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.fadein,.livedot,.bob,.eyes,.talk .mouth,.talk .ring,.talk .ant,.pulse,.wave i,.dots i,.pop{animation:none}.fi{animation:none;opacity:1}.dw{animation:none;stroke-dashoffset:0}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Session">
<div data-theme="{{uiTheme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Vachuo" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="today.html" aria-label="Vachuo, back to Today" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Geist, system-ui, sans-serif; font-size: 10.5px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div>
<a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a>
<a href="session.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a>
<a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a>
<a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="13" rx="2"/><path d="M10.5 8.5v5l4-2.5z"/><path d="M8 20.5h8"/></svg>My classes</a>
<a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M9 14.6l2 2 4-4.2"/></svg>My assessments</a>
<a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h2.5"/><path d="M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Portfolio</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div>
<a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a>
<a href="clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a>
<a href="showcase.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0z"/><path d="M5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Family</div>
<a href="copilot.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.3"/><path d="M16.5 14.2c2.4.3 4 2.4 4 5.3"/></svg>Parent copilot</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div>
<a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5V9h-4.5"/></svg>The loop</a>
</div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}; transition: background 160ms ease"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35); transition: left 160ms ease"></span></span></button>
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 12px 0; border-top: 1px solid #E2E2DA">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span>
</div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: #62676F"><a href="today.html" style="font-weight: 500">Today</a><span aria-hidden="true">/</span><span>Math · Level 6</span><span aria-hidden="true">/</span><span>Ratios from recipes</span></p>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(28px, 3vw, 38px); line-height: 1.1; letter-spacing: -0.015em; font-weight: 600">Scaling a chapati recipe</h1>
<div style="display: flex; align-items: center; gap: 10px">
<span role="timer" aria-live="off" style="font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #3F444C">{{timerText}}</span>
<button type="button" aria-pressed="{{pausedA}}" onClick="{{togglePause}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">{{pauseLabel}}</button>
</div>
</div>
</header>

<dc-import name="Approvals" area="tutor" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<section aria-labelledby="loop-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<h2 id="loop-h" style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">The loop, on Ratios</h2>
<div style="display: flex; align-items: center; gap: 6px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; color: #62676F; margin-right: 6px">{{loopMeta}}</span>
<button type="button" aria-label="Previous step" onClick="{{stepPrev}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<button type="button" aria-label="Next step" onClick="{{stepNext}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button type="button" aria-expanded="{{stepOpenA}}" onClick="{{toggleStep}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 13px; font-weight: 500; cursor: pointer">{{stepToggleLabel}}</button>
</div>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{loop}}" data-as="s">
<li><button type="button" aria-pressed="{{s.pressed}}" aria-current="{{s.current}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}; box-shadow: {{s.ring}}; cursor: pointer"><span style="font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; opacity: 0.8">{{s.n}}</span>{{s.name}}<template data-if="{{s.done}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></template></button></li>
</template>
</ol>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #ECECE6; overflow: hidden"><div style="width: {{loopPct}}%; height: 100%; background: #1D4ED8; transition: width .5s ease"></div></div>

<template data-if="{{stepOpen}}">
<div class="fadein" style="border-top: 1px solid #ECECE6; padding-top: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px">
<span style="display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: {{st.sbg}}; color: {{st.sfg}}; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{st.status}}</span>
<h3 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">{{st.n}} · {{st.name}}</h3>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">{{st.when}}</span>
</div>
<p style="margin: 0; font-size: 17.5px; line-height: 1.5; color: #3F444C; max-width: 860px">{{st.what}}</p>

<template data-if="{{s1}}">
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
<ol style="flex: 3 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<template data-for="{{diagItems}}" data-as="d">
<li><button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 12px; border-radius: 12px; border: 1px solid {{d.bd}}; background: {{d.bg}}; color: #14161A; text-align: left; cursor: pointer; font-family: Geist, system-ui, sans-serif">
<span style="flex: none; width: 22px; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #62676F">{{d.n}}</span>
<span style="flex: 1; min-width: 0; font-size: 14px">{{d.q}}</span>
<span style="flex: none; font-size: 12px; color: #62676F">{{d.skill}}</span>
<span style="flex: none; min-width: 64px; text-align: right; font-size: 12.5px; font-weight: 600; color: {{d.rc}}">{{d.res}}</span>
</button></li>
</template>
</ol>
<div style="flex: 2 1 300px; min-width: 0; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Item {{di.n}} · {{di.skill}}</span>
<p style="margin: 0; font-size: 19px; line-height: 1.35; font-weight: 600">{{di.q}}</p>
<p style="margin: 0; font-size: 16px">Amani answered <b>{{di.ans}}</b> in {{di.time}}.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">{{di.revealed}}</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600"><span style="padding: 6px 12px; border-radius: 999px; background: #E4ECFD; color: #1E40AF">Placed: Ratios, Level 6</span><span style="padding: 6px 12px; border-radius: 999px; background: #FEF1D9; color: #92400E">Gap: Equivalent fractions, 61%</span><span style="padding: 6px 12px; border-radius: 999px; background: #DDF4F1; color: #115E59">Strong: Unit rates, 86%</span></div>
</template>

<template data-if="{{s2}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px">
<template data-for="{{planDays}}" data-as="d">
<div style="border-radius: 14px; background: #FAFAF7; border: 1px solid #ECECE6; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 120px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #62676F">{{d.day}}</span>
<template data-for="{{d.items}}" data-as="it">
<div style="border-radius: 10px; padding: 8px 10px; background: {{it.bg}}; border: 1px solid {{it.bd}}; opacity: {{it.op}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; line-height: 1.25; text-decoration: {{it.strike}}">{{it.title}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #3F444C">{{it.meta}}</span></div>
</template>
</div>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: Geist, system-ui, sans-serif; font-size: 14px">
<template data-for="{{planOpts}}" data-as="o"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">{{o.label}}</label></template>
</div>
<p role="status" style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; color: #115E59">{{planSummary}}</p>
</template>

<template data-if="{{s3}}">
<div role="group" aria-label="Ways to teach it" style="display: flex; flex-wrap: wrap; gap: 6px">

<script>
DC.component("Session", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
    return { uiTheme: t, uiDark: d, uiLight: !d, uiOn: d ? 'true' : 'false', uiToggle: this._uiFlip, uiTrack: d ? '#1D4ED8' : '#8A8F96', uiKnob: d ? '19px' : '3px' };
  }
  themeOff() { try { window.removeEventListener('storage', this._uiSync); } catch (e) {} }

  constructor(props) {
    super(props);
    const F = this.faces();
    this.pads = {};
    this.state = {
      secs: 18 * 60, paused: false,
      step: 6, stepOpen: true,
