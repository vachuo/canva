<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Approvals and alignment plan</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Approvals">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<template data-if="{{isParent}}">
<section aria-labelledby="ap-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="ap-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Waiting for your approval</h2>
<span style="font-size: 13px; color: #62676F">{{pendingCount}}</span>
</div>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; line-height: 1.5; color: #3F444C">Alignment plans, Showcase listings, in-person sessions and job applications land here, with what your child said about each one. Learners can propose changes too. Nothing goes live, gets paid or meets anyone until you say yes.</p>
<template data-for="{{pending}}" data-as="a">
<div class="fadein" style="border: 1px solid #F3DDB0; background: #FEF9EE; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="padding: 2px 9px; border-radius: 999px; background: {{a.kBg}}; color: {{a.kFg}}; font-size: 12px; font-weight: 700">{{a.kind}}</span><span style="font-size: 12.5px; color: #3F444C">From {{a.from}} · {{a.at}}</span></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.25">{{a.title}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{a.detail}}</span>
<template data-if="{{a.hasSays}}"><p style="margin: 0; padding: 8px 12px; border-left: 3px solid #0D9488; background: #FFFFFF; border-radius: 0 10px 10px 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; font-style: italic; line-height: 1.45; color: #134E4A">“{{a.says}}” <span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-style: normal; color: #62676F">{{a.saysWho}}</span></p></template>
<template data-if="{{a.noSays}}"><span style="font-size: 12.5px; color: #8A8F96">Nothing from {{a.from}} on this yet. You could ask before deciding.</span></template>
<template data-if="{{a.hasAreas}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{a.areas}}" data-as="r"><span style="padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 12px; color: #3F444C">{{r.t}}</span></template></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{a.approve}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 700; cursor: pointer">Approve</button><button type="button" onClick="{{a.decline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></div>
</div>
</template>
<template data-if="{{noPending}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 14px; color: #3F444C">Nothing is waiting. Requests from My assessments, Portfolio, Clubs and Showcase will appear here.</p></template>
<template data-if="{{hasDone}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Decided</span>
<template data-for="{{done}}" data-as="d"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8; font-size: 13.5px"><span style="padding: 2px 8px; border-radius: 999px; background: {{d.sBg}}; color: {{d.sFg}}; font-size: 12px; font-weight: 700">{{d.status}}</span><span style="flex: 1 1 200px">{{d.title}}</span><button type="button" onClick="{{d.undo}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; text-decoration: underline; cursor: pointer">Undo</button></div></template>
</div>
</template>
</section>
</template>

<template data-if="{{isStrip}}">
<section aria-label="{{stripTitle}}" style="background: {{stripBg}}; border: 1px solid {{stripBd}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{chipBg}}; color: {{chipFg}}; font-size: 12px; font-weight: 700">{{chip}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600">{{stripTitle}}</span><span style="font-size: 12.5px; color: #62676F">{{stripSub}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{stripItems}}" data-as="s"><div style="flex: 1 1 240px; min-width: 0; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{s.t}}</span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{s.w}}</span></div></template>
</div>
</section>
</template>

</div>
</template>
<script>
DC.component("Approvals", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT;
    return { uiTheme: t };
  }
  componentDidMount() {
    this._sync = (e) => { if (!e || e.key === 'vachuo-approvals' || e.key === 'vachuo-theme') { this._uiT = undefined; this.forceUpdate(); } };
    try { window.addEventListener('storage', this._sync); window.addEventListener('vachuo-approvals', this._sync); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this._sync); window.removeEventListener('vachuo-approvals', this._sync); } catch (e) {} }
  read() { try { const v = JSON.parse(window.localStorage.getItem('vachuo-approvals') || 'null'); if (Array.isArray(v)) return v; } catch (e) {} return this._mem || this.seed(); }
  write(list) { this._mem = list; try { window.localStorage.setItem('vachuo-approvals', JSON.stringify(list)); window.dispatchEvent(new Event('vachuo-approvals')); } catch (e) {} this.forceUpdate(); }
  seed() {
    return [{ id: 'seed-club', kind: 'club', title: 'Amani wants to join “Bao la Kiswahili” at Kilimani Library, Sat 7 Nov, 10:00', detail: 'In person · group of 8 · run by Mzee Kariuki with a library volunteer present. Her first in-person club session.', says: 'Mzee Kariuki knows openings my grandfather never taught me. Please can I go?', from: 'Amani', at: 'Mon 2 Nov', status: 'pending' },
      { id: 'seed-list', kind: 'listing', title: 'Showcase listing: “Rain over Kilimani”, watercolour, A4, KSh 1,200', detail: 'Amani’s first listing. Payment would go to you; buyers message you, never Amani.', says: 'I want to save for a microscope. I’d put half of it towards that.', from: 'Amani', at: 'Sun 1 Nov', status: 'pending' }];
  }
  renderVals() {
    const area = (this.props && this.props.area) || 'parent'; const list = this.read();
    const K = { align: ['Alignment plan', '#E4ECFD', '#1E40AF'], listing: ['Showcase listing', '#FEF1D9', '#92400E'], club: ['Club session', '#DDF4F1', '#115E59'], job: ['Job application', '#ECECE6', '#3F444C'], onboard: ['New learner', '#E4ECFD', '#172F73'], session: ['In-person session', '#DDF4F1', '#115E59'] };
    const set = (id, status) => this.write(this.read().map((x) => (x.id === id ? Object.assign({}, x, { status, decidedAt: 'Tue 3 Nov' }) : x)));
    const out = Object.assign(this.themeVals(), { isParent: area === 'parent', isStrip: false, pending: [], noPending: true, done: [], hasDone: false, pendingCount: '', stripTitle: '', stripSub: '', stripItems: [], stripBg: '#FFFFFF', stripBd: '#E2E2DA', chip: '', chipBg: '#FFFFFF', chipFg: '#14161A' });
    if (area === 'parent') {
      const pend = list.filter((x) => x.status === 'pending'); const done = list.filter((x) => x.status !== 'pending');
      const AREA = { map: 'Learning map', classes: 'My classes', assess: 'My assessments', tutor: 'Socrates', clubs: 'Clubs and Connects' };
      Object.assign(out, { pendingCount: pend.length ? pend.length + ' waiting' : 'All clear', noPending: !pend.length, hasDone: done.length > 0,
        pending: pend.map((x) => { const k = K[x.kind] || K.job; const areas = x.payload && x.payload.items ? Object.keys(x.payload.items).filter((a) => x.payload.items[a].length).map((a) => ({ t: AREA[a] + ' · ' + x.payload.items[a].length })) : [];
          const says = x.says || (x.payload && x.payload.says) || ''; return { kind: k[0], kBg: k[1], kFg: k[2], title: x.title, detail: x.detail, says, hasSays: !!says, noSays: !says, saysWho: (x.from || 'The learner').split(' ')[0] + ', in their words', from: x.from, at: x.at, areas, hasAreas: areas.length > 0, approve: () => set(x.id, 'approved'), decline: () => set(x.id, 'declined') }; }),
        done: done.slice(-5).reverse().map((x) => ({ title: x.title, status: x.status === 'approved' ? 'Approved' : 'Declined', sBg: x.status === 'approved' ? '#DDF4F1' : '#ECECE6', sFg: x.status === 'approved' ? '#115E59' : '#3F444C', undo: () => set(x.id, 'pending') })) });
      return out;
    }
    const plans = list.filter((x) => x.kind === 'align' && x.payload && x.payload.items && (x.payload.items[area] || []).length);
    const ap = plans.filter((x) => x.status === 'approved').slice(-1)[0]; const pe = plans.filter((x) => x.status === 'pending').slice(-1)[0];
    const p = ap || pe; if (!p) return out;
    const items = p.payload.items[area] || [];
    Object.assign(out, { isStrip: true, chip: ap ? 'Added by your alignment plan' : 'Waiting for Wanjiru', chipBg: ap ? '#DDF4F1' : '#FEF1D9', chipFg: ap ? '#115E59' : '#92400E',
      stripTitle: p.payload.label, stripSub: ap ? 'Approved by Wanjiru · ' + (ap.decidedAt || 'today') + ' · ' + items.length + ' added here' : items.length + ' will be added here once approved',
      stripBg: ap ? '#F4F7FE' : '#FEF9EE', stripBd: ap ? '#DCE6FD' : '#F3DDB0', stripItems: items.map((x) => ({ t: x.t, w: x.w })) });
    return out;
  }
}
return Component;
}, {"area": "parent", "embedded": false});

DC.mount("Approvals");
</script>
</body>
</html>
