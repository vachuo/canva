<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo Pricing</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
html.rv-on [data-rv]{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
html.rv-on [data-rv]:not([data-shown]){opacity:0;transform:translateY(28px)}
.plan{transition:transform .25s ease,box-shadow .25s ease}
.plan:hover{transform:translateY(-4px);box-shadow:0 24px 48px -28px rgba(20,22,26,.35)}
.faq-q{transition:background .2s ease}.faq-q:hover{background:#F4F4EF}
@keyframes bot-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bot-hover{animation:bot-hover 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.plan,.plan:hover{transition:none;transform:none}.bot-hover{animation:none}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:30px;font-size:13.5px;line-height:1.3;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Pricing">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA; box-shadow: {{headShadow}}">
<div lang="{{svChromeLang}}" dir="{{svDir}}" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="index.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; color: #1E40AF; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px">{{svT.navPricing}}</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #3F444C">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>

<main>
<section aria-labelledby="price-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 6vw, 80px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Pricing</span>
<h1 id="price-title" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">A whole school, priced like a tutor.</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3F444C; max-width: 640px; text-wrap: pretty">Start free with one learner. Upgrade when the loop has earned it. Every plan includes the safeguards: verified adults, parent approval for meetings and a learner-owned record.</p>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 20px; padding-top: 6px">
<div role="group" aria-label="Billing period" style="display: inline-flex; padding: 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E2DA">
<button type="button" aria-pressed="{{mPressed}}" onClick="{{setMonthly}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: {{mBg}}; color: {{mFg}}; font-size: 14.5px; font-weight: 600; cursor: pointer">Monthly</button>
<button type="button" aria-pressed="{{yPressed}}" onClick="{{setYearly}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: {{yBg}}; color: {{yFg}}; font-size: 14.5px; font-weight: 600; cursor: pointer">Yearly · 2 months free</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="region" style="font-size: 13px; font-weight: 600; color: #3F444C">Region and currency</label>
<select id="region" value="{{region}}" onChange="{{pickRegion}}" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
<option value="USD">United States · USD</option>
<option value="KES">Kenya · KES</option>
<option value="EUR">Euro area · EUR</option>
<option value="GBP">United Kingdom · GBP</option>
<option value="INR">India · INR</option>
</select>
</div>
</div>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Local prices reflect what families can afford in each region, not exchange rates. Taxes may apply.</p>
</div>
<figure aria-hidden="true" style="flex: 2 1 320px; margin: 0; position: relative; height: 340px; border-radius: 26px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -200px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -420px; top: -660px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -96px; height: 170px; border-radius: 50%; background: #FBF7EE"></span>
<span style="position: absolute; left: 18px; top: 18px; padding: 7px 14px; border-radius: 16px 16px 16px 4px; background: #FFFFFF; color: #172F73; font-family: 'EB Garamond', Garamond, Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.15; white-space: nowrap">One tutor on every plan.</span>
<span style="position: absolute; left: 50%; bottom: 12px; width: 120px; height: 12px; margin-left: -120px; border-radius: 50%; background: rgba(20,22,26,0.12)"></span>
<div style="position: absolute; left: 0; right: 0; top: 30px; bottom: 18px; display: flex; justify-content: center; align-items: flex-end; gap: 4px">
<img class="bot-hover" src="assets/img/87d7bb4eafcdad13beb883a8e8834715.svg" alt="" style="display: block; height: 80%; width: auto; margin: 0 4px 22px 0">
<img src="assets/img/d42b6aeb08200a8796692a2ce1cd239f.svg" alt="" style="display: block; height: 72%; width: auto">
</div>
</figure>
</section>

<section aria-label="Plans" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 16px clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 16px; align-items: stretch">
<template data-for="{{plans}}" data-as="p">
<article class="plan" aria-labelledby="{{p.hid}}" style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 22px; background: {{p.bg}}; color: {{p.fg}}; border: {{p.border}}">
<template data-if="{{p.popular}}"><span style="position: absolute; top: -12px; left: 24px; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #F9A826; color: #14161A">Most popular</span></template>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="{{p.hid}}" style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 600">{{p.name}}</h2>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: {{p.sub}}">{{p.for}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-height: 86px">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.02em">{{p.price}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; color: {{p.sub}}">{{p.unit}}</span></span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: {{p.sub}}">{{p.note}}</span>
</div>
<a href="{{p.href}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 999px; background: {{p.ctaBg}}; color: {{p.ctaFg}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; text-decoration: none">{{p.cta}}</a>
<ul style="list-style: none; margin: 0; padding: 14px 0 0; border-top: 1px solid {{p.rule}}; display: flex; flex-direction: column; gap: 10px; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.45">
<template data-for="{{p.features}}" data-as="f"><li style="display: flex; gap: 10px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.tick}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>{{f}}</span></li></template>
</ul>
</article>
</template>
</div>
</section>

<section aria-labelledby="calc-title" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #115E59">Estimate your cost</span>
<h2 id="calc-title" style="margin: 0; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; font-weight: 600; text-wrap: balance">How many learners are in your home or microschool?</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #3F444C">Family plans cover up to four learners. Each extra learner adds a small fee, so siblings never cost the price of a new subscription.</p>
<img src="assets/img/2aa4c92439122fbbb3d3f75cd70a35fc.webp" alt="A parent reviews papers while her son learns with headphones at the kitchen table" style="display: block; width: 100%; max-width: 520px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 20px">
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: clamp(20px, 3vw, 32px); border-radius: 22px; background: #F4F4EF; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<label for="learners" style="font-size: 15px; font-weight: 600">Learners</label>
<output for="learners" style="font-family: ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 500">{{learners}}</output>
</div>
<input id="learners" type="range" min="1" max="12" step="1" value="{{learners}}" onChange="{{pickLearners}}" style="width: 100%; accent-color: #1D4ED8; min-height: 32px">
<div style="display: flex; flex-direction: column; gap: 10px">
<template data-for="{{estimates}}" data-as="e">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: {{e.border}}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{e.name}}</span><span style="font-size: 13px; color: #62676F">{{e.detail}}</span></span>
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 500">{{e.total}}</span>
</div>
</template>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #62676F">{{calcNote}}</p>
</div>
</div>
</section>

<section aria-labelledby="compare-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 32px">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 720px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Compare plans</span>
<h2 id="compare-title" style="margin: 0; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; font-weight: 600">Everything, side by side.</h2>
</div>
<div role="group" aria-label="Feature groups" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{groupChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{c.label}}</button></template>
</div>
</div>
<div style="overflow-x: auto; border-radius: 20px; border: 1px solid #E2E2DA; background: #FFFFFF">
<table style="width: 100%; min-width: 820px; border-collapse: collapse; font-family: Inter, system-ui, sans-serif; font-size: 14.5px">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Feature comparison across Vachuo plans</caption>
<thead>
<tr style="background: #F4F4EF">
<th scope="col" style="text-align: left; padding: 16px 18px; font-weight: 600; width: 30%">Feature</th>
<th scope="col" style="text-align: left; padding: 16px 12px; font-weight: 600">Explore</th>
<th scope="col" style="text-align: left; padding: 16px 12px; font-weight: 600; color: #1E40AF">Family</th>
<th scope="col" style="text-align: left; padding: 16px 12px; font-weight: 600">Family Plus</th>
<th scope="col" style="text-align: left; padding: 16px 12px; font-weight: 600">Microschool</th>
<th scope="col" style="text-align: left; padding: 16px 12px; font-weight: 600">Schools &amp; systems</th>
</tr>
</thead>
<tbody>
<template data-for="{{rows}}" data-as="r">
<tr style="border-top: 1px solid #ECECE6; background: {{r.bg}}">
<th scope="row" style="text-align: left; padding: 13px 18px; font-weight: {{r.weight}}; color: {{r.color}}">{{r.label}}</th>
<td style="padding: 13px 12px; color: #3F444C">{{r.a}}</td>
<td style="padding: 13px 12px; color: #14161A; font-weight: 500">{{r.b}}</td>
<td style="padding: 13px 12px; color: #3F444C">{{r.c}}</td>
<td style="padding: 13px 12px; color: #3F444C">{{r.d}}</td>
<td style="padding: 13px 12px; color: #3F444C">{{r.e}}</td>
</tr>
</template>
</tbody>
</table>
</div>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">✓ included · — not included. Guide sessions are 30 minutes with a verified Vachuo guide.</p>
</section>

<section aria-labelledby="access-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; padding: clamp(24px, 4vw, 44px); border-radius: 26px; background: #DDF4F1">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
