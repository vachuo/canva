<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">My learning map · {{subjName}}</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 860px; text-wrap: balance">What you think you know, and what Vachuo thinks.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 700px; text-wrap: pretty">Your view comes first. Every estimate is from your work, never a judgment of you. Correct it, set your own destinations, keep anything to yourself, or wander off the path. The map follows you, not the other way round.</p>
</header>

<dc-import name="Approvals" area="map" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<div role="group" aria-label="Subject" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{subjects}}" data-as="s">
<button type="button" class="chip" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{s.name}}<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: {{s.lv}}">{{s.levelText}}</span></button>
</template>
</div>

<section aria-labelledby="path" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="path" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{pathTitle}}</h2>
<span style="font-size: 13.5px; color: #62676F">{{placed}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px">
<ul aria-label="Legend" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: #3F444C">
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #E4ECFD; border: 1px solid #93BBF3"></span>Shown (85%+)</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FFFFFF; border: 1px solid #B9BCB4"></span>Growing</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FFFFFF; border: 2px solid #F9A826; box-sizing: border-box"></span>Gap found</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #1D4ED8"></span>Working now</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FAFAF7; border: 1px dashed #8A8F96; box-sizing: border-box"></span>Not yet</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FEF1D9; border: 1.5px dashed #F9A826; box-sizing: border-box"></span>Your destination</li>
</ul>
<button type="button" class="chip" aria-pressed="{{routePressed}}" onClick="{{toggleRoute}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{routeBd}}; background: {{routeBg}}; color: {{routeFg}}; font-size: 13.5px; font-weight: 500; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></svg>{{routeLabel}}</button>
</div>
<p style="margin: -6px 0 0; font-size: 13.5px; color: #62676F">Select any skill to see the evidence behind it, or the destination to change it.</p>
<div style="overflow-x: auto; margin: 0 -8px; padding: 4px 8px 8px">
<div role="group" aria-label="{{graphLabel}}" style="position: relative; width: 1064px; height: 256px">
<template data-for="{{edges}}" data-as="e">
<span aria-hidden="true">
<span class="edge" style="position: absolute; left: {{e.l}}px; top: {{e.t}}px; width: {{e.w}}px; height: {{e.h}}px; background: {{e.bg}}; border-top: {{e.dt}}; border-left: {{e.dl}}; opacity: {{e.op}}"></span>
<span class="edge" style="position: absolute; left: {{e.al}}px; top: {{e.at}}px; width: 0; height: 0; border-top: {{e.bt}}; border-right: {{e.br}}; border-bottom: {{e.bb}}; border-left: {{e.bl}}; opacity: {{e.op}}"></span>
</span>
</template>
<template data-for="{{nodes}}" data-as="n">
<button type="button" class="node" aria-pressed="{{n.sel}}" aria-label="{{n.aria}}" onClick="{{n.pick}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 168px; height: 72px; box-sizing: border-box; margin: 0; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; border-radius: 14px; background: {{n.bg}}; border: {{n.bd}}; color: {{n.fg}}; box-shadow: {{n.shadow}}; opacity: {{n.op}}; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; line-height: 18px; cursor: pointer">
<b style="font-weight: 600">{{n.name}}</b>
<span style="font-family: {{n.subFont}}; font-size: 12.5px; color: {{n.subFg}}">{{n.sub}}</span>
</button>
</template>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<template data-if="{{isSkill}}">
<section aria-labelledby="skill" class="fade" style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 id="skill" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{skName}}</h2>
<span style="font-size: 12.5px; font-weight: 600; color: {{skPillFg}}; background: {{skPillBg}}; padding: 4px 10px; border-radius: 999px">{{skPill}}</span>
</div>
<p style="margin: 0; font-size: 14px; color: #62676F">{{skLinks}}</p>
<p style="margin: 2px 0 0; font-size: 16.5px; line-height: 1.5; color: #3F444C; max-width: 640px">{{skAbout}}</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 260px; min-width: 0; border: 1px solid #ECECE6; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Your view, first</span>
<div role="group" aria-label="{{viewAria}}" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{views}}" data-as="v">
<button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="flex: 1 1 auto; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{v.bd}}; background: {{v.bg}}; color: {{v.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{v.label}}</button>
</template>
</div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">{{viewNote}}</p>
<button type="button" aria-pressed="{{privOn}}" onClick="{{togglePriv}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 6px 10px 6px 12px; border-radius: 12px; border: 1px solid #E2E2DA; background: {{privBg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Keep this to myself</span><span style="font-size: 12.5px; color: #62676F">{{privNote}}</span></span><span aria-hidden="true" style="flex: none; position: relative; width: 40px; height: 24px; border-radius: 999px; background: {{privTrack}}"><span style="position: absolute; top: 3px; left: {{privKnob}}; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
</div>
<div style="flex: 1 1 260px; min-width: 0; border: 1px solid #ECECE6; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Vachuo’s estimate</span>
<span aria-live="polite" style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 40px; line-height: 1; letter-spacing: -0.02em">{{skScore}}</span>
<div aria-hidden="true" style="position: relative; height: 10px; border-radius: 5px; background: #ECECE6">
<div style="position: absolute; left: {{skBandL}}%; width: {{skBandW}}%; top: 0; bottom: 0; background: #93BBF3; border-radius: 5px"></div>
<div style="position: absolute; left: calc({{skPos}}% - 1px); width: 3px; top: -3px; bottom: -3px; background: #1D4ED8; border-radius: 2px"></div>
<div style="position: absolute; left: 85%; width: 2px; top: -5px; bottom: -5px; background: #14161A"></div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #62676F">{{skRange}}</p>
</div>
</div>

<template data-if="{{hasQuiz}}">
<div style="border-radius: 16px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">

<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Counts as practice evidence</span>
</div>
<template data-if="{{hasPassage}}">
<blockquote style="margin: 0; padding: 12px 16px; border-left: 3px solid #1684E8; background: #FFFFFF; border-radius: 0 12px 12px 0; font-size: 17px; line-height: 1.55; font-style: italic; color: #14161A">{{quizPassage}}</blockquote>
</template>
<p style="margin: 0; font-size: 18px; line-height: 1.45; font-weight: 600">{{quizQ}}</p>
<div role="group" aria-label="Answer choices" style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{quizOpts}}" data-as="o">
<button type="button" class="opt" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 17px; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: {{o.markBg}}; color: {{o.markFg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600">{{o.mark}}</span>{{o.t}}</button>
</template>
</div>
<p role="status" style="margin: 0; min-height: 24px; font-size: 16px; line-height: 1.5; color: {{quizFbFg}}">{{quizFb}}</p>
<template data-if="{{quizDone}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{quizReset}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 500; cursor: pointer">Try it again</button>
<a href="session.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; text-decoration: none">Keep going with the tutor</a>
</div>
</template>
</div>
</template>

<div style="display: flex; flex-direction: column; gap: 4px">
<h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">Evidence behind the estimate</h3>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-for="{{evidence}}" data-as="e">
<li style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 0; border-top: 1px solid #ECECE6">
<span style="flex: none; width: 84px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #62676F">{{e.date}}</span>
<span style="flex: none; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: {{e.tagBg}}; color: {{e.tagFg}}">{{e.source}}</span>
<span style="flex: 1 1 240px; min-width: 0; font-size: 15.5px; line-height: 1.45">{{e.text}}</span>
<span style="flex: none; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: {{e.deltaFg}}">{{e.delta}}</span>
</li>
</template>
</ul>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="{{pinPressed}}" onClick="{{togglePin}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{pinBd}}; background: {{pinBg}}; color: {{pinFg}}; font-size: 14px; font-weight: 600; cursor: pointer">{{pinLabel}}</button>
<a href="connects.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #8FD3C9; background: #DDF4F1; color: #115E59; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-decoration: none">Learn it somewhere else</a>
<button type="button" aria-expanded="{{whyExpanded}}" aria-controls="why-text" onClick="{{toggleWhy}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">{{whyLabel}}</button>
</div>
<template data-if="{{whyOpen}}">
<p id="why-text" class="fade" style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #F4F4EF; font-size: 16px; line-height: 1.55; color: #3F444C">{{whyText}}</p>
</template>
</div>
</section>
</template>

<aside aria-labelledby="how" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

d}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Carry it</button></div></section>

<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="how" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">How your map works</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">Each skill holds a probability that you’ve got it. It updates after every lesson, project and workshop visit, and after anything you choose to log from open hours.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">A wrong answer is never just a zero. Vachuo asks why: a misconception, a slip, a missing step, confusing wording, tiredness or a guess. Each one gets a different response.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #14161A; font-weight: 500">Your map belongs to you. It goes with you to any school, tutor or employer, or nowhere at all.</p>

; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Open My tutor, the full conversation" title="Open My tutor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></a></template><button type="button" class="sf-hb" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Start a new conversation" title="New conversation" onClick="{{sfNew}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg></button><button type="button" class="sf-hb" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: transparent; color: #3F444C; text-decoration: none; font-size: 20px; line-height: 1" aria-label="Close Socrates" title="Close" onClick="{{sfClose}}">×</button></div><div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #ECECE6; background: #FBFBF8"><span style="font-size: 12.5px; color: #62676F">Want a full lesson or a timed debate?</span><a href="session.html#teach" onClick="{{sfTeach}}" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: #DC2626; color: #FFFFFF; font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap" title="A timed lesson or debate with Socrates, full screen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v12H3zM8 21h8M12 16.5V21"/></svg>Teach / Debate</a></div><div id="sf-log" aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><template data-for="{{sfMsgs}}" data-as="m"><template data-if="{{m.isDiv}}"><div role="separator" style="display: flex; align-items: center; gap: 10px; color: #62676F; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span>{{m.divText}}<span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span></div></template><template data-if="{{m.isTyping}}"><div role="status" aria-label="Socrates is thinking" class="sf-dots" style="align-self: flex-start; padding: 12px 14px; border-radius: 14px; background: #F4F7FE"><span></span><span></span><span></span></div></template><template data-if="{{m.isMsg}}"><div style="align-self: {{m.align}}; max-width: 90%; display: flex; flex-direction: column; align-items: {{m.align}}; gap: 2px"><div id="{{m.domId}}" style="padding: 9px 12px; border-radius: 14px; background: {{m.bg}}; font-size: 14px; line-height: 1.5; color: #14161A"><template data-if="{{m.hasQ}}"><button type="button" class="vq" onClick="{{m.qGo}}" aria-label="{{m.qAria}}"><span class="vq-w">↩ Replying to {{m.qWho}}:</span><span class="vq-t">{{m.qText}}</span></button></template>{{m.text}}</div><template data-if="{{m.canReply}}"><button type="button" class="vq-rb" onClick="{{m.replyGo}}" aria-label="{{m.replyAria}}">↩ Reply</button></template></div></template></template></div><div style="flex: none; padding: 10px 14px 12px; border-top: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 8px"><div role="group" aria-label="Quick actions" class="sf-chips" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px"><template data-for="{{sfChips}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer">{{c.label}}</button></template></div><template data-if="{{sfBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{sfBarWho}}:</span><span class="vq-t">{{sfBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{sfBarX}}">×</button></div></template><div style="display: flex; gap: 8px"><label for="sf-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{sfPh}}</label><input id="sf-input" value="{{sfDraft}}" onChange="{{sfSet}}" onKeyDown="{{sfInKey}}" placeholder="{{sfPh}}" autocomplete="off" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" aria-label="Send to Socrates" onClick="{{sfSend}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div><span style="font-size: 12px; line-height: 1.45; color: #62676F">{{sfNote}}</span></div></section></template></div>
</div>
</template>
<template id="dc-Approvals">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<template data-if="{{isParent}}">
<section aria-labelledby="ap-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="ap-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Waiting for your approval</h2>
<span style="font-size: 13px; color: #62676F">{{pendingCount}}</span>
</div>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; line-height: 1.5; color: #3F444C">Alignment plans, Showcase listings, in-person sessions and job applications land here, with what your child said about each one. Learners can propose changes too. Nothing goes live, gets paid or meets anyone until you say yes.</p>
<template data-for="{{pending}}" data-as="a">
<div class="fadein" style="border: 1px solid #F3DDB0; background: #FEF9EE; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="padding: 2px 9px; border-radius: 999px; background: {{a.kBg}}; color: {{a.kFg}}; font-size: 12px; font-weight: 700">{{a.kind}}</span><span style="font-size: 12.5px; color: #3F444C">From {{a.from}} · {{a.at}}</span></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.25">{{a.title}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{a.detail}}</span>
<template data-if="{{a.hasSays}}"><p style="margin: 0; padding: 8px 12px; border-left: 3px solid #0D9488; background: #FFFFFF; border-radius: 0 10px 10px 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; font-style: italic; line-height: 1.45; color: #134E4A">“{{a.says}}” <span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-style: normal; color: #62676F">{{a.saysWho}}</span></p></template>
<template data-if="{{a.noSays}}"><span style="font-size: 12.5px; color: #8A8F96">Nothing from {{a.from}} on this yet. You could ask before deciding.</span></template>
<template data-if="{{a.hasAreas}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{a.areas}}" data-as="r"><span style="padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 12px; color: #3F444C">{{r.t}}</span></template></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{a.approve}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 700; cursor: pointer">Approve</button><button type="button" onClick="{{a.decline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></div>
</div>
</template>
<template data-if="{{noPending}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 14px; color: #3F444C">Nothing is waiting. Requests from My assessments, Portfolio, Clubs and Showcase will appear here.</p></template>
<template data-if="{{hasDone}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Decided</span>
<template data-for="{{done}}" data-as="d"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8; font-size: 13.5px"><span style="padding: 2px 8px; border-radius: 999px; background: {{d.sBg}}; color: {{d.sFg}}; font-size: 12px; font-weight: 700">{{d.status}}</span><span style="flex: 1 1 200px">{{d.title}}</span><button type="button" onClick="{{d.undo}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; text-decoration: underline; cursor: pointer">Undo</button></div></template>
</div>
</template>
</section>
</template>

<template data-if="{{isStrip}}">
<section aria-label="{{stripTitle}}" style="background: {{stripBg}}; border: 1px solid {{stripBd}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{chipBg}}; color: {{chipFg}}; font-size: 12px; font-weight: 700">{{chip}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600">{{stripTitle}}</span><span style="font-size: 12.5px; color: #62676F">{{stripSub}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{stripItems}}" data-as="s"><div style="flex: 1 1 240px; min-width: 0; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{s.t}}</span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{s.w}}</span></div></template>
</div>
</section>
</template>

</div>
</template>
<template id="dc-Strengths">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="st-h" data-rail="1" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="st-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">{{title}}</h2><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #62676F">Each point is a skill. The further out, the stronger. The dashed ring is 85%, where a skill counts as secure.</p></div>
<template data-if="{{multi}}"><div class="st-railnav" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px"><span style="font-size: 13.5px; color: #62676F">Swipe or use the arrows.</span><span style="display: inline-flex; gap: 6px"><button type="button" class="st-railbtn" aria-label="Scroll back" onClick="{{railPrev}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="st-railbtn" aria-label="Scroll forward" onClick="{{railNext}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span></div></template>
<div class="st-rail {{railCls}}" aria-label="Strengths by subject">
<template data-for="{{radars}}" data-as="r"><div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FBFBF8; border: 1px solid #ECECE6">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{r.color}}"></span>{{r.name}}</span><span style="font-size: 12px; color: #62676F">{{r.done}}</span></div>
<svg viewBox="0 0 240 220" role="img" aria-label="{{r.aria}}" style="color: #3F444C; width: 100%; max-width: {{svgMax}}; height: auto; align-self: center">
<template data-for="{{r.rings}}" data-as="g"><polygon points="{{g.pts}}" fill="none" stroke="#9A9E95" stroke-opacity="0.45" stroke-width="1"></polygon></template>
<polygon points="{{r.secure}}" fill="none" stroke="#9A9E95" stroke-width="1.2" stroke-dasharray="4 3"></polygon>
<template data-for="{{r.axes}}" data-as="a"><line x1="120" y1="110" x2="{{a.x2}}" y2="{{a.y2}}" stroke="#9A9E95" stroke-opacity="0.45" stroke-width="1"></line><text x="{{a.lx}}" y="{{a.ly}}" text-anchor="{{a.anchor}}" font-size="10.5" font-family="Inter, system-ui, sans-serif" fill="currentColor">{{a.short}}</text></template>
<polygon points="{{r.poly}}" fill="{{r.color}}" fill-opacity="0.22" stroke="{{r.color}}" stroke-width="2"></polygon>
<template data-for="{{r.dots}}" data-as="d"><circle cx="{{d.x}}" cy="{{d.y}}" r="3.2" fill="{{r.color}}"></circle></template>
</svg>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<template data-for="{{r.skills}}" data-as="k"><li style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #3F444C">{{k.name}}</span><span style="font-weight: 600; color: {{k.fg}}">{{k.pct}}%</span></li></template>
</ul>
</div></template>

  subj() { return this.S.find((s) => s.id === this.state.subj) || this.S[0]; }
  nowNode(s) { return s.r1[2]; }
  allNodes(s) { return s.r0.concat(s.r1); }
  key(id) { return this.state.subj + ':' + id; }
  selId(s) { return this.state.sel[s.id] || this.nowNode(s).id; }
  destIdx(s) { return this.state.dest[s.id] || 0; }
  quizPick(s) { const q = this.state.quiz[s.id]; return typeof q === 'number' ? q : -1; }
  quizDelta(s) { const p = this.quizPick(s); if (p < 0) return 0; return s.quiz.opts[p][1] === true ? 0.03 : -0.02; }
  score(s, n) { return Math.max(0, Math.min(1, n.score + (n.id === this.nowNode(s).id ? this.quizDelta(s) : 0))); }
  routeIds(s) { return [s.r0[2].id, s.r1[2].id, s.r1[3].id, s.r1[4].id, 'dest']; }

  select(id) { const sel = Object.assign({}, this.state.sel); sel[this.state.subj] = id; this.setState({ sel, why: false }); }

  edges(s, selId, route) {
    const c0 = s.r0.map((n) => n.id).concat(['dest']);
    const c1 = s.r1.map((n) => n.id);
    const onRoute = this.routeIds(s);
    const out = [];
    const T = '0 solid transparent';
    const mk = (from, to, kind, c, r, dashed) => {
      const hl = from === selId || to === selId;
      const col = hl ? '#1D4ED8' : (dashed ? '#F9A826' : '#9A9E95');
      const op = route && !(onRoute.indexOf(from) >= 0 && onRoute.indexOf(to) >= 0) ? 0.22 : 1;
      if (kind === 'h') {
        const y = 24 + 136 * r;
        out.push({ l: 180 + 220 * c, t: y + 35, w: 38, h: dashed ? 0 : 2, bg: dashed ? 'transparent' : col, dt: dashed ? '2px dashed ' + col : 'none', dl: 'none',
          al: 218 + 220 * c, at: y + 31, bt: '5px solid transparent', bb: '5px solid transparent', bl: '7px solid ' + col, br: T, op });
      } else if (kind === 'down') {
        const x = 92 + 220 * c;
        out.push({ l: x - 1, t: 100, w: 2, h: 48, bg: col, dt: 'none', dl: 'none',
          al: x - 5, at: 148, bt: '7px solid ' + col, bb: T, bl: '5px solid transparent', br: '5px solid transparent', op });
      } else {
        const x = 92 + 220 * c;
        out.push({ l: x - 1, t: 108, w: 0, h: 48, bg: 'transparent', dt: 'none', dl: '2px dashed ' + col,
          al: x - 5, at: 101, bt: T, bb: '7px solid ' + col, bl: '5px solid transparent', br: '5px solid transparent', op });
      }
    };
    for (let c = 0; c < 3; c++) mk(c0[c], c0[c + 1], 'h', c, 0, false);
    for (let c = 0; c < 4; c++) mk(c1[c], c1[c + 1], 'h', c, 1, false);
    mk(c0[2], c1[2], 'down', 2, 0, false);
    mk(c0[3], c1[3], 'down', 3, 0, false);
    mk(c1[4], 'dest', 'up', 4, 1, true);
    return out;
  }

  linksText(s, id) {
    const all = this.allNodes(s);
    const name = (x) => (x === 'dest' ? 'your destination' : (all.find((n) => n.id === x) || {}).name);
    const c0 = s.r0.map((n) => n.id).concat(['dest']);
    const c1 = s.r1.map((n) => n.id);
    const pairs = [];
    for (let c = 0; c < 3; c++) pairs.push([c0[c], c0[c + 1]]);
    for (let c = 0; c < 4; c++) pairs.push([c1[c], c1[c + 1]]);
    pairs.push([c0[2], c1[2]], [c0[3], c1[3]], [c1[4], 'dest']);
    const ins = pairs.filter((p) => p[1] === id).map((p) => name(p[0]));
    const outs = pairs.filter((p) => p[0] === id).map((p) => name(p[1]));
    const join = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0]);
    const parts = [];
    if (ins.length) parts.push('Builds on ' + join(ins));
    if (outs.length) parts.push((outs[0] === 'your destination' ? 'Leads to ' : 'Opens up ') + join(outs));
    return { text: parts.join(' · ') || 'A starting point on this map', ins, outs };
  }

  renderVals() { return Object.assign(this.themeVals(), this.sfVals(), this.navVals(), this.siteVals(), this.pageVals(), { subjId: this.state.subj }); }
  pageVals() {
    const s = this.subj();
    const now = this.nowNode(s);
    const selId = this.selId(s);
    const route = this.state.route;
    const onRoute = this.routeIds(s);
    const dest = s.dests[this.destIdx(s)];
    const f2 = (v) => Math.round(v * 100) + '%';
    const pillOf = { shown: ['Shown', '#E4ECFD', '#1E40AF'], growing: ['Growing', '#F4F4EF', '#3F444C'], gap: ['Gap found', '#FEF1D9', '#92400E'], now: ['Working now', '#1D4ED8', '#FFFFFF'], notyet: ['Not yet', '#F4F4EF', '#62676F'] };
    const mono = "ui-monospace, Menlo, monospace";
    const serif = "'EB Garamond', Garamond, Georgia, serif";

    const subjects = this.S.map((x) => {
      const on = x.id === s.id;
      return { name: x.name, levelText: 'L' + x.level, pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14161A', bd: on ? '#14161A' : '#CFCFC6', lv: on ? 'rgba(255,255,255,0.8)' : '#62676F',
        pick: () => this.setState({ subj: x.id, why: false, log: false, status: '' }) };
    });

    const look = {
      shown: { bg: '#E4ECFD', bd: '1px solid #93BBF3', fg: '#172F73', subFg: '#172F73', shadow: 'none' },
      growing: { bg: '#FFFFFF', bd: '1px solid #B9BCB4', fg: '#14161A', subFg: '#14161A', shadow: 'none' },
      gap: { bg: '#FFFFFF', bd: '2px solid #F9A826', fg: '#14161A', subFg: '#92400E', shadow: 'none' },
      now: { bg: '#1D4ED8', bd: '1px solid #1D4ED8', fg: '#FFFFFF', subFg: '#FFFFFF', shadow: '0 0 0 4px #E4ECFD' },
      notyet: { bg: '#FAFAF7', bd: '1px dashed #8A8F96', fg: '#3F444C', subFg: '#3F444C', shadow: 'none' },
      dest: { bg: '#FEF1D9', bd: '1.5px dashed #F9A826', fg: '#78350F', subFg: '#78350F', shadow: 'none' }
    };
    const placed = [];
    s.r0.forEach((n, i) => placed.push([n, i, 0]));
    placed.push([{ id: 'dest', name: dest[0], st: 'dest' }, 4, 0]);
    s.r1.forEach((n, i) => placed.push([n, i, 1]));
    const nodes = placed.map(([n, c, r]) => {
      const L = look[n.st];
      const isSel = n.id === selId;
      const sc = n.st === 'dest' ? 0 : this.score(s, n);
      const pin = this.state.pins[this.key(n.id)] ? '★ ' : '';
      let sub = f2(sc);
      if (n.st === 'gap') sub = f2(sc) + ' · gap';
      if (n.st === 'now') sub = f2(sc) + ' · now';
      if (n.st === 'dest') sub = 'your destination';
      const state = n.st === 'dest' ? 'your destination' : pillOf[n.st][0].toLowerCase();
      return {
        x: 8 + 220 * c, y: 24 + 136 * r, name: n.name, sub: pin + sub,
        subFont: n.st === 'dest' ? serif : mono, subFg: L.subFg, bg: L.bg, bd: L.bd, fg: L.fg,
        shadow: isSel ? (n.st === 'now' ? '0 0 0 3px #FFFFFF, 0 0 0 6px #14161A' : '0 0 0 3px #FFFFFF, 0 0 0 5px #14161A') : L.shadow,
        op: route && onRoute.indexOf(n.id) < 0 ? 0.32 : 1,
        sel: isSel ? 'true' : 'false',
        aria: n.name + ', ' + state + (n.st === 'dest' ? '' : ', estimate ' + f2(sc)),
        pick: () => this.select(n.id)
      };
    });

    const tag = { Planned: ['#F4F4EF', '#3F444C'], Tutor: ['#E4ECFD', '#1E40AF'], 'Open hours': ['#DDF4F1', '#115E59'], Practice: ['#E4ECFD', '#1E40AF'], Workshop: ['#DDF4F1', '#115E59'] };
    const dFg = (d) => (d.indexOf('−') === 0 ? '#92400E' : (d.indexOf('+') === 0 ? '#1E40AF' : '#62676F'));
    const ev = (a) => ({ date: a[0], source: a[1], text: a[2], delta: a[3], tagBg: tag[a[1]][0], tagFg: tag[a[1]][1], deltaFg: dFg(a[3]) });

    const vals = {
      subjects, nodes,
      subjName: s.name,
      pathTitle: 'Your path to ' + dest[1],
      placed: 'Placed at Level ' + s.level + ' by what you can do, not by your age',
      graphLabel: 'Skill graph for ' + s.name + ': 9 skills and your destination, ' + dest[0] + '. Select one for details.',
      edges: this.edges(s, selId, route),
      routePressed: route ? 'true' : 'false', routeBg: route ? '#FEF1D9' : '#FFFFFF', routeFg: route ? '#92400E' : '#14161A', routeBd: route ? '#F9A826' : '#CFCFC6',
      routeLabel: route ? 'Showing your route' : 'Show my route',
      toggleRoute: () => this.setState({ route: !this.state.route }),
      wkSessions: String(s.week[0]), wkMinutes: String(s.week[1]), wkQs: String(Math.max(2, Math.round(s.week[1] / 25))),
      wkShown: String(this.allNodes(s).filter((n) => this.score(s, n) >= 0.85).length) + '/9',
      wkNext: s.next,
      exportMap: () => this.setState({ status: 'Your ' + s.name + ' map is ready as a PDF and a portable JSON file. (Demo: nothing downloads here.)' }),
      status: this.state.status,
      logOpen: this.state.log, logExpanded: this.state.log ? 'true' : 'false',
      toggleLog: () => this.setState({ log: !this.state.log }),
      carry: (this.state.carry || []).map((q, i) => ({ t: q[0], since: q[1], dropAria: 'Mark “' + q[0] + '” as answered', drop: () => this.setState({ carry: this.state.carry.filter((x, j) => j !== i) }) })),
      carryDraft: this.state.carryDraft || '', carrySet: (e) => this.setState({ carryDraft: e.target.value }),
      carryAdd: () => { const t = (this.state.carryDraft || '').trim(); if (!t) return; this.setState({ carry: (this.state.carry || []).concat([[t.charAt(0).toUpperCase() + t.slice(1), 'today']]), carryDraft: '' }); },
      carryKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); const t = (this.state.carryDraft || '').trim(); if (!t) return; this.setState({ carry: (this.state.carry || []).concat([[t.charAt(0).toUpperCase() + t.slice(1), 'today']]), carryDraft: '' }); } },
      isSkill: selId !== 'dest', isDest: selId === 'dest'
    };

    const logItems = [];
    this.allNodes(s).forEach((n) => n.ev.forEach((a) => { if (a[3] !== 'planned') logItems.push({ date: a[0], skill: n.name, text: a[2], delta: a[3], deltaFg: dFg(a[3]), ord: Date.parse(a[0].slice(4) + ' 2026') || 0 }); }));
    logItems.sort((a, b) => b.ord - a.ord);
    vals.logItems = logItems;
    vals.logLabel = this.state.log ? 'Hide observations' : 'Show recent observations (' + logItems.length + ' of ' + s.obs + ')';

    if (selId === 'dest') {
      const routeNodes = onRoute.filter((id) => id !== 'dest').map((id) => this.allNodes(s).find((n) => n.id === id));
      const ready = routeNodes.reduce((a, n) => a + Math.min(this.score(s, n) / 0.85, 1), 0) / routeNodes.length;
      vals.destTitle = dest[0];
      vals.destAbout = dest[2];
      vals.destPct = String(Math.round(ready * 100));
      vals.destCount = String(routeNodes.length);
      vals.destRoute = routeNodes.map((n) => ({ name: n.name, score: f2(this.score(s, n)), pill: pillOf[n.st][0], pillBg: pillOf[n.st][1], pillFg: pillOf[n.st][2], pick: () => this.select(n.id) }));
      vals.destOpts = s.dests.map((d, i) => {
        const on = i === this.destIdx(s);
        return { label: d[0], pressed: on ? 'true' : 'false', bg: on ? '#FEF1D9' : '#FFFFFF', fg: on ? '#92400E' : '#14161A', bd: on ? '1.5px dashed #F9A826' : '1px solid #CFCFC6',
          pick: () => { const dd = Object.assign({}, this.state.dest); dd[s.id] = i; this.setState({ dest: dd }); } };
      });
      Object.assign(vals, { skName: '', skPill: '', skPillBg: '', skPillFg: '', skLinks: '', skAbout: '', skScore: '', skBandL: 0, skBandW: 0, skPos: 0, skRange: '', views: [], viewNote: '', viewAria: '', privOn: 'false', privBg: '#FFFFFF', privTrack: '#CFCFC6', privKnob: '3px', privNote: '', togglePriv: () => {}, hasQuiz: false, hasPassage: false, evidence: [], quizOpts: [], quizDone: false,
        quizTag: '', quizQ: '', quizPassage: '', quizFb: '', quizFbFg: '#62676F', quizReset: () => {}, pinPressed: 'false', pinLabel: '', pinBg: '#FFFFFF', pinFg: '#14161A', pinBd: 'none', togglePin: () => {},
        whyOpen: false, whyExpanded: 'false', whyLabel: '', whyText: '', toggleWhy: () => {} });
      return vals;
    }

    const n = this.allNodes(s).find((x) => x.id === selId) || now;
    const sc = this.score(s, n);
    const shown = sc >= 0.85;
    const spread = shown ? 0.04 : 0.09;
    const lo = Math.max(0, sc - spread), hi = Math.min(1, sc + spread);
    const links = this.linksText(s, n.id);
    const pill = pillOf[n.st];

    const def = shown ? 'got' : (n.st === 'notyet' ? 'not' : 'getting');
    const view = this.state.views[this.key(n.id)] || def;
    const opts = [{ id: 'got', label: 'I’ve got it' }, { id: 'getting', label: 'Getting there' }, { id: 'not', label: 'Not yet' }];
    const views = opts.map((o) => {
      const on = view === o.id;
      return Object.assign({}, o, { pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14161A', bd: on ? '#14161A' : '#CFCFC6',
        pick: () => { const v = Object.assign({}, this.state.views); v[this.key(n.id)] = o.id; this.setState({ views: v }); } });
    });
    let viewNote;
    if (view === 'got') viewNote = shown ? 'You and Vachuo agree. It will come back now and then, mixed into other work, so it stays.' : 'Then show it. Vachuo will offer one real problem on ' + n.name + ' now: no penalty if it doesn’t go your way.';
    else if (view === 'getting') viewNote = shown ? 'Vachuo is a little more sure than you are. It will add one quick check this week, just to be certain.' : 'Close to Vachuo’s estimate. Your view is evidence too, and it’s logged alongside the rest.';
    else viewNote = shown ? 'Vachuo thinks you’ve shown this, but your doubt counts. Expect a short refresher before anything builds on it.' : 'Thanks for saying so. Vachuo will slow down and add a worked example this week.';

    let evidence = n.ev.map(ev);
    const isNow = n.id === now.id;
    const qp = this.quizPick(s);
    if (isNow && qp >= 0) {
      const ok = s.quiz.opts[qp][1] === true;
      evidence = [ev(['Today', 'Practice', ok ? 'Quick check from your map: right first time' : 'Quick check from your map: chose “' + s.quiz.opts[qp][0] + '”', ok ? '+3%' : '−2%'])].concat(evidence);
    }

    const ins = links.ins.join(' and ');
    const whyByState = {
      shown: 'You’ve shown ' + n.name + '. Vachuo will bring it back in a few weeks, mixed into other work, so it stays shown.',
      growing: n.name + ' is on its way. A few more pieces of evidence, of different kinds, and it will count as shown.' + (links.outs.length ? ' It matters because it leads to ' + links.outs.join(' and ') + '.' : ''),
      gap: 'Vachuo found this gap while you were working on ' + now.name + '. A short detour now will save a long one later, so it’s mixed into this week’s work.',
      now: s.why,
      notyet: 'Not yet, and that’s fine. It opens up once ' + (ins || 'the skills before it') + (links.ins.length === 1 ? ' reaches' : ' reach') + ' 85%. You can still try it any time: nothing on your map is locked.'

    });

});
