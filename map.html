<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · My learning map</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.node{transition:transform .18s ease,box-shadow .18s ease,opacity .25s ease}
.node:hover{transform:translateY(-2px)}
.edge{transition:opacity .25s ease}
.chip{transition:background .15s ease,border-color .15s ease}
.chip:hover{border-color:#14161A}
.opt{transition:background .15s ease,border-color .15s ease,transform .15s ease}
.opt:hover{border-color:#1D4ED8}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.node,.edge,.opt{transition:none}.node:hover{transform:none}.fade{animation:none}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Map">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Learner workspace" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<a href="today.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div><a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a><a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a><a href="map.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM18 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM9 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a><a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v13H3zM10.5 8.5v5l4-2.5zM8 20.5h8"/></svg>My classes</a><a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17v15.5h-17zM3.5 9.5h17M8 3v4M16 3v4M9 14.6l2 2 4-4.2"/></svg>My assessments</a><a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5zM8.5 8h7M8.5 12h7M8.5 16h2.5M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Portfolio</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Live room<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div><a href="connects.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a><a href="clubs.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a><a href="showcase.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0zM5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div><a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg>The loop</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="learner.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #F4F7FE"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1112px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">My learning map · {{subjName}}</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 860px; text-wrap: balance">What Vachuo thinks you know — and what you think.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 700px; text-wrap: pretty">Every number is an estimate from your work, not a judgment of you. Correct it, set your own destinations, or wander off the path. The map follows you, not the other way round.</p>
</header>

<dc-import name="Approvals" area="map" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<div role="group" aria-label="Subject" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{subjects}}" data-as="s">
<button type="button" class="chip" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{s.name}}<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: {{s.lv}}">{{s.levelText}}</span></button>
</template>
</div>

<section aria-labelledby="path" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="path" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{pathTitle}}</h2>
<span style="font-size: 13.5px; color: #62676F">{{placed}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px">
<ul aria-label="Legend" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: #3F444C">
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #E4ECFD; border: 1px solid #93BBF3"></span>Shown (85%+)</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FFFFFF; border: 1px solid #B9BCB4"></span>Growing</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FFFFFF; border: 2px solid #F9A826; box-sizing: border-box"></span>Gap found</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #1D4ED8"></span>Working now</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FAFAF7; border: 1px dashed #8A8F96; box-sizing: border-box"></span>Not yet</li>
<li style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 12px; border-radius: 4px; background: #FEF1D9; border: 1.5px dashed #F9A826; box-sizing: border-box"></span>Your destination</li>
</ul>
<button type="button" class="chip" aria-pressed="{{routePressed}}" onClick="{{toggleRoute}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{routeBd}}; background: {{routeBg}}; color: {{routeFg}}; font-size: 13.5px; font-weight: 500; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></svg>{{routeLabel}}</button>
</div>
<p style="margin: -6px 0 0; font-size: 13.5px; color: #62676F">Select any skill to see the evidence behind it, or the destination to change it.</p>
<div style="overflow-x: auto; margin: 0 -8px; padding: 4px 8px 8px">
<div role="group" aria-label="{{graphLabel}}" style="position: relative; width: 1064px; height: 256px">
<template data-for="{{edges}}" data-as="e">
<span aria-hidden="true">
<span class="edge" style="position: absolute; left: {{e.l}}px; top: {{e.t}}px; width: {{e.w}}px; height: {{e.h}}px; background: {{e.bg}}; border-top: {{e.dt}}; border-left: {{e.dl}}; opacity: {{e.op}}"></span>
<span class="edge" style="position: absolute; left: {{e.al}}px; top: {{e.at}}px; width: 0; height: 0; border-top: {{e.bt}}; border-right: {{e.br}}; border-bottom: {{e.bb}}; border-left: {{e.bl}}; opacity: {{e.op}}"></span>
</span>
</template>
<template data-for="{{nodes}}" data-as="n">
<button type="button" class="node" aria-pressed="{{n.sel}}" aria-label="{{n.aria}}" onClick="{{n.pick}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 168px; height: 72px; box-sizing: border-box; margin: 0; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; border-radius: 14px; background: {{n.bg}}; border: {{n.bd}}; color: {{n.fg}}; box-shadow: {{n.shadow}}; opacity: {{n.op}}; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; line-height: 18px; cursor: pointer">
<b style="font-weight: 600">{{n.name}}</b>
<span style="font-family: {{n.subFont}}; font-size: 12.5px; color: {{n.subFg}}">{{n.sub}}</span>
</button>
</template>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<template data-if="{{isSkill}}">
<section aria-labelledby="skill" class="fade" style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 id="skill" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">{{skName}}</h2>
<span style="font-size: 12.5px; font-weight: 600; color: {{skPillFg}}; background: {{skPillBg}}; padding: 4px 10px; border-radius: 999px">{{skPill}}</span>

  quizPick(s) { const q = this.state.quiz[s.id]; return typeof q === 'number' ? q : -1; }
  quizDelta(s) { const p = this.quizPick(s); if (p < 0) return 0; return s.quiz.opts[p][1] === true ? 0.03 : -0.02; }
  score(s, n) { return Math.max(0, Math.min(1, n.score + (n.id === this.nowNode(s).id ? this.quizDelta(s) : 0))); }
  routeIds(s) { return [s.r0[2].id, s.r1[2].id, s.r1[3].id, s.r1[4].id, 'dest']; }

  select(id) { const sel = Object.assign({}, this.state.sel); sel[this.state.subj] = id; this.setState({ sel, why: false }); }

  edges(s, selId, route) {
    const c0 = s.r0.map((n) => n.id).concat(['dest']);
    const c1 = s.r1.map((n) => n.id);
    const onRoute = this.routeIds(s);
    const out = [];
    const T = '0 solid transparent';
    const mk = (from, to, kind, c, r, dashed) => {
      const hl = from === selId || to === selId;
      const col = hl ? '#1D4ED8' : (dashed ? '#F9A826' : '#9A9E95');
      const op = route && !(onRoute.indexOf(from) >= 0 && onRoute.indexOf(to) >= 0) ? 0.22 : 1;
      if (kind === 'h') {
        const y = 24 + 136 * r;
        out.push({ l: 180 + 220 * c, t: y + 35, w: 38, h: dashed ? 0 : 2, bg: dashed ? 'transparent' : col, dt: dashed ? '2px dashed ' + col : 'none', dl: 'none',
          al: 218 + 220 * c, at: y + 31, bt: '5px solid transparent', bb: '5px solid transparent', bl: '7px solid ' + col, br: T, op });
      } else if (kind === 'down') {
        const x = 92 + 220 * c;
        out.push({ l: x - 1, t: 100, w: 2, h: 48, bg: col, dt: 'none', dl: 'none',
          al: x - 5, at: 148, bt: '7px solid ' + col, bb: T, bl: '5px solid transparent', br: '5px solid transparent', op });
      } else {
        const x = 92 + 220 * c;
        out.push({ l: x - 1, t: 108, w: 0, h: 48, bg: 'transparent', dt: 'none', dl: '2px dashed ' + col,
          al: x - 5, at: 101, bt: T, bb: '7px solid ' + col, bl: '5px solid transparent', br: '5px solid transparent', op });
      }
    };
    for (let c = 0; c < 3; c++) mk(c0[c], c0[c + 1], 'h', c, 0, false);
    for (let c = 0; c < 4; c++) mk(c1[c], c1[c + 1], 'h', c, 1, false);
    mk(c0[2], c1[2], 'down', 2, 0, false);
    mk(c0[3], c1[3], 'down', 3, 0, false);
    mk(c1[4], 'dest', 'up', 4, 1, true);
    return out;
  }

  linksText(s, id) {
    const all = this.allNodes(s);
    const name = (x) => (x === 'dest' ? 'your destination' : (all.find((n) => n.id === x) || {}).name);
    const c0 = s.r0.map((n) => n.id).concat(['dest']);
    const c1 = s.r1.map((n) => n.id);
    const pairs = [];
    for (let c = 0; c < 3; c++) pairs.push([c0[c], c0[c + 1]]);
    for (let c = 0; c < 4; c++) pairs.push([c1[c], c1[c + 1]]);
    pairs.push([c0[2], c1[2]], [c0[3], c1[3]], [c1[4], 'dest']);
    const ins = pairs.filter((p) => p[1] === id).map((p) => name(p[0]));
    const outs = pairs.filter((p) => p[0] === id).map((p) => name(p[1]));
    const join = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0]);
    const parts = [];
    if (ins.length) parts.push('Builds on ' + join(ins));
    if (outs.length) parts.push((outs[0] === 'your destination' ? 'Leads to ' : 'Opens up ') + join(outs));
    return { text: parts.join(' · ') || 'A starting point on this map', ins, outs };
  }

  renderVals() { return Object.assign(this.themeVals(), this.navVals(), this.siteVals(), this.pageVals(), { subjId: this.state.subj }); }
  pageVals() {
    const s = this.subj();
    const now = this.nowNode(s);
    const selId = this.selId(s);
    const route = this.state.route;
    const onRoute = this.routeIds(s);
    const dest = s.dests[this.destIdx(s)];
    const f2 = (v) => Math.round(v * 100) + '%';
    const pillOf = { shown: ['Shown', '#E4ECFD', '#1E40AF'], growing: ['Growing', '#F4F4EF', '#3F444C'], gap: ['Gap found', '#FEF1D9', '#92400E'], now: ['Working now', '#1D4ED8', '#FFFFFF'], notyet: ['Not yet', '#F4F4EF', '#62676F'] };
    const mono = "ui-monospace, Menlo, monospace";
    const serif = "'EB Garamond', Garamond, Georgia, serif";

    const subjects = this.S.map((x) => {
      const on = x.id === s.id;
      return { name: x.name, levelText: 'L' + x.level, pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14161A', bd: on ? '#14161A' : '#CFCFC6', lv: on ? 'rgba(255,255,255,0.8)' : '#62676F',
        pick: () => this.setState({ subj: x.id, why: false, log: false, status: '' }) };
    });

    const look = {
      shown: { bg: '#E4ECFD', bd: '1px solid #93BBF3', fg: '#172F73', subFg: '#172F73', shadow: 'none' },
      growing: { bg: '#FFFFFF', bd: '1px solid #B9BCB4', fg: '#14161A', subFg: '#14161A', shadow: 'none' },
      gap: { bg: '#FFFFFF', bd: '2px solid #F9A826', fg: '#14161A', subFg: '#92400E', shadow: 'none' },
      now: { bg: '#1D4ED8', bd: '1px solid #1D4ED8', fg: '#FFFFFF', subFg: '#FFFFFF', shadow: '0 0 0 4px #E4ECFD' },
      notyet: { bg: '#FAFAF7', bd: '1px dashed #8A8F96', fg: '#3F444C', subFg: '#3F444C', shadow: 'none' },
      dest: { bg: '#FEF1D9', bd: '1.5px dashed #F9A826', fg: '#78350F', subFg: '#78350F', shadow: 'none' }
    };
    const placed = [];
    s.r0.forEach((n, i) => placed.push([n, i, 0]));
    placed.push([{ id: 'dest', name: dest[0], st: 'dest' }, 4, 0]);
    s.r1.forEach((n, i) => placed.push([n, i, 1]));
    const nodes = placed.map(([n, c, r]) => {
      const L = look[n.st];
      const isSel = n.id === selId;
      const sc = n.st === 'dest' ? 0 : this.score(s, n);
      const pin = this.state.pins[this.key(n.id)] ? '★ ' : '';
      let sub = f2(sc);
      if (n.st === 'gap') sub = f2(sc) + ' · gap';
      if (n.st === 'now') sub = f2(sc) + ' · now';
      if (n.st === 'dest') sub = 'your destination';
      const state = n.st === 'dest' ? 'your destination' : pillOf[n.st][0].toLowerCase();
      return {
        x: 8 + 220 * c, y: 24 + 136 * r, name: n.name, sub: pin + sub,
        subFont: n.st === 'dest' ? serif : mono, subFg: L.subFg, bg: L.bg, bd: L.bd, fg: L.fg,
        shadow: isSel ? (n.st === 'now' ? '0 0 0 3px #FFFFFF, 0 0 0 6px #14161A' : '0 0 0 3px #FFFFFF, 0 0 0 5px #14161A') : L.shadow,
        op: route && onRoute.indexOf(n.id) < 0 ? 0.32 : 1,
        sel: isSel ? 'true' : 'false',
        aria: n.name + ', ' + state + (n.st === 'dest' ? '' : ', estimate ' + f2(sc)),
        pick: () => this.select(n.id)
      };
    });

    const tag = { Planned: ['#F4F4EF', '#3F444C'], Tutor: ['#E4ECFD', '#1E40AF'], 'Open hours': ['#DDF4F1', '#115E59'], Practice: ['#E4ECFD', '#1E40AF'], Workshop: ['#DDF4F1', '#115E59'] };
    const dFg = (d) => (d.indexOf('−') === 0 ? '#92400E' : (d.indexOf('+') === 0 ? '#1E40AF' : '#62676F'));
    const ev = (a) => ({ date: a[0], source: a[1], text: a[2], delta: a[3], tagBg: tag[a[1]][0], tagFg: tag[a[1]][1], deltaFg: dFg(a[3]) });

    const vals = {
      subjects, nodes,
      subjName: s.name,
      pathTitle: 'Your path to ' + dest[1],
      placed: 'Placed at Level ' + s.level + ' by what you can do, not by your age',
      graphLabel: 'Skill graph for ' + s.name + ': 9 skills and your destination, ' + dest[0] + '. Select one for details.',
      edges: this.edges(s, selId, route),
      routePressed: route ? 'true' : 'false', routeBg: route ? '#FEF1D9' : '#FFFFFF', routeFg: route ? '#92400E' : '#14161A', routeBd: route ? '#F9A826' : '#CFCFC6',
      routeLabel: route ? 'Showing your route' : 'Show my route',
      toggleRoute: () => this.setState({ route: !this.state.route }),
      wkSessions: String(s.week[0]), wkMinutes: String(s.week[1]),
      wkShown: String(this.allNodes(s).filter((n) => this.score(s, n) >= 0.85).length) + '/9',
      wkNext: s.next,
      exportMap: () => this.setState({ status: 'Your ' + s.name + ' map is ready as a PDF and a portable JSON file. (Demo: nothing downloads here.)' }),
      status: this.state.status,
      logOpen: this.state.log, logExpanded: this.state.log ? 'true' : 'false',
      toggleLog: () => this.setState({ log: !this.state.log }),
      isSkill: selId !== 'dest', isDest: selId === 'dest'
    };

    const logItems = [];
    this.allNodes(s).forEach((n) => n.ev.forEach((a) => { if (a[3] !== 'planned') logItems.push({ date: a[0], skill: n.name, text: a[2], delta: a[3], deltaFg: dFg(a[3]), ord: Date.parse(a[0].slice(4) + ' 2026') || 0 }); }));
    logItems.sort((a, b) => b.ord - a.ord);
    vals.logItems = logItems;
    vals.logLabel = this.state.log ? 'Hide observations' : 'Show recent observations (' + logItems.length + ' of ' + s.obs + ')';

    if (selId === 'dest') {
      const routeNodes = onRoute.filter((id) => id !== 'dest').map((id) => this.allNodes(s).find((n) => n.id === id));
      const ready = routeNodes.reduce((a, n) => a + Math.min(this.score(s, n) / 0.85, 1), 0) / routeNodes.length;
      vals.destTitle = dest[0];
      vals.destAbout = dest[2];
      vals.destPct = String(Math.round(ready * 100));
      vals.destCount = String(routeNodes.length);
      vals.destRoute = routeNodes.map((n) => ({ name: n.name, score: f2(this.score(s, n)), pill: pillOf[n.st][0], pillBg: pillOf[n.st][1], pillFg: pillOf[n.st][2], pick: () => this.select(n.id) }));
      vals.destOpts = s.dests.map((d, i) => {
        const on = i === this.destIdx(s);
        return { label: d[0], pressed: on ? 'true' : 'false', bg: on ? '#FEF1D9' : '#FFFFFF', fg: on ? '#92400E' : '#14161A', bd: on ? '1.5px dashed #F9A826' : '1px solid #CFCFC6',
          pick: () => { const dd = Object.assign({}, this.state.dest); dd[s.id] = i; this.setState({ dest: dd }); } };
      });
      Object.assign(vals, { skName: '', skPill: '', skPillBg: '', skPillFg: '', skLinks: '', skAbout: '', skScore: '', skBandL: 0, skBandW: 0, skPos: 0, skRange: '', views: [], viewNote: '', viewAria: '', hasQuiz: false, hasPassage: false, evidence: [], quizOpts: [], quizDone: false,
        quizTag: '', quizQ: '', quizPassage: '', quizFb: '', quizFbFg: '#62676F', quizReset: () => {}, pinPressed: 'false', pinLabel: '', pinBg: '#FFFFFF', pinFg: '#14161A', pinBd: 'none', togglePin: () => {},
        whyOpen: false, whyExpanded: 'false', whyLabel: '', whyText: '', toggleWhy: () => {} });
      return vals;
    }

    const n = this.allNodes(s).find((x) => x.id === selId) || now;
    const sc = this.score(s, n);
    const shown = sc >= 0.85;
    const spread = shown ? 0.04 : 0.09;
    const lo = Math.max(0, sc - spread), hi = Math.min(1, sc + spread);
    const links = this.linksText(s, n.id);
    const pill = pillOf[n.st];

    const def = shown ? 'got' : (n.st === 'notyet' ? 'not' : 'getting');
    const view = this.state.views[this.key(n.id)] || def;
    const opts = [{ id: 'got', label: 'I’ve got it' }, { id: 'getting', label: 'Getting there' }, { id: 'not', label: 'Not yet' }];
    const views = opts.map((o) => {
      const on = view === o.id;
      return Object.assign({}, o, { pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14161A', bd: on ? '#14161A' : '#CFCFC6',
        pick: () => { const v = Object.assign({}, this.state.views); v[this.key(n.id)] = o.id; this.setState({ views: v }); } });
    });
    let viewNote;
    if (view === 'got') viewNote = shown ? 'You and Vachuo agree. It will come back now and then, mixed into other work, so it stays.' : 'Then show it. Vachuo will offer one real problem on ' + n.name + ' now: no penalty if it doesn’t go your way.';
    else if (view === 'getting') viewNote = shown ? 'Vachuo is a little more sure than you are. It will add one quick check this week, just to be certain.' : 'Close to Vachuo’s estimate. Your view is evidence too, and it’s logged alongside the rest.';
    else viewNote = shown ? 'Vachuo thinks you’ve shown this, but your doubt counts. Expect a short refresher before anything builds on it.' : 'Thanks for saying so. Vachuo will slow down and add a worked example this week.';

    let evidence = n.ev.map(ev);
    const isNow = n.id === now.id;
    const qp = this.quizPick(s);
    if (isNow && qp >= 0) {
      const ok = s.quiz.opts[qp][1] === true;
      evidence = [ev(['Today', 'Practice', ok ? 'Quick check from your map: right first time' : 'Quick check from your map: chose “' + s.quiz.opts[qp][0] + '”', ok ? '+3%' : '−2%'])].concat(evidence);
    }

    const ins = links.ins.join(' and ');
    const whyByState = {
      shown: 'You’ve shown ' + n.name + '. Vachuo will bring it back in a few weeks, mixed into other work, so it stays shown.',
      growing: n.name + ' is on its way. A few more pieces of evidence, of different kinds, and it will count as shown.' + (links.outs.length ? ' It matters because it leads to ' + links.outs.join(' and ') + '.' : ''),
      gap: 'Vachuo found this gap while you were working on ' + now.name + '. A short detour now will save a long one later, so it’s mixed into this week’s work.',
      now: s.why,
      notyet: 'Not yet, and that’s fine. It opens up once ' + (ins || 'the skills before it') + (links.ins.length === 1 ? ' reaches' : ' reach') + ' 85%. You can still try it any time: nothing on your map is locked.'
    };

    const pinned = !!this.state.pins[this.key(n.id)];
    Object.assign(vals, {
      skName: n.name, skPill: pill[0], skPillBg: pill[1], skPillFg: pill[2], skLinks: links.text, skAbout: n.about,
      skScore: f2(sc), skBandL: (lo * 100).toFixed(1), skBandW: ((hi - lo) * 100).toFixed(1), skPos: (sc * 100).toFixed(1),
      skRange: 'Likely between ' + f2(lo) + ' and ' + f2(hi) + '. ' + (shown ? 'That counts as shown.' : 'At 85%, with two kinds of evidence, it counts as shown.'),
      views, viewNote, viewAria: 'How sure are you about ' + n.name + '?',
      evidence,
      pinPressed: pinned ? 'true' : 'false', pinLabel: pinned ? '★ Pinned as a destination' : 'Make this a destination',
      pinBg: pinned ? '#FEF1D9' : '#1D4ED8', pinFg: pinned ? '#92400E' : '#FFFFFF', pinBd: pinned ? '1.5px dashed #F9A826' : '1px solid #1D4ED8',
      togglePin: () => { const p = Object.assign({}, this.state.pins); p[this.key(n.id)] = !pinned; this.setState({ pins: p }); },
      whyOpen: this.state.why, whyExpanded: this.state.why ? 'true' : 'false', whyLabel: this.state.why ? 'Hide the reason' : (isNow ? 'Why is this next?' : 'Why is it here?'),
      whyText: whyByState[n.st],
      toggleWhy: () => this.setState({ why: !this.state.why }),
      hasQuiz: isNow
    });

    const q = s.quiz;
    vals.quizTag = q.tag;
    vals.quizQ = q.q;
    vals.quizPassage = q.passage;
    vals.hasPassage = !!q.passage;
    vals.quizDone = qp >= 0;
    vals.quizOpts = q.opts.map((o, i) => {
      const picked = qp === i, right = o[1] === true, done = qp >= 0;
      let bg = '#FFFFFF', bd = '#CFCFC6', markBg = '#F4F4EF', markFg = '#3F444C', mark = String.fromCharCode(65 + i);
      if (done && right) { bg = '#DDF4F1'; bd = '#0D9488'; markBg = '#0D9488'; markFg = '#FFFFFF'; mark = '✓'; }
      else if (picked) { bg = '#FEF1D9'; bd = '#F9A826'; markBg = '#F9A826'; markFg = '#14161A'; mark = '✗'; }
      return { t: o[0], bg, bd, markBg, markFg, mark, pressed: picked ? 'true' : 'false',
        pick: () => { if (this.quizPick(s) >= 0) return; const qq = Object.assign({}, this.state.quiz); qq[s.id] = i; this.setState({ quiz: qq }); } };
    });
    if (qp >= 0) {
      const right = q.opts[qp][1] === true;
      vals.quizFb = right ? q.ok + ' Estimate +3%.' : q.opts[qp][1] + ' Logged as a slip to work on, −2%.';
      vals.quizFbFg = right ? '#115E59' : '#92400E';
    } else {
      vals.quizFb = 'Pick one. Your answer updates the estimate above.';
      vals.quizFbFg = '#62676F';
    }
    vals.quizReset = () => { const qq = Object.assign({}, this.state.quiz); delete qq[s.id]; this.setState({ quiz: qq }); };
    return vals;
  }
}
return Component;
});

DC.component("Strengths", function () {
class Component extends DCLogic {

    return [
      { id: 'math', name: 'Maths', color: '#1D4ED8', ink: '#1E40AF', done: 68, sk: [['Equiv. fractions', 'Equivalent fractions', 92], ['Ratio language', 'Ratio language and notation', 78], ['Ratio tables', 'Ratio tables', 61], ['Unit rates', 'Unit rates', 55], ['Scaling', 'Scaling quantities', 47], ['Map scale', 'Map scale', 22]] },
      { id: 'reading', name: 'Reading', color: '#0F766E', ink: '#115E59', done: 74, sk: [['Main idea', 'Main idea', 86], ['Inference', 'Inference', 81], ['Vocabulary', 'Vocabulary in context', 74], ['Summarising', 'Summarising', 69], ['Metaphor', 'Metaphor and figurative language', 52]] },
      { id: 'kiswahili', name: 'Kiswahili', color: '#B45309', ink: '#92400E', done: 61, sk: [['Ngeli', 'Ngeli (noun classes)', 84], ['Kusoma', 'Reading aloud', 80], ['Vivumishi', 'Vivumishi (adjectives)', 66], ['Insha', 'Insha (persuasive writing)', 64], ['Upatanisho', 'Upatanisho (agreement)', 58]] },
      { id: 'science', name: 'Science', color: '#1684E8', ink: '#1E40AF', done: 70, sk: [['Moon phases', 'Moon phases', 91], ['Models', 'Building and testing models', 88], ['Fair tests', 'Fair tests', 76], ['Data tables', 'Reading data tables', 70], ['Soil, water', 'Soil and water', 49]] },
      { id: 'social', name: 'Social Studies', color: '#92400E', ink: '#92400E', done: 55, sk: [['Communities', 'Communities', 80], ['Sources', 'Questioning sources', 72], ['Timelines', 'Timelines', 63], ['Map stories', 'Mapping stories', 44]] },
      { id: 'making', name: 'Making', color: '#172F73', ink: '#172F73', done: 50, sk: [['Circuits', 'Simple circuits', 73], ['Design', 'Design and sketching', 69], ['Testing', 'Testing and fixing', 58], ['Tools', 'Safe use of tools', 90]] }
    ];
  }
  misc() {
    return [
      ['math', 'Adds instead of multiplying when scaling a recipe', [3, 3, 2, 2, 1, 0]],
      ['math', 'Reads a ratio as a fraction of the whole', [0, 2, 2, 1, 1, 1]],
      ['math', 'Map scale: multiplies the wrong way', [0, 0, 0, 1, 2, 3]],
      ['kiswahili', 'Adjective doesn’t agree with the noun class', [2, 2, 3, 2, 2, 1]],
      ['reading', 'Takes a metaphor literally', [0, 0, 1, 2, 2, 1]],
      ['science', 'Changes two things at once in a test', [1, 2, 1, 0, 0, 0]],
      ['social', 'Treats a source as fact, not a viewpoint', [1, 1, 1, 1, 0, 0]],
      ['making', 'Leaves a circuit open and expects it to work', [0, 1, 0, 0, 0, 0]]
    ];
  }
  renderVals() {
    const P = this.props || {}; const sub = P.subject && P.subject !== 'all' ? P.subject : null;
    const D = this.data(); const list = sub ? D.filter((d) => d.id === sub) : D;
    const cx = 120, cy = 110, R = 78;
    const pt = (i, n, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
    const poly = (n, f) => Array.from({ length: n }, (x, i) => pt(i, n, f(i)).map((q) => q.toFixed(1)).join(',')).join(' ');
    const radars = list.map((d) => { const n = d.sk.length;
      return { name: d.name, color: d.color, done: 'Lessons done ' + d.done + '%',
        aria: d.name + ': ' + d.sk.map((k) => k[1] + ' ' + k[2] + '%').join(', '),
        rings: [25, 50, 75, 100].map((v) => ({ pts: poly(n, () => v) })), secure: poly(n, () => 85), poly: poly(n, (i) => d.sk[i][2]),
        axes: d.sk.map((k, i) => { const e = pt(i, n, 100), l = pt(i, n, 118); const dx = l[0] - cx; return { x2: e[0].toFixed(1), y2: e[1].toFixed(1), lx: l[0].toFixed(1), ly: (l[1] + 4).toFixed(1), anchor: Math.abs(dx) < 8 ? 'middle' : (dx > 0 ? 'start' : 'end'), short: k[0] }; }),
        dots: d.sk.map((k, i) => { const p = pt(i, n, k[2]); return { x: p[0].toFixed(1), y: p[1].toFixed(1) }; }),
        skills: d.sk.map((k) => ({ name: k[1], pct: String(k[2]), fg: k[2] >= 85 ? '#115E59' : (k[2] < 50 ? '#92400E' : '#14161A') })) }; });
    const SCALE = [['#FBFBF8', '#62676F'], ['#FEF9EE', '#78350F'], ['#FEF1D9', '#78350F'], ['#F9A826', '#14161A'], ['#B45309', '#FFFFFF']];
    const W = ['Wk 4', 'Wk 5', 'Wk 6', 'Wk 7', 'Wk 8', 'Wk 9'];
    const SUB = {}; D.forEach((d) => { SUB[d.id] = d; });
    const rows = this.misc().filter((m) => !sub || m[0] === sub).map((m) => { const c = m[2]; const last = c[5], prev = c[3] + c[4];
      const trend = last === 0 ? 'Gone' : (last > c[4] ? 'Rising' : (last < c[4] || prev > last * 2 ? 'Fading' : 'Steady'));
      return { subject: SUB[m[0]].name, ink: SUB[m[0]].ink, text: m[1], trend, tfg: trend === 'Rising' ? '#92400E' : (trend === 'Gone' || trend === 'Fading' ? '#115E59' : '#3F444C'),
        cells: c.map((v, i) => ({ n: v ? String(v) : '', bg: SCALE[Math.min(4, v)][0], fg: SCALE[Math.min(4, v)][1], aria: W[i] + ': seen ' + v + (v === 1 ? ' time' : ' times') })) }; });
    return Object.assign(this.themeVals(), { title: sub ? (list[0] ? list[0].name : '') + ' at a glance' : 'Strengths by subject', radars, rows, weeks: W, legend: SCALE.map((x) => x[0]), cardMin: sub ? '320px' : '250px', svgMax: sub ? '360px' : '260px' });
  }
}
return Component;
}, {"subject": "all"});
