<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Showcase</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Caveat:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.acard{transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.55)}
.calpill{transition:transform .15s ease,box-shadow .15s ease}
.calpill:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(20,22,26,.45)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slidein{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.paper-lined{background-color:#FFFFFE;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#C9D6F2 33px,#C9D6F2 34px),linear-gradient(to right,transparent 40px,#F2B8B5 40px,#F2B8B5 41px,transparent 41px);background-position:0 10px,0 0}
@media (prefers-reduced-motion:reduce){.fadein,.slidein,.livedot{animation:none}.acard:hover,.calpill:hover{transform:none}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Showcase">
<div data-theme="{{uiTheme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Vachuo" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="today.html" aria-label="Vachuo, back to Today" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Geist, system-ui, sans-serif; font-size: 10.5px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div>
<a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a>
<a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a>
<a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a>
<a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="13" rx="2"/><path d="M10.5 8.5v5l4-2.5z"/><path d="M8 20.5h8"/></svg>My classes</a>
<a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M9 14.6l2 2 4-4.2"/></svg>My assessments</a>
<a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h2.5"/><path d="M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Report card</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div>
<a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a>
<a href="clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a>
<a href="showcase.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0z"/><path d="M5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Family</div>
<a href="copilot.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.3"/><path d="M16.5 14.2c2.4.3 4 2.4 4 5.3"/></svg>Parent copilot</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div>
<a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5V9h-4.5"/></svg>The loop</a>
</div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}; transition: background 160ms ease"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35); transition: left 160ms ease"></span></span></button>
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 12px 0; border-top: 1px solid #E2E2DA">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">Showcase</span>
<h1 style="margin: 0; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Show your work, earn from it, and find your next opportunity.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 720px; text-wrap: pretty">Sell, offer services, swap, give, ask, take on paid challenges, and put your home library or art on a shelf others can browse. Learners do it with a grown-up: a parent or guardian approves every listing, receives every payment and answers every buyer.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<template data-for="{{stats}}" data-as="s"><div style="min-width: 112px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{s.v}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #62676F">{{s.l}}</span></div></template>
</div>
</header>

<section aria-label="Choose whose view to see" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-family: Geist, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Viewing as (demo)</span><button type="button" onClick="{{openPost}}" style="min-height: 42px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">{{postLabel}}</button></div>
<div role="group" aria-label="Viewer" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{roleChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 46px; padding: 5px 12px; border-radius: 12px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; text-align: left; cursor: pointer"><span style="font-size: 13.5px; font-weight: 600">{{c.label}}</span><span style="font-size: 11.5px; opacity: 0.75">{{c.sub}}</span></button></template>
</div>
<p aria-live="polite" style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">{{roleNote}}</p>
</section>

<section aria-label="How Showcase keeps learners safe" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px">
<template data-for="{{rules}}" data-as="r"><div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FBF7EE; border: 1px solid #F6DFAE"><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; color: #92400E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg></span><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Geist, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; color: #14161A">{{r.t}}</span><span style="font-size: 14.5px; line-height: 1.4; color: #3F444C">{{r.d}}</span></div></div></template>
</section>

<template data-if="{{isParent}}">
<section aria-labelledby="inbox-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-family: Geist, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="inbox-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Waiting for you</h2><a href="copilot.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13.5px">All approvals in Parent copilot</a></div>
<template data-if="{{inboxClear}}"><p style="margin: 0; font-size: 14px; color: #62676F">Nothing waiting. When Amani posts, buys, borrows or enters a challenge, it shows up here first.</p></template>
<template data-for="{{inbox}}" data-as="a"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 14px; background: #FEF9EE; border: 1px solid #F6DFAE"><div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14.5px; font-weight: 600; line-height: 1.35">{{a.t}}</span><span style="font-size: 13px; line-height: 1.45; color: #3F444C">{{a.d}}</span><span style="font-size: 12px; color: #62676F">{{a.at}}</span></div><div style="display: flex; gap: 6px"><button type="button" onClick="{{a.approve}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer">Approve</button><button type="button" onClick="{{a.decline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></div></div></template>
</section>
</template>

<template data-if="{{hasMine}}">
<section aria-labelledby="mine-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="mine-h" style="margin: 0; font-size: 24px; font-weight: 600">{{mineTitle}}</h2><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F">{{mineNote}}</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; font-family: Geist, system-ui, sans-serif">
<template data-for="{{mine}}" data-as="m"><div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 14px; padding: 10px; display: flex; gap: 10px"><button type="button" aria-label="Open {{m.t}}" onClick="{{m.open}}" style="flex: none; width: 64px; height: 64px; border-radius: 10px; border: none; background: {{m.bg}}; cursor: pointer"></button><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{m.t}}</span><span style="font-size: 12.5px; color: #3F444C">{{m.sub}}</span><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="padding: 2px 8px; border-radius: 999px; background: {{m.stBg}}; color: {{m.stFg}}; font-size: 11.5px; font-weight: 700">{{m.st}}</span><template data-if="{{m.hasDecide}}"><button type="button" onClick="{{m.approve}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 12.5px; font-weight: 600; cursor: pointer">Approve</button><button type="button" onClick="{{m.decline}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; cursor: pointer">Decline</button></template><template data-if="{{m.hasDemo}}"><button type="button" onClick="{{m.demo}}" style="min-height: 32px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; text-decoration: underline; cursor: pointer">{{m.demoLabel}}</button></template></div></div></div></template>
</div>
</section>
</template>

<section aria-label="Showcase sections" style="display: flex; flex-direction: column; gap: 16px">
<div role="tablist" aria-label="Showcase sections" style="display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif">
<template data-for="{{tabs}}" data-as="t"><button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 14px; border-radius: 10px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap">{{t.label}} <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; opacity: 0.7">{{t.n}}</span></button></template>
</div>

<template data-if="{{isListTab}}">
<div role="tabpanel" aria-label="{{tabTitle}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">{{tabTitle}}</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 760px">{{tabLead}}</p></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-family: Geist, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{catChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #62676F"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search listings</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search: watercolour, logo, textbooks…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #14161A"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F444C">Sort<select value="{{sort}}" onChange="{{setSort}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{sortOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{learnerOnly}}" onChange="{{toggleLearner}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Learners’ work only</label>
</div>
<span aria-live="polite" style="font-size: 13px; color: #62676F">{{resultText}}</span>
</div>
<template data-if="{{hasCards}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<template data-for="{{cards}}" data-as="c">
<article class="acard" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative">
<button type="button" onClick="{{c.open}}" aria-label="Open {{c.t}}" style="display: block; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer">
<span role="img" aria-label="{{c.alt}}" style="position: relative; aspect-ratio: 4 / 3; background: {{c.bg}}; display: flex; align-items: center; justify-content: center">
<template data-if="{{c.hasIcon}}"><span style="width: 76px; height: 76px; border-radius: 50%; background: #FFFFFF; color: {{c.iconInk}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -16px rgba(20,22,26,.6)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span></template>
<template data-if="{{c.isCover}}"><span style="max-width: 70%; padding: 14px 10px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; line-height: 1.1; font-weight: 600; color: #FFFFFE; text-align: center; text-wrap: balance">{{c.coverT}}</span></template>
</span>
</button>
<button type="button" aria-pressed="{{c.saved}}" aria-label="{{c.saveLabel}}" onClick="{{c.save}}" style="position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; border: none; background: #FFFFFF; color: #14161A; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -10px rgba(20,22,26,.7)"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{c.saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></button>
</div>
<div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: Geist, system-ui, sans-serif"><span style="padding: 2px 8px; border-radius: 6px; background: {{c.tint}}; color: {{c.ink}}; font-size: 11.5px; font-weight: 700">{{c.cat}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13.5px; font-weight: 500; color: #14161A">{{c.price}}</span></div>
<h3 style="margin: 0; font-size: 19px; line-height: 1.2; font-weight: 600"><button type="button" onClick="{{c.open}}" style="padding: 0; border: none; background: transparent; color: #14161A; font: inherit; text-align: left; cursor: pointer">{{c.t}}</button></h3>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{c.by}} · {{c.area}}</span>
<template data-if="{{c.hasSwap}}"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; color: #1E40AF">{{c.swapLine}}</span></template>
<template data-if="{{c.hasCloses}}"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #92400E">{{c.closes}}</span></template>
<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 5px; font-family: Geist, system-ui, sans-serif; font-size: 11.5px; font-weight: 600"><template data-if="{{c.hasBadge}}"><span style="padding: 2px 8px; border-radius: 6px; background: #DDF4F1; color: #115E59">{{c.badge}}</span></template><template data-if="{{c.hasSold}}"><span style="padding: 2px 8px; border-radius: 6px; background: #F4F4EF; color: #3F444C">{{c.soldLine}}</span></template></div>
</div>
</article>
</template>
</div>
</template>
<template data-if="{{noCards}}"><p style="margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed #CFCFC6; text-align: center; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">{{emptyText}}</p></template>
</div>
</template>

<template data-if="{{isColl}}">
<div role="tabpanel" aria-label="Collections" style="display: flex; flex-direction: column; gap: 14px">
<template data-if="{{notInColl}}">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">Collections</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 720px">Put a physical collection online: a home library, a sketchbook, a club’s kit. Catalogue it by ISBN, photo or a pasted list, choose who can see it, and set lending rules.</p></div><button type="button" onClick="{{openStart}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Start a collection</button></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px">
<template data-for="{{collCards}}" data-as="c"><article class="acard" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column"><div aria-hidden="true" style="height: 120px; background: {{c.bg}}"></div><div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; flex: 1"><div style="display: flex; flex-wrap: wrap; gap: 5px; font-family: Geist, system-ui, sans-serif; font-size: 11.5px; font-weight: 700"><span style="padding: 2px 8px; border-radius: 6px; background: #F4F7FE; color: #1E40AF">{{c.kind}}</span><span style="padding: 2px 8px; border-radius: 6px; background: #F4F4EF; color: #3F444C">{{c.vis}}</span></div><h3 style="margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600">{{c.t}}</h3><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{c.by}} · {{c.total}}</span><p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3F444C">{{c.d}}</p><button type="button" onClick="{{c.open}}" style="margin-top: auto; align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Open collection</button></div></article></template>
</div>
</template>

<template data-if="{{inColl}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<button type="button" onClick="{{cBack}}" style="align-self: flex-start; min-height: 40px; padding: 0 4px; border: none; background: transparent; color: #1D4ED8; font-family: Geist, system-ui, sans-serif; font-size: 14px; cursor: pointer">← All collections</button>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">{{cKind}} · {{cBy}}</span><h2 style="margin: 0; font-size: 28px; font-weight: 600">{{cT}}</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 720px">{{cD}}</p></div><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: Geist, system-ui, sans-serif"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px">{{cTotal}}</span><span style="font-size: 12.5px; color: #62676F">{{cVisLabel}}</span></div></div>
<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #F4F4EF; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">{{cRulesLine}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-family: Geist, system-ui, sans-serif">
<label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #62676F"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search this collection</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" value="{{cq}}" onChange="{{cSetQ}}" placeholder="Search titles and authors" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #14161A"></label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cAvail}}" onChange="{{cToggleAvail}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Available to borrow</label>
<span style="font-size: 13px; color: #62676F">{{cShown}}</span>
</div>
<template data-if="{{cHasItems}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
<template data-for="{{cItems}}" data-as="it"><div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column"><div role="img" aria-label="{{it.t}}" style="aspect-ratio: 3 / 4; background: {{it.bg}}; display: flex; align-items: center; justify-content: center"><template data-if="{{it.isCover}}"><span style="max-width: 78%; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; line-height: 1.1; font-weight: 600; color: #FFFFFE; text-align: center; text-wrap: balance">{{it.t}}</span></template></div><div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; font-family: Geist, system-ui, sans-serif"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16.5px; font-weight: 600; line-height: 1.2">{{it.t}}</span><span style="font-size: 12.5px; color: #3F444C">{{it.by}}</span><template data-if="{{it.hasYear}}"><span style="font-size: 12px; color: #62676F">{{it.year}} · {{it.cond}}</span></template><template data-if="{{it.hasIsbn}}"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #62676F">{{it.isbn}}</span></template><span style="font-size: 12px; font-weight: 600; color: {{it.stFg}}">{{it.status}}</span><template data-if="{{it.hasAct}}"><button type="button" onClick="{{it.go}}" disabled="{{it.actOff}}" style="margin-top: auto; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; font-weight: 600; cursor: pointer">{{it.act}}</button></template></div></div></template>
</div>
</template>
<template data-if="{{cNoItems}}"><p style="margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed #CFCFC6; text-align: center; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">{{cEmpty}}</p></template>

<template data-if="{{cIsOwner}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; font-family: Geist, system-ui, sans-serif">
<section aria-labelledby="add-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 id="add-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Add an item</h3>
<template data-if="{{aIsBooks}}"><div style="display: flex; gap: 6px; align-items: flex-end"><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">ISBN (from the back cover)<input type="text" inputmode="numeric" value="{{aIsbn}}" onChange="{{aSetIsbn}}" placeholder="9780141439518" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-family: 'Geist Mono', ui-monospace, monospace"></label><button type="button" onClick="{{aLookup}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Look up</button></div></template>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Title<input type="text" value="{{aT}}" onChange="{{aSetT}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label>
<div style="display: flex; gap: 8px"><label style="flex: 2; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">{{aByLabel}}<input type="text" value="{{aBy}}" onChange="{{aSetBy}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Year<input type="text" inputmode="numeric" value="{{aYear}}" onChange="{{aSetYear}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F444C">Condition<select value="{{aCond}}" onChange="{{aSetCond}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{aConds}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><template data-if="{{aIsBooks}}"><label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{aLend}}" onChange="{{aToggleLend}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Can be lent</label></template></div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 10px; border: 1px dashed #CFCFC6; background: {{aPhotoBg}}"></span><label style="position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Add a photo of the cover or piece<input type="file" accept="image/*" onChange="{{aSetPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label></div>
<template data-if="{{aHasMsg}}"><span role="status" style="font-size: 13px; color: #115E59">{{aMsg}}</span></template>
<button type="button" onClick="{{aAdd}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Add to collection</button>
</section>
<div style="display: flex; flex-direction: column; gap: 14px">
<section aria-labelledby="imp-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h3 id="imp-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Paste a list</h3>
<span style="font-size: 13px; color: #62676F">One item per line: Title, Author, Year. Good for a shelf you’ve typed up or a spreadsheet column.</span>
<textarea rows="4" aria-label="Items to import" value="{{importTxt}}" onChange="{{setImport}}" placeholder="The River and the Source, Margaret Ogola, 1994" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; line-height: 1.5"></textarea>
<button type="button" onClick="{{doImport}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Import</button>
</section>
<section aria-labelledby="vis-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 id="vis-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Who can see it, and lending</h3>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Visible to<select value="{{cVis}}" onChange="{{cSetVis}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cVisOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label>
<span style="font-size: 13px; line-height: 1.45; color: #62676F">{{cVisNote}}</span>
<template data-if="{{cIsLibrary}}"><div style="display: flex; flex-wrap: wrap; gap: 10px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Loan length<select value="{{cWeeks}}" onChange="{{cSetWeeks}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cWeekOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Items per family<select value="{{cMax}}" onChange="{{cSetMax}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cMaxOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div><label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{cVerified}}" onChange="{{cToggleVerified}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Lend only to verified Vachuo families</label></template>
</section>
</div>
</div>
</template>
</div>
</template>
</div>
</template>

<template data-if="{{isJobs}}">
<div role="tabpanel" aria-label="Jobs and internships" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">Jobs and internships</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 760px">For senior-school learners from 16, alumni and adult learners. Employers are verified, every listing states pay, and nobody can charge you to apply.</p></div><template data-if="{{isEmployer}}"><button type="button" onClick="{{openJobPost}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Post a job</button></template></div>

<template data-if="{{jLocked}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 18px; border-radius: 16px; background: #F4F7FE; border: 1px solid #93BBF3; font-family: Geist, system-ui, sans-serif"><span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: #1E40AF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg></span><p style="flex: 1 1 320px; margin: 0; font-size: 15px; line-height: 1.5; color: #14161A">{{jLockText}}</p><div style="display: flex; gap: 6px"><button type="button" onClick="{{goEarn}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer">See paid challenges</button><button type="button" onClick="{{goServices}}" style="min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Offer a service</button></div></div>
</template>

<template data-if="{{jOpen}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-family: Geist, system-ui, sans-serif">
