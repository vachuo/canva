</div>

<template data-if="{{isListTab}}">
<div role="tabpanel" aria-label="{{tabTitle}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">{{tabTitle}}</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 760px">{{tabLead}}</p></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{catChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #62676F"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search listings</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search: watercolour, logo, textbooks…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #14161A"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F444C">Sort<select value="{{sort}}" onChange="{{setSort}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{sortOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{learnerOnly}}" onChange="{{toggleLearner}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Learners’ work only</label>
</div>
<span aria-live="polite" style="font-size: 13px; color: #62676F">{{resultText}}</span>
</div>
<template data-if="{{hasCards}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<template data-for="{{cards}}" data-as="c">
<article class="acard" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative">
<button type="button" onClick="{{c.open}}" aria-label="Open {{c.t}}" style="display: block; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer">
<span role="img" aria-label="{{c.alt}}" style="position: relative; aspect-ratio: 4 / 3; background: {{c.bg}}; display: flex; align-items: center; justify-content: center">
<template data-if="{{c.hasIcon}}"><span style="width: 76px; height: 76px; border-radius: 50%; background: #FFFFFF; color: {{c.iconInk}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -16px rgba(20,22,26,.6)"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span></template>
<template data-if="{{c.isCover}}"><span style="max-width: 70%; padding: 14px 10px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; line-height: 1.1; font-weight: 600; color: #FFFFFE; text-align: center; text-wrap: balance">{{c.coverT}}</span></template>
</span>
</button>
<button type="button" aria-pressed="{{c.saved}}" aria-label="{{c.saveLabel}}" onClick="{{c.save}}" style="position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; border: none; background: #FFFFFF; color: #14161A; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 14px -10px rgba(20,22,26,.7)"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{c.saveFill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></button>
</div>
<div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: Inter, system-ui, sans-serif"><span style="padding: 2px 8px; border-radius: 6px; background: {{c.tint}}; color: {{c.ink}}; font-size: 11.5px; font-weight: 700">{{c.cat}}</span><span style="font-family: ui-monospace, monospace; font-size: 13.5px; font-weight: 500; color: #14161A">{{c.price}}</span></div>
<h3 style="margin: 0; font-size: 19px; line-height: 1.2; font-weight: 600"><button type="button" onClick="{{c.open}}" style="padding: 0; border: none; background: transparent; color: #14161A; font: inherit; text-align: left; cursor: pointer">{{c.t}}</button></h3>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{c.by}} · {{c.area}}</span>
<template data-if="{{c.hasSwap}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #1E40AF">{{c.swapLine}}</span></template>
<template data-if="{{c.hasCloses}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #92400E">{{c.closes}}</span></template>
<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 600"><template data-if="{{c.hasBadge}}"><span style="padding: 2px 8px; border-radius: 6px; background: #DDF4F1; color: #115E59">{{c.badge}}</span></template><template data-if="{{c.hasSold}}"><span style="padding: 2px 8px; border-radius: 6px; background: #F4F4EF; color: #3F444C">{{c.soldLine}}</span></template></div>
</div>
</article>
</template>
</div>
</template>
<template data-if="{{noCards}}"><p style="margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed #CFCFC6; text-align: center; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">{{emptyText}}</p></template>
</div>
</template>

<template data-if="{{isColl}}">
<div role="tabpanel" aria-label="Collections" style="display: flex; flex-direction: column; gap: 14px">
<template data-if="{{notInColl}}">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">Collections</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 720px">Put a physical collection online: a home library, a sketchbook, a club’s kit. Catalogue it by ISBN, photo or a pasted list, choose who can see it, and set lending rules.</p></div><button type="button" onClick="{{openStart}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Start a collection</button></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px">
<template data-for="{{collCards}}" data-as="c"><article class="acard" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column"><div aria-hidden="true" style="height: 120px; background: {{c.bg}}"></div><div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; flex: 1"><div style="display: flex; flex-wrap: wrap; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 700"><span style="padding: 2px 8px; border-radius: 6px; background: #F4F7FE; color: #1E40AF">{{c.kind}}</span><span style="padding: 2px 8px; border-radius: 6px; background: #F4F4EF; color: #3F444C">{{c.vis}}</span></div><h3 style="margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600">{{c.t}}</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{c.by}} · {{c.total}}</span><p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3F444C">{{c.d}}</p><button type="button" onClick="{{c.open}}" style="margin-top: auto; align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Open collection</button></div></article></template>
</div>
</template>

<template data-if="{{inColl}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<button type="button" onClick="{{cBack}}" style="align-self: flex-start; min-height: 40px; padding: 0 4px; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer">← All collections</button>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">{{cKind}} · {{cBy}}</span><h2 style="margin: 0; font-size: 28px; font-weight: 600">{{cT}}</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 720px">{{cD}}</p></div><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: Inter, system-ui, sans-serif"><span style="font-family: ui-monospace, monospace; font-size: 15px">{{cTotal}}</span><span style="font-size: 12.5px; color: #62676F">{{cVisLabel}}</span></div></div>
<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #F4F4EF; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">{{cRulesLine}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-family: Inter, system-ui, sans-serif">
<label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #62676F"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search this collection</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" value="{{cq}}" onChange="{{cSetQ}}" placeholder="Search titles and authors" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #14161A"></label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cAvail}}" onChange="{{cToggleAvail}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Available to borrow</label>
<span style="font-size: 13px; color: #62676F">{{cShown}}</span>
</div>
<template data-if="{{cHasItems}}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
<template data-for="{{cItems}}" data-as="it"><div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column"><div role="img" aria-label="{{it.t}}" style="aspect-ratio: 3 / 4; background: {{it.bg}}; display: flex; align-items: center; justify-content: center"><template data-if="{{it.isCover}}"><span style="max-width: 78%; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; line-height: 1.1; font-weight: 600; color: #FFFFFE; text-align: center; text-wrap: balance">{{it.t}}</span></template></div><div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; font-family: Inter, system-ui, sans-serif"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16.5px; font-weight: 600; line-height: 1.2">{{it.t}}</span><span style="font-size: 12.5px; color: #3F444C">{{it.by}}</span><template data-if="{{it.hasYear}}"><span style="font-size: 12px; color: #62676F">{{it.year}} · {{it.cond}}</span></template><template data-if="{{it.hasIsbn}}"><span style="font-family: ui-monospace, monospace; font-size: 11px; color: #62676F">{{it.isbn}}</span></template><span style="font-size: 12px; font-weight: 600; color: {{it.stFg}}">{{it.status}}</span><template data-if="{{it.hasAct}}"><button type="button" onClick="{{it.go}}" disabled="{{it.actOff}}" style="margin-top: auto; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; font-weight: 600; cursor: pointer">{{it.act}}</button></template></div></div></template>
</div>
</template>
<template data-if="{{cNoItems}}"><p style="margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed #CFCFC6; text-align: center; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">{{cEmpty}}</p></template>

<template data-if="{{cIsOwner}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; font-family: Inter, system-ui, sans-serif">
<section aria-labelledby="add-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 id="add-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Add an item</h3>
<template data-if="{{aIsBooks}}"><div style="display: flex; gap: 6px; align-items: flex-end"><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">ISBN (from the back cover)<input type="text" inputmode="numeric" value="{{aIsbn}}" onChange="{{aSetIsbn}}" placeholder="9780141439518" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-family: ui-monospace, monospace"></label><button type="button" onClick="{{aLookup}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Look up</button></div></template>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Title<input type="text" value="{{aT}}" onChange="{{aSetT}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label>
<div style="display: flex; gap: 8px"><label style="flex: 2; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">{{aByLabel}}<input type="text" value="{{aBy}}" onChange="{{aSetBy}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Year<input type="text" inputmode="numeric" value="{{aYear}}" onChange="{{aSetYear}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F444C">Condition<select value="{{aCond}}" onChange="{{aSetCond}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{aConds}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><template data-if="{{aIsBooks}}"><label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{aLend}}" onChange="{{aToggleLend}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Can be lent</label></template></div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 10px; border: 1px dashed #CFCFC6; background: {{aPhotoBg}}"></span><label style="position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Add a photo of the cover or piece<input type="file" accept="image/*" onChange="{{aSetPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label></div>
<template data-if="{{aHasMsg}}"><span role="status" style="font-size: 13px; color: #115E59">{{aMsg}}</span></template>
<button type="button" onClick="{{aAdd}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Add to collection</button>
</section>
<div style="display: flex; flex-direction: column; gap: 14px">
<section aria-labelledby="imp-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h3 id="imp-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Paste a list</h3>
<span style="font-size: 13px; color: #62676F">One item per line: Title, Author, Year. Good for a shelf you’ve typed up or a spreadsheet column.</span>
<textarea rows="4" aria-label="Items to import" value="{{importTxt}}" onChange="{{setImport}}" placeholder="The River and the Source, Margaret Ogola, 1994" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; line-height: 1.5"></textarea>
<button type="button" onClick="{{doImport}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Import</button>
</section>
<section aria-labelledby="vis-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 id="vis-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Who can see it, and lending</h3>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Visible to<select value="{{cVis}}" onChange="{{cSetVis}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cVisOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label>
<span style="font-size: 13px; line-height: 1.45; color: #62676F">{{cVisNote}}</span>
<template data-if="{{cIsLibrary}}"><div style="display: flex; flex-wrap: wrap; gap: 10px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Loan length<select value="{{cWeeks}}" onChange="{{cSetWeeks}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cWeekOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Items per family<select value="{{cMax}}" onChange="{{cSetMax}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{cMaxOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div><label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{cVerified}}" onChange="{{cToggleVerified}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Lend only to verified Vachuo families</label></template>
</section>
</div>
</div>
</template>
</div>
</template>
</div>
</template>

<template data-if="{{isJobs}}">
<div role="tabpanel" aria-label="Jobs and internships" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 26px; font-weight: 600">Jobs and internships</h2><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C; max-width: 760px">For senior-school learners from 16, alumni and adult learners. Employers are verified, every listing states pay, and nobody can charge you to apply.</p></div><template data-if="{{isEmployer}}"><button type="button" onClick="{{openJobPost}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Post a job</button></template></div>

<section aria-labelledby="appr-h" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: #FBF7EE; border: 1px solid #EFE6D2"><div style="display: flex; flex-direction: column; gap: 4px"><h2 id="appr-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Apprenticeships and learning placements</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F444C">Learn a craft beside someone who does it for a living. The work itself is the test: the circuit lights, the shirt fits, the bread rises. Under 16, placements are for learning only, a few hours at a time, always with a guardian’s yes; from 16, apprenticeships pay.</p></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px"><article style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E">Apprenticeship · 16+ · paid stipend</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Solar installation</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">Otieno A., solar installer · Kibera and Kilimani</span><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">Wire, mount and test small home systems, and learn to find faults. Kim O. started here.</p></article><article style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E">Learning placement · 12+ · with a guardian’s yes</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Tailoring and pattern-cutting</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">Achieng’s workshop · Kilimani</span><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">Two afternoons a month: scale a pattern, cut it, sew it. Ratios in cloth. Never paid labour for under-16s.</p></article><article style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E">Learning placement · 14+ · weekends</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Baking at scale</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">Grace’s bakery · Lavington</span><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">Turn one recipe into four hundred chapati. Hygiene certificate included.</p></article><article style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E">Learning placement · 10+ · Saturdays</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Bicycle and radio repair</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">Juma’s repair café · Kawangware</span><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">Diagnose, fix, explain. You leave with something that works again.</p></article></div></section>

}}" onClick="{{j.save}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">{{j.saveLabel}}</button><button type="button" onClick="{{j.actGo}}" disabled="{{j.actOff}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: {{j.actBg}}; color: {{j.actFg}}; font-size: 13.5px; font-weight: 700; cursor: pointer">{{j.act}}</button></div></div></article></template>
<template data-if="{{noJobs}}"><p style="margin: 0; padding: 18px; border-radius: 14px; border: 1px dashed #CFCFC6; text-align: center; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">No opportunities match these filters.</p></template>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">

</template>
<section aria-labelledby="finder-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><h3 id="finder-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Opportunity finder</h3><span style="padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700">Demo · sample data</span></div>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Each morning at 06:00 it reads public job listings from approved sources, keeps only safe, paid, clearly identified roles, and a person reviews each one before it’s shared with matching members.</p>

<template data-if="{{crShowBlocked}}"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Blocked automatically</span><template data-for="{{crBlocked}}" data-as="b"><div style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; background: #FBF7EE"><span style="font-size: 13px; text-decoration: line-through; color: #3F444C">{{b.t}}</span><span style="font-size: 12px; font-weight: 600; color: #92400E">{{b.why}}</span></div></template></div></template>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #62676F">In this prototype the finder runs on sample listings. In production it reads only public pages from approved sources, follows each site’s robots.txt and terms, stores no personal data from those sites, and links back to the original posting.</p>

<section aria-labelledby="msg-h" style="display: flex; flex-direction: column; gap: 10px">

</div>

</template>

<template data-if="{{lHasCond}}"><span style="font-size: 13.5px; color: #3F444C">{{lCond}}</span></template>
<template data-if="{{lHasSwap}}"><span style="font-size: 13.5px; font-weight: 600; color: #1E40AF">{{lSwap}}</span></template>
<span style="font-size: 12.5px; color: #62676F">{{lArea}} · {{lPosted}}</span>

<template data-if="{{lManages}}"><div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #F4F4EF"><div style="display: flex; align-items: center; gap: 8px"><span style="padding: 2px 8px; border-radius: 999px; background: {{lStBg}}; color: {{lStFg}}; font-size: 11.5px; font-weight: 700">{{lStatus}}</span><span style="font-size: 13px; color: #3F444C">{{lMgrNote}}</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-if="{{lHasDecide}}"><button type="button" onClick="{{lApprove}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer">Approve</button><button type="button" onClick="{{lDecline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></template><button type="button" onClick="{{lRemove}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Remove listing</button></div></div></template>

<template data-if="{{lNotManages}}"><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><button type="button" onClick="{{lActGo}}" disabled="{{lActOff}}" style="min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: {{lActBg}}; color: {{lActFg}}; font-size: 14.5px; font-weight: 700; cursor: pointer">{{lAct}}</button><template data-if="{{lHasDemo}}"><button type="button" onClick="{{lDemo}}" style="min-height: 40px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-size: 13px; text-decoration: underline; cursor: pointer">{{lDemoLabel}}</button></template></div><span style="font-size: 13px; line-height: 1.45; color: #3F444C">{{lActNote}}</span></div></template>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FBF7EE"><template data-for="{{lRules}}" data-as="r"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.45"><span aria-hidden="true" style="color: #0F766E">✓</span>{{r.t}}</span></template></div>

<template data-if="{{lIsMinor}}"><p style="margin: 0; font-size: 13px; color: #62676F">{{lMinorNote}}</p></template>
<template data-if="{{lHasThread}}"><div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid #ECECE6"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Conversation</span><template data-for="{{lThread}}" data-as="m"><div style="display: flex; flex-direction: column; align-items: {{m.align}}"><template data-if="{{m.notSys}}"><div id="{{m.domId}}" style="max-width: 88%; padding: 7px 11px; border-radius: 12px; background: {{m.bg}}; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11.5px; font-weight: 700; color: #3F444C">{{m.from}}</span><template data-if="{{m.hasQ}}"><button type="button" class="vq" onClick="{{m.qGo}}" aria-label="{{m.qAria}}"><span class="vq-w">↩ Replying to {{m.qWho}}:</span><span class="vq-t">{{m.qText}}</span></button></template><span style="font-size: 14px; line-height: 1.4">{{m.t}}</span></div><template data-if="{{m.canReply}}"><button type="button" class="vq-rb" onClick="{{m.replyGo}}" aria-label="{{m.replyAria}}">↩ Reply</button></template></template><template data-if="{{m.isSys}}"><span style="font-size: 12px; color: #62676F">{{m.t}}</span></template></div></template></div></template>
<template data-if="{{lCanMsg}}"><div style="display: flex; flex-direction: column; gap: 6px"><template data-if="{{lqBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{lqBarWho}}:</span><span class="vq-t">{{lqBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{lqBarX}}">×</button></div></template><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">{{lMsgTo}}<textarea id="sc-ldraft" rows="3" value="{{draft}}" onChange="{{setDraft}}" placeholder="Ask a question or make an offer. Contact details are hidden." style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400; line-height: 1.45"></textarea></label><div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><button type="button" onClick="{{sendDraft}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer">Send message</button><button type="button" onClick="{{lReport}}" style="min-height: 42px; padding: 0 8px; border: none; background: transparent; color: #62676F; font-size: 13px; text-decoration: underline; cursor: pointer">Report this listing</button></div></div></template>
</div>
</div>
</div>
</template>

<template data-if="{{coOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="co-h" style="position: fixed; inset: 0; z-index: 90; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="fadein" style="width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-start; gap: 10px"><h2 id="co-h" style="flex: 1; margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 23px; line-height: 1.2; font-weight: 600">{{coTitle}}</h2><button type="button" aria-label="Close" onClick="{{coClose}}" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 18px; cursor: pointer">×</button></div>
<template data-if="{{coIsHand}}"><div role="group" aria-label="{{coHandTitle}}" style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">{{coHandTitle}}</span><template data-for="{{coHands}}" data-as="h"><button type="button" aria-pressed="{{h.pressed}}" onClick="{{h.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 10px 12px; border-radius: 12px; border: 2px solid {{h.bd}}; background: {{h.bg}}; color: #14161A; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 600">{{h.label}}</span><span style="font-size: 12.5px; color: #3F444C">{{h.sub}}</span></button></template></div></template>
<template data-if="{{coIsPay}}"><div style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FAFAF7"><template data-for="{{coLines}}" data-as="ln"><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px"><span style="color: #3F444C">{{ln.k}}</span><span style="font-weight: 600; text-align: right">{{ln.v}}</span></div></template><div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; padding-top: 6px; border-top: 1px solid #ECECE6"><span>Total</span><span style="font-family: ui-monospace, monospace">{{coTotal}}</span></div></div><div role="group" aria-label="Payment method" style="display: flex; gap: 6px"><template data-for="{{coPays}}" data-as="p"><button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 600; cursor: pointer">{{p.label}}</button></template></div><template data-if="{{coIsMpesa}}"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">M-Pesa number<input type="tel" inputmode="tel" value="{{coPhone}}" onChange="{{coSetPhone}}" placeholder="0712 345 678" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-family: ui-monospace, monospace"></label><span style="font-size: 12.5px; color: #62676F">You’d get an STK prompt on your phone. Demo: nothing is charged.</span></template><template data-if="{{coIsCard}}"><span style="font-size: 13px; color: #3F444C">Card details are entered on the payment provider’s secure page. Demo: nothing is charged.</span></template><template data-if="{{coHasErr}}"><span role="alert" style="font-size: 13px; font-weight: 600; color: #92400E">{{coErr}}</span></template></div></template>
<template data-if="{{coIsDone}}"><div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #DDF4F1"><span style="font-size: 16px; font-weight: 700; color: #115E59">Done. Order {{coOrder}}</span><span style="font-size: 14px; line-height: 1.5; color: #14161A">{{coDoneText}}</span></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-if="{{coNotDone}}"><button type="button" onClick="{{coNext}}" style="min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">{{coNextLabel}}</button></template><template data-if="{{coHasBack}}"><button type="button" onClick="{{coBack}}" style="min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; cursor: pointer">Back</button></template><template data-if="{{coIsDone}}"><button type="button" onClick="{{coClose}}" style="min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Close</button></template></div>
</div>
</div>
</template>

<template data-if="{{enOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="en-h" style="position: fixed; inset: 0; z-index: 90; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="fadein" style="width: min(520px, 100%); background: #FFFFFF; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-start; gap: 10px"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #92400E">Your entry</span><h2 id="en-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 23px; font-weight: 600">{{enT}}</h2></div><button type="button" aria-label="Close" onClick="{{enClose}}" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 18px; cursor: pointer">×</button></div>
<div style="display: flex; align-items: center; gap: 10px"><label style="position: relative; display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Attach your work<input type="file" accept="image/*,application/pdf,.sb3" onChange="{{enSetFile}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label><span style="font-size: 13px; color: #3F444C">{{enFileName}}</span></div>

<button type="button" onClick="{{enSubmit}}" style="align-self: flex-start; min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Submit entry</button>
</div>
</div>
</template>

<template data-if="{{pmOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="pm-h" style="position: fixed; inset: 0; z-index: 90; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="fadein" style="width: min(620px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-start; gap: 10px"><h2 id="pm-h" style="flex: 1; margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">{{pmTitle}}</h2><button type="button" aria-label="Close" onClick="{{pmClose}}" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 18px; cursor: pointer">×</button></div>
<div role="group" aria-label="What are you posting?" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{pmModes}}" data-as="m"><button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid {{m.bd}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 13.5px; cursor: pointer">{{m.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Title<input type="text" value="{{pmT}}" onChange="{{pmSetT}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label><label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Category<select value="{{pmCat}}" onChange="{{pmSetCat}}" style="min-height: 42px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{pmCats}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<template data-if="{{pmNeedPrice}}"><div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">{{pmPriceLabel}}<input type="text" inputmode="numeric" value="{{pmPrice}}" onChange="{{pmSetPrice}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-family: ui-monospace, monospace"></label><template data-if="{{pmIsService}}"><label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Charged<select value="{{pmUnit}}" onChange="{{pmSetUnit}}" style="min-height: 42px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{pmUnits}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></template></div></template>
<template data-if="{{pmIsSwap}}"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">What would you like in return?<input type="text" value="{{pmSwap}}" onChange="{{pmSetSwap}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></template>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Description<textarea rows="3" value="{{pmD}}" onChange="{{pmSetD}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400; line-height: 1.45"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Neighbourhood or “Online”<input type="text" value="{{pmArea}}" onChange="{{pmSetArea}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><span style="font-weight: 400; color: #62676F">Never a home address. Handovers happen at a library desk, school office or by courier.</span></label>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 12px; border: 1px dashed #CFCFC6; background: {{pmPhotoBg}}"></span><label style="position: relative; display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Add a photo<input type="file" accept="image/*" onChange="{{pmSetPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label></div>
<template data-if="{{pmHasErr}}"><p role="alert" style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FEF1D9; color: #92400E; font-size: 13.5px; line-height: 1.45">{{pmErr}}</p></template>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #3F444C">{{pmRuleText}}</p>
<button type="button" onClick="{{pmSubmit}}" style="align-self: flex-start; min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">{{pmSubmitLabel}}</button>
</div>
</div>
</template>

<div role="dialog" aria-modal="true" aria-labelledby="sc-h" style="position: fixed; inset: 0; z-index: 90; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">

</div>

<template data-if="{{jpOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="jp-h" style="position: fixed; inset: 0; z-index: 90; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="fadein" style="width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-start; gap: 10px"><h2 id="jp-h" style="flex: 1; margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Post a job or internship</h2><button type="button" aria-label="Close" onClick="{{jpClose}}" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 18px; cursor: pointer">×</button></div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Job title<input type="text" value="{{jpT}}" onChange="{{jpSetT}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Type<select value="{{jpType}}" onChange="{{jpSetType}}" style="min-height: 42px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{jpTypes}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="flex: 1 1 130px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Where<select value="{{jpWhere}}" onChange="{{jpSetWhere}}" style="min-height: 42px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{jpWheres}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="flex: 2 1 180px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Place<input type="text" value="{{jpPlace}}" onChange="{{jpSetPlace}}" placeholder="Westlands, Nairobi" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Pay (KSh)<input type="text" inputmode="numeric" value="{{jpPay}}" onChange="{{jpSetPay}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-family: ui-monospace, monospace"></label><label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Minimum age<select value="{{jpMin}}" onChange="{{jpSetMin}}" style="min-height: 42px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{jpMins}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="flex: 1 1 110px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Hours a day<input type="text" inputmode="numeric" value="{{jpHours}}" onChange="{{jpSetHours}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label><label style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Closes<input type="date" value="{{jpCloses}}" onChange="{{jpSetCloses}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></div>
<label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{jpNight}}" onChange="{{jpToggleNight}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Includes night shifts</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">What the work involves<textarea rows="4" value="{{jpD}}" onChange="{{jpSetD}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400; line-height: 1.45"></textarea></label>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px"><template data-for="{{jpChecks}}" data-as="c"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: {{c.fg}}"><span aria-hidden="true" style="font-weight: 700">{{c.icon}}</span>{{c.t}}</span></template></div>
<template data-if="{{jpHasErr}}"><p role="alert" style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FEF1D9; color: #92400E; font-size: 13.5px; line-height: 1.45">{{jpErr}}</p></template>
<button type="button" onClick="{{jpSubmit}}" style="align-self: flex-start; min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Submit for checks</button>
</div>
</div>
</template>

<div aria-live="polite" style="position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 120; pointer-events: none; max-width: calc(100% - 32px)"><template data-if="{{hasToast}}"><div class="fadein" style="padding: 12px 18px; border-radius: 14px; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.4">{{toast}}</div></template></div>

<footer lang="{{svChromeLang}}" dir="{{svDir}}" style="margin-top: 56px; padding-top: 12px; border-top: 1px solid #E2E2DA; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F"><nav aria-label="{{svT.policies}}" style="display: flex; flex-wrap: wrap; gap: 0 18px"><a href="mailto:hello@vachuo.com?subject=Help" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.help}}</a><a href="privacy.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.privacy}}</a><a href="terms.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.terms}}</a><a href="mailto:hello@vachuo.com" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 40px; text-decoration: none">{{svT.contact}}</a></nav><span style="margin-left: auto">© 2026 Vachuo™</span><div style="position: relative"><button type="button" aria-haspopup="true" aria-expanded="{{svLangOpen}}" aria-label="{{svT.langMenu}}" onClick="{{svLangToggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{svLangName}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{svLangOpen}}"><div class="vlang-list" role="menu" aria-label="{{svT.langMenu}}" style="position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 70; width: 250px; max-height: 340px; overflow-y: auto; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5)"><template data-for="{{svLangs}}" data-as="l"><button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: {{l.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{l.name}}</span><span style="font-size: 11.5px; color: #62676F">{{l.sub}}</span></span><span aria-hidden="true" style="color: #1D4ED8; font-weight: 700">{{l.mark}}</span></button></template></div></template></div></footer>
</main>

    const found = this.state.foundOk.map((id) => Object.assign({}, this.FOUND.pass.find((f) => f.id === id), { src: 'found' }));
    return this.JB.concat(this.state.myJobs, found);
  }
  match(j) {
    const r = this.R(); if (!r.interests || r.age < j.min) return 0;
    const o = j.tags.filter((t) => r.interests.indexOf(t) >= 0).length; return o ? Math.min(95, 55 + 15 * o) : 35;
  }
  matchesFor(j) { return ['kim', 'tumaini'].filter((k) => { const r = this.RL[k]; return r.age >= j.min && j.tags.some((t) => r.interests.indexOf(t) >= 0); }).map((k) => this.RL[k].n); }
  runCrawl() { if (this.state.crawl.state === 'running') return; this.setState({ crawl: { state: 'running', step: 0 }, queue: [], foundNo: [] }); }
  review(id, yes) {
    const q = this.state.queue.filter((x) => x !== id);
    if (yes) { const j = this.FOUND.pass.find((f) => f.id === id); const m = this.matchesFor(j); this.setState({ queue: q, foundOk: this.state.foundOk.concat([id]) }); this.toast('Shared to Jobs' + (m.length ? ' and sent to ' + m.length + ' matching ' + (m.length === 1 ? 'profile' : 'profiles') + ': ' + m.join(', ') : '') + '.'); }
    else { this.setState({ queue: q, foundNo: this.state.foundNo.concat([id]) }); this.toast('Not shared. The finder learns from this.'); }
  }
  submitJob() {
    const p = this.state.jobPost; const err = [];
    if (p.t.trim().length < 4) err.push('Add a job title.');
    if (!p.place.trim()) err.push('Add where the work happens.');
    if (p.type !== 'Volunteer' && !(Number(p.pay) > 0)) err.push('State the pay. Every paid listing on Vachuo shows pay.');
    if (p.d.trim().length < 20) err.push('Describe the work in at least a sentence.');
    if (/\b(fee|fees|deposit|registration|pay to apply|pay to join)\b/i.test(p.d)) err.push('Jobs on Vachuo can’t ask applicants to pay anything.');
    if (this.clean(p.d).hid) err.push('Remove phone numbers, emails and links. Applicants reply through Vachuo.');
    if (Number(p.min) === 16 && Number(p.hours) > 8) err.push('For 16- and 17-year-olds, keep shifts to 8 hours or less.');
    if (Number(p.min) === 16 && p.night) err.push('Night work isn’t allowed for under-18s.');
    if (err.length) { this.setState({ jobPost: Object.assign({}, p, { err: err.join(' ') }) }); return; }
    const unit = { Internship: ' a month', Apprenticeship: ' stipend a month', 'Full-time': ' a month', 'Part-time': ' a day', Volunteer: '' }[p.type];
    const j = { id: 'jp-' + Date.now(), t: p.t.trim(), org: this.R().n, type: p.type, where: p.where, place: p.place.trim(), pay: p.type === 'Volunteer' && !(Number(p.pay) > 0) ? 'Unpaid' : this.ksh(p.pay) + unit, min: Number(p.min), closes: p.closes ? 'Closes ' + p.closes : 'Rolling', d: p.d.trim(), tags: [], src: 'employer', own: 'employer', fresh: true };
    this.setState({ jobPost: null, myJobs: this.state.myJobs.concat([j]) }); this.toast('Live after checks: pay stated, no fees, contact through Vachuo' + (j.min === 16 ? ', safe hours for under-18s.' : '.'));
  }
  applyAct(j) {
    const r = this.R(); const s = this.state;
    if (s.applied[s.role + ':' + j.id]) return { label: 'Applied', go: null, demo: null, bg: '#DDF4F1', fg: '#115E59' };
    if (j.own && j.own === r.id) return { label: 'Your posting', go: null, demo: null, bg: '#ECECE6', fg: '#3F444C' };
    if (r.id === 'employer') return { label: 'Employers can’t apply', go: null, demo: null, bg: '#ECECE6', fg: '#3F444C' };
    if (r.age < j.min) return { label: 'Open to ' + j.min + '+', go: null, demo: null, bg: '#ECECE6', fg: '#3F444C' };
    if (r.age < 18) {
      const st = this.okStatus('job-' + j.id);
      if (st === 'approved') return { label: 'Apply', go: () => this.setState({ apply: { id: j.id, note: '', passport: true } }), demo: null, bg: '#F9A826', fg: '#14161A' };
      if (st === 'pending') return { label: 'Waiting for ' + r.guardian, go: null, demo: () => this.decide('job-' + j.id, true), bg: '#FEF1D9', fg: '#92400E' };
      return { label: 'Ask ' + r.guardian + ' first', go: () => this.askOk('job-' + j.id, r.short + ' wants to apply to “' + j.t + '”', j.org + ' · ' + j.pay + ' · ' + j.place), demo: null, bg: '#F9A826', fg: '#14161A' };
    }
    return { label: 'Apply', go: () => this.setState({ apply: { id: j.id, note: '', passport: true } }), demo: null, bg: '#F9A826', fg: '#14161A' };
  }
