<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Homeschooling’s Second Wave: What the Evidence Can and Cannot Tell Us</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Home education is growing again, and its families are more varied than the stereotypes. The research base has not kept up.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 18px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 4px">
<img src="assets/img/22033daaf123028b1b5f7e201a7028b0.svg" alt="" style="display: block; height: 92%; width: auto">
<img src="assets/img/cc13f9d919b0933cc82b960722e0d690.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/267b7a442640f30304c2f6baf1e79fcb.svg" alt="" style="display: block; height: 89%; width: auto">
<img src="assets/img/0a1435c5059775e636726ec8ea6ae1bf.svg" alt="" style="display: block; height: 75%; width: auto">
</div>
</figure>

<p style="margin: 0">For much of the late twentieth century, homeschooling in the United States was associated with two groups: religious families seeking to shape their children’s moral formation, and countercultural families inspired by critics of schooling such as John Holt. The pandemic scrambled that picture. Millions of families experienced home-based learning involuntarily, and a meaningful fraction decided to keep going. What has followed looks less like a temporary spike than a second wave, with new motivations, new infrastructure and new questions about quality.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The numbers, and their limits</h2>
<p style="margin: 0">Counting homeschoolers is hard because many jurisdictions require little or no registration. Researchers at the Johns Hopkins University Homeschool Hub, compiling data from 22 US states that publish counts, found that homeschooling grew by an average of 5.4% in the 2024–25 school year. That is roughly triple the pre-pandemic growth rate of about 2% a year, and more than a third of the states reporting recorded their highest numbers ever. The authors stress that these are minimum counts: some families never register, and some students using education savings accounts are not classified as homeschoolers. Estimates drawing on US Census survey data have put the homeschooled share of students at around 6%, roughly double pre-pandemic levels, though survey measures carry their own uncertainty.</p>
<p style="margin: 0">Outside the United States the data are thinner still. In many countries, including Kenya, home education has long operated in a legal grey zone, with families relying on international curricula and examinations rather than a recognised national pathway.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Who homeschools now</h2>
<p style="margin: 0">The second wave is more varied than the first. Families cite dissatisfaction with school environments, worries about safety and bullying, the needs of children with disabilities or learning differences, flexibility for travel or work, and a desire for more individualised pacing. Hybrid models, from co-operatives and microschools to part-time enrolment and online schools, blur the line between home and school. Public money has followed: education savings accounts and similar programmes in a growing number of US states now let some families direct public funds toward home and alternative education.</p>
<p style="margin: 0">This diversity matters for research and for product design. A tool built for a highly educated parent with time to teach will fail the single parent working two jobs, the family managing a child’s disability, or the parent who left school early and dreads teaching algebra.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What the research can and cannot say</h2>
<p style="margin: 0">Advocates often cite studies showing homeschooled students outperforming their peers in school. Sceptics cite cases of educational neglect and abuse hidden from view. Both frequently overreach. Robert Kunzman and Milton Gaither’s comprehensive surveys of the literature conclude that most studies rely on volunteer samples of families who choose both to participate and to be tested, which makes comparisons with public-school averages unreliable. Where better-controlled studies exist, the differences shrink.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">Outcomes vary enormously, and we know much less about the average homeschooled child than either side claims.</blockquote>
<p style="margin: 0">Some patterns are consistent. Outcomes appear to depend heavily on the structure, resources and support available to the family. The labour of home education falls disproportionately on mothers, as the sociologist Jennifer Lois documented in <i>Home Is Where the School Is</i>, and it carries real emotional and economic costs. Concerns about socialisation are often overstated for families embedded in co-ops and communities, but they are real for isolated ones.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The parent bottleneck</h2>
<p style="margin: 0">The central constraint of home education is not curriculum, which has never been more abundant. It is the parent’s capacity: time, subject knowledge, energy and confidence. Most families eventually reach a subject or a stage, often secondary mathematics, the sciences or extended writing, where they struggle. Many also struggle with the administration: records, compliance, assessment and transcripts.</p>
<p style="margin: 0">This is where technology can help or harm. Help looks like reliable instruction in the subjects where parents are weakest, honest assessment that tells families where a child really stands, administration that disappears into the background, and connection to tutors, peers and community. Harm looks like screen-heavy curricula that isolate children, dashboards that generate anxiety rather than insight, and systems that replace the parent’s relationship with the child instead of supporting it.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Safeguarding without stigma</h2>
<p style="margin: 0">A responsible case for home education must take safeguarding seriously. Where oversight is minimal, children withdrawn from school can disappear from the view of the professionals who would otherwise notice abuse or neglect. Groups such as the Coalition for Responsible Home Education in the United States argue for basic protections, such as notification and periodic contact, that need not burden the great majority of conscientious families. Technology that keeps children connected to guides, peers and community can support safety as well as learning, provided it respects family privacy and never becomes surveillance.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What good support looks like</h2>
<p style="margin: 0">The second wave needs infrastructure the first lacked: validated instruction across subjects; assessment that families and institutions can trust; portable records that ease a return to school or the move to university; human guides for motivation and hard moments; and networks that connect children to peers and to the wider world. It also needs better research, longitudinal, representative and independent. Vachuo is built for this moment, and we intend to contribute to that evidence, including when it is unflattering.</p>
