<span style="font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: #DCE6FD">VISION · MISSION · VALUES</span>
<h1 id="vision-title" style="margin: 0; font-size: clamp(52px, 7.4vw, 108px); line-height: 0.96; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">Every child, fully known and entirely free.</h1>
<p style="margin: 0; font-size: clamp(20px, 1.9vw, 25px); line-height: 1.45; color: #E4ECFD; max-width: 680px; text-wrap: pretty">Vachuo is building the operating system for individualized education. This is what we believe, why we believe it, and what we will and will not do to get there.</p>
</div>
<span class="vis-kids" aria-hidden="true"><img src="assets/img/6ab3d26d29f9009ba1269cd62a3e4663.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/1653e814680e71213ad5bbf83b9efca2.svg" alt="" style="display: block; height: 100%; width: auto"></span>
</div>
</section>

<section aria-label="Epigraph" style="max-width: 900px; margin: 0 auto; box-sizing: border-box; padding: clamp(56px, 7vw, 96px) clamp(16px, 4vw, 48px); text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center">
<p style="margin: 0; font-size: clamp(26px, 3vw, 38px); line-height: 1.3; font-style: italic; color: #1E3A8A; text-wrap: balance">“The mind does not require filling like a bottle, but rather, like wood, it only requires kindling.”</p>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Plutarch, On Listening to Lectures</span>
</section>

<section id="v01" aria-labelledby="v01-h" style="border-top: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">01</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">Vision</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v01-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">Known and free, at the same time.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Imagine a child understood as precisely as the best tutor ever understood a student: what she knows, what she misunderstands, what she loves and what she is ready for next. Now imagine the same child free of the age-graded queue, of seat time, and of the idea that learning only happens when someone is teaching.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Most education systems have offered one of these at the cost of the other. <b style="font-weight: 600">We intend to offer both, to every child, everywhere.</b></p>
</div>
</div>
</section>

<section id="v02" aria-labelledby="v02-h" style="border-top: 1px solid #E2E2DA; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">02</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">Mission</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v02-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">Build the operating system for individualized education.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">A validated CAP engine, a persistent learner model, autonomous AI teachers, automated school administration, a parent copilot, and human expertise available only when it adds value. We start with homeschooling families and grow one family, tutor and school at a time, until a nation can run on it.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; padding-top: 6px">
<div style="border-radius: 16px; background: #E4ECFD; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 25px; font-weight: 600; color: #172F73">The Loop</span><span style="font-size: 19px; font-style: italic; color: #1E40AF">Knows what you know.</span></div>
<div style="border-radius: 16px; background: #FEF1D9; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 25px; font-weight: 600; color: #78350F">The Guide</span><span style="font-size: 19px; font-style: italic; color: #92400E">Knows why it matters.</span></div>
<div style="border-radius: 16px; background: #DDF4F1; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 25px; font-weight: 600; color: #134E4A">The Web</span><span style="font-size: 19px; font-style: italic; color: #115E59">Knows who can show you.</span></div>
</div>
</div>
</div>
</section>

<section id="v03" aria-labelledby="v03-h" style="border-top: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">03</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">The tutor of princes</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v03-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">The best way to teach has always been known.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">For most of history the finest education on earth was reserved for a few. Aristotle tutored Alexander. Royal households hired private masters. In 1984 Benjamin Bloom measured what that privilege is worth: students tutored one-to-one with mastery learning outperformed conventionally taught peers by about two standard deviations.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty"><b style="font-weight: 600">It has simply never been affordable.</b> That has just changed.</p>
</div>
</div>
</section>

<section id="v04" aria-labelledby="v04-h" style="border-top: 1px solid #E2E2DA; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">04</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">School was a workaround</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v04-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">We don’t want to automate school. We want to make the workaround unnecessary.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Mass schooling was a brilliant answer to a hard question: how do you educate millions of children with too few teachers? Batch them by age. Move them through fixed sequences. Count the hours. Certify the survivors. It worked well enough to build the modern world.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">But as Ivan Illich warned in 1971, it also taught us to confuse being taught with learning, and a diploma with competence. When every child can be placed by what she knows and measured by what she can do, the workaround is no longer necessary.</p>
</div>
</div>
</section>

<section id="v05" aria-labelledby="v05-h" style="border-top: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">05</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">The book and the voice</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v05-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">Technology scales instruction. Only people scale meaning.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In <i>The Diamond Age</i>, a book raises a girl named Nell into an extraordinary young woman. Everyone remembers the book. Fewer remember the voice: a human performer who reads to Nell night after night and comes to love her. Hundreds of thousands of copies without that love raise an army instead.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">So every Vachuo learner has a named human guide. AI handles instruction and school operations. People handle motivation, mentorship, relationships and inspiration.</p>
</div>
</div>
</section>

<section id="v06" aria-labelledby="v06-h" style="border-top: 1px solid #E2E2DA; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">06</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">Questions before answers</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v06-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">The first books that answer back must not just answer.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Socrates taught by asking, and he distrusted the written word because it gives the same reply to every question. Our tutors are the first texts that can answer back, which is exactly why they must not simply hand over answers. They ask first. They let a child find her own contradiction. They check understanding with new problems, and never by trusting a confident reply.</p>
</div>
</div>
</section>

<section id="v07" aria-labelledby="v07-h" style="border-top: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">07</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">Do the thing</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v07-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">We become builders by building.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Aristotle said we acquire excellence by practising it. Dewey said education is a process of living, not a preparation for it. A ratio understood in conversation is half a skill. A ratio used to scale a recipe for forty, cut a shirt pattern or read a surveyor’s map is a whole one.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty"><b style="font-weight: 600">Every Vachuo day begins with a question the child cares about and ends somewhere real.</b></p>
</div>
</div>
</section>

<section id="v08" aria-labelledby="v08-h" style="border-top: 1px solid #E2E2DA; background: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 76px; line-height: 1; font-weight: 500; color: #1684E8">08</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #3F444C">The loop</span></div>
<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v08-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">Know. Teach. Grow. Repeat.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Everyone will have an AI tutor. Our advantage is the closed loop around it, run across K–12, every subject, every standard, every learning level and multiple pedagogies, for millions of learners.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 12px">
<li style="border-radius: 16px; border: 1px solid #E2E2DA; border-top: 4px solid #1D4ED8; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #1E40AF">STEP 01</span><span style="font-size: 26px; font-weight: 600">Know</span><span style="font-size: 17.5px; line-height: 1.5; color: #3F444C">Diagnose what the learner knows and misunderstands. Keep a model of every skill, with its evidence, that she can see and correct.</span></li>
<li style="border-radius: 16px; border: 1px solid #E2E2DA; border-top: 4px solid #1684E8; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #1E40AF">STEP 02</span><span style="font-size: 26px; font-weight: 600">Teach</span><span style="font-size: 17.5px; line-height: 1.5; color: #3F444C">Plan the next step, teach it in the way that suits her, and observe only inside the time she has agreed to learn.</span></li>
<li style="border-radius: 16px; border: 1px solid #E2E2DA; border-top: 4px solid #0D9488; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #1E40AF">STEP 03</span><span style="font-size: 26px; font-weight: 600">Grow</span><span style="font-size: 17.5px; line-height: 1.5; color: #3F444C">Assess, find the misconception, remediate, reassess, update the model and tell the family. Then repeat.</span></li>
</ol>
</div>
</div>
</section>

<section id="v09" aria-labelledby="v09-h" style="border-top: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 16px 64px">

<h2 id="v09-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">The world is the larger school.</h2>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(220px, 30vw, 300px); border-radius: 22px; overflow: hidden; background: #0D9488">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 18px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 8px">
<img src="assets/img/21ef351959c7b27f73dae1d9e0a3393f.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/58864873fe4dd83572979be618792f53.svg" alt="" style="display: block; height: 82%; width: auto">
<img src="assets/img/d21e7783f1935f06ae9fa2d66914be3f.svg" alt="" style="display: block; height: 84%; width: auto">
</div>
</figure>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Illich imagined four networks that could replace the school building. We are building them, with the safeguards children deserve:</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<li style="display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 14px 0; border-top: 1px solid #E2E2DA"><span style="flex: 1 1 200px; font-size: 21px; font-weight: 600; color: #134E4A">Resource services</span><span style="flex: 2 1 320px; font-size: 18px; line-height: 1.5; color: #3F444C">The tools, spaces and objects of learning, mapped to the skills they teach.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 14px 0; border-top: 1px solid #E2E2DA"><span style="flex: 1 1 200px; font-size: 21px; font-weight: 600; color: #134E4A">Skill exchanges</span><span style="flex: 2 1 320px; font-size: 18px; line-height: 1.5; color: #3F444C">People who teach what they do, often as a swap.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 14px 0; border-top: 1px solid #E2E2DA"><span style="flex: 1 1 200px; font-size: 21px; font-weight: 600; color: #134E4A">Peer-matching</span><span style="flex: 2 1 320px; font-size: 18px; line-height: 1.5; color: #3F444C">Partners who want to learn the same thing at the same time.</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 14px 0; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA"><span style="flex: 1 1 200px; font-size: 21px; font-weight: 600; color: #134E4A">Educator directory</span><span style="flex: 2 1 320px; font-size: 18px; line-height: 1.5; color: #3F444C">Elders, masters and guides for advice, critique and inspiration.</span></li>
</ul>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Learning in the world counts exactly as much as learning in a lesson, if the learner wants it counted.</p>

<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">They decide what we build, what we measure and whom we hire. When two of them conflict, the child’s freedom wins.</p>

<div style="flex: 3 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 18px">
<h2 id="v11-h" style="margin: 0; font-size: clamp(34px, 3.8vw, 50px); line-height: 1.06; letter-spacing: -0.01em; font-weight: 600; text-wrap: balance">Being known should be a birthright.</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; font-style: italic; color: #92400E; text-wrap: pretty">[FOUNDER’S STORY: a short paragraph, in your own words, about the teacher, tutor or moment that showed you what one person who truly knows a child can do.]</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">I don’t believe children need more school. I believe they need more learning, and more of the people and places that make learning possible. For most of history, being known that well was a privilege. It should be a birthright.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Vachuo is our attempt to make it one: a Primer for every child, a guide for every Primer, and a web for every guide.</p>
<p style="margin: 8px 0 0; font-size: 21px; font-style: italic">[FOUNDER NAME], Founder</p>

<script>
DC.component("Vision", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
    return { uiTheme: t, uiDark: d, uiLight: !d, uiOn: d ? 'true' : 'false', uiToggle: this._uiFlip, uiTrack: d ? '#1D4ED8' : '#8A8F96', uiKnob: d ? '19px' : '3px' };
  }
  themeOff() { try { window.removeEventListener('storage', this._uiSync); } catch (e) {} }
  constructor(props) {
    super(props);
    this.state = { scrolled: false, showTop: false };
  }
  componentDidMount() {
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = 0;
        const y = window.scrollY || 0, scrolled = y > 8, showTop = y > 900;
        if (scrolled !== this.state.scrolled || showTop !== this.state.showTop) this.setState({ scrolled, showTop });
      });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    if (window.innerHeight < 1600 && 'IntersectionObserver' in window && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      const vh = window.innerHeight;
      this._io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.setAttribute('data-shown', ''); this._io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll('main > section').forEach((el) => { if (el.getBoundingClientRect().top > vh * 0.9) { el.setAttribute('data-rv', ''); this._io.observe(el); } });
      document.documentElement.classList.add('rv-on');
    }
  }
  componentWillUnmount() { this.themeOff();
    window.removeEventListener('scroll', this._onScroll);
    if (this._io) this._io.disconnect();
    document.documentElement.classList.remove('rv-on');
  }
  renderVals() { return Object.assign(this.themeVals(), this.pageVals()); }
  pageVals() {
    const blue = '#1E40AF', amber = '#92400E', teal = '#115E59';
    const v = [
      ['Learning over schooling', 'We measure what a child can do, never how long she sat or how old she is.', blue],
      ['Ask before telling', 'Our tutors question first. Understanding is verified with new problems, never assumed.', blue],
      ['Know the child, never own the child', 'Every inference is visible and contestable, and every record belongs to the learner.', amber],
      ['The world is the classroom', 'Workshops, markets, forests and neighbours count as much as lessons do.', teal],
      ['People for meaning', 'AI for instruction and operations; humans for motivation, mentorship and inspiration.', teal],
      ['Evidence over enthusiasm', 'We validate before we teach, and we publish what we find, including what fails.', blue],
      ['Independence is the goal', 'Success is a learner who needs Vachuo a little less every year.', amber],
      ['Every child, every place', 'Built for low bandwidth, many languages and every family budget.', teal]
    ];
    return {
      values: v.map((x, i) => ({ n: String(i + 1).padStart(2, '0'), title: x[0], text: x[1], c: x[2] })),
      headShadow: this.state.scrolled ? '0 10px 30px -18px rgba(20,22,26,0.35)' : 'none',
      showTop: this.state.showTop,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })
    };
  }
}
return Component;
});

DC.mount("Vision");
</script>
