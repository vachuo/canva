<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 660px; text-wrap: pretty">Start from your own question. Vachuo finds where it lives on your map, builds a path to it, and points you to people and places nearby who know it.</p>

</div>

<a href="session.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Start from my question<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
</div>

<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">Wander, read, build, help at home, or do nothing at all. Open hours are yours: nothing is tracked, scored or reported, not even to your parents.</p>

<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Keep open hours unobserved</span><span style="font-size: 13px; color: #62676F">{{toggleNote}}</span></span>
<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 26px; border-radius: 999px; background: {{trackBg}}"><span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,22,26,0.25)"></span></span>
</button>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log something I learned</button>
<p style="margin: 0; font-size: 13px; color: #62676F; line-height: 1.5">Only if you want it on your map. You decide what counts.</p>

</div>

<div style="display: flex; flex-wrap: wrap; gap: 6px"><span style="font-size: 12.5px; font-weight: 500; color: #1E40AF; background: #E4ECFD; padding: 4px 10px; border-radius: 999px">Rates</span><span style="font-size: 12.5px; font-weight: 500; color: #1E40AF; background: #E4ECFD; padding: 4px 10px; border-radius: 999px">Data</span></div>
