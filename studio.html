<template id="dc-Studio">

<nav aria-label="Vachuo Studio" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px"><a href="studio.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><span style="align-self: flex-start; margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: #E4ECFD; color: #1E40AF; font-size: 12px; font-weight: 600">Content, assessment and pedagogy · sandbox</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Vachuo Studio</div><template data-for="{{tabs}}" data-as="t"><button type="button" aria-current="{{t.cur}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer"><span style="flex: 1">{{t.label}}</span><template data-if="{{t.hasN}}"><span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700; text-align: center">{{t.n}}</span></template></button></template></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Internal tools</div><a href="ops.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Ops console</a><a href="admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Admin dashboard</a><a href="super-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Super admin</a><a href="blog-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Blog admin</a><a href="studio.html" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #1E40AF; background: #E4ECFD">Vachuo Studio</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #ECECE6; color: #3F444C; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">A</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Achieng O.</span><span style="font-size: 12.5px; color: #62676F">Learning designer · studio lead</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="studio.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3vw, 40px); line-height: 1.08; font-weight: 600">Vachuo Studio</h1><button type="button" onClick="{{resetSandbox}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Reset sandbox</button></div><p style="margin: 0; max-width: 820px; font-size: 15px; line-height: 1.5; color: #3F444C">The sandbox where the content, assessment and pedagogy team turns what the crowd knows into better teaching. Crowdsource approved curriculum materials, items and labels from Pre-K to Grade 12. Learn by training and testing Vachuo’s models and Socrates against them. Power Vachuo’s products and services with the trained models. Contributed materials are used only to train and test Vachuo’s AI engine and Socrates, never outside that. Contributors work for Vachuo as employees or contractors, directly or through a third-party provider.</p></header><p role="note" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #14161A; color: #EDEDE8; font-size: 13.5px; line-height: 1.45">Sandbox: nothing here reaches learners, parents or production models. Promoting a model or publishing a pack goes through the super admin’s gates.</p><template data-if="{{is_overview}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-wrap: wrap; gap: 14px"><section style="flex: 1 1 300px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid #0D9488"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0D9488">1 · Crowdsource</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">Gather</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">Guides, teachers, elders and parents contribute materials, items, worked examples, rubrics and labels, as Vachuo employees or contractors, directly or through a third-party provider. Contractors are paid per task, weekly or bi-weekly; employees are paid as agreed.</span><template data-for="{{ovC}}" data-as="m"><div style="display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ECECE6; font-size: 13.5px"><span style="color: #3F444C">{{m.k}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{m.v}}</span></div></template></section><section style="flex: 1 1 300px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid #1D4ED8"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1D4ED8">2 · Learn</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">Train and test</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">The labelled set trains the marking, hint and misconception models. Nothing ships until it agrees with expert guides and passes the safety gates.</span><template data-for="{{ovL}}" data-as="m"><div style="display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ECECE6; font-size: 13.5px"><span style="color: #3F444C">{{m.k}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{m.v}}</span></div></template></section><section style="flex: 1 1 300px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px; border-top: 4px solid #B45309"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B45309">3 · Power</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">Power the engine</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">Contributed materials train and test Vachuo’s AI engine, its models and Socrates AI, and are used nowhere else. The trained models power every Vachuo product and service: family plans, microschool and school plans, assessment services and the partner API. Contributors are paid for their work, not a share of sales.</span><template data-for="{{ovS}}" data-as="m"><div style="display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ECECE6; font-size: 13.5px"><span style="color: #3F444C">{{m.k}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{m.v}}</span></div></template></section></div><section style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">This week in the loop</h2></div><template data-for="{{ovFeed}}" data-as="f"><div style="display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE6; font-size: 13.5px"><span style="flex: none; padding: 2px 8px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 11.5px; font-weight: 700">{{f.stage}}</span><span>{{f.t}}</span></div></template></section></div>
</template>
<template data-if="{{is_contrib}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px"><template data-for="{{cKpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><input aria-label="Search" value="{{cQ}}" onChange="{{cSetQ}}" placeholder="Search contributions" style="flex: 1 1 240px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" onClick="{{ux_bounty}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Post a bounty</button></div><div role="group" aria-label="Kind" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 70px; font-size: 12.5px; font-weight: 600; color: #62676F">Kind</span><template data-for="{{cKinds}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div><div role="group" aria-label="Status" style="display: flex; flex-wrap: wrap; align-items: cent ight: 600">{{m.v}}</span></div></template><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Agreement by label</h2></div><template data-for="{{lbAgree}}" data-as="b"><div style="display: grid; grid-template-columns: minmax(120px, 220px) 1fr 90px; align-items: center; gap: 10px; font-size: 13.5px"><span style="color: #3F444C">{{b.label}}</span><span aria-hidden="true" style="display: block; height: 12px; border-radius: 6px; background: #ECECE6"><span style="display: block; width: {{b.w}}%; height: 100%; border-radius: 6px; background: {{b.c}}"></span></span><span style="text-align: right; font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{b.v}}</span></div></template></aside></div></div>

9px; border-radius: 999px; background: {{r.statusBg}}; color: {{r.statusFg}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.status}}</span></td><td style="padding: 6px 12px; border-bottom: 1px solid #ECECE6; text-align: right; white-space: nowrap"><template data-for="{{r.acts}}" data-as="x"><button type="button" onClick="{{x.go}}" style="min-height: 36px; margin-left: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{x.t}}</button></template></td></tr></template></tbody></table></div><p style="margin: 0; font-size: 12.5px; color: #62676F">Calibrated with a two-parameter model on pilot responses. Items with discrimination under 0.5 are flagged for review; items seen by more than 30% of learners rotate out of assessments.</p></div>
