<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">After the EdTech Bubble: Where Patient Capital Should Go Next</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Venture funding has fallen by more than four-fifths since 2021. The next decade will reward evidence, distribution and sound unit economics.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 6 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #172F73">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.28)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end">
<img src="assets/img/734c48226a9d32aaeebc02194bddd245.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>

<p style="margin: 0">Few sectors have seen a boom and bust as sharp as education technology’s. During the pandemic, remote learning turned edtech from a niche into a necessity, and capital poured in. According to Tracxn data reported by Rest of World in April 2026, global edtech venture funding peaked at about $16.7 billion in 2021 and fell to under $3 billion in 2025. The number of new edtech companies founded fell from almost 10,500 in 2020 to 645 in 2025. HolonIQ, using a different methodology, described 2024 as the weakest year for edtech venture investment in about a decade. The collapse of Byju’s, once valued at around $22 billion, became the emblem of the era.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What went wrong</h2>
<p style="margin: 0">Hindsight makes the causes clear. Pandemic demand was pulled forward, then receded as schools reopened. Many consumer products relied on paid acquisition and struggled with churn once the novelty passed, so that the cost of acquiring a customer often exceeded what that customer was worth. Companies selling to schools faced long procurement cycles and budgets tied to temporary emergency funds. And underneath it all, few products could show that they improved learning.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">When growth slowed, few products had evidence that they improved learning, and little else to sustain demand.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Where capital is going now</h2>
<p style="margin: 0">The money has not disappeared; it has concentrated. HolonIQ reports investors focusing on AI-enabled products, workforce-aligned platforms and operational tools for K–12 systems. Other analysts argue that corporate training and certification preparation, where buyers pay for measurable outcomes such as passed exams or filled roles, look more promising than general consumer products for school-age children. Generative AI has created a new wave of start-ups, but investors who lived through 2021 are asking harder questions about defensibility. If every company can call the same models, where is the moat?</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Evidence as a moat</h2>
<p style="margin: 0">The answer we find most persuasive is evidence. In the United States, the Every Student Succeeds Act of 2015 defined tiers of evidence, from strong evidence based on well-designed randomised trials down to a demonstrated rationale, and many public purchasers now ask vendors where they sit. Independent certifications and third-party evaluations are becoming procurement requirements rather than marketing extras. A company that can show rigorously that its product raises learning has an asset competitors cannot copy by switching to a better model.</p>
<p style="margin: 0">Evidence is slow and expensive to build, which is exactly why it is defensible. It also aligns the interests of investors and learners in a way engagement metrics never did.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Beyond venture capital</h2>
<p style="margin: 0">Venture capital is a poor fit for much of education. Its returns depend on a few companies growing very large very fast, while educational impact often depends on patient, trust-based adoption by families, teachers and governments. Other forms of capital deserve more attention. Outcomes-based financing ties payment to results: the Educate Girls development impact bond in Rajasthan, India, evaluated by IDinsight, exceeded both its enrolment and its learning targets, showing that paying for outcomes can work in education. Philanthropy can fund public goods that no single company will, such as open curricula, assessment banks and independent evaluations. Government procurement, done well, can reward evidence at scale.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What investors should ask</h2>
<p style="margin: 0">For investors still interested in education, and there are good reasons to be, a short list of questions separates durable businesses from the 2021 pattern. Does the product have evidence of learning impact, and how strong is it? Who pays, and are they the people who benefit? What does it cost to serve a learner for a year, compared with what families or systems can afford? How does the product reach its users (through parents, schools, employers or governments) and how long does that take? How does it treat children’s data? And does the business still work if the underlying AI models become commodities?</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Africa and the affordability test</h2>
<p style="margin: 0">Edtech funding has always been concentrated, with most of it coming from US-based investors and much of it flowing to products for wealthy markets. African edtech has received a small share despite the continent’s young and fast-growing population. The products that succeed there will need to be mobile-first, resilient to poor connectivity, priced for household budgets and recognised by local systems. Those constraints are good discipline everywhere. A product that can deliver measurable learning cheaply on a basic phone is a product with a future.</p>
