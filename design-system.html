@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:30px;font-size:13.5px;line-height:1.3;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}
</style>

<section aria-labelledby="ds-c" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; flex-direction: column; gap: 4px"><h2 id="ds-c" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; letter-spacing: -0.015em">Colour</h2><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #62676F">Four brand colours from the brief, and semantic tokens in light and dark pairs. Components use tokens, never raw hex.</p></div><h3 style="margin: 0; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Brand</h3><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px"><div style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid #E2E2DA"><div style="height: 96px; background-image: linear-gradient(#1D4ED8, #1D4ED8); color: #FEFEFE; display: flex; align-items: flex-end; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600">#1D4ED8</div><div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Primary blue</span><span style="font-size: 12.5px; color: #62676F">Links, focus rings, data</span></div></div><div style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; border: 1px solid #E2E2DA"><div style="height: 96px; background-image: linear-gradient(#1684E8, #1684E8); color: #FEFEFE; display: flex; align-items: flex-end; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600">#1684E8</div><div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Sky</span><span style="font-size: 12.5px; color: #62676F">Science,
