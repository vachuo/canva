<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · My classes</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.flipin{animation:flipin .5s ease}.flipin2{animation:flipin .5s ease}@keyframes flipin{from{transform:perspective(900px) rotateY(-80deg);opacity:.2}to{transform:none;opacity:1}}
.fadein2{animation:fadein .35s ease}
.lcard{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.lcard:hover{transform:translateY(-3px);box-shadow:0 18px 34px -24px rgba(20,22,26,.5)}
.kb{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translateY(-6px)}}
.tline{transition:background .2s ease}
.tline:hover{background:#F4F4EF}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.bigplay{transition:transform .2s ease}
.bigplay:hover{transform:scale(1.08)}
input[type=range]{accent-color:#F9A826}
@media (prefers-reduced-motion:reduce){.kb,.fadein,.livedot{animation:none}.lcard:hover,.bigplay:hover{transform:none}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vq{display:flex;flex-direction:column;gap:1px;align-self:stretch;box-sizing:border-box;width:100%;margin:0 0 6px;padding:5px 9px;border:none;border-left:3px solid currentColor;border-radius:6px;background:rgba(127,127,127,.14);color:inherit;font-family:Inter,system-ui,sans-serif;font-size:12.5px;line-height:1.35;text-align:left;white-space:normal;cursor:pointer}div.vq{cursor:default}.vq .vq-w{font-weight:600;opacity:.8}.vq .vq-t,.vq-bar .vq-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vq .vq-t{opacity:.92}.vq:focus-visible,.vq-rb:focus-visible,.vq-x:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}.vq-rb{display:inline-flex;align-items:center;min-height:28px;padding:0 6px;border:none;border-radius:999px;background:transparent;color:#1E40AF;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600;cursor:pointer}.vq-rb:hover{background:#F4F7FE}.vq-bar{display:flex;align-items:flex-start;gap:8px;padding:7px 6px 7px 10px;border-left:3px solid #1D4ED8;border-radius:8px;background:#F4F7FE;color:#14161A;font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.4}.vq-bar .vq-w{font-weight:600}.vq-bar .vq-t{color:#3F444C}.vq-x{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:transparent;color:#3F444C;font-size:17px;line-height:1;cursor:pointer}.vq-x:hover{background:rgba(127,127,127,.18)}[data-theme="dark"] .vq-bar{background:#1B2333;color:#EDEDE8}[data-theme="dark"] .vq-bar .vq-t{color:#C9CCD1}[data-theme="dark"] .vq-rb{color:#AFD0FF}[data-theme="dark"] .vq-rb:hover{background:#22262D}[data-theme="dark"] .vq-x{color:#C9CCD1}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Notes">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Learner workspace" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<a href="today.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div><a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a><a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a><a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM18 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM9 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a><a href="notes.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v13H3zM10.5 8.5v5l4-2.5zM8 20.5h8"/></svg>My classes</a><a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17v15.5h-17zM3.5 9.5h17M8 3v4M16 3v4M9 14.6l2 2 4-4.2"/></svg>My assessments</a><a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5zM8.5 8h7M8.5 12h7M8.5 16h2.5M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Portfolio</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Live room<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div><a href="connects.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a><a href="clubs.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a><a href="showcase.html" onClick="{{viewLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0zM5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div><a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg>The loop</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="learner.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #F4F7FE"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">My classes</span>
<h1 style="margin: 0; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Every lesson, note and resource, in one place.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 680px; text-wrap: pretty">Watch, pause, write it down, ask. Lessons are arranged by subject, path and section, and your notes count as evidence only when you choose.</p>
</div>
<div style="display: flex; gap: 10px">
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statWatched}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">watched this week</span></div>
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statNotes}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">notes taken</span></div>
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statDue}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">cards to review</span></div>
</div>
</header>

<dc-import name="Approvals" area="classes" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="nsearch" style="font-size: 13px; font-weight: 600; color: #3F444C">Search lessons, transcripts and notes</label>
<div style="position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62676F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<input id="nsearch" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Try “batches”, “ngeli” or “fair test”" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 0 16px 0 44px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
</div>
</div>
<div role="group" aria-label="Subject" style="flex: 1 1 100%; width: 100%; min-width: 0; display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding-bottom: 2px">
<template data-for="{{subjChips}}" data-as="s">
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="flex: 1 0 auto; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 10px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 500; cursor: pointer"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{s.dot}}"></span>{{s.name}}</button>
</template>
</div>
</div>

<section aria-labelledby="lesson-title" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="path-h" aria-label="Module outline" style="flex: 1 1 250px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="path-h" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">{{outlineTitle}}</h2>

</div>
<div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #ECECE6; overflow: hidden"><div style="width: {{outlinePct}}%; height: 100%; background: {{pColor}}; border-radius: 4px"></div></div>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{outlineMeta}}</span>

<template data-for="{{s.items}}" data-as="o">

<span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: {{o.iconBg}}; color: {{o.iconFg}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{o.icon}}"/></svg></span>
<span style="flex: 1; min-width: 0; font-size: 16.5px; font-weight: 600">{{o.title}}</span>

</div>
</template>
</section>

<div style="flex: 3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div ref="{{playerRef}}" style="border-radius: 20px; overflow: hidden; background: #0B0D10; box-shadow: 0 24px 48px -32px rgba(20,22,26,0.7)">
<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #0B0D10">
<video ref="{{vidRefCb}}" src="{{vSrc}}" poster="{{vPoster}}" preload="metadata" playsInline="{{ true }}" aria-label="{{videoAria}}" onClick="{{togglePlay}}" onTimeUpdate="{{onTime}}" onPlay="{{onPlay}}" onPause="{{onPause}}" onEnded="{{onEnded}}" onLoadedMetadata="{{onMeta}}" onVolumeChange="{{onVol}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0B0D10; display: block; cursor: pointer"></video>
<template data-if="{{showBigPlay}}"><div style="position: absolute; left: 14px; top: 14px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none"><span style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{pSubject}}</span><span style="display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: {{pStatusBg}}; color: {{pStatusFg}}; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600"><template data-if="{{pLive}}"><span class="livedot" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: currentColor"></span></template>{{pStatus}}</span></div></template>
<template data-if="{{showBigPlay}}"><button type="button" class="bigplay" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="position: absolute; left: 50%; top: 50%; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; border: none; background: rgba(255,255,255,0.95); color: #14161A; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 34px -14px rgba(0,0,0,0.6)"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button></template>
<template data-if="{{showCaption}}"><span aria-live="polite" style="position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); max-width: 86%; padding: 6px 12px; border-radius: 8px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.4; text-align: center">{{caption}}</span></template>
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 4px; width: {{pct}}%; background: #F9A826; pointer-events: none"></span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; background: #14161A; color: #FFFFFF">
<button type="button" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; cursor: pointer; display: flex; align-items: center; justify-content: center">
<template data-if="{{playing}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></template>
<template data-if="{{paused}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></template>
</button>
<button type="button" aria-label="Back 10 seconds" onClick="{{back10}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 11px">−10</button>
<span style="flex: none; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #DCE6FD">{{timeText}}</span>
<div style="flex: 1 1 200px; min-width: 160px; position: relative; display: flex; align-items: center">
<label for="scrub" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Seek</label>
<input id="scrub" type="range" min="0" max="{{durMax}}" step="1" value="{{tInt}}" onChange="{{seek}}" style="width: 100%; margin: 0; cursor: pointer">
<template data-for="{{ticks}}" data-as="k"><span aria-hidden="true" style="position: absolute; left: {{k.left}}%; top: -8px; width: 2px; height: 6px; border-radius: 1px; background: #7DB4FF; pointer-events: none"></span></template>
</div>
<button type="button" aria-label="{{speedAria}}" onClick="{{cycleSpeed}}" style="flex: none; min-width: 52px; height: 36px; border-radius: 999px; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px">{{speedText}}</button>
<button type="button" aria-pressed="{{ccPressed}}" onClick="{{toggleCc}}" style="flex: none; min-width: 44px; height: 36px; border-radius: 8px; border: 1px solid {{ccBd}}; background: {{ccBg}}; color: {{ccFg}}; cursor: pointer; font-size: 12.5px; font-weight: 600">CC</button>
<div role="group" aria-label="Sound" style="flex: none; display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="{{muteAria}}" aria-pressed="{{mutedA}}" onClick="{{toggleMute}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><template data-if="{{soundOn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></template><template data-if="{{soundOff}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/></svg></template></button>
<label for="vol" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Volume</label>
<input id="vol" type="range" min="0" max="100" step="1" value="{{vol100}}" onChange="{{setVol}}" style="width: 96px; margin: 0; cursor: pointer">
<span style="min-width: 34px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #DCE6FD">{{volText}}</span>
</div>
<button type="button" aria-label="Full screen" onClick="{{fullscreen}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
</div>

<div role="group" aria-label="Chapters" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
<template data-for="{{chapters}}" data-as="c">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 52px; max-width: 220px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: #14161A; text-align: left; cursor: pointer"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: {{c.tc}}">{{c.time}}</span><span style="font-size: 13.5px; font-weight: 500; line-height: 1.25">{{c.label}}</span></button>
</template>
</div>

<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
<nav aria-label="Where this lesson sits" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F"><span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: {{pInk}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{pColor}}"></span>{{crumbSubject}}</span><span aria-hidden="true">›</span><span>{{crumbPath}}</span><span aria-hidden="true">›</span><span>{{crumbSection}}</span></nav>
<h2 id="lesson-title" style="margin: 0; font-size: clamp(26px, 2.6vw, 32px); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em">{{title}}</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<span style="display: inline-flex; align-items: center; gap: 10px"><img src="{{hostImg}}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: {{pTint}}"><span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">{{hostName}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">{{hostRole}}</span></span></span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{metaLine}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-if="{{isNext}}"><button type="button" aria-pressed="{{remindPressed}}" onClick="{{toggleRemind}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid {{remindBd}}; background: {{remindBg}}; color: {{remindFg}}; font-size: 13.5px; font-weight: 600; cursor: pointer">{{remindLabel}}</button></template>
<template data-if="{{canMark}}"><button type="button" onClick="{{markWatched}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 500; cursor: pointer">{{markLabel}}</button></template>
<a href="session.html" style="display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; text-decoration: none">Ask the tutor about {{nowText}}</a>
<a href="{{vSrc}}" download="{{vFile}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 500; text-decoration: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download for offline</a>
</div>
<template data-if="{{hasIdeas}}">
<div style="border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF"><img src="assets/img/6b7158ce9be36ad9a33a1085cc3b48e2.svg" alt="" style="width: 24px; height: 24px; border-radius: 50%">Key ideas · summary by Socrates</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 17px; line-height: 1.45">
<template data-for="{{ideas}}" data-as="i"><li>{{i}}</li></template>
</ul>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">Check it against the lesson. If something’s off, say so in the comments.</span>
</div>
</template>
<p role="status" style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #115E59">{{statusMsg}}</p>
</div>
<aside aria-label="Lesson materials" style="min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden">
<div role="group" aria-label="Materials" style="display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid #ECECE6; overflow-x: auto">
<template data-for="{{tabs}}" data-as="t">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-size: 13.5px; font-weight: 600; cursor: pointer">{{t.label}}<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; padding: 1px 6px; border-radius: 999px; background: {{t.cbg}}">{{t.count}}</span></button>
</template>
</div>
<div style="height: 520px; overflow-y: auto; padding: 14px 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">

<template data-if="{{tabTranscript}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<label for="tfind" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Find in transcript</label>
<input id="tfind" type="search" value="{{tq}}" onChange="{{setTq}}" placeholder="Find in transcript" style="flex: 1; min-width: 0; min-height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; font-size: 14px">
<span style="flex: none; font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">{{tqCount}}</span>
</div>
<template data-if="{{isPreview}}"><p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FEF1D9; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: #92400E">Preview transcript. The full transcript appears when the lesson premieres.</p></template>
<template data-for="{{lines}}" data-as="l">
<button type="button" class="tline" aria-current="{{l.current}}" onClick="{{l.pick}}" style="display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 8px; border-radius: 10px; border: none; border-left: 3px solid {{l.edge}}; background: {{l.bg}}; color: #14161A; text-align: left; cursor: pointer; opacity: {{l.op}}">
<span style="flex: none; min-width: 42px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #1E40AF; padding-top: 3px">{{l.time}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; color: #62676F">{{l.who}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16.5px; line-height: 1.45">{{l.text}}</span></span>
</button>
</template>
</div>
</template>

<template data-if="{{tabNotes}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 12px">
<label for="ndraft" style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">New note at {{nowText}}</label>
<textarea id="ndraft" rows="3" value="{{draft}}" onChange="{{setDraft}}" placeholder="What clicked? What’s still fuzzy?" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 8px; font-family: Inter, system-ui, sans-serif">
<label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>Attach files<input type="file" multiple="{{ true }}" accept="image/*,application/pdf,audio/*,video/*,.doc,.docx,.txt,.csv" onChange="{{addFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label>
<button type="button" aria-pressed="{{padOpenA}}" onClick="{{togglePad}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{padBd}}; background: {{padBg}}; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Draw or handwrite</button>
</div>
<template data-if="{{padOpen}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; height: 240px; border-radius: 14px; border: 1px solid #93BBF3; background: #FFFFFF; background-image: linear-gradient(#ECECE6 1px, transparent 1px); background-size: 100% 28px; overflow: hidden">
<span style="position: absolute; left: 10px; top: 8px; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; color: #8A8F96">Finger, stylus or mouse · pressure-sensitive</span>
<canvas ref="{{padRefCb}}" aria-label="Handwriting and drawing pad" onPointerDown="{{padDown}}" onPointerMove="{{padMove}}" onPointerUp="{{padUp}}" onPointerLeave="{{padUp}}" onPointerCancel="{{padUp}}" style="position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair"></canvas>
</div>
<div role="toolbar" aria-label="Pen tools" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{tools}}" data-as="t"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 12.5px; cursor: pointer">{{t.label}}</button></template>
<template data-for="{{inks}}" data-as="c"><button type="button" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid {{c.ring}}; background: {{c.hex}}; cursor: pointer"></button></template>
<button type="button" onClick="{{padUndoCb}}" style="min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 12.5px; cursor: pointer">Undo</button>
<button type="button" onClick="{{padClearCb}}" style="min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #3F444C; font-size: 12.5px; cursor: pointer">Clear</button>
<button type="button" onClick="{{padAttachCb}}" style="margin-left: auto; min-height: 34px; padding: 0 12px; border-radius: 999px; border: none; background: #0F766E; color: #FFFFFF; font-size: 12.5px; font-weight: 600; cursor: pointer">Attach drawing</button>
</div>
</div>
</template>
<template data-if="{{hasPending}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{pendingList}}" data-as="a">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 12px; border: 1px solid #E2E2DA; background: #FAFAF7; font-family: Inter, system-ui, sans-serif; font-size: 12.5px">
<template data-if="{{a.isImg}}"><img src="{{a.url}}" alt="" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #FFFFFF"></template>
<template data-if="{{a.isFile}}"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 8px; background: #E4ECFD; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px">{{a.ext}}</span></template>
<span style="display: flex; flex-direction: column; max-width: 160px"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span><span style="color: #8A8F96">{{a.size}}</span></span>
<button type="button" aria-label="{{a.aria}}" onClick="{{a.remove}}" style="width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: #8A8F96; cursor: pointer">×</button>
</div>
</template>
</div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{addNote}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Add note at {{nowText}}</button>

  vid() { return this._vid || null; }
  vidRef(el) {
    this._vid = el;
    if (!el) return;
    el.playsInline = true;
    if (el._vachuo) return;
    el._vachuo = true;
    el.volume = this.state.vol; el.muted = this.state.muted; el.playbackRate = this.state.speed;
  }
  onMeta(e) {
    const v = e.currentTarget; const t = this.state.t;
    if (t > 0 && t < (v.duration || 0) - 0.5) { try { v.currentTime = t; } catch (x) {} }
    v.volume = this.state.vol; v.muted = this.state.muted; v.playbackRate = this.state.speed;
    if (this._wantPlay) { this._wantPlay = false; const p = v.play(); if (p && p.catch) p.catch(() => this.setState({ playing: false })); }
  }
  play() { const v = this.vid(); if (!v) return; const p = v.play(); if (p && p.catch) p.catch(() => this.setState({ playing: false, msg: 'Your browser blocked playback. Press play again.' })); }
  pause() { const v = this.vid(); if (v) v.pause(); }
  seekTo(t, andPlay) { const v = this.vid(); const tt = Math.max(0, t); if (v) { try { v.currentTime = tt; } catch (x) {} } this.setState({ t: tt }); if (andPlay) this.play(); }

  padRef(el) {
    if (!this._pad) this._pad = { strokes: [] };
    if (!el) { this._pad.el = null; return; }
    if (this._pad.el !== el) { this._pad.el = el; this.sizePad(); }
