<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · My notes</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
.lcard{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.lcard:hover{transform:translateY(-3px);box-shadow:0 18px 34px -24px rgba(20,22,26,.5)}
.kb{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translateY(-6px)}}
.tline{transition:background .2s ease}
.tline:hover{background:#F4F4EF}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.bigplay{transition:transform .2s ease}
.bigplay:hover{transform:scale(1.08)}
input[type=range]{accent-color:#F9A826}
@media (prefers-reduced-motion:reduce){.kb,.fadein,.livedot{animation:none}.lcard:hover,.bigplay:hover{transform:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Notes">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Vachuo" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="today.html" aria-label="Vachuo, back to Today" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto">
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div>
<a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a>
<a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>Tutor session</a>
<a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My map</a>
<a href="notes.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M3.5 7.5h5M3.5 12h5M3.5 16.5h5M11 8h5M11 12h5"/></svg>My notes</a>
<a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></svg>Passport</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div>
<a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Family</div>
<a href="copilot.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.3"/><path d="M16.5 14.2c2.4.3 4 2.4 4 5.3"/></svg>Parent copilot</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div>
<a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5V9h-4.5"/></svg>The loop</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 16px 12px 0; border-top: 1px solid #E2E2DA">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">My notes</span>
<h1 style="margin: 0; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Every lesson, note and resource, in one place.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 680px; text-wrap: pretty">Watch, pause, write it down, ask. Lessons are arranged by subject, path and section, and your notes count as evidence only when you choose.</p>
</div>
<div style="display: flex; gap: 10px">
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statWatched}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #62676F">watched this week</span></div>
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statNotes}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #62676F">notes taken</span></div>
<div style="min-width: 104px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{statDue}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #62676F">cards to review</span></div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="nsearch" style="font-size: 13px; font-weight: 600; color: #3F444C">Search lessons, transcripts and notes</label>
<div style="position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62676F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<input id="nsearch" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Try “batches”, “ngeli” or “fair test”" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 0 16px 0 44px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
</div>
</div>
<div role="group" aria-label="Subject" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{subjChips}}" data-as="s">
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 500; cursor: pointer"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{s.dot}}"></span>{{s.name}}</button>
</template>
</div>
</div>

<section aria-labelledby="lesson-title" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 20px; overflow: hidden; background: #0B0D10; box-shadow: 0 24px 48px -32px rgba(20,22,26,0.7)">
<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: {{pBg}}">
<span aria-hidden="true" style="position: absolute; width: 70%; aspect-ratio: 1; right: -18%; top: -45%; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.32)"></span>
<span aria-hidden="true" style="position: absolute; width: 120%; aspect-ratio: 1; left: -55%; top: -95%; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span aria-hidden="true" style="position: absolute; left: -20%; right: -20%; bottom: -22%; height: 42%; border-radius: 50%; background: #FBF7EE"></span>
<div aria-hidden="true" class="{{kbCls}}" style="position: absolute; right: 6%; bottom: 4%; height: 78%; display: flex; align-items: flex-end; gap: 6px">
<img src="{{pImg}}" alt="" style="display: block; height: 100%; width: auto">
</div>
<div style="position: absolute; left: 5%; top: 7%; max-width: 54%; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #14161A; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{pSubject}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: {{pStatusBg}}; color: {{pStatusFg}}; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600"><template data-if="{{pLive}}"><span class="livedot" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: currentColor"></span></template>{{pStatus}}</span>
</div>
<span style="font-size: clamp(22px, 2.6vw, 34px); line-height: 1.08; font-weight: 600; letter-spacing: -0.01em; color: {{pTitleFg}}; text-wrap: balance">{{title}}</span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: {{pTitleFg}}; opacity: 0.85">{{pHostLine}}</span>
</div>
<template data-if="{{showBigPlay}}"><button type="button" class="bigplay" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="position: absolute; left: 50%; top: 50%; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; border: none; background: rgba(255,255,255,0.95); color: #14161A; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 34px -14px rgba(0,0,0,0.6)"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button></template>
<template data-if="{{showCaption}}"><span aria-live="polite" style="position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); max-width: 86%; padding: 6px 12px; border-radius: 8px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-family: Geist, system-ui, sans-serif; font-size: 14.5px; line-height: 1.4; text-align: center">{{caption}}</span></template>
<span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 4px; width: {{pct}}%; background: #F9A826"></span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; background: #14161A; color: #FFFFFF">
<button type="button" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; cursor: pointer; display: flex; align-items: center; justify-content: center">
<template data-if="{{playing}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></template>
<template data-if="{{paused}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></template>
</button>
<button type="button" aria-label="Back 10 seconds" onClick="{{back10}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 11px">−10</button>
<span style="flex: none; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #DCE6FD">{{timeText}}</span>
<div style="flex: 1 1 200px; min-width: 160px; position: relative; display: flex; align-items: center">
<label for="scrub" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Seek</label>
<input id="scrub" type="range" min="0" max="{{durMax}}" step="1" value="{{tInt}}" onChange="{{seek}}" style="width: 100%; margin: 0; cursor: pointer">
<template data-for="{{ticks}}" data-as="k"><span aria-hidden="true" style="position: absolute; left: {{k.left}}%; top: -8px; width: 2px; height: 6px; border-radius: 1px; background: #7DB4FF; pointer-events: none"></span></template>
</div>
<button type="button" aria-label="{{speedAria}}" onClick="{{cycleSpeed}}" style="flex: none; min-width: 52px; height: 36px; border-radius: 999px; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; cursor: pointer; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 12.5px">{{speedText}}</button>
<button type="button" aria-pressed="{{ccPressed}}" onClick="{{toggleCc}}" style="flex: none; min-width: 44px; height: 36px; border-radius: 8px; border: 1px solid {{ccBd}}; background: {{ccBg}}; color: {{ccFg}}; cursor: pointer; font-size: 12.5px; font-weight: 600">CC</button>
</div>
</div>

<div role="group" aria-label="Chapters" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px">
<template data-for="{{chapters}}" data-as="c">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 52px; max-width: 220px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: #14161A; text-align: left; cursor: pointer"><span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 11.5px; color: {{c.tc}}">{{c.time}}</span><span style="font-size: 13.5px; font-weight: 500; line-height: 1.25">{{c.label}}</span></button>
</template>
</div>

<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
<nav aria-label="Where this lesson sits" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #62676F"><span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: {{pInk}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{pColor}}"></span>{{crumbSubject}}</span><span aria-hidden="true">›</span><span>{{crumbPath}}</span><span aria-hidden="true">›</span><span>{{crumbSection}}</span></nav>
<h2 id="lesson-title" style="margin: 0; font-size: clamp(26px, 2.6vw, 32px); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em">{{title}}</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<span style="display: inline-flex; align-items: center; gap: 10px"><img src="{{hostImg}}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: {{pTint}}"><span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">{{hostName}}</span><span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; color: #62676F">{{hostRole}}</span></span></span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 13px; color: #3F444C">{{metaLine}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-if="{{isNext}}"><button type="button" aria-pressed="{{remindPressed}}" onClick="{{toggleRemind}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid {{remindBd}}; background: {{remindBg}}; color: {{remindFg}}; font-size: 13.5px; font-weight: 600; cursor: pointer">{{remindLabel}}</button></template>
<template data-if="{{canMark}}"><button type="button" onClick="{{markWatched}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 500; cursor: pointer">{{markLabel}}</button></template>
<a href="session.html" style="display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #1D4ED8; color: #FFFFFF; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; text-decoration: none">Ask the tutor about {{nowText}}</a>
<button type="button" onClick="{{saveOffline}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 500; cursor: pointer">{{offlineLabel}}</button>
</div>
<template data-if="{{hasIdeas}}">
<div style="border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF"><img src="assets/img/6b7158ce9be36ad9a33a1085cc3b48e2.svg" alt="" style="width: 24px; height: 24px; border-radius: 50%">Key ideas · summary by the Vachuo tutor</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 17px; line-height: 1.45">
<template data-for="{{ideas}}" data-as="i"><li>{{i}}</li></template>
</ul>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12px; color: #62676F">Check it against the lesson. If something’s off, say so in the comments.</span>
</div>
</template>
<p role="status" style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; color: #115E59">{{statusMsg}}</p>
</div>
</div>

<script>
DC.component("Notes", function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.L = this.lessons();
    const notes = {}, comments = {};
    this.L.forEach((l) => { notes[l.id] = l.notes.slice(); comments[l.id] = l.com.slice(); });
    this.state = { subj: 'all', q: '', cur: 'm-scale', t: 395, playing: false, speed: 1, cc: true, tab: 'transcript', tq: '',
      notes, comments, draft: '', cdraft: '', liked: {}, sort: 'top', view: 'all', remind: {}, watched: {}, evidence: false, msg: '',
      ci: 0, back: false, known: {}, again: 0 };
  }

  componentDidMount() {
    this._t = setInterval(() => {
      if (!this.state.playing) return;
      const l = this.cur();
      const dur = this.durOf(l);
      const t = this.state.t + 0.25 * this.state.speed;
      if (t >= dur) { const w = Object.assign({}, this.state.watched); if (l.status !== 'next') w[l.id] = true; this.setState({ t: dur, playing: false, watched: w }); }
      else this.setState({ t });
    }, 250);
  }

    // ----- player -----
    let curLine = -1;
    l.tr.forEach((x, i) => { if (x[0] <= t) curLine = i; });
    const chIdx = (() => { let k = 0; l.ch.forEach((c, i) => { if (c[0] <= t) k = i; }); return k; })();
    const statusText = isNext ? (l.live ? 'Live · ' + l.when.replace('Live ', '') : l.when) : (watched(l) ? 'Watched' : 'Up now');
    const tq = st.tq.trim().toLowerCase();
    const lines = l.tr.map((x, i) => {
      const hit = tq && x[2].toLowerCase().indexOf(tq) >= 0;
      const isCur = i === curLine && (st.playing || t > 0);
      return { time: this.mmss(x[0]), who: x[1], text: x[2], current: isCur ? 'true' : 'false',
        bg: isCur ? '#F4F7FE' : (hit ? '#FEF1D9' : 'transparent'), edge: isCur ? '#1D4ED8' : (hit ? '#F9A826' : 'transparent'), op: tq && !hit ? 0.45 : 1,
        pick: () => this.setState({ t: Math.min(x[0], dur), playing: true }) };
    });
    const tqCount = tq ? l.tr.filter((x) => x[2].toLowerCase().indexOf(tq) >= 0).length + ' found' : l.tr.length + ' lines';

    const myNotes = (st.notes[l.id] || []).slice().sort((a, b) => a[0] - b[0]);
    const noteList = myNotes.map((n) => ({ time: this.mmss(n[0]), text: n[1], aria: 'Jump to ' + this.mmss(n[0]),
      seek: () => this.setState({ t: Math.min(n[0], dur) }),
      del: () => { const all = Object.assign({}, st.notes); all[l.id] = (all[l.id] || []).filter((x) => x !== n); this.setState({ notes: all }); } }));

    const youRes = l.res.filter((r) => r[3] === 'you'), guideRes = l.res.filter((r) => r[3] === 'guide');
    const resItem = (r) => ({ title: r[1], meta: r[2], icon: RIC[r[0]] || RIC.worksheet, bg: r[3] === 'guide' ? '#FEF1D9' : s.tint, fg: r[3] === 'guide' ? '#92400E' : s.ink,
      cta: r[0] === 'practice' ? 'Start' : 'Open', open: () => this.setState({ msg: (r[0] === 'practice' ? 'Starting “' : 'Opening “') + r[1] + '”. In this demo nothing downloads.' }) });
    const resGroups = [{ title: 'For you', items: youRes.map(resItem) }, { title: 'For your parent or guide', items: guideRes.map(resItem) }].filter((g) => g.items.length);

    const raw = (st.comments[l.id] || []).map((c, i) => ({ c, i }));
    const ordered = st.sort === 'top' ? raw.slice().sort((a, b) => (b.c[4] + (st.liked[l.id + ':' + b.i] ? 1 : 0)) - (a.c[4] + (st.liked[l.id + ':' + a.i] ? 1 : 0))) : raw.slice().reverse();
    const comments = ordered.map(({ c, i }) => {
      const k = l.id + ':' + i, liked = !!st.liked[k];
      const role = ROLE[c[1]] || ROLE.Learner;
      return { who: c[0], role: c[1] === 'You' ? 'You' : c[1], when: c[2], text: c[3], likes: String(c[4] + (liked ? 1 : 0)),
        ini: c[0].split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(), avBg: role[0], avFg: role[1], roleBg: role[0], roleFg: role[1],
        likedPressed: liked ? 'true' : 'false', likeBg: liked ? '#FEF1D9' : '#FFFFFF', likeFg: liked ? '#92400E' : '#3F444C', likeBd: liked ? '#F9A826' : '#E2E2DA', heart: liked ? '#F9A826' : 'none',
        like: () => { const lk = Object.assign({}, st.liked); lk[k] = !liked; this.setState({ liked: lk }); },
        reply: () => this.setState({ cdraft: '@' + c[0].split(' ')[0] + ' ' }),
        hasAt: c[5] >= 0, at: c[5] >= 0 ? this.mmss(c[5]) : '', seek: () => this.setState({ t: Math.min(Math.max(c[5], 0), dur) }) };
    });

    const tabDefs = [['transcript', 'Transcript', l.tr.length], ['notes', 'Notes', myNotes.length], ['resources', 'Resources', l.res.length], ['comments', 'Comments', raw.length]];
    const tabs = tabDefs.map(([id, label, n]) => {
      const on = st.tab === id;
      return { label, count: String(n), pressed: on ? 'true' : 'false', bg: on ? '#14161A' : 'transparent', fg: on ? '#FFFFFF' : '#3F444C', cbg: on ? 'rgba(255,255,255,0.18)' : '#F4F4EF', pick: () => this.setState({ tab: id }) };
    });

    // ----- lesson lists -----
    const q = st.q.trim().toLowerCase();
    const hitIn = (x) => {
      if (!q) return { ok: true, hit: '' };
      const base = (x.title + ' ' + x.sec + ' ' + S[x.subj].name + ' ' + S[x.subj].path).toLowerCase();
      if (base.indexOf(q) >= 0) return { ok: true, hit: '' };
      const tl = x.tr.find((y) => y[2].toLowerCase().indexOf(q) >= 0);
      if (tl) return { ok: true, hit: 'In the transcript at ' + this.mmss(tl[0]) };
      const nl = (st.notes[x.id] || []).find((y) => y[1].toLowerCase().indexOf(q) >= 0);
      if (nl) return { ok: true, hit: 'In your notes at ' + this.mmss(nl[0]) };
      return { ok: false, hit: '' };
    };
    const pool = this.L.filter((x) => (st.subj === 'all' || x.subj === st.subj) && hitIn(x).ok);
    const kind = (x) => (x.status === 'next' ? 'next' : (x.status === 'now' && !st.watched[x.id] ? 'now' : 'past'));
    const card = (x) => {
      const ss = S[x.subj], on = x.id === l.id, h = hitIn(x), k = kind(x);
      const prog = st.watched[x.id] ? 100 : (x.id === l.id && !isNext ? Math.round(t / x.dur * 100) : x.prog);
      return { title: x.title, subj: ss.name, section: x.sec, color: ss.color, ink: ss.ink, img: x.img, dur: x.status === 'next' && x.live ? 'Live · ' + this.dur(x.dur) : this.dur(x.dur),
        when: st.watched[x.id] && x.status !== 'past' ? 'Watched today' : x.when, prog,
        badge: k === 'next' ? (x.live ? '● Live' : 'Premieres') : (k === 'now' ? 'Up now' : (prog >= 100 ? 'Watched' : 'In progress')),
        badgeBg: k === 'next' ? (x.live ? '#14161A' : 'rgba(255,255,255,0.92)') : (k === 'now' ? '#F9A826' : 'rgba(255,255,255,0.92)'), badgeFg: k === 'next' && x.live ? '#FFFFFF' : '#14161A',
        notes: String((st.notes[x.id] || []).length), res: String(x.res.length), com: String((st.comments[x.id] || []).length),
        hasHit: !!h.hit, hit: h.hit, pressed: on ? 'true' : 'false', bd: on ? ss.color : '#E2E2DA', pick: () => this.load(x.id) };
    };
    const nowL = pool.filter((x) => kind(x) === 'now');
    const nextL = pool.filter((x) => kind(x) === 'next').sort((a, b) => a.day - b.day);
    const pastL = pool.filter((x) => kind(x) === 'past').sort((a, b) => b.day - a.day);
    const groupsAll = [['now', 'Up now', '#92400E', nowL], ['next', 'Coming up this week', '#1E40AF', nextL], ['past', 'Watched', '#115E59', pastL]];
    const groups = groupsAll.filter((g) => (st.view === 'all' || st.view === g[0]) && g[3].length).map((g) => ({ title: g[1], color: g[2], cards: g[3].map(card) }));
    const views = [['all', 'All', pool.length], ['now', 'Up now', nowL.length], ['next', 'Coming up', nextL.length], ['past', 'Watched', pastL.length]].map(([id, label, n]) => {
      const on = st.view === id;
      return { label, count: String(n), pressed: on ? 'true' : 'false', bg: on ? '#14161A' : 'transparent', fg: on ? '#FFFFFF' : '#3F444C', pick: () => this.setState({ view: id }) };
    });
    const subjChips = [['all', 'All subjects', '#8A8F96']].concat(Object.keys(S).map((k) => [k, S[k].name + ' ' + S[k].level, S[k].color])).map(([id, name, dot]) => {
      const on = st.subj === id;
      return { name, dot, pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14161A', bd: on ? '#14161A' : '#CFCFC6', pick: () => this.setState({ subj: id }) };
    });

    // ----- outline -----
    const inSubj = this.L.filter((x) => x.subj === l.subj).sort((a, b) => a.so - b.so || a.day - b.day);
    const secs = [];
    inSubj.forEach((x) => { let g = secs.find((y) => y.name === x.sec); if (!g) { g = { name: x.sec, so: x.so, items: [] }; secs.push(g); } g.items.push(x); });
    secs.sort((a, b) => a.so - b.so);
    const ICON = { done: 'M5 12l5 5 9-10', now: 'M8 5.5v13l11-6.5z', next: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' };
    const outline = secs.map((g) => ({ name: g.name, items: g.items.map((x) => {
      const k = kind(x), on = x.id === l.id;
      const sk = k === 'past' ? 'done' : k;
      return { title: x.title, meta: (x.status === 'next' ? x.when.replace('Premieres ', '') : (k === 'now' ? 'Up now' : 'Watched')) + ' · ' + this.dur(x.dur), icon: ICON[sk],
        iconBg: sk === 'done' ? '#DDF4F1' : (sk === 'now' ? '#F9A826' : '#F4F4EF'), iconFg: sk === 'done' ? '#0F766E' : (sk === 'now' ? '#14161A' : '#62676F'),
        pressed: on ? 'true' : 'false', bg: on ? '#F4F7FE' : '#FFFFFF', bd: on ? s.color : '#ECECE6', pick: () => this.load(x.id) };
    }) }));
    const doneN = inSubj.filter((x) => watched(x)).length;

    // ----- review cards -----
    const deck = this.decks()[l.subj];
    const kn = st.known[l.subj] || 0;
    const left = deck.length - kn;
    const cardI = deck.length ? st.ci % deck.length : 0;
    const allNotes = Object.keys(st.notes).reduce((a, k) => a + st.notes[k].length, 0);
    const dueAll = Object.keys(this.decks()).reduce((a, k) => a + Math.max(0, this.decks()[k].length - (st.known[k] || 0)), 0);
    let mins = 0;
    this.L.forEach((x) => { if (x.day >= -7 && x.status !== 'next') mins += (st.watched[x.id] ? x.dur : (x.id === l.id ? t : x.dur * x.prog / 100)) / 60; });

    const ccOn = st.cc;
    const capLine = curLine >= 0 ? l.tr[curLine] : null;
    return {
      statWatched: Math.floor(mins / 60) + ' h ' + Math.round(mins % 60) + ' m', statNotes: String(allNotes), statDue: String(dueAll),
      q: st.q, setQ: (e) => this.setState({ q: e.target.value }), subjChips,
      pBg: s.color, pImg: l.img, kbCls: st.playing ? 'kb' : '', pSubject: s.name + ' · ' + s.level,
      pStatus: statusText, pLive: isNext && l.live, pStatusBg: isNext ? (l.live ? '#14161A' : 'rgba(255,255,255,0.92)') : (watched(l) ? 'rgba(255,255,255,0.92)' : '#F9A826'), pStatusFg: isNext && l.live ? '#FFFFFF' : '#14161A',
      title: l.title, pTitleFg: s.titleFg, pHostLine: l.host.name + (isNext ? ' · preview available' : ' · ' + this.dur(l.dur)),
      showBigPlay: !st.playing, playing: st.playing, paused: !st.playing, playAria: st.playing ? 'Pause' : (isNext ? 'Play the preview' : 'Play the lesson'),
      togglePlay: () => this.setState({ playing: !st.playing, t: t >= dur ? 0 : t }),
      back10: () => this.setState({ t: Math.max(0, t - 10) }),
      showCaption: ccOn && !!capLine && (st.playing || t > 0), caption: capLine ? capLine[2] : '',
      pct: (t / dur * 100).toFixed(2), timeText: this.mmss(t) + ' / ' + this.mmss(dur) + (isNext ? ' preview' : ''),
      durMax: String(dur), tInt: String(Math.floor(t)), seek: (e) => this.setState({ t: Number(e.target.value) || 0 }),
      ticks: l.ch.slice(1).map((c) => ({ left: (Math.min(c[0], dur) / dur * 100).toFixed(2) })),
      speedText: st.speed + '×', speedAria: 'Playback speed ' + st.speed + 'x, change', cycleSpeed: () => { const sp = [0.75, 1, 1.25, 1.5]; this.setState({ speed: sp[(sp.indexOf(st.speed) + 1) % sp.length] }); },
      ccPressed: ccOn ? 'true' : 'false', ccBg: ccOn ? '#FFFFFF' : 'transparent', ccFg: ccOn ? '#14161A' : '#FFFFFF', ccBd: ccOn ? '#FFFFFF' : '#3F444C', toggleCc: () => this.setState({ cc: !ccOn }),
      chapters: l.ch.map((c, i) => ({ time: this.mmss(c[0]), label: c[1], pressed: i === chIdx ? 'true' : 'false', bg: i === chIdx ? s.tint : '#FFFFFF', bd: i === chIdx ? s.color : '#E2E2DA', tc: s.ink, pick: () => this.setState({ t: Math.min(c[0], dur), playing: true }) })),
      pInk: s.ink, pColor: s.color, pTint: s.tint, crumbSubject: s.name + ' ' + s.level, crumbPath: s.path, crumbSection: l.sec,
      hostImg: l.host.img, hostName: l.host.name, hostRole: l.host.role,
      metaLine: (isNext ? l.when + ' · ' + this.dur(l.dur) : l.when) + ' · ' + l.tr.length + (isNext ? ' preview lines' : ' transcript lines'),
      isNext, remindPressed: st.remind[l.id] ? 'true' : 'false', remindLabel: st.remind[l.id] ? '✓ Reminder set' : (l.live ? 'Remind me and add to Today' : 'Remind me when it premieres'),
      remindBg: st.remind[l.id] ? '#DDF4F1' : '#FFFFFF', remindFg: st.remind[l.id] ? '#115E59' : '#14161A', remindBd: st.remind[l.id] ? '#8FD3C9' : '#CFCFC6',
      toggleRemind: () => { const r = Object.assign({}, st.remind); r[l.id] = !r[l.id]; this.setState({ remind: r, msg: r[l.id] ? 'Reminder set. It will also appear in Today.' : '' }); },
      canMark: !isNext, markLabel: watched(l) ? '✓ Watched' : 'Mark as watched',
      markWatched: () => { const w = Object.assign({}, st.watched); w[l.id] = true; this.setState({ watched: w, msg: 'Marked as watched. Want it counted as evidence? Add a note and switch on “Count as evidence”.' }); },
      nowText: this.mmss(t),
      offlineLabel: 'Save for offline',
      saveOffline: () => this.setState({ msg: 'Saved for offline: video, transcript and resources (demo). Useful when the connection drops.' }),
      hasIdeas: l.ideas.length > 0, ideas: l.ideas, statusMsg: st.msg,
      tabs, tabTranscript: st.tab === 'transcript', tabNotes: st.tab === 'notes', tabResources: st.tab === 'resources', tabComments: st.tab === 'comments',
      tq: st.tq, setTq: (e) => this.setState({ tq: e.target.value }), tqCount, isPreview: isNext, lines,
      draft: st.draft, setDraft: (e) => this.setState({ draft: e.target.value }),
      addNote: () => { const txt = st.draft.trim(); if (!txt) return; const all = Object.assign({}, st.notes); all[l.id] = (all[l.id] || []).concat([[Math.floor(t), txt]]); this.setState({ notes: all, draft: '' }); },
      noNotes: myNotes.length === 0, noteList,
      evPressed: st.evidence ? 'true' : 'false', evLabel: st.evidence ? '✓ Notes count as evidence' : 'Count my notes as evidence',
      evBg: st.evidence ? '#DDF4F1' : '#FFFFFF', evFg: st.evidence ? '#115E59' : '#3F444C', evBd: st.evidence ? '#8FD3C9' : '#CFCFC6', toggleEvidence: () => this.setState({ evidence: !st.evidence }),
      resGroups, refs: l.refs,
      commentNote: isNext ? 'Comments open fully when the lesson premieres. Questions you post now go to the tutor first.' : 'Visible to your learning circle, your guide and your parent. Be kind and be specific.',
      cdraft: st.cdraft, setCdraft: (e) => this.setState({ cdraft: e.target.value }),
      postComment: () => { const txt = st.cdraft.trim(); if (!txt) return; const all = Object.assign({}, st.comments); all[l.id] = (all[l.id] || []).concat([['Amani (you)', 'You', 'Just now', txt, 0, Math.floor(t)]]); this.setState({ comments: all, cdraft: '', sort: 'new' }); },
      sorts: [['top', 'Top'], ['new', 'Newest']].map(([id, label]) => { const on = st.sort === id; return { label, pressed: on ? 'true' : 'false', bg: on ? '#14161A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#3F444C', bd: on ? '#14161A' : '#E2E2DA', pick: () => this.setState({ sort: id }) }; }),
      noComments: raw.length === 0, comments,
      views, groups, noCards: pool.length === 0,
      outlineTitle: s.name + ' path · ' + s.path, outlinePct: Math.round(doneN / inSubj.length * 100), outlineMeta: doneN + ' of ' + inSubj.length + ' lessons watched · placed at Level ' + s.level.slice(1), outline,
      cardMeta: left > 0 ? left + ' of ' + deck.length + ' due · ' + s.name : 'All done · ' + s.name,
      hasCard: left > 0, deckDone: left === 0,
      cardBg: st.back ? '#FFFFFF' : s.color, cardFg: st.back ? '#14161A' : s.titleFg,
      cardSide: st.back ? 'Answer' : 'Question', showFront: !st.back, showBack: st.back,
      cardFront: deck[cardI] ? deck[cardI][0] : '', cardBack: deck[cardI] ? deck[cardI][1] : '',
      flipHint: st.back ? 'Tap to see the question again' : 'Tap to flip', flipAria: st.back ? 'Show question' : 'Show answer', flip: () => this.setState({ back: !st.back }),
      again: () => this.setState({ ci: st.ci + 1, back: false, again: st.again + 1 }),
      gotIt: () => { const k = Object.assign({}, st.known); k[l.subj] = Math.min(deck.length, (k[l.subj] || 0) + 1); this.setState({ known: k, ci: st.ci + 1, back: false }); },
      resetDeck: () => { const k = Object.assign({}, st.known); k[l.subj] = 0; this.setState({ known: k, ci: 0, back: false }); },
      dots: deck.map((d, i) => ({ bg: i < kn ? '#0F766E' : (i === kn ? s.color : '#ECECE6') }))
    };
  }
}
return Component;
});

DC.mount("Notes");
</script>
