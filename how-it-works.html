@keyframes dv{0%{top:-4px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 4px);opacity:0}}
@keyframes dh{0%{left:-4px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 4px);opacity:0}}
@keyframes dhr{0%{left:calc(100% - 4px);opacity:0}15%{opacity:1}85%{opacity:1}100%{left:-4px;opacity:0}}
.antv{animation:antv .8s linear infinite}@keyframes antv{to{background-position:0 12px}}
.anth{animation:anth .8s linear infinite}@keyframes anth{to{background-position:-12px 0}}
.ripple{position:absolute;inset:-3px;border-radius:15px;border:2px solid;pointer-events:none;animation:ripple 1.6s ease-out infinite}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dv,.dvu,.dh,.dhr{display:none}.antv,.anth,.antvu,.anthr,.ripple,.pop,.unfold,.lyfill,.lyin{animation:none}.lnode:hover{transform:none}}

.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}
.hw-card{transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .45s ease,box-shadow .45s ease,background-color .45s ease,border-color .45s ease;transform-origin:50% 100%}.hw-in{transition:opacity .35s ease}.hw-back:hover{border-color:#3A4049!important}.hw-stack:focus-visible{outline:2px solid #7DB4FF;outline-offset:8px;border-radius:28px}.hw-pill{transition:flex-grow .45s ease,background-color .35s ease,border-color .35s ease,color .35s ease}.hw-pill:hover{border-color:#7DB4FF!important}.hw-btn:hover{background:#1A1D20!important}.hw-bar{transform-origin:0 50%;animation:hw-fill 3.2s linear both}@keyframes hw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}.hw-pop{animation:hw-pop .5s cubic-bezier(.2,.8,.2,1) both}@keyframes hw-pop{from{opacity:0;transform:translateY(8px)}}.hw-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media (max-width:640px){.hw-lbl{display:none}.hw-pilln{display:none}}@media (prefers-reduced-motion:reduce){.hw-card,.hw-in,.hw-pill{transition:none}.hw-bar,.hw-pop{animation:none}}
.dk-card{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease,box-shadow .4s ease,background-color .4s ease;transform-origin:50% 100%}.dk-in{transition:opacity .3s ease}.dk-back:hover{box-shadow:0 16px 30px -20px rgba(20,22,26,.5)!important}.dk-stack:focus-visible{outline:2px solid #7FA2EE;outline-offset:8px;border-radius:26px}.dk-ix{transition:background-color .2s ease,border-color .2s ease}.dk-ix:hover{background:#FFFFFF!important;border-color:#CFCFC6!important}.dk-dot{transition:width .3s ease,background-color .3s ease}.dk-btn:hover{background:#F4F4EF!important}.dk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[data-theme="dark"] .dk-btn{background:#22262D!important;border-color:#3A4049!important;color:#EDEDE8!important}@media (max-width:760px){.dk-index{display:none!important}}@media (max-width:520px){.dk-lbl{display:none}.dk-btn{padding:0 12px!important}}@media (prefers-reduced-motion:reduce){.dk-card,.dk-in,.dk-dot{transition:none}}
</style>

0px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>

<main id="top">
<section aria-labelledby="hiw-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 96px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 18px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">How Vachuo works</span>
<h1 id="hiw-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(40px, 5.4vw, 76px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; max-width: 980px; text-wrap: balance">How Vachuo helps a learner, and when it steps back.</h1>
<p style="margin: 0; padding-left: 14px; border-left: 3px solid #F9A826; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(20px, 1.9vw, 26px); font-style: italic; line-height: 1.3; color: #1E40AF">{{svT.slogan}}</p>
<p style="margin: 0; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.55; color: #3F444C; max-width: 760px; text-wrap: pretty">A tutor can answer questions. Learning also needs questions of the learner’s own, people and places to learn from, rest, and a record she owns. Here is the loop that serves her, the columns it stands on, the engine underneath, and how it reaches beyond one family.</p>
<nav aria-label="On this page" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><a href="#moat" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; text-decoration: none">1 · The loop</a><a href="#layers" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; text-decoration: none">2 · The full system</a><a href="#cap" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; text-decoration: none">3 · The CAP engine</a><a href="#scale" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; text-decoration: none">4 · Beyond homeschooling</a></nav>
</section>

<section id="moat" aria-labelledby="moat-title" style="background: #111315; color: #EDEDE8">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 44px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 900px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7DB4FF">Why a tutor is not enough</span>
<h2 id="moat-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(36px, 4.6vw, 64px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">A tutor answers. A learner needs more.</h2>
<p style="margin: 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; color: #C9CCD0; text-wrap: pretty">Every child will soon have an AI tutor. What she also needs is a loop that starts with her question, brings in real people and places, ends in rest, and measures success by one thing: a learner taking the lead more.</p>
</div>

ius: 24px; padding: 28px 30px 26px; display: flex; flex-direction: column; overflow: hidden"><span aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; height: 4px; background: {{c.ac}}"></span><div class="hw-in" style="opacity: {{c.cop}}; flex: 1; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(56px, 6vw, 84px); line-height: 0.82; font-weight: 600; letter-spacing: -0.03em; color: {{c.ac}}">{{c.n}}</span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-family: Inter, system-ui, sans-serif"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.ownFg}}; background: {{c.ownBg}}; padding: 4px 10px; border-radius: 999px">{{c.owner}}</span><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #8A8F96">Step {{c.n}} of 13</span></span></div><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3vw, 42px); line-height: 1.05; font-weight: 600; letter-spacing: -0.015em; color: #FFFFFF">{{c.name}}</h3><p style="margin: 0; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.5; color: #C9CCD0">{{c.cap}}</p><div style="margin-top: auto; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid #2A2E33; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.ac}}">On Amani’s ratios</span><span style="font-size: 16.5px; line-height: 1.5; color: #EDEDE8">{{c.ex}}</span></div><template data-if="{{c.timer}}"><div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #2A2E33; overflow: hidden"><template data-if="{{c.tA
