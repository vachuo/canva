le="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px"><template data-for="{{sfChips}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer">{{c.label}}</button></template></div><template data-if="{{sfBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{sfBarWho}}:</span><span class="vq-t">{{sfBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{sfBarX}}">×</button></div></template><div style="display: flex; gap: 8px"><label for="sf-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{sfPh}}</label><input id="sf-input" value="{{sfDraft}}" onChange="{{sfSet}}" onKeyDown="{{sfInKey}}" placeholder="{{sfPh}}" autocomplete="off" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" aria-label="Send to Socrates" onClick="{{sfSend}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div><span style="font-size: 12px; line-height: 1.45; color: #62676F">{{sfNote}} <a href="#access" onClick="{{sfClose}}" style="color: #1E40AF; font-weight: 600">Request early access</a></span></div></section></template></div>

<section aria-labelledby="deschool-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; padding: clamp(24px, 4vw, 40px); border-radius: 24px; background: #DDF4F1">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #115E59">Learner-led by design</span>
<h2 id="deschool-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(28px, 3vw, 40px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; color: #134E4A; text-wrap: balance">Built for the learner to lead.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #134E4A; text-wrap: pretty">Too often, school teaches children to wait: for the bell, for permission, for someone to tell them what to learn next. Vachuo is built the other way round. It keeps seven promises, among them: she can question anything Vachuo thinks about her, her open time is never watched, learning out in the world counts, her record belongs to her, and success means a learner taking the lead more!</p>
</div>
<a href="loop.html" style="flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 600; text-decoration: none">Read our seven limits<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<img src="assets/img/f2d98c98ce8744c8f63eeb876bbf6246.svg" alt="" style="flex: none; align-self: flex-end; height: 190px; width: auto; margin-bottom: calc(-1 * clamp(24px, 4vw, 40px))">
</div>
</section>

<section aria-labelledby="learners-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="position: relative; overflow: hidden; border-radius: 28px; background: #1D4ED8; color: #FFFFFF; display: flex; flex-wrap: wrap; align-items: flex-end">
<span aria-hidden="true" style="position: absolute; width: 760px; height: 760px; right: -260px; top: -520px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.28)"></span>
<span aria-hidden="true" style="position: absolute; width: 1300px; height: 1300px; left: -560px; top: -980px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; left: -20%; right: -20%; bottom: -120px; height: 220px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: relative; flex: 1 1 340px; min-width: 0; align-self: flex-start; box-sizing: border-box; padding: clamp(28px, 4vw, 56px); display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #DCE6FD">Every child already knows how to learn</span>
<h2 id="learners-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(32px, 3.6vw, 50px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Every child, every continent. Already a learner.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #DCE6FD; text-wrap: pretty">From Nairobi to Chicago, Mumbai to London, every child starts somewhere different. Vachuo asks where she wants to go, finds the people and places that can show her, and steps back when she can go on alone.</p>
<a href="today.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 600; text-decoration: none">See Amani’s day<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
<div style="position: relative; flex: 1 1 100%; min-width: 0; height: clamp(220px, 26vw, 380px); box-sizing: border-box; padding: 8px 16px 18px; display: flex; justify-content: center; align-items: flex-end">
<img src="assets/img/80b06694a121b52e5cf0510bfda36f44.svg" alt="Illustrated learners from all seven continents, in everyday, formal and traditional dress" style="display: block; max-height: 100%; max-width: 100%; width: auto; height: auto">
</div>
</div>
</section>

<section id="people" aria-labelledby="people-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: flex-start">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #115E59" title="Real Intelligence: building where education meets AI, bringing intelligence closer to people than artificial intelligence is to machines">REAL</span>
<h2 id="people-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 54px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Children arrive curious. School teaches them to wait.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F444C; text-wrap: pretty">Every toddler teaches herself to speak. Curiosity doesn’t need to be manufactured; it needs to be left alone and given somewhere to go. So the question isn’t why an 8-year-old should care about fractions. It’s this:</p>
<div style="display: flex; align-items: center; gap: 16px">
<img src="assets/img/ee935388d47b6bf0d509293d4cba8892.svg" alt="" style="flex: none; width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: #DDF4F1">
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; color: #115E59; text-wrap: balance">“What does an 8-year-old already care about that needs fractions?”</p>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F444C; text-wrap: pretty">For Amani it was a chapati recipe for forty people. Start there, and fractions stop being a subject and become a tool. Children learn best when learning starts from their own world.</p>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px" id="people-board"><div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="display: inline-flex; align-items: center; gap: 10px; font-family: Inter, system-ui, sans-serif; font-size: 18px; font-weight: 600"><span class="pp-x" style="opacity: {{ppXop}}">Teacher</span><svg class="pp-arrow {{ppArrowCls}}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9E95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span style="color: #115E59">Guide</span></span><span style="flex: 1 1 200px; font-size: 15.5px; line-height: 1.5; color: #3F444C">From explaining to noticing. The adult’s job changes; it doesn’t disappear.</span></div><div role="group" aria-label="See an adult’s day as" style="display: flex; gap: 6px"><button type="button" class="pp-tg" aria-pressed="{{ppIsThen}}" onClick="{{ppThen}}">A teacher’s day</button><button type="button" class="pp-tg gd" aria-pressed="{{ppIsNow}}" onClick="{{ppNow}}">A guide’s day</button></div><div style="display: flex; flex-direction: column; gap: 8px"><template data-for="{{ppBars}}" data-as="r"><div class="pp-bar"><b>{{r.t}}</b><span><i style="width: {{r.w}}; background: {{r.c}}"></i></span><em>{{r.w}}</em></div></template></div><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">{{ppBarNote}}</span></div></div>
</div>
<figure style="margin: 0; position: relative">
<img src="assets/img/4de2ed3f217056ab76b199a4501cab88.webp" alt="A boy learns at home with an AI tutor on screen while a human guide joins by video" style="display: block; width: 100%; aspect-ratio: 21 / 9; object-fit: cover; border-radius: 24px">
<figcaption style="position: absolute; left: 16px; bottom: 16px; font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #14161A">A tutor that asks · a guide who notices · a learner who leads</figcaption>
</figure>
<div style="border-radius: 24px; background: #14161A; color: #EDEDE8; padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 16px; color: #A3A8AE">We don’t sell <span style="color: #EDEDE8; text-decoration: line-through; text-decoration-color: #F9A826">“No teachers.”</span> We sell this:</p>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 3.2vw, 44px); line-height: 1.12; letter-spacing: -0.015em; font-weight: 500; text-wrap: balance">AI instructs and coaches. People and peers hold the conversation. <span style="color: #F9A826">The learner decides where to go.</span></p>
<p style="margin: 0; font-size: 15px; color: #A3A8AE">Good teaching mixes three things: clear explanation, patient coaching and real conversation. The learner steers all three.</p>
</div>
</section>

<section id="schole" aria-labelledby="schole-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center; padding: clamp(24px, 4vw, 48px); border-radius: 28px; background: #FBF7EE; border: 1px solid #EFE6D2">
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #92400E">Open time</span>
<h2 id="schole-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(32px, 3.6vw, 50px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Room to think is part of learning.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F444C; text-wrap: pretty">Children learn a great deal when nobody is teaching them: reading for fun, building something, wandering outside, helping at home, or simply thinking. That needs time nobody has booked. A child’s week should not be all work.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F444C; text-wrap: pretty">So the open part of Amani’s week is hers. Vachuo never schedules over it, and never tracks, scores or reports it, not even to her parents.</p>
<a href="today.html" style="align-self: flex-start; font-size: 15px; font-weight: 600">See how Today protects it</a>
</div>
<figure class="wkx" style="flex: 1 1 420px; min-width: 0; margin: 0" aria-label="Amani’s week, part by part. Choose a kind of time or a part of the week to learn more."><div class="wk-f" role="group" aria-label="Show one kind of time"><template data-for="{{wkChips}}" data-as="c"><button type="button" class="wk-chip" aria-pressed="{{c.pressed}}" onClick="{{c.go}}"><i style="background: {{c.col}}"></i>{{c.name}}<b>{{c.n}}</b></button></template></div><div style="display: flex; flex-direction: column; gap: 6px"><div class="wk-row" aria-hidden="true"><span></span><template data-for="{{wkDays}}" data-as="d"><span style="text-align: center">{{d.d}}</span></template></div><template data-for="{{wkRows}}" data-as="r"><div class="wk-row" role="group" aria-label="{{r.label}}"><span>{{r.label}}</span><template data-for="{{r.cells}}" data-as="x"><button type="button" class="{{x.cls}}" style="--d: {{x.d}}; --g: {{x.g}}" aria-pressed="{{x.pressed}}" aria-label="{{x.aria}}" onClick="{{x.pick}}"><span class="{{x.bcls}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#134E4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3 M5 11h14v10H5z"/></svg></span></button></template></div></template></div><div class="wk-seg" aria-hidden="true"><template data-for="{{wkSeg}}" data-as="g"><span style="width: {{g.w}}; background: {{g.col}}; opacity: {{g.op}}"></span></template></div><div class="wk-card" role="status" aria-live="polite" style="--wkc: {{wkAc}}"><template data-if="{{wkEven}}"><div class="wk-in"><span class="wk-k">{{wkK}}</span><span class="wk-t">{{wkT}}</span><span class="wk-d">{{wkD}}</span></div></template><template data-if="{{wkOdd}}"><div class="wk-in"><span class="wk-k">{{wkK}}</span><span class="wk-t">{{wkT}}</span><span class="wk-d">{{wkD}}</span></div></template></div></figure>
</div>
</section>

<section id="parents" aria-labelledby="parents-title" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 860px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">For parents</span>
<h2 id="parents-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 54px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Not a dashboard. A thinking partner that hands the decisions back.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3F444C; text-wrap: pretty">Most homeschooling products show parents analytics. Vachuo’s Parent Copilot says what happened in plain words, suggests a next step, and leaves the judgment with you and your child.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<div style="flex: 1 1 280px; min-width: 0; border-radius: 22px; background: #F4F4EF; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What parents get today</span><span style="padding: 2px 8px; border-radius: 999px; background: #ECECE6; color: #3F444C; font-size: 11.5px; font-weight: 600">Sample figures</span></span>
<img src="assets/img/9fc3c61854cc5c01193c9cd4234c440a.webp" alt="A worried parent reads printouts while her daughter works on a laptop" style="display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 14px">
<dl style="margin: 0; display: flex; flex-direction: column; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 16px; color: #3F444C">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #DCDCD3"><dt>Math</dt><dd style="margin: 0">82%</dd></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #DCDCD3"><dt>English</dt><dd style="margin: 0">91%</dd></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #DCDCD3; border-bottom: 1px solid #DCDCD3"><dt>Lessons completed</dt><dd style="margin: 0">17</dd></div>
</dl>
<p style="margin: auto 0 0; font-size: 16px; line-height: 1.5; color: #62676F">A typical dashboard, with just numbers. It says what happened, not what it means or what to do next.</p>
</div>
<div style="flex: 2 1 480px; min-width: 0; border-radius: 22px; border: 1.5px solid #1D4ED8; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">What a Parent Copilot says</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><img src="assets/img/ee935388d47b6bf0d509293d4cba8892.svg" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #E4ECFD"><span style="font-size: 16px; font-weight: 600">Bob, 9</span><span style="font-size: 12px; font-weight: 600; color: #1E40AF; background: #E4ECFD; padding: 3px 10px; border-radius: 999px">Nothing needs you</span></div>

    const G = 'cccccoo' + 'ocooopo' + 'ooooooo', DAY = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], PART = ['Morning', 'Afternoon', 'Evening'];
    const K = { c: { name: 'Commitments she planned', col: '#1D4ED8', d: 'Short blocks Amani chose on Sunday evening with her guide. She can move, swap or drop any of them.' },
      p: { name: 'Out in the world, by choice', col: '#F9A826', d: 'Real places and real people, found through Connects. It counts as learning, and it goes on her record only if she adds it.' },
      o: { name: 'Open time: hers, never counted', col: '#2BB39B', d: 'Nothing can be booked here. Vachuo never records, scores or reports what she does with it, not even to her parents.' } };
    const A = { 0: ['Fractions with Socrates', 'Socrates asks, Amani works it out. Forty-five minutes, then a break.'], 1: ['Reading circle', 'Four children and a guide, talking about one story.'], 2: ['Chapati project', 'Her own question: how much flour does a recipe for forty people need?'],
      3: ['Story writing in Kiswahili', 'A story for her grandmother, drafted and revised.'], 4: ['Why does dough rise?', 'A kitchen experiment she chose, written up for her Portfolio.'], 8: ['Check-in with her guide', 'Twenty minutes to look back at the week and plan the next one.'],
      12: ['Her aunt’s market stall', 'Found through Connects. Real customers, real change, real fractions.'] };
    const cnt = { c: 0, p: 0, o: 0 }; for (const ch of G) cnt[ch]++;
    const bump = (o) => { Object.assign(W, o); W.v++; this.forceUpdate(); };
    const pick = (i) => { const t = G[i]; clearTimeout(this._wkT); bump({ sel: W.sel === i ? null : i, f: null, shake: t === 'o' && W.sel !== i ? i : -1 }); if (t === 'o') this._wkT = setTimeout(() => { W.shake = -1; this.forceUpdate(); }, 520); };
    const rows = PART.map((p, r) => ({ label: p, cells: DAY.map((d, k) => { const i = r * 7 + k, t = G[i], on = W.sel === i;
      return { cls: 'wkc ' + t + (W.f && W.f !== t ? ' dim' : ''), bcls: 'wkb' + (W.shake === i ? ' shake' : ''), pressed: on ? 'true' : 'false',
        d: (i * 40) + 'ms', g: ((i * 0.37) % 7).toFixed(2) + 's', aria: d + ' ' + p.toLowerCase() + ': ' + K[t].name + (A[i] ? ', ' + A[i][0] : ''), pick: () => pick(i) }; }) }));
    let k, t, dd, ac;
    if (W.sel !== null) { const s = G[W.sel], day = DAY[W.sel % 7], part = PART[Math.floor(W.sel / 7)].toLowerCase(); k = day + ' ' + part; ac = K[s].col;
      if (s === 'o') { t = 'Open time'; dd = 'Hers. Nothing can be booked here, and Vachuo never records what she does with it. Try another part of her week.'; }
      else { t = A[W.sel][0]; dd = A[W.sel][1] + ' ' + (s === 'c' ? 'She planned it herself and can move it.' : 'It goes on her record only if she adds it.'); } }
    else if (W.f) { k = cnt[W.f] + ' of 21 parts of her week'; t = K[W.f].name; dd = K[W.f].d; ac = K[W.f].col; }
    else { k = 'Amani’s week'; t = 'Two thirds of her week is open.'; dd = 'She planned the rest herself. Tap a colour or any part of the week to see what happens there.'; ac = '#14161A'; }
    return { wkDays: DAY.map((x) => ({ d: x.slice(0, 3) })), wkRows: rows,
      wkChips: ['c', 'p', 'o'].map((c) => ({ name: K[c].name, col: K[c].col, n: String(cnt[c]), pressed: W.f === c ? 'true' : 'false', go: () => bump({ f: W.f === c ? null : c, sel: null, shake: -1 }) })),
      wkSeg: ['c', 'p', 'o'].map((c) => ({ w: ((cnt[c] / 21) * 100).toFixed(1) + '%', col: K[c].col, op: W.f && W.f !== c ? '0.25' : '1' })),
      wkK: k, wkT: t, wkD: dd, wkAc: ac, wkEven: W.v % 2 === 0, wkOdd: W.v % 2 === 1 };
  }
  renderVals() { return Object.assign(this.themeVals(), this.sfVals(), this.pvVals(), this.ppVals(), this.siteVals(), this.pageVals(), this.soVals(), this.trVals(), this.wkVals()); }
  soVals() { return { signedOut: !!this.state.signedOut, closeSignedOut: () => this.setState({ signedOut: false }) }; }
  pageVals() {
    const step = this.state.step;
    const caps = ['Start from the learner’s own question: what does she want to figure out?', 'Find where the learner really is, not where the grade says.', 'Build the next path from their goals and their gaps.', 'Explain it in the way that suits this learner.', 'Watch how they work, not just what they answer.', 'Check understanding with fresh, well-made items.', 'Name the exact misconception behind an error.', 'Repair the gap with targeted practice.', 'Confirm the repair held, days later.', 'Update what Vachuo believes, and how sure it is.', 'Talk it over with the family, in plain words, with the decisions left to them.', 'Then start again, from her next question.', 'Stop. Open time is hers: never scheduled over, never tracked.'];
    const names = ['Wonder', 'Diagnose', 'Plan', 'Teach', 'Observe, with consent', 'Assess', 'Diagnose misconception', 'Untangle', 'Reassess', 'Update learner model', 'Talk it over with the family', 'Repeat', 'Rest'];
    const loop = names.map((name, i) => {
      const human = name === 'Talk it over with the family' || name === 'Wonder' || name === 'Rest';
      const on = i === step;
      return { n: String(i + 1).padStart(2, '0'), name, c: human ? '#F9A826' : '#7DB4FF', bd: on ? (human ? '#F9A826' : '#7DB4FF') : (human ? '#8C6416' : '#2A2E33'), bg: on ? (human ? '#3A2A0E' : '#172E66') : '#1A1D20', tf: on ? 'translateY(-4px)' : 'none', cur: on ? 'step' : 'false', pick: () => this.setState({ step: i, playing: false }) };
    });
    const miniLoop = names.map((n, i) => ({ bg: i <= step ? (i === 10 || i === 0 || i === 12 ? '#0D9488' : '#1D4ED8') : '#DCDCD3' }));
    const green = '#1D4ED8', orange = '#0D9488', ink = '#3F444C';
    return Object.assign(this.layerVals(), {
      loop,
      miniLoop,
      loopNow: names[step],
      loopCaption: caps[step],
      loopPressed: this.state.playing ? 'true' : 'false',
      loopToggleLabel: this.state.playing ? 'Pause the loop' : 'Play the loop',
      loopToggle: () => this.setState({ playing: !this.state.playing }),
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value, emailErr: false }),
      emailKey: (e) => { if (e.key === 'Enter') this.join(); },
      joinList: () => this.join(),
      joinLabel: this.state.joined ? 'You’re on the list' : 'Request early access',
      emailInvalid: this.state.emailErr ? 'true' : 'false',
      emailBorder: this.state.emailErr ? '#F9A826' : '#7FA2EE',
      emailMsg: this.state.joined ? 'Thank you. This demo stores nothing, so no email will arrive.' : (this.state.emailErr ? 'Please enter a valid email address, like name@example.com.' : ''),
      headShadow: this.state.scrolled ? '0 10px 30px -18px rgba(20,22,26,0.35)' : 'none',
      showTop: this.state.showTop,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      scale: ['K → 12', '× every subject', '× every standard', '× every learning level', '× multiple pedagogies', '× millions of learners'],
      chain: ['Fractions', 'Equivalent fractions', 'Comparing fractions', 'Operations with fractions', 'Ratios', 'Proportions', 'Algebraic reasoning'].map((name, i, a) => ({ name, more: i < a.length - 1 })),
      causes: ['Conceptual misconception', 'Procedural mistake', 'Prerequisite gap', 'Language misunderstanding', 'Attention lapse', 'Calculation error', 'Guessing'],
      questions: ['What should I teach?', 'How should I teach it?', 'How difficult should it be?', 'Which modality?', 'What example?', 'When should I intervene?', 'When should I review?', 'When has mastery actually occurred?'],
      path: [
        { n: '01', name: 'Families', note: 'Homeschooling, where we start', h: '150px', bg: '#E4ECFD', fg: '#172F73' },
        { n: '02', name: 'Tutors', note: 'One tutor, many learners', h: '180px', bg: '#CFDDFB', fg: '#172F73' },
        { n: '03', name: 'Microschools', note: 'Small groups, one guide', h: '210px', bg: '#9DBDF6', fg: '#172F73' },
        { n: '04', name: 'Private schools', note: 'The whole school, run end to end', h: '240px', bg: '#1684E8', fg: '#0A1A3F' },
        { n: '05', name: 'Charter schools', note: 'Public accountability built in', h: '270px', bg: '#1D4ED8', fg: '#FFFFFF' },
        { n: '06', name: 'Governments', note: 'National scale', h: '300px', bg: '#14161A', fg: '#FFFFFF' }
      ]
    });
  }
}
return Component;
