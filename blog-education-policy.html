<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Education Policy Meets AI: Five Regimes Taking Shape</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">From Brussels to Beijing, governments are writing the rules for AI in schools. Their choices will shape what learners experience for a generation.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 14px; bottom: 10px; display: flex; justify-content: center; align-items: flex-end">
<img src="assets/img/80b06694a121b52e5cf0510bfda36f44.svg" alt="" style="display: block; height: 100%; width: auto; max-width: 96%; object-fit: contain; object-position: bottom">
</div>
</figure>

<p style="margin: 0">For most of the past decade, education ministries treated artificial intelligence as a topic for the computer-science syllabus. Generative AI changed that. Within three years, governments have moved from cautious guidance to binding law, mandated AI curricula and rewritten rules on children’s data. Five regimes are taking shape, and the differences between them will shape what learners experience for a generation.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">1. The European Union: risk-based regulation</h2>
<p style="margin: 0">The EU Artificial Intelligence Act (Regulation (EU) 2024/1689) is the most comprehensive attempt to regulate AI anywhere, and education is one of its explicit concerns. AI systems used to decide admission, evaluate learning outcomes, steer the learning process, assess the level of education a person should receive or monitor students during tests are classed as high-risk under Annex III. That brings obligations for risk management, data governance, human oversight, accuracy and documentation. Some practices are banned outright: since February 2025, AI systems that infer emotions in educational institutions have been prohibited except for medical or safety reasons.</p>
<p style="margin: 0">The timeline has moved. Under the Digital Omnibus on AI, adopted in June 2026 and in force since 27 July 2026 as Regulation (EU) 2026/1744, obligations for Annex III high-risk systems, education included, now apply from 2 December 2027 rather than August 2026. The same package softened the general AI-literacy duty into one where authorities support and facilitate organisations, and added prohibitions on AI systems that generate non-consensual intimate imagery or child sexual abuse material. The direction of travel is unchanged: AI that shapes a child’s educational path will be regulated as consequential infrastructure.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">2. The United States: promotion, choice and privacy</h2>
<p style="margin: 0">The United States has emphasised adoption and parental choice over up-front regulation. An executive order of April 2025, “Advancing Artificial Intelligence Education for American Youth”, directed federal agencies to promote AI literacy and teacher training. Meanwhile the school-choice movement has expanded dramatically, with universal or near-universal education savings accounts in a growing number of states and a federal tax-credit scholarship programme, enacted in 2025, due to begin in 2027. Together these shift purchasing power toward families and, indirectly, toward alternative providers, AI-supported ones among them.</p>
<p style="margin: 0">Privacy remains the main federal regulatory lever. Amendments to the Children’s Online Privacy Protection Act rule, finalised in 2025, became fully enforceable in April 2026. They require separate parental consent for many disclosures to third parties and limit how long children’s data may be kept. State laws on student data and AI add a patchwork on top.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">3. China: AI as national curriculum</h2>
<p style="margin: 0">China has moved fastest to make AI a compulsory part of schooling. Ministry of Education guidance in 2025 set out AI education across primary and secondary levels, and Beijing required schools to provide at least eight hours of AI instruction a year from autumn 2025. The model is top-down and ambitious, binding AI literacy to national technology strategy.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">4. The Gulf: AI from kindergarten</h2>
<p style="margin: 0">The United Arab Emirates announced that AI would be taught as a subject at every stage of public education, from kindergarten to grade 12, beginning in the 2025–26 school year. Like China, the UAE treats AI fluency as an economic priority. Unlike China, it is also one of the fastest-growing international-school markets, so its AI policy interacts with a large private sector.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">5. Africa: strategy, reform and data protection</h2>
<p style="margin: 0">In July 2024 the African Union adopted a Continental Artificial Intelligence Strategy that emphasises human capital, skills and responsible use. National policy is moving alongside major curriculum reform. Kenya, for example, is completing its transition from the 8-4-4 system to competency-based education, whose first cohort entered senior school in 2026. Its Data Protection Act of 2019 requires that children’s data be processed with parental consent and in the child’s best interests. Across much of the continent, however, the capacity to enforce rules and to evaluate AI tools lags behind ambition.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The global layer</h2>
<p style="margin: 0">Above national regimes sits international guidance. UNESCO’s 2023 Guidance for Generative AI in Education and Research urged a human-centred approach and suggested a minimum age of 13 for using generative AI tools in the classroom. Its 2024 AI competency frameworks for students and teachers describe what people should know and be able to do. None of this is binding, but it shapes procurement and teacher training in many countries.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">The question is no longer whether AI will be in schools, but whose rules will govern it.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Six questions every policymaker must answer</h2>
<p style="margin: 0">Across these regimes the same questions recur, and answering them well matters more than the choice of model. What evidence of efficacy should an AI tool have to show before it is used with children at scale? Who is accountable when an AI system misjudges a child’s level or misdiagnoses a difficulty? How are children’s data, and the inferences drawn from them, protected, and who owns them? What role do teachers and guides play when instruction is partly automated? How do public systems recognise learning that happens outside them, at home, online or in the community? And how will credentials earned in one system be recognised in another?</p>
<p style="margin: 0">Vachuo is designed to meet the strictest of these regimes by default: contestable inferences, human oversight, no emotion recognition, minimal data and portable records. The policies that will age best, we suspect, are those that protect children while leaving room for learning to happen in more places than the school.</p>
