<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo internal · Ops console</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Ops">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<nav aria-label="Ops console" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px"><a href="ops.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><span style="align-self: flex-start; margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 12px; font-weight: 600">Trust and safety · staff only</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Ops console</div><template data-for="{{tabs}}" data-as="t"><button type="button" aria-current="{{t.cur}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer"><span style="flex: 1">{{t.label}}</span><template data-if="{{t.hasN}}"><span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700; text-align: center">{{t.n}}</span></template></button></template></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Internal tools</div><a href="ops.html" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #1E40AF; background: #E4ECFD">Ops console</a><a href="admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Admin dashboard</a><a href="super-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Super admin</a><a href="blog-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Blog admin</a><a href="studio.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Content studio</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #ECECE6; color: #3F444C; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">M</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Mwende</span><span style="font-size: 12.5px; color: #62676F">Trust and safety lead</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="ops.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 22px">
<p style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FEF9EE; border: 1px solid #F3DDB0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Separate app and login, never linked from the customer product. Every action here is written to the audit log with your name. Demo data.</p>

<template data-if="{{isMod}}">
<section aria-labelledby="o-mod" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 id="o-mod" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Moderation queue</h1><span style="font-size: 13px; color: #62676F">{{mqCount}}</span></div><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C; max-width: 760px">Items reach this queue after a parent or guide has already seen them, or when a safety check stops something before anyone sees it. Children’s contact details stay hidden here too.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px"><template data-for="{{mqKpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div><div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end"><label style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #62676F">Search<input value="{{mqQ}}" onChange="{{mqSetQ}}" placeholder="Words, account or case number" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #62676F">Sort<select value="{{mqSort}}" onChange="{{mqSetSort}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><option value="sla">Due soonest</option><option value="new">Newest first</option><option value="prio">Highest priority</option></select></label><button type="button" onClick="{{mqReset}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Clear filters</button></div><div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 74px; font-size: 12.5px; font-weight: 600; color: #62676F">Type</span><template data-for="{{mqTypes}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div><div role="group" aria-label="Priority" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 74px; font-size: 12.5px; font-weight: 600; color: #62676F">Priority</span><template data-for="{{mqPrios}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div><div role="group" aria-label="Status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 74px; font-size: 12.5px; font-weight: 600; color: #62676F">Status</span><template data-for="{{mqStatuses}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div><div role="group" aria-label="Age band" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 74px; font-size: 12.5px; font-weight: 600; color: #62676F">Age band</span><template data-for="{{mqAges}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div><div role="group" aria-label="Assigned" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 74px; font-size: 12.5px; font-weight: 600; color: #62676F">Assigned</span><template data-for="{{mqOwners}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}} <span style="opacity: 0.7">{{c.n}}</span></button></template></div></div>
<template data-if="{{mqHasSel}}"><div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; background: #14161A; color: #FFFFFF; font-size: 14px"><span style="flex: 1 1 200px">{{mqSelLine}}</span><button type="button" onClick="{{mqBulkAssign}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Assign to me</button><button type="button" onClick="{{mqBulkResolve}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Resolve as allowed</button><button type="button" onClick="{{mqBulkClear}}" style="min-height: 38px; padding: 0 12px; border: none; background: transparent; color: #AFD0FF; font-size: 13px; cursor: pointer">Clear selection</button></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
<div style="flex: 3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 8px"><template data-for="{{mqRows}}" data-as="m"><div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid {{m.bd}}"><label style="flex: none; display: flex; align-items: flex-start; padding-top: 2px"><input type="checkbox" checked="{{m.checked}}" onChange="{{m.check}}" aria-label="{{m.aria}}" style="width: 20px; height: 20px; accent-color: #1D4ED8"></label><button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 0; border: none; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #62676F">{{m.id}}</span><span style="padding: 2px 8px; border-radius: 999px; background: {{m.kBg}}; color: {{m.kFg}}; font-size: 11.5px; font-weight: 700">{{m.kind}}</span><span style="padding: 2px 8px; border-radius: 999px; background: {{m.pBg}}; color: {{m.pFg}}; font-size: 11.5px; font-weight: 700">{{m.prio}}</span><span style="font-size: 12px; color: #62676F">{{m.age}} · {{m.owner}}</span><span style="margin-left: auto; font-size: 12px; font-weight: 600; color: {{m.slaFg}}">{{m.sla}}</span></span><span style="font-size: 15px; font-weight: 600; line-height: 1.35">{{m.title}}</span><span style="font-size: 12.5px; color: #3F444C">{{m.source}} · {{m.at}} · {{m.status}}</span></button></div></template><template data-if="{{mqNone}}"><p style="margin: 0; padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 14px; color: #3F444C">Nothing matches these filters.</p></template></div>
<aside aria-label="Case" style="flex: 2 1 360px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><template data-if="{{mqHasCase}}"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #62676F">{{cs.id}} · {{cs.kind}} · {{cs.prio}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.25">{{cs.title}}</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{cs.detail}}</span><span style="font-size: 12.5px; color: #62676F">Policy: {{cs.policy}}</span><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Account lookup</span><template data-for="{{cs.facts}}" data-as="x"><span style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="color: #62676F">{{x.k}}</span><span style="font-weight: 600; text-align: right">{{x.v}}</span></span></template></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Timeline</span><template data-for="{{cs.timeline}}" data-as="t"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.4"><span style="flex: none; width: 92px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #62676F">{{t.at}}</span><span>{{t.t}}</span></span></template></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #62676F">Reply template<select value="{{csMacro}}" onChange="{{csSetMacro}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><option value="">Choose a template…</option><option value="guardian">To the guardian: what happened and what we did</option><option value="host">To a host: remove contact details</option><option value="job">To an employer: listing does not meet the rules</option><option value="safeguard">Safeguarding handover note</option></select></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: #62676F">Internal note<textarea rows="3" value="{{csNote}}" onChange="{{csSetNote}}" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></textarea></label><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{csActions}}" data-as="x"><button type="button" onClick="{{x.go}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{x.bd}}; background: {{x.bg}}; color: {{x.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{x.t}}</button></template></div><a href="live-room.html" onClick="{{roomModerator}}" style="font-size: 13.5px; font-weight: 600">Open the live room silently as a moderator</a><span role="status" style="font-size: 13px; color: #115E59">{{csMsg}}</span></template><template data-if="{{mqNoCase}}"><p style="margin: 0; font-size: 14px; color: #3F444C">Pick a case to see the account, the timeline and the tools.</p></template></aside>
</div>
</section>
</template>

<template data-if="{{isUsers}}">
<section aria-labelledby="o-users" style="display: flex; flex-direction: column; gap: 14px">
<h1 id="o-users" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Accounts</h1>
