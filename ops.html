<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo internal · Ops console</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Ops">
<div data-theme="{{uiTheme}}" style="min-height: 100vh; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<header style="background: #14161A; color: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px">
<span style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px"><img src="assets/img/mark-white.png" alt="Vachuo" style="display: block; width: 34px; height: auto"><span style="font-size: 15px; font-weight: 600">Ops console</span><span style="padding: 2px 8px; border-radius: 6px; background: #F9A826; color: #14161A; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Staff only</span></span>
<nav aria-label="Ops" style="display: flex; flex-wrap: wrap; gap: 4px; margin-right: auto">
<template data-for="{{tabs}}" data-as="t"><button type="button" aria-current="{{t.current}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 14px; border: none; border-radius: 10px; background: {{t.bg}}; color: #FFFFFF; font-size: 14.5px; font-weight: 500; cursor: pointer">{{t.label}}</button></template>
</nav>
<button type="button" aria-label="Dark mode" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #3F444C; background: transparent; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<span style="font-size: 13px; color: #C9CCD1">Mwende · Trust and safety</span>
</div>
</header>

<main style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 40px) 72px; display: flex; flex-direction: column; gap: 22px">
<p style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #FEF9EE; border: 1px solid #F3DDB0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Separate app and login, never linked from the customer product. Every action here is written to the audit log with your name. Demo data.</p>

<template data-if="{{isMod}}">
<section aria-labelledby="o-mod" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 id="o-mod" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Moderation queue</h1><span style="font-size: 13px; color: #62676F">{{modCount}}</span></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C; max-width: 760px">Items reach this queue after a parent or guide has already seen them, or when a safety check stops something before anyone sees it. Children’s contact details stay hidden here too.</p>
<template data-for="{{mods}}" data-as="m">
<article style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="padding: 2px 9px; border-radius: 999px; background: {{m.kBg}}; color: {{m.kFg}}; font-size: 12px; font-weight: 700">{{m.kind}}</span><span style="font-size: 12.5px; color: #3F444C">{{m.source}} · {{m.at}}</span><template data-if="{{m.urgent}}"><span style="padding: 2px 9px; border-radius: 999px; background: #14161A; color: #FFFFFF; font-size: 12px; font-weight: 700">Safeguarding: within 1 hour</span></template></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.3">{{m.title}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{m.detail}}</span>
<span style="font-size: 12.5px; color: #62676F">Policy: {{m.policy}}</span>
<template data-if="{{m.open}}"><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{m.allow}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">{{m.allowLabel}}</button><button type="button" onClick="{{m.remove}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Remove</button><button type="button" onClick="{{m.escalate}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 700; cursor: pointer">Escalate to safeguarding lead</button></div></template>
<template data-if="{{m.closed}}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13.5px"><span style="padding: 2px 9px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-size: 12px; font-weight: 700">{{m.outcome}}</span><span style="color: #3F444C">Logged as Mwende · Tue 3 Nov</span><button type="button" onClick="{{m.undo}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; text-decoration: underline; cursor: pointer">Undo</button></div></template>
</article>
</template>
</section>
</template>

<template data-if="{{isUsers}}">
<section aria-labelledby="o-users" style="display: flex; flex-direction: column; gap: 14px">
<h1 id="o-users" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Accounts</h1>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px">
<label for="o-q" style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Search by name or account<input id="o-q" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Wanjiru, Nduta, Kilimani…" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400"></label>
<div role="group" aria-label="Account type" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{roles}}" data-as="r"><button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{r.name}}</button></template>
</div>
</div>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; background: #FFFFFF; border: 1px solid #E2E2DA">
<thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Name</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Type</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Account</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Consent</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Sign-in</th></tr></thead>
<tbody>
<template data-for="{{users}}" data-as="u"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{u.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6">{{u.role}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; color: #3F444C">{{u.account}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 2px 8px; border-radius: 999px; background: {{u.cBg}}; color: {{u.cFg}}; font-size: 12px; font-weight: 700">{{u.consent}}</span></td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; color: #3F444C">{{u.signin}}</td></tr></template>
</tbody></table></div>
<template data-if="{{noUsers}}"><p style="margin: 0; font-size: 14px; color: #3F444C">No accounts match.</p></template>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #3F444C">Learners under 13 have no login of their own: they sign in through their family account, so they are listed under it.</p>
</section>
</template>

<template data-if="{{isAi}}">
<section aria-labelledby="o-ai" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 id="o-ai" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">AI cost per school</h1><span style="font-size: 13px; color: #62676F">Last 7 days</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
<template data-for="{{evals}}" data-as="e"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">Evaluation · {{e.name}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600; line-height: 1">{{e.score}}</span><span style="font-size: 12.5px; color: #3F444C">{{e.note}}</span></div></template>
</div>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; background: #FFFFFF; border: 1px solid #E2E2DA">
<thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Account</th><th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Learners</th><th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Socrates turns</th><th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">AI cost</th><th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Per learner</th><th scope="col" style="text-align: right; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Safety flags</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA">Limit</th></tr></thead>
<tbody>
<template data-for="{{tenants}}" data-as="t"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{t.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; text-align: right; font-family: ui-monospace, monospace">{{t.learners}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; text-align: right; font-family: ui-monospace, monospace">{{t.turns}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; text-align: right; font-family: ui-monospace, monospace">{{t.cost}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; text-align: right; font-family: ui-monospace, monospace">{{t.per}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; text-align: right; font-family: ui-monospace, monospace">{{t.flags}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 2px 8px; border-radius: 999px; background: {{t.lBg}}; color: {{t.lFg}}; font-size: 12px; font-weight: 700">{{t.limit}}</span></td></tr></template>
</tbody></table></div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #3F444C">Every Socrates turn passes a policy check before and after the model. A flag means the check stopped or changed a reply; flagged chats go to the account’s guide and, for safeguarding, to the moderation queue.</p>
</section>
</template>

<template data-if="{{isSafety}}">
<section aria-labelledby="o-safe" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 id="o-safe" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Safety and evaluation</h1><span style="font-size: 13px; color: #62676F">Last 7 days · demo data</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px"><template data-for="{{safeKpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 14px"><div style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">What the safety checks stopped or changed</h2><template data-for="{{flagBars}}" data-as="b"><div style="display: grid; grid-template-columns: minmax(110px, 180px) 1fr 70px; align-items: center; gap: 10px; font-size: 13.5px"><span style="color: #3F444C">{{b.label}}</span><span aria-hidden="true" style="display: block; height: 12px; border-radius: 6px; background: #ECECE6"><span style="display: block; width: {{b.w}}%; height: 100%; border-radius: 6px; background: {{b.c}}"></span></span><span style="text-align: right; font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{b.v}}</span></div></template><span style="font-size: 12.5px; color: #62676F">Every Socrates reply passes a check before and after the model. Safeguarding flags reach a person within an hour.</span></div><div style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Evaluation set · last prompt change</h2><template data-for="{{evalRows}}" data-as="e"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 0; border-top: 1px solid #ECECE6; font-size: 14px"><span style="flex: 1 1 220px">{{e.name}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{e.score}}</span><span style="padding: 3px 9px; border-radius: 999px; background: {{e.bg}}; color: {{e.fg}}; font-size: 12px; font-weight: 700">{{e.verdict}}</span></div></template><span style="font-size: 12.5px; color: #62676F">A prompt change ships only when every gate passes. Run 412 · Tue 3 Nov · 1,240 cases.</span></div></div>
</section>
</template>

<template data-if="{{isAnalytics}}">
<section aria-labelledby="o-an" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 id="o-an" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 600">Analytics</h1><div role="group" aria-label="Period" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{periods}}" data-as="p"><button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: none; background: {{p.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{p.label}}</button></template></div></div>
<p style="margin: 0; font-size: 13.5px; color: #62676F">Counts only, never a child’s name. Demo data.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px"><template data-for="{{kpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div>
<div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Weekly active learners</h2><svg viewBox="0 0 600 140" role="img" aria-label="{{wauAria}}" style="width: 100%; height: auto; color: #3F444C"><polyline points="{{wauGrid}}" fill="none" stroke="#9A9E95" stroke-opacity="0.4" stroke-width="1"></polyline><polyline points="{{wauLine}}" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></polyline><template data-for="{{wauDots}}" data-as="d"><circle cx="{{d.x}}" cy="{{d.y}}" r="3.5" fill="#1D4ED8"></circle></template><template data-for="{{wauLabels}}" data-as="l"><text x="{{l.x}}" y="136" text-anchor="middle" font-size="11" font-family="Inter, system-ui, sans-serif" fill="currentColor">{{l.t}}</text></template></svg></div>
<div style="display: flex; flex-wrap: wrap; gap: 14px"><div style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">From sign-up to a first full loop</h2><template data-for="{{funnel}}" data-as="b"><div style="display: grid; grid-template-columns: minmax(110px, 180px) 1fr 70px; align-items: center; gap: 10px; font-size: 13.5px"><span style="color: #3F444C">{{b.label}}</span><span aria-hidden="true" style="display: block; height: 12px; border-radius: 6px; background: #ECECE6"><span style="display: block; width: {{b.w}}%; height: 100%; border-radius: 6px; background: {{b.c}}"></span></span><span style="text-align: right; font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{b.v}}</span></div></template></div><div style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Learners by country</h2><template data-for="{{countries}}" data-as="b"><div style="display: grid; grid-template-columns: minmax(110px, 180px) 1fr 70px; align-items: center; gap: 10px; font-size: 13.5px"><span style="color: #3F444C">{{b.label}}</span><span aria-hidden="true" style="display: block; height: 12px; border-radius: 6px; background: #ECECE6"><span style="display: block; width: {{b.w}}%; height: 100%; border-radius: 6px; background: {{b.c}}"></span></span><span style="text-align: right; font-family: ui-monospace, Menlo, monospace; font-weight: 600">{{b.v}}</span></div></template></div></div>
<div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Families still active, by month they joined</h2><div style="overflow-x: auto"><table style="width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 4px; font-size: 13px"><thead><tr><th scope="col" style="text-align: left; padding: 4px 6px; color: #62676F">Joined</th><template data-for="{{retHead}}" data-as="h"><th scope="col" style="padding: 4px; color: #62676F">{{h}}</th></template></tr></thead><tbody><template data-for="{{retRows}}" data-as="r"><tr><th scope="row" style="text-align: left; padding: 6px; font-weight: 600">{{r.m}}</th><template data-for="{{r.cells}}" data-as="c"><td style="height: 34px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; text-align: center; font-weight: 600">{{c.v}}</td></template></tr></template></tbody></table></div></div>
</section>
</template>


</main>
</div>
</template>
<script>
DC.component("Ops", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
    return { uiTheme: t, uiDark: d, uiLight: !d, uiOn: d ? 'true' : 'false', uiToggle: this._uiFlip, uiTrack: d ? '#1D4ED8' : '#8A8F96', uiKnob: d ? '19px' : '3px' };
  }
  constructor(props) { super(props); this.state = { tab: 'mod', done: {}, q: '', role: 'all' }; }
  componentWillUnmount() { try { window.removeEventListener('storage', this._uiSync); } catch (e) {} }
  renderVals() { return Object.assign(this.themeVals(), this.pageVals(), this.anVals()); }
  anVals() {
    const st = this.state, per = st.per || '12w';
    const W = { '4w': [1180, 1215, 1262, 1304], '12w': [612, 655, 701, 760, 812, 870, 934, 1010, 1088, 1180, 1215, 1262], '6m': [210, 260, 330, 405, 470, 520, 612, 701, 812, 934, 1088, 1262] }[per];
    const max = Math.max.apply(null, W) * 1.1, n = W.length, X = (i) => 30 + i * (540 / Math.max(1, n - 1)), Y = (v) => 118 - (v / max) * 104;
