<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">What Is Education For? Three Purposes, One Child</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Before we automate schooling, we should be clear about what it is for. Gert Biesta’s three purposes of education offer a test every AI system should pass.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 8px">
<img src="assets/img/734c48226a9d32aaeebc02194bddd245.svg" alt="" style="display: block; height: 97%; width: auto">
<img src="assets/img/d42b6aeb08200a8796692a2ce1cd239f.svg" alt="" style="display: block; height: 97%; width: auto">
<img src="assets/img/d21e7783f1935f06ae9fa2d66914be3f.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>

<p style="margin: 0">Every few decades a new technology arrives promising to fix education, and every time the conversation skips the prior question: fix it for what? Film, radio, television, the personal computer and the internet were each greeted as the end of the classroom as we knew it. Each left the classroom largely intact, partly because each was asked to do more efficiently something nobody had stopped to define. Artificial intelligence is more capable than any of its predecessors, which makes the prior question more urgent, not less. A system that optimises relentlessly will become very good at whatever we tell it to pursue.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Three purposes, not one</h2>
<p style="margin: 0">The Dutch philosopher of education Gert Biesta offers a useful starting point. In <i>Good Education in an Age of Measurement</i> (2010) he argues that education always serves three overlapping purposes. The first is <b style="font-weight: 600">qualification</b>: equipping people with the knowledge, skills and dispositions to do things, from reading a contract to repairing an engine. The second is <b style="font-weight: 600">socialisation</b>: initiating people into traditions, cultures and ways of being, including the habits of citizenship. The third, which Biesta calls <b style="font-weight: 600">subjectification</b>, is the least familiar and arguably the most important. It concerns the formation of a person who can act independently, take responsibility, and resist being merely a product of the systems that shaped them.</p>
<p style="margin: 0">The three purposes pull against each other. Socialisation without subjectification produces conformity. Qualification without socialisation produces competent strangers. A school that attends only to qualification, because qualification is what tests measure, will look successful on its own dashboards while neglecting most of what parents actually hope for.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The measurement trap</h2>
<p style="margin: 0">The danger is not measurement itself. Good measurement is how we find out whether children are learning. The danger is what the social scientist Donald Campbell described in the 1970s: the more a quantitative indicator is used for social decision-making, the more it becomes subject to corruption pressures, and the more it distorts the very processes it was meant to monitor. When test scores become the target, teaching narrows toward the test, and the scores stop meaning what they once meant.</p>
<p style="margin: 0">AI intensifies this risk. A human teacher who teaches to the test does so imperfectly and often reluctantly. An algorithm rewarded for score gains will do it tirelessly. It can also measure far more than tests ever could: time on task, hesitation, error patterns and, if permitted, facial expression. Unless we are explicit about purpose, the most measurable fragment of education will quietly become the whole of it.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">Unless we are explicit about purpose, the most measurable fragment of education will quietly become the whole of it.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Older warnings, still current</h2>
<p style="margin: 0">Biesta’s worry has a long lineage. Paulo Freire, writing in Brazil in the late 1960s, condemned what he called the banking model of education, in which teachers deposit information into passive students who receive, file and store it. His alternative, problem-posing education, treats learners as co-investigators of a world they can change. John Dewey, decades earlier, insisted that education is a process of living rather than a preparation for future living. Amartya Sen’s capability approach, developed in economics, offers a complementary test: development, and therefore education, should be judged by the expansion of the real freedoms people have to lead lives they have reason to value.</p>
<p style="margin: 0">These thinkers disagree on much. They agree that education is diminished when it becomes the transfer of content from those who have it to those who lack it. That is precisely the model a naïve AI tutor would automate.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The scale of the unmet need</h2>
<p style="margin: 0">None of this is an argument for complacency about qualification. The global learning crisis is real. The World Bank and its partners estimated in 2022 that about seven in ten ten-year-olds in low- and middle-income countries could not read and understand a simple text, a condition they call learning poverty. Roughly a quarter of a billion school-age children are not in school at all. A philosophy of education that treats basic literacy and numeracy as afterthoughts is a luxury for the already educated.</p>
<p style="margin: 0">The point is that qualification and the other purposes need not compete when education is designed well. Children who are known as individuals, who pursue questions they care about and who learn alongside others tend to acquire skills more durably, not less. The trade-off appears mainly when systems optimise a single metric.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">A test for AI-era schooling</h2>
<p style="margin: 0">Biesta’s framework yields three questions that any AI-supported school should be able to answer.</p>
<p style="margin: 0"><b style="font-weight: 600">On qualification:</b> does the system know, with honest uncertainty, what each learner can actually do? Does it count competence demonstrated in the world as well as on a screen?</p>
<p style="margin: 0"><b style="font-weight: 600">On socialisation:</b> does the system bring children into contact with peers, families, communities and traditions, or does it isolate them in a private stream of content? Learning to disagree, collaborate and belong cannot be done alone.</p>
<p style="margin: 0"><b style="font-weight: 600">On subjectification:</b> does the system enlarge the learner’s agency? Can she see what the system believes about her, challenge it, set her own goals and, over time, need the system less? An AI that makes children more dependent on it has failed this test, however good its scores.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">How we apply it</h2>
<p style="margin: 0">At Vachuo these questions are design constraints rather than slogans. Our learner model is visible to the learner and contestable by her. Evidence from workshops, projects and peers counts alongside evidence from lessons. Unscheduled time is never observed. Our north-star metric is not engagement but self-direction. The right ambition for AI in education is not to replace its purposes with the one that is easiest to measure, but to make all three achievable for every child, including those whom schools have served worst.</p>
<p style="margin: 0">The question “what is education for?” will never be settled. But it must be asked before the software is written, because afterwards the software will have answered it for us.</p>
