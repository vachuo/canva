<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Learner profile</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Learner">
<div data-theme="{{uiTheme}}" style="background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; box-sizing: border-box; padding: {{rootPad}}">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<template data-if="{{embedded}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<button type="button" onClick="{{goBack}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to the briefing</button>
<span style="font-size: 13.5px; color: #62676F">Parent copilot / Learners / {{L.name}}</span>
</div>
</template>

<nav aria-label="Your learners" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; margin-right: 6px">Your learners</span>
<template data-for="{{pickers}}" data-as="p">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 4px; border-radius: 999px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 500; cursor: pointer"><img src="{{p.face}}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: {{p.tint}}">{{p.name}}</button>
</template>
</nav>

<section aria-labelledby="lp-name" style="position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 24px">
<div aria-hidden="true" style="height: 120px; position: relative; overflow: hidden; background: {{L.band}}"><span style="position: absolute; width: 420px; height: 420px; right: -120px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span><span style="position: absolute; width: 720px; height: 720px; left: -260px; top: -560px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span></div>
<div style="padding: 0 clamp(18px, 3vw, 32px) 26px; display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; margin-top: -64px; position: relative">
<img src="{{L.face}}" alt="{{L.name}}" style="flex: none; width: 128px; height: 128px; border-radius: 50%; object-fit: cover; object-position: top; background: {{L.tint}}; border: 5px solid #FFFFFF; box-shadow: 0 10px 24px -14px rgba(20,22,26,0.5)">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h1 id="lp-name" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.05; font-weight: 600; letter-spacing: -0.015em">{{L.name}}</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{L.statusFg}}; background: {{L.statusBg}}; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{L.statusDot}}"></span>{{L.status}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F444C">{{L.meta}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{L.interests}}" data-as="i"><span style="font-size: 12.5px; font-weight: 500; color: #115E59; background: #DDF4F1; padding: 4px 10px; border-radius: 999px">{{i}}</span></template></div>
</div>
<div style="flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{messageGuide}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>{{L.msgLabel}}</button>
<button type="button" aria-pressed="{{talkPressed}}" onClick="{{toggleTalk}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{talkBd}}; background: {{talkBg}}; color: {{talkFg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{talkLabel}}</button>
</div>
</div>
<template data-if="{{hasNote}}"><p role="status" style="margin: 0 clamp(18px, 3vw, 32px) 20px; padding: 10px 14px; border-radius: 12px; background: #DDF4F1; color: #115E59; font-size: 14.5px; line-height: 1.45">{{note}}</p></template>
<div style="border-top: 1px solid #ECECE6; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr))">
<template data-for="{{L.stats}}" data-as="s">
<div style="padding: 16px clamp(18px, 3vw, 32px); display: flex; flex-direction: column; gap: 4px; border-right: 1px solid #ECECE6">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{s.label}}</span>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1">{{s.value}}</span>
<span style="font-size: 12.5px; color: {{s.noteFg}}">{{s.note}}</span>
</div>
</template>
</div>
</section>

<div role="tablist" aria-label="Profile sections" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; overflow-x: auto">
<template data-for="{{tabs}}" data-as="t">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="flex: 1 0 auto; min-height: 42px; padding: 0 16px; border-radius: 10px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap">{{t.label}}<template data-if="{{t.locked}}"> · private</template></button>
</template>
</div>

<template data-if="{{tabOverview}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="lp-now" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Right now</span>
<h2 id="lp-now" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{L.focus.title}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">{{L.focus.text}}</p>
<template data-if="{{L.focus.hasLoop}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 10px"><template data-for="{{L.focus.segs}}" data-as="s"><span style="flex: 1 1 0; height: {{s.h}}; border-radius: 3px; background: {{s.bg}}"></span></template></div>
<span style="font-size: 13px; color: #62676F">Loop step {{L.focus.step}} of 11 · <span style="color: #14161A; font-weight: 500">{{L.focus.stepName}}</span></span>
</div>
</template>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{L.did}}" data-as="d"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: #3F444C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{d}}</li></template>
</ul>
</section>
<section aria-labelledby="lp-next" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<h2 id="lp-next" style="margin: 0 0 6px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Coming up</h2>
<template data-for="{{L.upcoming}}" data-as="u">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 0; border-top: 1px solid #ECECE6">
<span style="flex: none; width: 108px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #3F444C">{{u.when}}</span>
<span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{u.title}}</span><span style="font-size: 13px; color: #62676F">{{u.where}}</span></span>
<span style="flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{u.bg}}; color: {{u.fg}}">{{u.tag}}</span>
</div>
</template>
</section>
</div>
<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="lp-str" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="lp-str" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Strengths</h2>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.5; color: #3F444C"><template data-for="{{L.strengths}}" data-as="s"><li>{{s}}</li></template></ul>
<h3 style="margin: 6px 0 0; font-size: 14px; font-weight: 600">Working on</h3>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.5; color: #3F444C"><template data-for="{{L.growing}}" data-as="s"><li>{{s}}</li></template></ul>
</section>
<section aria-labelledby="lp-people" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="lp-people" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">People around {{L.first}}</h2>
<template data-for="{{L.people}}" data-as="p">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: {{p.tint}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px"><template data-if="{{p.hasFace}}"><img src="{{p.face}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top"></template><template data-if="{{p.noFace}}">{{p.ini}}</template></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14.5px; font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #62676F">{{p.role}}</span></span>
<template data-if="{{p.canMsg}}"><button type="button" onClick="{{p.msg}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer">Message</button></template>
</div>
</template>
</section>
</aside>
</div>
</template>

<template data-if="{{tabSubjects}}">
<section aria-label="Subjects" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
<template data-for="{{L.subjects}}" data-as="s">
<article style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{s.color}}"></span>{{s.name}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 500">Level {{s.level}}</span></div>
<div aria-hidden="true" style="position: relative; height: 10px; border-radius: 5px; background: #ECECE6"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{s.pct}}; border-radius: 5px; background: {{s.color}}"></div><div style="position: absolute; left: {{s.age}}; top: -4px; bottom: -4px; border-left: 2px dashed #F9A826"></div></div>
<span style="font-size: 12.5px; color: #62676F">{{s.vsAge}}</span>
<p style="margin: 0; font-size: 15px; line-height: 1.5"><span style="font-weight: 600">Now:</span> {{s.now}}</p>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C"><span style="font-weight: 600; color: #14161A">Last evidence:</span> {{s.last}}</p>
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{s.trendBg}}; color: {{s.trendFg}}">{{s.trend}}</span>
</article>
</template>
</section>
</template>

<template data-if="{{tabCard}}">
<section aria-labelledby="lp-card" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px">
<h2 id="lp-card" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Recently shown</h2>
<template data-if="{{L.hasCardLink}}"><a href="passport.html" style="font-size: 14px; font-weight: 500">Open the full Portfolio</a></template>
</div>
<template data-for="{{L.shown}}" data-as="k">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 0; border-top: 1px solid #ECECE6">
<span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{k.area}}</span><span style="font-size: 16px; font-weight: 600">{{k.title}}</span><span style="font-size: 13.5px; color: #3F444C">{{k.evidence}}</span></span>
<span style="flex: none; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{k.bg}}; color: {{k.fg}}">{{k.status}}</span>
</div>
</template>
</section>
</template>

<template data-if="{{tabWeek}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="lp-week" style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="lp-week" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Learning time this week</h2><span style="font-size: 13.5px; color: #62676F">{{L.weekTotal}}</span></div>
<div role="img" aria-label="{{L.weekAria}}" style="display: flex; align-items: flex-end; gap: 12px; height: 180px; padding-top: 10px; border-bottom: 1px solid #CFCFC6">
<template data-for="{{L.week}}" data-as="d">
<div style="flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #3F444C">{{d.label}}</span>
<div style="width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; height: {{d.h}}"><template data-for="{{d.parts}}" data-as="p"><span style="display: block; height: {{p.h}}; background: {{p.c}}"></span></template></div>
</div>
</template>
</div>
<div aria-hidden="true" style="display: flex; gap: 12px"><template data-for="{{L.week}}" data-as="d"><span style="flex: 1 1 0; text-align: center; font-size: 12.5px; color: #62676F">{{d.day}}</span></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px"><template data-for="{{L.legend}}" data-as="g"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3F444C"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{g.c}}"></span>{{g.name}}</span></template></div>
</section>
<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="lp-open" style="background: #DDF4F1; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<h2 id="lp-open" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600; color: #134E4A">{{L.openHours}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #134E4A">Open hours happened. What {{L.first}} did with them is not tracked or shown to anyone.</p>
</section>
<section aria-labelledby="lp-check" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 id="lp-check" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">How {{L.first}} says the week went</h2>
<p style="margin: 0; font-size: 13px; color: #62676F">Self-reported check-ins, shared by choice.</p>
<template data-for="{{L.checkins}}" data-as="c"><div style="display: flex; gap: 10px; align-items: baseline; padding-top: 8px; border-top: 1px solid #ECECE6"><span style="flex: none; width: 40px; font-size: 12.5px; font-weight: 600; color: #62676F">{{c.day}}</span><span style="font-size: 15px; line-height: 1.45">“{{c.text}}”</span></div></template>
</section>
</aside>
</div>
</template>

<template data-if="{{tabPrivacy}}">
<section aria-labelledby="lp-priv" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="lp-priv" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">What you can see, and who decides</h2>
<p style="margin: 0; font-size: 15.5px; line-height: 1.55; color: #3F444C">{{L.privacyIntro}}</p>
<template data-for="{{shares}}" data-as="s">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 0; border-top: 1px solid #ECECE6">
<span style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{s.label}}</span><span style="font-size: 13px; color: #62676F">{{s.who}}</span></span>
<span style="flex: none; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}">{{s.state}}</span>
<template data-if="{{s.canAsk}}"><button type="button" aria-pressed="{{s.asked}}" onClick="{{s.ask}}" style="flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer">{{s.askLabel}}</button></template>
</div>
</template>
</section>
</template>

<template data-if="{{tabLocked}}">
<section style="background: #FFFFFF; border: 1px dashed #CFCFC6; border-radius: 20px; padding: 32px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#62676F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
<h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">{{L.first}} keeps this private</h2>
<p style="margin: 0; max-width: 520px; font-size: 15.5px; line-height: 1.55; color: #3F444C">{{L.lockedText}}</p>
<button type="button" onClick="{{gotoPrivacy}}" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">See what {{L.first}} shares</button>
</section>
</template>

</div>
</div>
</template>
<script>
DC.component("Learner", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
