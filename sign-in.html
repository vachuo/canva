<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Sign in</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-SignIn">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<section aria-label="About signing in" style="flex: 1 1 420px; position: relative; overflow: hidden; box-sizing: border-box; padding: clamp(28px, 4vw, 56px); background: #1D4ED8; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
<span aria-hidden="true" style="position: absolute; width: 640px; height: 640px; right: -300px; top: -360px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.28)"></span>
<span aria-hidden="true" style="position: absolute; width: 1100px; height: 1100px; left: -520px; top: -760px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>
<span aria-hidden="true" style="position: absolute; left: -30%; right: -30%; bottom: -110px; height: 210px; border-radius: 50%; background: #FBF7EE"></span>
<a href="index.html" style="position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #FFFFFF; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to vachuo.com</a>
<div style="position: relative; display: flex; flex-direction: column; gap: 24px; max-width: 460px">
<span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none; align-self: flex-start"><img src="assets/img/78712f5daf163a96256f6f781a871cff.png" alt="Vachuo" style="display: block; width: 190px; height: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; line-height: 1; color: #FFFFFF">™</span></span>
<p style="margin: 0; font-size: clamp(28px, 3vw, 40px); line-height: 1.12; font-weight: 600; text-wrap: balance">One door for everyone who learns, guides and builds with Vachuo.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #E4ECFD">Children under 13 sign in with a code or picture password that a parent controls. We never ask a child for an email address.</p>
</div>
<img src="assets/img/5c3f875080e321cd4069ef3eba9f9f60.svg" alt="Illustrated learners from North America, India, Jordan, Canada and Kenya" style="position: relative; display: block; align-self: center; width: 100%; max-width: 460px; height: auto; margin-bottom: -44px">
<span style="position: relative; align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #14161A; background: #F9A826; padding: 5px 12px; border-radius: 999px">Demo sign-in · no real accounts</span>
</section>

<main style="flex: 1 1 520px; min-width: 0; box-sizing: border-box; padding: clamp(28px, 5vw, 64px) clamp(16px, 4vw, 56px); display: flex; justify-content: center">
<div style="width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: clamp(36px, 3.6vw, 48px); line-height: 1.05; font-weight: 600">Sign in</h1>
<button type="button" aria-label="Dark mode" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
<div role="group" aria-label="I am a" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{roles}}" data-as="r">
<button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{r.label}}</button>
</template>
</div>

<template data-if="{{isLearner}}">
<form onSubmit="{{noSubmit}}" aria-label="Learner sign-in" style="display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px">
<h2 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600">Hi! Ready to learn?</h2>
<div role="group" aria-label="How old are you?" style="align-self: flex-start; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{ages}}" data-as="g"><button type="button" aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: {{g.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{g.label}}</button></template></div>
<template data-if="{{isUnder}}">
<template data-if="{{famLocked}}"><div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD"><span style="font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600">A grown-up opens your family account first</span><span style="font-size: 16px; line-height: 1.5; color: #3F444C">Learners under 13 don’t have a login of their own. A parent or guardian unlocks your family on this device, then you pick yourself.</span><button type="button" onClick="{{famUnlock}}" style="align-self: flex-start; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer">Parent: unlock with your passkey</button></div></template>
<template data-if="{{famOpen}}">
<p role="status" style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #115E59">Your family is open on this device, unlocked by Wanjiru.<button type="button" onClick="{{famLock}}" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; text-decoration: underline; cursor: pointer">Lock it again</button></p>
<div role="group" aria-label="Who is learning?" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><template data-for="{{kids}}" data-as="k"><button type="button" aria-pressed="{{k.on}}" onClick="{{k.pick}}" style="min-height: 96px; border-radius: 14px; border: 2px solid {{k.bd}}; background: {{k.bg}}; color: #14161A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: {{k.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; font-size: 18px; font-weight: 700">{{k.ini}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">{{k.name}}</span></button></template></div>
<template data-if="{{kidPicked}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">Now tap your three pictures</span>
<div role="group" aria-label="Picture password" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<template data-for="{{pics}}" data-as="p">
<button type="button" aria-label="{{p.name}}" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 72px; border-radius: 14px; border: 2px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"/></svg>
<span style="font-size: 12.5px">{{p.name}}</span>
</button>
</template>
</div>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{picNote}}</span>
</div>
<a href="today.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none">Start learning</a>
</template>
</template>
</template>
<template data-if="{{isTeen}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="code" style="font-size: 14px; font-weight: 600">Your learner code</label>
<input id="code" type="text" autocomplete="off" placeholder="AMANI-7K" style="min-height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FAFAF7; font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: 0.08em; color: #14161A">
</div>
<a href="today.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none">Start learning</a>
</template>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">Forgot your code or pictures? Ask your parent or guardian. They can find them in Parent copilot.</p>
</form>
</template>

<template data-if="{{isParent}}">
<form onSubmit="{{noSubmit}}" aria-label="Parent sign-in" style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px">
<h2 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600">Welcome back</h2>
<button type="button" onClick="{{passkeyParent}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 14px; border: none; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Sign in with a passkey</button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F"><span style="flex: 1; height: 1px; background: #E2E2DA"></span>or<span style="flex: 1; height: 1px; background: #E2E2DA"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="pemail" style="font-size: 14px; font-weight: 600">Email</label><input id="pemail" type="email" autocomplete="email" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; align-items: baseline"><label for="ppass" style="font-size: 14px; font-weight: 600">Password</label><button type="button" onClick="{{openForgot}}" style="min-height: 32px; padding: 0; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; text-decoration: underline; cursor: pointer">Forgot password?</button></div><div style="position: relative; display: flex"><input id="ppass" type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onChange="{{setPw}}" spellcheck="false" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 54px 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.02em"><button type="button" aria-label="{{pwLabel}}" aria-pressed="{{pwPressed}}" aria-controls="ppass" title="{{pwLabel}}" onClick="{{togglePw}}" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 10px; border: none; background: transparent; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{pwHidden}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></template><template data-if="{{pwShown}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></template></button></div></div>
<a href="copilot.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 14px; border: 1px solid #14161A; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; text-decoration: none">Sign in</a>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{ssoGoogle}}" style="flex: 1 1 160px; min-height: 46px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Continue with Google</button>
<button type="button" onClick="{{ssoApple}}" style="flex: 1 1 160px; min-height: 46px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Continue with Apple</button>
</div>
<template data-if="{{ssoOpen}}"><div aria-live="polite" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD; font-family: Inter, system-ui, sans-serif"><template data-if="{{ssoStep1}}"><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{ssoTitle}}</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">wanjiru@example.com · the {{ssoName}} account linked to your family</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{ssoNext}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Continue</button><button type="button" onClick="{{ssoCancel}}" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; text-decoration: underline; cursor: pointer">Cancel</button></div></div></template><template data-if="{{ssoStep2}}"><div style="display: flex; flex-direction: column; gap: 8px"><label for="ssocode" style="font-size: 15px; font-weight: 600">Two-step check: enter the 6-digit code we sent to +254 7•• ••• 412</label><div style="display: flex; flex-wrap: wrap; gap: 8px"><input id="ssocode" inputMode="numeric" autocomplete="one-time-code" value="{{ssoCode}}" onChange="{{ssoSetCode}}" placeholder="123456" style="width: 160px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: ui-monospace, Menlo, monospace; font-size: 18px; letter-spacing: 0.12em"><button type="button" onClick="{{ssoVerify}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Verify</button></div><span style="font-size: 13px; color: {{ssoMsgFg}}">{{ssoMsg}}</span></div></template><template data-if="{{ssoStep3}}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><span style="flex: 1 1 220px; font-size: 15px; font-weight: 600; color: #115E59">Signed in with {{ssoName}}. Two-step check passed.</span><a href="copilot.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">Open Parent copilot</a></div></template><span style="font-size: 12px; color: #62676F">Prototype: the real app sends you to {{ssoName}} to confirm. Nothing is sent from this demo.</span></div></template>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">New to Vachuo? <a href="onboarding.html">Create a family account</a>. Two-step verification is on for every parent account.</p>
</form>
</template>

<template data-if="{{isGuide}}">
<form onSubmit="{{noSubmit}}" aria-label="Guide and educator sign-in" style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px">
<h2 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600">Guides, hosts and educators</h2>
<button type="button" onClick="{{ssoGuide}}" style="min-height: 52px; border-radius: 14px; border: none; background: #0F766E; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Sign in with your organisation (SSO)</button>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F"><span style="flex: 1; height: 1px; background: #E2E2DA"></span>or<span style="flex: 1; height: 1px; background: #E2E2DA"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="gemail" style="font-size: 14px; font-weight: 600">Work email</label><input id="gemail" type="email" autocomplete="email" placeholder="you@school.org" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="gpass" style="font-size: 14px; font-weight: 600">Password</label><div style="position: relative; display: flex"><input id="gpass" type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onChange="{{setPw}}" spellcheck="false" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 54px 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.02em"><button type="button" aria-label="{{pwLabel}}" aria-pressed="{{pwPressed}}" aria-controls="gpass" title="{{pwLabel}}" onClick="{{togglePw}}" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 10px; border: none; background: transparent; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{pwHidden}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></template><template data-if="{{pwShown}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></template></button></div></div>
<a href="guide.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 14px; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; text-decoration: none">Sign in</a>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">Every guide and host is identity-verified and background-checked before meeting a learner. <a href="join.html">Become a guide</a> or <a href="connects.html">a Connects host</a></p>
</form>
</template>

<template data-if="{{isSchool}}">
<form onSubmit="{{noSubmit}}" aria-label="School and partner sign-in" style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px">
<h2 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600">Schools and partners</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #3F444C">For tutors, microschools, schools, districts and ministries running Vachuo.</p>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="domain" style="font-size: 14px; font-weight: 600">Organisation domain</label><input id="domain" type="text" placeholder="yourschool.ac.ke" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; font-size: 15px; color: #14161A"></div>
