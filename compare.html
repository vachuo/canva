<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Curriculum fit</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Compare">
<section data-theme="{{uiTheme}}" aria-labelledby="cmp-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; overflow: hidden; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">
<div style="padding: 20px 22px 16px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #ECECE6">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">{{eyebrow}}</span>
<h2 id="cmp-h" style="margin: 0; font-size: clamp(24px, 2.4vw, 30px); line-height: 1.15; font-weight: 600">{{title}}</h2>
<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #3F444C; max-width: 820px">{{sub}}</p>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; line-height: 1.5; color: #115E59">For families who have to fit a system: Vachuo compares curricula so a move never costs a child a year. It never ranks countries or children.</p>
</div>

<div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 10px; background: #FAFAF7; border-bottom: 1px solid #ECECE6; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px"><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">Learner</span><select aria-label="Learner" value="{{cfLid}}" onChange="{{cfSetLid}}" style="width: {{cfLidW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{learnerOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">Learns</span><select aria-label="Learns with" value="{{cfKe}}" onChange="{{cfSetKe}}" style="width: {{cfKeW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{keOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">Compare</span><select aria-label="Compare with" value="{{cfTo}}" onChange="{{cfSetTo}}" style="width: {{cfToW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{toOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">{{regLabel}}</span><select aria-label="Region" value="{{cfReg}}" onChange="{{cfSetReg}}" style="width: {{cfRegW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{regOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">Goal</span><select aria-label="Goal" value="{{cfDir}}" onChange="{{cfSetDir}}" style="width: {{cfDirW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{dirOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F; white-space: nowrap">When</span><select aria-label="When" value="{{cfWhen}}" onChange="{{cfSetWhen}}" style="width: {{cfWhenW}}; min-height: 36px; flex: none; box-sizing: border-box; padding: 0 26px 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2362676F%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 10px center; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; -webkit-appearance: none; appearance: none"><template data-for="{{whenOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
</div>

<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 300px; min-width: 0; padding: 14px; border-radius: 14px; background: #FBFBF8; border: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #62676F">{{keName}}</span><span style="font-size: 15.5px; line-height: 1.5; color: #3F444C">{{keNote}}</span></div>
<div style="flex: 1 1 300px; min-width: 0; padding: 14px; border-radius: 14px; background: #FBFBF8; border: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #62676F">{{stdName}} · standards and tests</span><span style="font-size: 15.5px; line-height: 1.5; color: #3F444C">{{stdText}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 21px; font-weight: 600">By age: where {{ageNow}}, and {{ageAt}}</h3>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{placeCards}}" data-as="p">
<div style="flex: 1 1 320px; min-width: 0; padding: 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700">{{p.h}}</span><span style="font-size: 12px; color: #62676F">{{p.sub}}</span></div>
<div style="display: flex; gap: 10px"><div style="flex: 1; padding: 10px; border-radius: 10px; background: #F4F7FE; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11.5px; color: #1E40AF">Now</span><span style="font-size: 18px; font-weight: 700">{{p.now}}</span><span style="font-size: 12px; color: #3F444C">{{p.nowStage}}</span></div><div style="flex: 1; padding: 10px; border-radius: 10px; background: #FEF9EE; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11.5px; color: #92400E">At the move</span><span style="font-size: 18px; font-weight: 700">{{p.at}}</span><span style="font-size: 12px; color: #3F444C">{{p.atStage}}</span></div></div>
<span style="font-size: 12.5px; line-height: 1.5; color: #3F444C">{{p.year}} · {{p.rule}}</span>
<span style="font-size: 12.5px; line-height: 1.5; color: #3F444C"><strong>Next milestone:</strong> {{p.next}}</span>
</div>
</template>
</div>
<div style="padding: 12px 14px 16px; border-radius: 14px; border: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{timelines}}" data-as="t">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px"><span style="flex: 0 0 170px; font-size: 12.5px; font-weight: 600">{{t.name}}</span><div style="flex: 1 1 400px; position: relative; height: 26px; border-radius: 6px; background: #F4F4EF"><template data-for="{{t.bars}}" data-as="b"><span title="{{b.t}}" style="position: absolute; top: 2px; bottom: 2px; left: {{b.left}}%; width: {{b.w}}%; border-radius: 5px; background: {{b.c}}; color: #14161A; font-size: 11px; font-weight: 600; display: flex; align-items: center; padding: 0 6px; box-sizing: border-box; overflow: hidden; white-space: nowrap; border-right: 2px solid #FFFFFF">{{b.t}}</span></template></div></div>
</template>
<div style="display: flex; gap: 10px"><span style="flex: 0 0 170px"></span><div style="flex: 1 1 400px; position: relative; height: 34px"><template data-for="{{ageTicks}}" data-as="k"><span style="position: absolute; left: {{k.left}}%; top: 0; font-size: 11px; color: #62676F; transform: translateX(-50%)">{{k.t}}</span></template><span style="position: absolute; left: {{agePos}}%; top: 14px; transform: translateX(-50%); padding: 1px 7px; border-radius: 999px; background: #1D4ED8; color: #FFFFFF; font-size: 11px; font-weight: 700; white-space: nowrap">now</span><span style="position: absolute; left: {{ageAtPos}}%; top: 14px; transform: translateX(-50%); padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 11px; font-weight: 700; white-space: nowrap">move</span></div></div>
<span style="font-size: 12px; color: #62676F">Age in years. Bands show the usual ages for each stage; exact placement follows each system’s birthday cut-off, shown above.</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 21px; font-weight: 600">By curriculum: subject by subject</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{rowsHead}}</span></div>
<div style="overflow-x: auto; border: 1px solid #E2E2DA; border-radius: 14px">
<div style="min-width: 760px; display: grid; grid-template-columns: 150px 1fr 1.2fr 150px; font-family: Inter, system-ui, sans-serif; font-size: 13px">
<span style="padding: 10px 12px; background: #FAFAF7; font-weight: 600; color: #62676F; border-bottom: 1px solid #E2E2DA">Subject · level</span><span style="padding: 10px 12px; background: #FAFAF7; font-weight: 600; color: #62676F; border-bottom: 1px solid #E2E2DA">In Kenya</span><span style="padding: 10px 12px; background: #FAFAF7; font-weight: 600; color: #62676F; border-bottom: 1px solid #E2E2DA">There, at that age</span><span style="padding: 10px 12px; background: #FAFAF7; font-weight: 600; color: #62676F; border-bottom: 1px solid #E2E2DA">Fit</span>
<template data-for="{{rows}}" data-as="r">
<span style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 13.5px">{{r.name}}</strong><span style="color: #62676F">{{r.lv}}</span></span>
<span style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; line-height: 1.45; color: #3F444C">{{r.here}}</span>
<span style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 2px; line-height: 1.45"><strong style="font-weight: 600">{{r.there}}</strong><span style="color: #3F444C">{{r.topic}}</span></span>
<span style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="display: inline-block; padding: 3px 9px; border-radius: 999px; background: {{r.sBg}}; color: {{r.sFg}}; font-size: 12px; font-weight: 700">{{r.status}}</span></span>
</template>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 14px; border-radius: 14px; background: #F4F7FE; font-family: Inter, system-ui, sans-serif">
<span style="font-size: 13px; font-weight: 600; color: #1E3A8A">Curriculum fit</span>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><div aria-hidden="true" style="position: relative; height: 12px; border-radius: 999px; background: #DCE6FD"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{afterW}}%; border-radius: 999px; background: #93BBF3"></span><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{scoreW}}%; border-radius: 999px; background: #1D4ED8"></span></div><span style="font-size: 12.5px; color: #1E3A8A">{{score}} now · about {{after}} with the plan below · {{fitNote}}</span></div>
</div>
</div>

<template data-if="{{isAssess}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 21px; font-weight: 600">Assessments, side by side</h3>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="flex: 1 1 320px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700">Kenya</span><template data-for="{{asmHere}}" data-as="a"><div style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8"><span style="font-size: 13.5px; font-weight: 600">{{a.n}} <span style="font-weight: 400; color: #62676F">· {{a.when}}</span></span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{a.t}}</span></div></template></div>
<div style="flex: 1 1 320px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700">{{asmThereName}}</span><template data-for="{{asmThere}}" data-as="a"><div style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8"><span style="font-size: 13.5px; font-weight: 600">{{a.n}} <span style="font-weight: 400; color: #62676F">· {{a.when}}</span></span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{a.t}}</span></div></template></div>
</div>
</div>
</template>
<template data-if="{{isReport}}">
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="flex: 1.3 1 380px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">How this Portfolio reads in {{convName}}</span>
<template data-for="{{conv}}" data-as="c"><div style="display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8; font-size: 13px"><span style="flex: 1 1 160px; font-weight: 600">{{c.v}}</span><span style="flex: 1 1 140px; color: #3F444C">Kenya: {{c.ke}}</span><span style="flex: 1 1 160px; color: #1E40AF; font-weight: 600">{{c.t}}</span></div></template>
<span style="font-size: 12px; line-height: 1.5; color: #62676F">A guide for the receiving school, printed on the transcript. Final placement is always the school’s decision.</span></div>
<div style="flex: 1 1 280px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600">Documents schools usually ask for</span><template data-for="{{docs}}" data-as="d"><span style="display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45"><span aria-hidden="true" style="color: #0F766E">✓</span>{{d.t}}</span></template><span style="font-size: 12px; line-height: 1.5; color: #62676F">Check the school or education office for the exact list. Vachuo can prepare the transcript and portfolio; visas and residence are outside what it advises on.</span></div>
</div>
</template>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 21px; font-weight: 600">What the plan would change</h3><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{nChosen}} changes selected · untick anything you don’t want</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px">
<template data-for="{{groups}}" data-as="g">
<div style="padding: 12px 14px; border-radius: 14px; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 13.5px; font-weight: 700">{{g.label}}</span><a href="{{g.href}}" style="font-size: 12.5px">Open →</a></div>
<template data-for="{{g.items}}" data-as="i"><label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8; cursor: pointer"><input type="checkbox" checked="{{i.on}}" onChange="{{i.toggle}}" style="flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: #1D4ED8"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13.5px; font-weight: 600; line-height: 1.35">{{i.t}}</span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{i.w}}</span></span></label></template>
</div>
</template>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; border-radius: 16px; background: #FEF9EE; border: 1px solid #F3DDB0; font-family: Inter, system-ui, sans-serif">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700">{{planLabel}}</span>
<template data-if="{{stNone}}"><span style="font-size: 13px; color: #3F444C">Send it to Wanjiru. Once she approves, each change appears on the page it belongs to.</span></template>
<template data-if="{{stDeclined}}"><span style="font-size: 13px; color: #92400E">Wanjiru declined the last version. Adjust it and send again.</span></template>
<template data-if="{{stPending}}"><span style="font-size: 13px; color: #92400E">Waiting for Wanjiru. It’s in her Parent copilot inbox.</span></template>
<template data-if="{{stApproved}}"><span style="font-size: 13px; color: #115E59">Approved by Wanjiru and applied.</span></template>
</div>
<template data-if="{{stNone}}"><button type="button" onClick="{{propose}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Send to Wanjiru for approval</button></template>
<template data-if="{{stPending}}"><button type="button" onClick="{{approveDemo}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Approve as Wanjiru (signed in here)</button><button type="button" onClick="{{withdraw}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; cursor: pointer">Withdraw</button></template>
