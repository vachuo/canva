@keyframes sf-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes sf-shade{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.72);opacity:.55}}.sf-fab{position:fixed;z-index:88;width:56px;height:56px;padding:0;margin:0;border:none;border-radius:50%;background:transparent;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.sf-fab .sf-bob{position:absolute;inset:0;display:block;animation:sf-bob 3.6s ease-in-out infinite}.sf-fab .sf-face{display:block;width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px #FFFFFF,0 12px 24px -10px rgba(20,22,26,.6)}.sf-fab .sf-q{position:absolute;right:-5px;top:-5px;width:21px;height:21px;box-sizing:border-box;border-radius:50%;border:2px solid #FFFFFF;background:#F9A826;color:#14161A;font:700 12px/17px Inter,system-ui,sans-serif;text-align:center}.sf-fab .sf-shade{position:absolute;left:50%;bottom:-11px;width:38px;height:7px;margin-left:-19px;border-radius:50%;background:rgba(20,22,26,.2);animation:sf-shade 3.6s ease-in-out infinite}.sf-fab .sf-tip{position:absolute;top:50%;transform:translateY(-50%);padding:6px 12px;border-radius:999px;background:#14161A;color:#FFFFFF;font:600 13px/1.2 Inter,system-ui,sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.sf-fab:hover .sf-tip,.sf-fab:focus-visible .sf-tip{opacity:1}.sf-fab.sf-drag .sf-tip,.sf-fab.sf-open .sf-tip{opacity:0}.sf-fab:focus-visible{outline:none}.sf-fab:focus-visible .sf-face{box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #1D4ED8}.sf-fab.sf-drag{cursor:grabbing}.sf-fab.sf-drag .sf-bob,.sf-fab.sf-drag .sf-shade{animation:none}.sf-fab.sf-drag .sf-face{transform:scale(1.08);box-shadow:0 0 0 3px #FFFFFF,0 18px 30px -10px rgba(20,22,26,.6)}.sf-anchor{right:-24px;bottom:30px}.sf-anchor .sf-tip{opacity:1;top:auto;bottom:66px;right:22px;transform:none;border-radius:16px 16px 4px 16px;background:#FFFFFF;color:#172F73;border:1px solid #DCDCD3;font:italic 600 17px/1.15 'EB Garamond',Garamond,Georgia,serif;padding:7px 14px}.sf-panel-anchor{right:44px;bottom:30px}@media (max-width:760px){.sf-anchor{right:8px}.sf-panel-anchor{right:8px;bottom:96px}}#sf-panel:focus{outline:none}.sf-head{cursor:move;touch-action:none;-webkit-user-select:none;user-select:none}.sf-head button,.sf-head a{cursor:pointer}.sf-chips{scrollbar-width:none}.sf-chips::-webkit-scrollbar{display:none}.sf-hb:hover{background:#F4F4EF!important}[data-theme="dark"] .sf-hb:hover{background:#22262D!important}@keyframes sf-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}.sf-dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#62676F;animation:sf-dot 1.2s infinite}.sf-dots span:nth-child(2){animation-delay:.15s}.sf-dots span:nth-child(3){animation-delay:.3s}[data-theme="dark"] .sf-fab .sf-face{box-shadow:0 0 0 3px #2B3038,0 12px 24px -10px rgba(0,0,0,.8)}[data-theme="dark"] .sf-fab .sf-q{border-color:#2B3038}@media (prefers-reduced-motion:reduce){.sf-fab .sf-bob,.sf-fab .sf-shade,.sf-dots span{animation:none}}

<template data-if="{{bHasScore}}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 600">{{bPct}}</span><span style="padding: 3px 10px; border-radius: 999px; background: {{bBandBg}}; color: {{bBandFg}}; font-size: 12.5px; font-weight: 700">{{bBand}}</span><span style="font-size: 13.5px; color: #3F444C">{{bScoreSub}}</span></div></template>

<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What it covers</h3>

<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif"><span style="flex: 1; font-size: 14px; font-weight: 500">{{k.name}}</span><span role="img" aria-label="{{k.aria}}" style="display: inline-flex; gap: 3px"><template data-for="{{k.dots}}" data-as="d"><span style="width: 12px; height: 7px; border-radius: 3px; background: {{d.bg}}"></span></template></span><span style="flex: 0 0 76px; font-size: 12px; font-weight: 600; color: {{k.fg}}">{{k.label}}</span></div>

<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px">

<div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px"><span style="flex: 0 0 96px; color: #3F444C">{{b.n}} · {{b.name}}</span><span aria-hidden="true" style="flex: 1; height: 10px; border-radius: 999px; background: #F4F4EF; overflow: hidden"><span style="display: block; height: 100%; width: {{b.w}}%; background: {{b.bar}}"></span></span><span style="flex: 0 0 22px; text-align: right; font-family: ui-monospace, Menlo, monospace; color: #14161A">{{b.c}}</span></div>
</template>
<span style="font-size: 12px; color: #62676F">{{bBloomNote}}</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Where it sits in your {{bSubj}} spiral · {{bThread}}</h3>
<div style="display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px">
<template data-for="{{bSpiral}}" data-as="p">
<button type="button" onClick="{{p.open}}" aria-current="{{p.curA}}" style="flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 128px; max-width: 170px; padding: 9px 10px; border-radius: 12px; border: {{p.bd}}; background: {{p.bg}}; color: #14161A; text-align: left; cursor: pointer; font-family: Inter, system-ui, sans-serif"><span style="font-size: 11.5px; font-weight: 600; color: #62676F">{{p.wk}} · {{p.type}}</span><span style="font-size: 13px; font-weight: 600; line-height: 1.25">{{p.label}}</span><span style="display: flex; gap: 2px" aria-hidden="true"><template data-for="{{p.lv}}" data-as="l"><span style="width: 9px; height: 4px; border-radius: 2px; background: {{l.bg}}"></span></template></span><span style="font-size: 11.5px; color: #3F444C">{{p.st}}</span></button>
</template>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F444C">{{bSpiralNote}}</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div style="flex: 1 1 300px; min-width: 0; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">

<template data-for="{{bFacts}}" data-as="f"><div style="display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45"><span style="flex: 0 0 92px; color: #62676F">{{f.k}}</span><span style="flex: 1; color: #14161A">{{f.v}}</span></div></template>
</div>
<div style="flex: 1 1 300px; min-width: 0; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">

</div>
</div>

<template data-if="{{bHasTeam}}">

<div style="display: flex; flex-wrap: wrap; gap: 8px">

</div>
<template data-if="{{bHasMs}}">

</ol>
</template>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13.5px; font-weight: 600">How the mark is built</span>
<div aria-hidden="true" style="display: flex; height: 14px; border-radius: 999px; overflow: hidden"><span style="width: {{bGroupW}}%; background: #0D9488"></span><span style="width: {{bIndW}}%; background: #1D4ED8"></span></div>
<span style="font-size: 12.5px; color: #3F444C">{{bSplit}}</span>
<template data-for="{{bCrit}}" data-as="c"><div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="flex: none; padding: 1px 7px; border-radius: 6px; background: {{c.tagBg}}; color: {{c.tagFg}}; font-size: 11px; font-weight: 700">{{c.tag}}</span><span style="flex: 1">{{c.n}}</span><span style="font-family: ui-monospace, Menlo, monospace; color: #3F444C">{{c.w}}</span></div></template>
</div>
</div>
</template>

<template data-if="{{bIsProject}}">
<div style="padding: 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px"><h3 style="margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Project files</h3><span style="font-size: 12.5px; color: #62676F">Uploads are for projects only. Tests stay on the pad.</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px"><label style="flex: 1 1 210px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Where it came from<select value="{{upSrc}}" onChange="{{upSetSrc}}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><option value="photo">A photo I took of my work</option><option value="made">A file I made myself</option><option value="group">Made with my group</option><option value="helped">Made with help</option><option value="found">Found somewhere else</option></select></label><label style="flex: 2 1 240px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Who helped, or where it came from<input value="{{upNote}}" onChange="{{upSetNote}}" placeholder="e.g. Mum held the ruler; recipe from Bibi" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Add a file<input type="file" onChange="{{upPick}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label></div>
<template data-for="{{upFiles}}" data-as="u"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600; overflow-wrap: anywhere">{{u.name}}</span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{u.prov}}</span></span><span style="padding: 3px 9px; border-radius: 999px; background: #ECECE6; color: #3F444C; font-size: 12px; font-weight: 600">Waiting for Nduta</span><button type="button" onClick="{{u.remove}}" style="min-height: 44px; padding: 0 12px; border: none; background: transparent; color: #1D4ED8; font-size: 13px; text-decoration: underline; cursor: pointer">Remove</button></div></template>
<template data-if="{{upNone}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 13.5px; line-height: 1.5; color: #3F444C">No files yet. Each file keeps a record of who made it, how and when, so Nduta knows which work is yours.</p></template>
</div>
</template>

<template data-if="{{bHasPrep}}">
<div style="display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">
<h3 style="margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">How to get ready</h3>
<template data-for="{{bPrep}}" data-as="p">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 14px"><span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #E4ECFD; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{p.n}}</span><span style="flex: 1">{{p.t}}</span><template data-if="{{p.isLink}}"><a href="{{p.href}}" style="font-size: 13.5px; font-weight: 500">Go →</a></template></div>
</template>
</div>
</template>
</div>
</div>
</div>
</template>

<template data-if="{{rOpen}}">

<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 600; color: {{rInk}}">{{rSubj}} · {{rType}} · {{rModeLabel}}</span><h2 id="r-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; line-height: 1.15; font-weight: 600">{{rTitle}}</h2></div>
<span role="timer" aria-label="{{rTimerA}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: {{rTimerBg}}; color: {{rTimerFg}}; font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>{{rTimer}}</span>
<span title="Closed workspace" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-size: 12.5px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>{{rIntegrity}}</span>
<button type="button" onClick="{{rFocus}}" aria-pressed="{{rFsA}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">{{rFsLabel}}</button>
<button type="button" onClick="{{rExit}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">{{rExitLabel}}</button>
</div>
<template data-if="{{rHasWarn}}"><div role="status" style="flex: none; padding: 8px clamp(12px, 3vw, 28px); background: #FEF1D9; color: #92400E; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 500">{{rWarn}}</div></template>

<template data-if="{{rIntro}}">
<div style="flex: 1; overflow-y: auto; padding: 24px clamp(12px, 4vw, 40px)">
<div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3F444C">{{rIntroText}}</p>

</div>
<div style="padding: 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">How this workspace keeps it fair</span>
<template data-for="{{rRules}}" data-as="r"><div style="display: flex; gap: 8px; font-size: 14.5px; line-height: 1.45"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M5 12l4 4 10-10"/></svg><span>{{r.t}}</span></div></template>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #FEF9EE; border: 1px solid #F3DDB0; font-size: 16.5px; line-height: 1.45; cursor: pointer"><input type="checkbox" checked="{{rPledge}}" onChange="{{rTogglePledge}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #1D4ED8">{{rPledgeText}}</label>

<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{rBeginHint}}</span>
</div>
</div>
</div>
</template>

<template data-if="{{rWork}}">
<div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; overflow-y: auto">
<nav aria-label="Questions" style="flex: 1 1 180px; max-width: 100%; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-family: Inter, system-ui, sans-serif">

<template data-for="{{rNav}}" data-as="n"><button type="button" onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-current="{{n.curA}}" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{n.bd}}; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: 700; cursor: pointer">{{n.n}}<template data-if="{{n.flag}}"><span aria-hidden="true" style="position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: #F9A826; border: 2px solid #F4F4EF"></span></template></button></template>

<template data-if="{{rShowPass}}"><p style="margin: 0; padding: 14px 16px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 17px; line-height: 1.6; white-space: pre-line; user-select: none">{{rPassage}}</p></template>

<template data-if="{{rHasGloss}}"><p style="margin: -6px 0 0; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">{{rGloss}}</p></template>

<template data-if="{{rIsMc}}">
<div role="group" aria-label="Choose one answer" style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{rOpts}}" data-as="o"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-radius: 14px; border: 2px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; font-size: 17px; text-align: left; cursor: pointer"><span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: {{o.lBg}}; color: {{o.lFg}}; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700">{{o.l}}</span>{{o.t}}</button></template>
</div>
</template>
<template data-if="{{rIsNum}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; color: #3F444C">Your answer<span style="display: flex; align-items: center; gap: 10px"><input type="text" inputMode="decimal" autoComplete="off" value="{{rVal}}" onChange="{{rSet}}" onPaste="{{rNoPaste}}" onDrop="{{rNoPaste}}" style="width: 200px; min-height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: ui-monospace, Menlo, monospace; font-size: 22px"><span style="font-weight: 400; color: #62676F">Type the number only.</span></span></label>
</template>
<template data-if="{{rIsText}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; color: #3F444C">Your answer<textarea rows="6" value="{{rVal}}" onChange="{{rSet}}" onPaste="{{rNoPaste}}" onDrop="{{rNoPaste}}" spellCheck="false" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 2px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; line-height: 1.5; resize: vertical"></textarea><span style="font-weight: 400; color: #62676F">{{rWords}} · spellcheck and pasting are off</span></label>
</template>

<template data-if="{{rIsPad}}">
<div style="display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif">
<div role="toolbar" aria-label="Drawing tools" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA">
<template data-for="{{padTools}}" data-as="t"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{t.label}}</button></template>
<span aria-hidden="true" style="width: 1px; height: 26px; background: #E2E2DA"></span>
<template data-for="{{padInks}}" data-as="k"><button type="button" aria-label="{{k.name}}" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="width: 32px; height: 32px; border-radius: 50%; border: 3px solid {{k.ring}}; background: {{k.hex}}; cursor: pointer"></button></template>
<span aria-hidden="true" style="width: 1px; height: 26px; background: #E2E2DA"></span>
<template data-for="{{papers}}" data-as="p"><button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: #14161A; font-size: 12.5px; cursor: pointer">{{p.label}}</button></template>
<span style="flex: 1"></span>
<button type="button" onClick="{{padUndo}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; cursor: pointer">Undo</button>
<button type="button" onClick="{{padClear}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; cursor: pointer">Clear</button>
<button type="button" onClick="{{padReplay}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; cursor: pointer">Replay my working</button>
<button type="button" aria-pressed="{{penOnlyA}}" onClick="{{togglePenOnly}}" title="Ignore your palm when you write with a stylus" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{penOnlyBd}}; background: {{penOnlyBg}}; color: #14161A; font-size: 12.5px; cursor: pointer">Stylus only</button>
</div>
<div onDrop="{{rNoPaste}}" onDragOver="{{rNoDrag}}" style="position: relative; width: 100%; height: {{padH}}; border-radius: 14px; overflow: hidden; border: 1px solid #CFCFC6; background: #FFFFFE">
<canvas ref="{{paperRefCb}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"></canvas>
<canvas ref="{{inkRefCb}}" role="img" aria-label="{{padAria}}" onPointerDown="{{padDown}}" onPointerMove="{{padMove}}" onPointerUp="{{padUp}}" onPointerCancel="{{padUp}}" style="position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair"></canvas>
</div>
<span style="font-size: 12.5px; color: #62676F">{{padInfo}}</span>
<template data-if="{{rHasChk}}">
<fieldset style="margin: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #E2E2DA; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px"><legend style="padding: 0 6px; font-size: 13px; font-weight: 600; color: #3F444C">Check your own work before you move on</legend>
<template data-for="{{rChk}}" data-as="k"><label style="display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{k.on}}" onChange="{{k.toggle}}" style="width: 18px; height: 18px; accent-color: #0F766E">{{k.t}}</label></template>
</fieldset>
</template>
</div>
</template>

<template data-if="{{rCanHint}}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: Inter, system-ui, sans-serif"><span style="font-size: 13.5px; font-weight: 600; color: #1E40AF">Stuck? Socrates asks, he doesn’t tell.</span><button type="button" onClick="{{rHint}}" aria-disabled="{{rHintDis}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #93BBF3; background: #FFFFFF; color: #1E40AF; font-size: 13px; font-weight: 600; cursor: pointer; opacity: {{rHintOp}}">{{rHintLabel}}</button></div>
<template data-for="{{rHints}}" data-as="h"><p class="fadein" style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #172F73">{{h.t}}</p></template>
</div>
</template>
</div>
</div>
<div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px clamp(12px, 3vw, 28px); background: #FFFFFF; border-top: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<button type="button" onClick="{{rPrev}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; cursor: pointer; opacity: {{rPrevOp}}">← Previous</button>
<button type="button" aria-pressed="{{rFlagA}}" onClick="{{rFlag}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{rFlagBd}}; background: {{rFlagBg}}; color: #14161A; font-size: 14px; cursor: pointer">{{rFlagLabel}}</button>
<span style="flex: 1"></span>
<button type="button" onClick="{{rNext}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #14161A; background: #14161A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{rNextLabel}}</button>
</div>
</template>

<template data-if="{{rConfirm}}">
<div style="flex: 1; overflow-y: auto; padding: 24px clamp(12px, 4vw, 40px)">
<div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-size: 28px; font-weight: 600">Ready to hand it in?</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #3F444C">{{rConfirmText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{rConfirmList}}" data-as="n"><button type="button" onClick="{{n.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 120px; padding: 10px 12px; border-radius: 12px; border: 1px solid {{n.bd}}; background: {{n.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 700">Question {{n.n}}</span><span style="font-size: 12.5px; color: #3F444C">{{n.st}}</span></button></template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; font-family: Inter, system-ui, sans-serif">
<button type="button" onClick="{{rBack}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14.5px; cursor: pointer">Go back and check</button>
<button type="button" onClick="{{rSubmit}}" style="min-height: 46px; padding: 0 22px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Hand it in</button>
</div>
</div>
</div>
</template>

<template data-if="{{rDone}}">
<div style="flex: 1; overflow-y: auto; padding: 24px clamp(12px, 4vw, 40px)">

<span style="width: 56px; height: 56px; border-radius: 50%; background: #DDF4F1; color: #0F766E; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></span>
<h3 style="margin: 0; font-size: 30px; font-weight: 600">Handed in.</h3>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C">{{rDoneText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{rDoneFacts}}" data-as="f"><div style="flex: 1 1 140px; padding: 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #62676F">{{f.k}}</span><span style="font-size: 16px; font-weight: 600">{{f.v}}</span></div></template>
</div>
<template data-if="{{rHasSkills}}"><div style="display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif"><h4 style="margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">How your mastery changed</h4><template data-for="{{rSkills}}" data-as="k"><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px"><span style="font-size: 15px; font-weight: 600">{{k.name}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: 600; color: {{k.fg}}">{{k.change}}</span></div><div aria-hidden="true" style="position: relative; height: 8px; border-radius: 4px; background: #ECECE6"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.before}}%; border-radius: 4px; background: #CFCFC6"></div><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.after}}%; border-radius: 4px; background: {{k.bar}}; opacity: 0.85"></div></div><span style="font-size: 12.5px; line-height: 1.45; color: #62676F">{{k.note}}</span></div></template></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 10px; font-family: Inter, system-ui, sans-serif">
<button type="button" onClick="{{rToReview}}" style="min-height: 46px; padding: 0 22px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Review my answers</button>
<button type="button" onClick="{{rClose}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14.5px; cursor: pointer">Back to My assessments</button>
</div>
</div>
</div>
</template>
</div>
</template>

<template data-if="{{vOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="v-title" style="position: fixed; inset: 0; z-index: 85; background: #F4F4EF; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px clamp(12px, 3vw, 28px); background: #FFFFFF; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<span style="flex: none; width: 10px; height: 34px; border-radius: 4px; background: {{vColor}}" aria-hidden="true"></span>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 600; color: {{vInk}}">Review · {{vSubj}} · {{vType}} · {{vWhen}}</span><h2 id="v-title" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; line-height: 1.15; font-weight: 600">{{vTitle}}</h2></div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{vTiles}}" data-as="t"><div style="flex: 1 1 150px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #62676F">{{t.k}}</span><span style="font-size: 19px; font-weight: 600; color: {{t.fg}}">{{t.v}}</span><span style="font-size: 12px; color: #3F444C">{{t.s}}</span></div></template>
</div>
<template data-if="{{vHasSkills}}"><div style="display: flex; flex-direction: column; gap: 8px; font-family: Inter, system-ui, sans-serif"><h4 style="margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Mastery, skill by skill · this assessment</h4><template data-for="{{vSkills}}" data-as="k"><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px"><span style="font-size: 15px; font-weight: 600">{{k.name}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: 600; color: {{k.fg}}">{{k.change}}</span></div><div aria-hidden="true" style="position: relative; height: 8px; border-radius: 4px; background: #ECECE6"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.before}}%; border-radius: 4px; background: #CFCFC6"></div><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.after}}%; border-radius: 4px; background: {{k.bar}}; opacity: 0.85"></div></div><span style="font-size: 12.5px; line-height: 1.45; color: #62676F">{{k.note}}</span></div></template></div></template>

<template data-if="{{vHasFb}}"><p style="margin: 0; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 17px; line-height: 1.5"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #62676F">{{vBy}} · </span>“{{vFb}}”</p></template>

<template data-if="{{vHasItems}}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Questions</span><button type="button" aria-pressed="{{vOnlyA}}" onClick="{{vToggleOnly}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid {{vOnlyBd}}; background: {{vOnlyBg}}; color: #14161A; font-size: 12px; font-weight: 600; cursor: pointer">{{vOnlyLabel}}</button></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<template data-for="{{vNav}}" data-as="n"><button type="button" onClick="{{n.pick}}" aria-current="{{n.curA}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border-radius: 10px; border: 1px solid {{n.bd}}; background: {{n.bg}}; color: #14161A; font-size: 13.5px; text-align: left; cursor: pointer"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: {{n.mBg}}; color: {{n.mFg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{n.mark}}</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Question {{n.n}}</span><span style="font-size: 11.5px; color: #62676F">{{n.sub}}</span></span></button></template>
</div>
</div>
<div style="padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 6px">

</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: Inter, system-ui, sans-serif; font-size: 13px"><span style="font-weight: 700">Question {{vNum}}</span><span style="padding: 2px 8px; border-radius: 6px; background: {{vBloomBg}}; color: {{vBloomFg}}; font-size: 12px; font-weight: 600">{{vBloomLabel}}</span><span style="color: #3F444C">{{vMarks}}</span><span style="color: #62676F">{{vSkill}}</span><span style="margin-left: auto; padding: 3px 10px; border-radius: 999px; background: {{vStBg}}; color: {{vStFg}}; font-size: 12.5px; font-weight: 700">{{vStLabel}}</span></div>
<template data-if="{{vHasPassage}}"><button type="button" onClick="{{vTogglePass}}" aria-expanded="{{vPassA}}" style="align-self: flex-start; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; cursor: pointer">{{vPassLabel}}</button></template>
<template data-if="{{vShowPass}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #FBFBF8; font-size: 16.5px; line-height: 1.6; white-space: pre-line">{{vPassage}}</p></template>
<p style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 600">{{vQ}}</p>
<template data-if="{{vHasGloss}}"><p style="margin: -6px 0 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">{{vGloss}}</p></template>

<template data-if="{{vIsMc}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<template data-for="{{vOpts}}" data-as="o"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 46px; padding: 6px 12px; border-radius: 12px; border: 2px solid {{o.bd}}; background: {{o.bg}}; font-size: 16.5px"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: {{o.lBg}}; color: {{o.lFg}}; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700">{{o.l}}</span><span style="flex: 1 1 200px">{{o.t}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; color: {{o.tagFg}}">{{o.tag}}</span></div></template>
</div>
</template>
<template data-if="{{vIsNum}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; font-family: Inter, system-ui, sans-serif">

<div style="flex: 1 1 160px; padding: 10px 14px; border-radius: 12px; border: 2px solid #0D9488; background: #DDF4F1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #115E59">Correct answer</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; font-weight: 600; color: #134E4A">{{vAns}}</span></div>
</div>
</template>
<template data-if="{{vIsText}}">
<div style="padding: 12px 14px; border-radius: 12px; border: 2px solid {{vMineBd}}; background: {{vMineBg}}; display: flex; flex-direction: column; gap: 4px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #3F444C">Your answer</span><span style="font-size: 17px; line-height: 1.5; white-space: pre-line">{{vMine}}</span></div>
</template>

</div>

<template data-if="{{vHasLad}}">

<p style="margin: 0; align-self: flex-start; max-width: 560px; padding: 8px 14px; border-radius: 4px 14px 14px 14px; background: {{m.rBg}}; color: {{m.rFg}}; font-size: 15.5px; line-height: 1.45">{{m.r}}</p>

<template data-if="{{lActive}}">

</div>
</div>
</template>

th="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v12H3zM8 21h8M12 16.5V21"/></svg>Teach / Debate</a></div><div id="sf-log" aria-live="polite" style="flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><template data-for="{{sfMsgs}}" data-as="m"><template data-if="{{m.isDiv}}"><div role="separator" style="display: flex; align-items: center; gap: 10px; color: #62676F; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span>{{m.divText}}<span aria-hidden="true" style="flex: 1; height: 1px; background: #ECECE6"></span></div></template><template data-if="{{m.isTyping}}"><div role="status" aria-label="Socrates is thinking" class="sf-dots" style="align-self: flex-start; padding: 12px 14px; border-radius: 14px; background: #F4F7FE"><span></span><span></span><span></span></div></template><template data-if="{{m.isMsg}}"><div style="align-self: {{m.align}}; max-width: 90%; display: flex; flex-direction: column; align-items: {{m.align}}; gap: 2px"><div id="{{m.domId}}" style="padding: 9px 12px; border-radius: 14px; background: {{m.bg}}; font-size: 14px; line-height: 1.5; color: #14161A"><template data-if="{{m.hasQ}}"><button type="button" class="vq" onClick="{{m.qGo}}" aria-label="{{m.qAria}}"><span class="vq-w">↩ Replying to {{m.qWho}}:</span><span class="vq-t">{{m.qText}}</span></button></template>{{m.text}}</div><template data-if="{{m.canReply}}"><button type="button" class="vq-rb" onClick="{{m.replyGo}}" aria-label="{{m.replyAria}}">↩ Reply</button></template></div></template></template></div><div style="flex: none; padding: 10px 14px 12px; border-top: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 8px"><div role="group" aria-label="Quick actions" class="sf-chips" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px"><template data-for="{{sfChips}}" data-as="c"><button type="button" title="{{c.tip}}" onClick="{{c.go}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer">{{c.label}}</button></template></div><template data-if="{{sfBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{sfBarWho}}:</span><span class="vq-t">{{sfBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{sfBarX}}">×</button></div></template><div style="display: flex; gap: 8px"><label for="sf-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{sfPh}}</label><input id="sf-input" value="{{sfDraft}}" onChange="{{sfSet}}" onKeyDown="{{sfInKey}}" placeholder="{{sfPh}}" autocomplete="off" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" aria-label="Send to Socrates" onClick="{{sfSend}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div><span style="font <template id="dc-Approvals">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<template data-if="{{isParent}}">
<section aria-labelledby="ap-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="ap-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Waiting for your approval</h2>
<span style="font-size: 13px; color: #62676F">{{pendingCount}}</span>
</div>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; line-height: 1.5; color: #3F444C">Alignment plans, Showcase listings, in-person sessions and job applications for your learners land here. Nothing goes live, gets paid or meets anyone until you say yes.</p>
<template data-for="{{pending}}" data-as="a">
<div class="fadein" style="border: 1px solid #F3DDB0; background: #FEF9EE; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="padding: 2px 9px; border-radius: 999px; background: {{a.kBg}}; color: {{a.kFg}}; font-size: 12px; font-weight: 700">{{a.kind}}</span><span style="font-size: 12.5px; color: #3F444C">From {{a.from}} · {{a.at}}</span></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.25">{{a.title}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{a.detail}}</span>
<template data-if="{{a.hasAreas}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{a.areas}}" data-as="r"><span style="padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 12px; color: #3F444C">{{r.t}}</span></template></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{a.approve}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 700; cursor: pointer">Approve</button><button type="button" onClick="{{a.decline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></div>
</div>
</template>
<template data-if="{{noPending}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 14px; color: #3F444C">Nothing is waiting. Requests from My assessments, Portfolio, Clubs and Showcase will appear here.</p></template>
<template data-if="{{hasDone}}">
<div style="display: flex; flex-direction: column; gap: 6px">

</div>
</template>
</section>
</template>

</div>
</section>
</template>

</div>
</template>
<template id="dc-Calendar">

        pending: pend.map((x) => { const k = K[x.kind] || K.job; const areas = x.payload && x.payload.items ? Object.keys(x.payload.items).filter((a) => x.payload.items[a].length).map((a) => ({ t: AREA[a] + ' · ' + x.payload.items[a].length })) : [];
