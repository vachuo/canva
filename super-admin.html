<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Super admin</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-SuperAdmin">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, sans-serif">
<nav aria-label="Super admin" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px"><a href="super-admin.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><span style="align-self: flex-start; margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: #14161A; color: #FFFFFF; font-size: 12px; font-weight: 600">Vachuo staff · super admin</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Super admin</div><template data-for="{{tabs}}" data-as="t"><button type="button" aria-current="{{t.cur}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer"><span style="flex: 1">{{t.label}}</span><template data-if="{{t.hasN}}"><span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700; text-align: center">{{t.n}}</span></template></button></template></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Internal tools</div><a href="ops.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Ops console</a><a href="admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Admin dashboard</a><a href="super-admin.html" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #1E40AF; background: #E4ECFD">Super admin</a><a href="blog-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Blog admin</a><a href="studio.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Content studio</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #ECECE6; color: #3F444C; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">D</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Daniel O.</span><span style="font-size: 12.5px; color: #62676F">Super admin · AI and platform</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="super-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="sign-in.html" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3vw, 40px); line-height: 1.08; font-weight: 600">Super admin</h1><span style="padding: 4px 10px; border-radius: 999px; background: #14161A; color: #FFFFFF; font-size: 12.5px; font-weight: 700">Vachuo staff · highest access</span></div><p style="margin: 0; max-width: 820px; font-size: 15px; line-height: 1.5; color: #3F444C">The whole Vachuo platform: every organisation, plan, feature, model and region. Changes here affect everyone, so most of them need a second person to approve and all of them are logged.</p></header><p role="note" style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #14161A; color: #EDEDE8; font-size: 13.5px; line-height: 1.45">Signed in with a security key. Two-person rule is on: plan prices, kill switches, model promotions and break-glass access each need a second super admin.</p><template data-if="{{is_overview}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px"><template data-for="{{ovKpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div><div style="display: flex; flex-wrap: wrap; gap: 14px"><section style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Waiting for a second approver</h2></div><template data-for="{{pending}}" data-as="p"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-top: 1px solid #ECECE6"><span style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">{{p.t}}</span><span style="font-size: 12.5px; color: #62676F">{{p.d}}</span></span><template data-if="{{p.open}}"><button type="button" onClick="{{p.ok}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Approve</button><button type="button" onClick="{{p.no}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Reject</button></template><template data-if="{{p.closed}}"><span style="font-size: 13px; font-weight: 600; color: {{p.fg}}">{{p.result}}</span></template></div></template></section><section style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">System status</h2></div><div style="overflow-x: auto; border-radius: 14px; border: 1px solid #E2E2DA"><table style="width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px; background: #FFFFFF"><thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Service</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Status</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Uptime, 30 days</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Last deploy</th></tr></thead><tbody><template data-for="{{services}}" data-as="r"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{r.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 3px 9px; border-radius: 999px; background: {{r.statusBg}}; color: {{r.statusFg}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.status}}</span></td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.up}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.deploy}}</td></tr></template></tbody></table></div></section></div></div>
</template>
<template data-if="{{is_tenants}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><input aria-label="Search" value="{{tQ}}" onChange="{{tSetQ}}" placeholder="Search organisations" style="flex: 1 1 240px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></div><div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 70px; font-size: 12.5px; font-weight: 600; color: #62676F">Type</span><template data-for="{{tTypes}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div><div style="overflow-x: auto; border-radius: 14px; border: 1px solid #E2E2DA"><table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14px; background: #FFFFFF"><thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Organisation</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Type</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Plan</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Learners</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Region</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Status</th><th scope="col" style="padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; text-align: right">Actions</th></tr></thead><tbody><template data-for="{{tenants}}" data-as="r"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{r.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.type}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.plan}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.learners}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.region}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 3px 9px; border-radius: 999px; background: {{r.statusBg}}; color: {{r.statusFg}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.status}}</span></td><td style="padding: 6px 12px; border-bottom: 1px solid #ECECE6; text-align: right; white-space: nowrap"><template data-for="{{r.acts}}" data-as="x"><button type="button" onClick="{{x.go}}" style="min-height: 36px; margin-left: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{x.t}}</button></template></td></tr></template></tbody></table></div><p style="margin: 0; font-size: 12.5px; color: #62676F">Opening an organisation as its admin needs a reason, the customer’s permission for anything beyond settings, and is shown to them in their audit log.</p></div>
</template>
<template data-if="{{is_plans}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Plans and prices</h2><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #62676F">Prices per currency. A change needs a second approver and reaches customers at their next billing date, with 30 days’ notice.</p></div><div style="overflow-x: auto; border-radius: 14px; border: 1px solid #E2E2DA"><table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14px; background: #FFFFFF"><thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Plan</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">KES</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">USD</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">EUR</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Unit</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Includes</th><th scope="col" style="padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; text-align: right">Actions</th></tr></thead><tbody><template data-for="{{plans}}" data-as="r"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{r.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.kes}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.usd}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.eur}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.unit}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.inc}}</td><td style="padding: 6px 12px; border-bottom: 1px solid #ECECE6; text-align: right; white-space: nowrap"><template data-for="{{r.acts}}" data-as="x"><button type="button" onClick="{{x.go}}" style="min-height: 36px; margin-left: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{x.t}}</button></template></td></tr></template></tbody></table></div><span role="status" style="font-size: 13px; color: #92400E">{{planMsg}}</span></div>
</template>
<template data-if="{{is_flags}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Feature flags and kill switches</h2><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #62676F">Roll features out gradually. Kill switches stop a feature everywhere within a minute.</p></div><template data-for="{{flags}}" data-as="f"><div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px"><span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; font-weight: 600">{{f.key}}</span><span style="font-size: 13px; color: #62676F">{{f.d}}</span></span><label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Rollout<input type="range" min="0" max="100" step="5" value="{{f.pct}}" onChange="{{f.setPct}}" aria-label="{{f.aria}}" style="width: 160px; accent-color: #1D4ED8"><span style="min-width: 44px; font-family: ui-monospace, Menlo, monospace">{{f.pctLabel}}</span></label><button type="button" onClick="{{f.kill}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.kbd}}; background: {{f.kbg}}; color: {{f.kfg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">{{f.killLabel}}</button></div><span style="font-size: 12.5px; color: #3F444C">{{f.overrides}}</span></div></template></div>
</template>
<template data-if="{{is_models}}">
