<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Guide workspace</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Guide">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<nav aria-label="Guide workspace" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="guide.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-size: 10.5px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Guide</div>
<template data-for="{{tabs}}" data-as="t">
<button type="button" aria-current="{{t.current}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; text-align: left; font-size: 15px; font-weight: 500; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}"><span style="flex: 1">{{t.label}}</span><template data-if="{{t.hasCount}}"><span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 12px; font-weight: 700; text-align: center">{{t.count}}</span></template></button>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomGuide}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Start a live class<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a><a href="live-room.html" onClick="{{roomGuideCheckin}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>Open the check-in room</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div><a href="connects.html#guide" onClick="{{viewGuide}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a><a href="clubs.html#guide" onClick="{{viewGuide}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a><a href="showcase.html#guide" onClick="{{viewGuide}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0zM5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Shared with families</div><a href="messages.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>Messages</a><a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg>The loop</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Contribute</div><a href="contribute.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Share materials</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #E4ECFD; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">N</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Nduta K.</span><span style="font-size: 12.5px; color: #62676F">Guide · 4 learners</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="guide.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #F4F7FE"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div>
<div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Guide workspace · Tuesday 3 November</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Good morning, Nduta. Learners lead, Socrates asks, you notice and judge.</h1>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; line-height: 1.55; color: #3F444C; max-width: 760px">Socrates suggests a mark for every piece of drawn or written work. Nothing reaches a learner or a parent until you publish it, and anything in person waits for a parent’s yes.</p>
</header>

<section aria-label="This week" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
<template data-for="{{metrics}}" data-as="m">
<div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{m.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1">{{m.value}}</span><span style="font-size: 12.5px; color: #3F444C">{{m.note}}</span></div>
</template>
</section>

<template data-if="{{isLearners}}">
<section aria-labelledby="g-learners" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-learners" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Your learners</h2><span style="font-size: 13px; color: #62676F">Mastery per skill, how they are doing, and who might need a conversation. No ranks.</span></div>
<div role="group" aria-label="View" style="align-self: flex-start; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{lviews}}" data-as="v"><button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: {{v.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{v.label}}</button></template></div>
<template data-if="{{lviewBoard}}"><div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Signals from this week, in no order of merit. Each one is a reason to talk, not a score. Try Rancière’s three questions: what do you see, what do you think of it, what do you make of it?</p><template data-for="{{talkRows}}" data-as="r"><div style="display: flex; gap: 12px; align-items: flex-start; padding-top: 12px; border-top: 1px solid #ECECE6"><span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: {{r.tint}}; color: {{r.ink}}; display: inline-flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600">{{r.initial}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{r.name}} <span style="font-size: 12px; font-weight: 600; color: {{r.fg}}; background: {{r.bg}}; padding: 2px 8px; border-radius: 999px; margin-left: 4px">{{r.kind}}</span></span><span style="font-size: 14px; line-height: 1.5; color: #3F444C">{{r.signal}}</span><span style="font-size: 13.5px; line-height: 1.5; color: #14161A"><span style="font-weight: 600">Open with: </span>“{{r.ask}}”</span></span></div></template><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #62676F">There is no leaderboard of learners. Ranking children teaches them their place in a line; this view only tells you who to talk to and why.</p></div></template>
<template data-if="{{lviewCards}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px">
<template data-for="{{learners}}" data-as="l">
<article style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: {{l.tint}}; color: {{l.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 600">{{l.initial}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">{{l.name}}</span><span style="font-size: 13px; color: #62676F">{{l.meta}}</span></span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{l.skills}}" data-as="s">
<div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px"><span>{{s.name}}</span><span style="font-family: ui-monospace, monospace; color: #3F444C">{{s.pct}}</span></div><div aria-hidden="true" style="height: 8px; border-radius: 999px; background: #ECECE6; overflow: hidden"><div style="height: 100%; width: {{s.pct}}; border-radius: 999px; background: {{s.bar}}"></div></div></div>
</template>
</div>
<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #FBFBF8; font-size: 13.5px; line-height: 1.5; color: #3F444C"><span style="font-weight: 600; color: #14161A">How they are doing: </span>{{l.wellbeing}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: #3F444C"><span>Next check-in: {{l.next}}</span><a href="messages.html" style="margin-left: auto; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; color: #14161A; text-decoration: none; font-weight: 500">Message family</a></div>
</article>
</template>
</div>
</template>
</section>
</template>

<template data-if="{{isMarking}}">
<section aria-labelledby="g-marking" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-marking" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Marking queue</h2><span style="font-size: 13px; color: #62676F">Socrates’ suggestion sits beside yours. Yours is the mark.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div role="list" style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{queue}}" data-as="q">
<div role="listitem"><button type="button" aria-pressed="{{q.selected}}" onClick="{{q.pick}}" style="width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid {{q.bd}}; background: {{q.bg}}; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; color: #14161A"><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 14.5px; font-weight: 600">{{q.learner}}</span><span style="padding: 2px 8px; border-radius: 999px; background: {{q.chipBg}}; color: {{q.chipFg}}; font-size: 11.5px; font-weight: 700">{{q.status}}</span></span><span style="font-size: 13.5px; color: #3F444C">{{q.task}}</span><span style="font-size: 12px; color: #62676F">{{q.when}}</span></button></div>
</template>
</div>
<article style="flex: 999 1 460px; min-width: 0; padding: 20px 22px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{cur.kind}} · {{cur.learner}}</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2">{{cur.task}}</h3></div>
<div style="padding: 12px 14px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 600; color: #62676F">The question</span><span style="font-size: 14.5px; line-height: 1.5">{{cur.prompt}}</span></div>
<div style="padding: 12px 14px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 600; color: #62676F">{{cur.learner}}’s answer</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 17px; line-height: 1.55; white-space: pre-line">{{cur.answer}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 600; color: #62676F">Rubric</span>
<template data-for="{{cur.rubric}}" data-as="r"><div style="display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45"><span style="flex: none; width: 22px; font-family: ui-monospace, monospace; font-weight: 600">{{r.n}}</span><span style="color: #3F444C">{{r.t}}</span></div></template>
</div>
<div style="padding: 12px 14px; border-radius: 12px; background: #F4F7FE; border: 1px solid #DCE6FD; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; font-weight: 700; color: #1E40AF">Suggested by Socrates · {{cur.ai}} of 4</span><span style="font-size: 13.5px; line-height: 1.5; color: #23272E">{{cur.aiWhy}}</span></div>
<template data-if="{{curOpen}}">
<div style="display: flex; flex-direction: column; gap: 8px"><span id="g-score" style="font-size: 13.5px; font-weight: 600">Your mark</span>
<div role="group" aria-labelledby="g-score" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{scores}}" data-as="s"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 15px; font-weight: 600; cursor: pointer">{{s.n}}</button></template>
</div>
<label for="g-feedback" style="font-size: 13.5px; font-weight: 600">Feedback for {{cur.learner}}</label>
<textarea id="g-feedback" rows="3" value="{{feedback}}" onChange="{{setFeedback}}" placeholder="What she did well, and one thing to try next" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14.5px; line-height: 1.5; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><button type="button" onClick="{{publish}}" disabled="{{publishOff}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Publish to {{cur.learner}} and family</button><span style="font-size: 12.5px; color: #62676F">{{publishHint}}</span></div>
</div>
</template>
<template data-if="{{curDone}}">
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #DDF4F1; color: #115E59; font-size: 14px; line-height: 1.5">{{doneLine}}</p>
</template>
</article>
</div>
</section>
</template>

<template data-if="{{isSchedule}}">
<section aria-labelledby="g-schedule" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-schedule" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">This week</h2><span style="font-size: 13px; color: #62676F">Online check-ins are booked straight away. In-person sessions wait for a parent.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div role="list" style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div role="listitem" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; border-radius: 14px; background: #F4F7FE; border: 1px solid #DCE6FD"><span style="flex: none; width: 92px; font-family: ui-monospace, monospace; font-size: 13px; color: #1E40AF">Sat 10:00</span><span style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">You’re hosting the Agora: “What makes a rule a good rule?”</span><span style="font-size: 12.5px; color: #3F444C">Online · free · any age · no marks. Ask, listen, and let the learners answer each other. Socrates only takes notes.</span></span><a href="connects.html" style="flex: none; font-size: 13.5px; font-weight: 600">See the Agora</a></div>
<template data-for="{{sessions}}" data-as="s">
<div role="listitem" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="flex: none; width: 92px; font-family: ui-monospace, monospace; font-size: 13px; color: #3F444C">{{s.when}}</span><span style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">{{s.title}}</span><span style="font-size: 12.5px; color: #62676F">{{s.where}}</span></span><span style="padding: 2px 9px; border-radius: 999px; background: {{s.chipBg}}; color: {{s.chipFg}}; font-size: 12px; font-weight: 700">{{s.status}}</span></div>
</template>
</div>
<form onSubmit="{{addSession}}" style="flex: 1 1 280px; min-width: 0; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Book a session</h3>
<label for="g-who" style="font-size: 13px; font-weight: 600">Learner</label>
<select id="g-who" value="{{fWho}}" onChange="{{setWho}}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><option value="Amani">Amani</option><option value="Johari">Johari</option><option value="Bob">Bob</option><option value="Kim">Kim</option></select>
<label for="g-type" style="font-size: 13px; font-weight: 600">Kind</label>
<select id="g-type" value="{{fType}}" onChange="{{setType}}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><option value="online">Online check-in</option><option value="person">In person</option></select>
<label for="g-when" style="font-size: 13px; font-weight: 600">When</label>
<input id="g-when" type="text" value="{{fWhen}}" onChange="{{setWhen}}" placeholder="Thu 5 Nov, 16:00" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px">
<template data-if="{{fPerson}}"><label for="g-where" style="font-size: 13px; font-weight: 600">Where</label><input id="g-where" type="text" value="{{fWhere}}" onChange="{{setWhere}}" placeholder="Kilimani Library, reading room" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></template>
<button type="submit" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">{{bookLabel}}</button>
<span aria-live="polite" style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{bookNote}}</span>
</form>
</div>
</section>
</template>

<template data-if="{{isCheckins}}">
<section aria-labelledby="g-ci" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-ci" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Check-ins this week</h2><span style="font-size: 14px; color: #62676F">20 minutes each, for the why: motivation, big decisions and bad days. Try three questions before any advice: what do you see, what do you think of it, what do you make of it?</span></div>
<template data-for="{{checkins}}" data-as="c"><article style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">{{c.name}}</span><span style="font-size: 13px; color: #62676F">{{c.when}} · online</span></span><a href="live-room.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">Join the room</a></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #F4F7FE"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Suggested by Socrates · talking points</span><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.45"><template data-for="{{c.points}}" data-as="p"><li>{{p.t}}</li></template></ul></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 600">How did it feel?</span><div role="group" aria-label="How did it feel?" style="display: flex; gap: 6px"><template data-for="{{c.moods}}" data-as="m"><button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: {{m.bg}}; color: {{m.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{m.m}}</button></template></div></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Your notes<textarea rows="2" value="{{c.notes}}" onChange="{{c.setNotes}}" placeholder="What did you agree?" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></textarea></label><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><button type="button" onClick="{{c.save}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Save notes</button><span role="status" style="font-size: 13px; color: #115E59">{{c.savedLine}}</span></div></article></template>
</section>
</template>

<template data-if="{{isApprovals}}">
<section aria-labelledby="g-ap" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-ap" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Approvals</h2><span style="font-size: 14px; color: #62676F">You suggest; parents decide anything in person, public or paid.</span></div>
<template data-if="{{hasLearnerReq}}"><article style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #92400E">For you first · from Johari</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Swap her science project from “Mixtures” to “How a sufuria cleans water”</span><span style="font-size: 14px; line-height: 1.5; color: #3F444C">Same skills and the same deadline. If you agree, it goes to her parent for the final yes.</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{lrYes}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Agree and send to parent</button><button type="button" onClick="{{lrNo}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Not this time</button></div></article></template>
<template data-if="{{lrDone}}"><p role="status" style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #DDF4F1; color: #115E59; font-size: 14px; font-weight: 600">{{lrLine}}</p></template>
<div style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Sent to parents</span><template data-for="{{sent}}" data-as="a"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; border-top: 1px solid #ECECE6"><span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{a.title}}</span><span style="font-size: 13px; color: #62676F">{{a.to}}</span></span><span style="padding: 3px 9px; border-radius: 999px; background: {{a.bg}}; color: {{a.fg}}; font-size: 12.5px; font-weight: 600">{{a.status}}</span></div></template></div>
</section>
</template>

<template data-if="{{isCreate}}">
<section aria-labelledby="g-create" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="g-create" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Create a lesson or loop</h2><span style="font-size: 13px; color: #62676F">Objectives map to a curriculum standard; every item carries a Bloom level.</span></div>
<form onSubmit="{{saveDraft}}" style="padding: 20px 22px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="g-lq" style="font-size: 13px; font-weight: 600">The learner question this starts from <span style="font-weight: 400; color: #92400E">· required</span></label>
<input id="g-lq" type="text" value="{{lQ}}" onChange="{{setLQ}}" placeholder="e.g. How do recipes scale for 40 people?" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid {{lQBd}}; background: #FFFFFF; color: #14161A; font-size: 14px">
<span style="font-size: 12.5px; color: #62676F">A real question a learner asked, in their words. Lessons that start from a question stick.</span>
<label for="g-title" style="font-size: 13px; font-weight: 600">Title</label>
<input id="g-title" type="text" value="{{lTitle}}" onChange="{{setTitle}}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px">
<label for="g-std" style="font-size: 13px; font-weight: 600">Curriculum standard</label>
<select id="g-std" value="{{lStd}}" onChange="{{setStd}}" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><option value="cbc">Kenya CBC · Grade 6 Mathematics · Ratios</option><option value="us">US Common Core · 6.RP.A.1 · Ratio language</option><option value="uk">England NC · KS3 · Ratio and proportion</option></select>
<label for="g-obj" style="font-size: 13px; font-weight: 600">What the learner will be able to do</label>
<textarea id="g-obj" rows="3" value="{{lObj}}" onChange="{{setObj}}" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; line-height: 1.5; resize: vertical"></textarea>
<label for="g-ctx" style="font-size: 13px; font-weight: 600">What Socrates should know</label>
<textarea id="g-ctx" rows="3" value="{{lCtx}}" onChange="{{setCtx}}" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; line-height: 1.5; resize: vertical"></textarea>
<span style="font-size: 12.5px; line-height: 1.45; color: #62676F">Socrates uses this to tutor. It never gives answers during an assessment.</span>
<span style="margin-top: 6px; font-size: 13px; font-weight: 600">Videos, audio and resources</span><label style="position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Upload a file<input type="file" accept="video/*,audio/*,application/pdf,image/*" onChange="{{upPick}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label><template data-for="{{ups}}" data-as="u"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="flex: 1 1 180px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere">{{u.name}}</span><span style="font-size: 12px; color: #62676F">{{u.meta}}</span><button type="button" onClick="{{u.remove}}" style="min-height: 36px; padding: 0 8px; border: none; background: transparent; color: #1D4ED8; font-size: 13px; text-decoration: underline; cursor: pointer">Remove</button></div><span style="font-size: 12.5px; font-weight: 600; color: #115E59">{{u.status}}</span><template data-if="{{u.hasPreview}}"><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{u.preview}}</span></template></div></template><template data-if="{{upsNone}}"><span style="font-size: 12.5px; line-height: 1.45; color: #62676F">Video and audio get a transcript and captions automatically, in English and Kiswahili. Check them before you publish.</span></template>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600">Practice items</span>
<template data-for="{{items}}" data-as="it"><div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><span style="flex: none; padding: 2px 8px; border-radius: 6px; background: #E4ECFD; color: #1E40AF; font-size: 11.5px; font-weight: 700">{{it.bloom}}</span><span style="flex: 1; font-size: 13.5px; line-height: 1.45">{{it.t}}</span><button type="button" aria-label="Remove item" onClick="{{it.remove}}" style="flex: none; width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: #62676F; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></template>
<label for="g-item" style="font-size: 13px; font-weight: 600">New item</label>
<input id="g-item" type="text" value="{{newItem}}" onChange="{{setNewItem}}" placeholder="A recipe for 4 uses 3 cups of flour. How much for 10?" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px">
<div role="group" aria-label="Bloom level" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{blooms}}" data-as="b"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{b.bd}}; background: {{b.bg}}; color: {{b.fg}}; font-size: 13px; font-weight: 500; cursor: pointer">{{b.name}}</button></template>
</div>
<button type="button" onClick="{{addItem}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Add item</button>
</div>
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 6px; border-top: 1px solid #ECECE6">
<button type="submit" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 700; cursor: pointer">Save draft</button>
<span aria-live="polite" style="font-size: 13px; color: #3F444C">{{draftNote}}</span>
</div>
</form>
</section>
