<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #62676F">Storyboard</span><template data-for="{{stScenes}}" data-as="s"><div style="display: flex; align-items: center; gap: 8px"><label for="{{s.id}}" style="flex: none; width: 64px; font-size: 12px; font-weight: 600; color: #62676F">{{s.n}}</label><input id="{{s.id}}" value="{{s.v}}" onInput="{{s.set}}" placeholder="What happens in this scene?" style="flex: 1 1 auto; min-width: 0; min-height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #DCDCD3; background: #FFFFFF; color: #14161A; font-size: 13.5px"></div></template><button type="button" onClick="{{stAddScene}}" style="align-self: flex-start; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 12.5px; cursor: pointer">+ Scene</button></div>

</template>
<template data-if="{{stHasMsg}}"><p role="status" style="margin: 0; padding: 8px 12px; border-radius: 10px; background: #FEF6E4; font-size: 12.5px; color: #92400E">{{stMsg}}</p></template>
</template>

<template data-if="{{stViewing}}">

<template data-if="{{stHasPages}}">

<template data-if="{{stHasPageImg}}"><img src="{{stPageImg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain"></template>
<canvas ref="{{stPad}}" aria-label="The drawing on this page" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"></canvas>
<template data-if="{{stIsComic}}"><template data-for="{{stPanels}}" data-as="p"><template data-if="{{p.v}}"><span style="position: absolute; left: calc({{p.left}} + 16px); top: calc({{p.top}} + 16px); max-width: calc(50% - 40px); padding: 6px 10px; border-radius: 14px; border: 2px solid #14161A; background: #FFFFFF; color: #14161A; font-family: 'Comic Neue', 'Comic Sans MS', Inter, sans-serif; font-size: 13.5px; font-weight: 700">{{p.v}}</span></template></template></template>
</div>
<template data-if="{{stNotComic}}"><p style="margin: 0; white-space: pre-wrap; font-family: 'EB Garamond', Georgia, serif; font-size: 20px; line-height: 1.5; color: #14161A">{{stPageText}}</p><template data-if="{{stCanRead}}"><button type="button" onClick="{{stReadPage}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; font-weight: 600; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7"/></svg>{{stReadLabel}}</button></template></template>
<template data-if="{{stMulti}}"><div role="group" aria-label="Turn the page" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><template data-for="{{stPages}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{c.t}}</button></template><span style="font-size: 12px; color: #62676F">{{stPageLabel}}</span></div></template>
</template>
<template data-if="{{stIsMedia}}">
<template data-if="{{stMediaVideo}}"><video src="{{stMediaUrl}}" controls style="width: 100%; max-height: 420px; border-radius: 12px; background: #14161A"></video></template>
<template data-if="{{stMediaAudio}}"><audio src="{{stMediaUrl}}" controls style="width: 100%"></audio></template>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #14161A"><template data-for="{{stPrevScenes}}" data-as="s"><li>{{s.t}}</li></template></ol>
<template data-if="{{stIsAudio}}"><p style="margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.55; color: #3F444C">{{stTranscript}}</p></template>
</template>
<p style="margin: 0; font-size: 12px; color: #62676F">{{stLicLine}}<template data-if="{{stAiLabel}}"> · Made with help from an AI tool</template></p>
</template>
</section>

<template data-if="{{stCanShare}}">
<aside aria-label="Share and rights" style="flex: 1 1 320px; max-width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<section aria-labelledby="st-sh-h" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA">
<h2 id="st-sh-h" style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-size: 21px; font-weight: 600; color: #14161A">Share it</h2>
<template data-if="{{stPublished}}"><p style="margin: 0; padding: 8px 10px; border-radius: 10px; background: #F4F7FE; font-size: 12.5px; line-height: 1.45; color: #1E3A8A">{{stPubText}}</p></template>
<template data-for="{{stDests}}" data-as="t"><button type="button" role="switch" aria-checked="{{t.on}}" onClick="{{t.flip}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: 1px solid #ECECE6; background: #FBFBF8; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; position: relative; width: 38px; height: 22px; border-radius: 999px; background: {{t.track}}"><span style="position: absolute; top: 3px; left: {{t.knob}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span><span style="display: flex; flex-direction: column; gap: 1px"><b style="font-size: 13.5px; color: #14161A">{{t.t}}</b><span style="font-size: 12px; color: #62676F">{{t.d}}</span></span></button></template>
<template data-if="{{stHasAud}}"><div role="group" aria-label="Who sees it on Showcase" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{stAud}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 12.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div><template data-if="{{stIsLearner}}"><span style="font-size: 11.5px; color: #62676F">{{stAudNote}}</span></template></template>
<template data-if="{{stAsk}}"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #62676F">A note for Wanjiru (optional)<input value="{{stSays}}" onInput="{{stSetSays}}" placeholder="Why you want to share it" style="min-height: 38px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #DCDCD3; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 400"></label></template>
<template data-if="{{stPending}}"><p role="status" style="margin: 0; padding: 8px 10px; border-radius: 10px; background: #FEF1D9; font-size: 12.5px; line-height: 1.45; color: #92400E">{{stPendingText}}</p></template>
<template data-if="{{stDeclined}}"><p role="status" style="margin: 0; padding: 8px 10px; border-radius: 10px; background: #FBE1DF; font-size: 12.5px; line-height: 1.45; color: #A3271F">{{stDeclinedText}}</p></template>
<button type="button" onClick="{{stShare}}" style="min-height: 46px; padding: 0 18px; border-radius: 999px; border: none; background: {{stShareBg}}; color: {{stShareFg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{stShareLabel}}</button>
<span style="font-size: 12px; font-weight: 600; color: {{stShareFg}}">{{stBlockText}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><template data-if="{{stPublished}}"><button type="button" onClick="{{stUnshare}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 12.5px; cursor: pointer">Unshare</button></template><button type="button" onClick="{{stDelete}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DA; background: #FFFFFF; color: #92400E; font-size: 12.5px; cursor: pointer">Delete</button></div>
</section>

<button type="button" role="switch" aria-checked="{{stOwnWork}}" onClick="{{stFlipOwn}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 1px solid #ECECE6; background: #FBFBF8; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; position: relative; width: 38px; height: 22px; border-radius: 999px; background: {{stOwnTrack}}"><span style="position: absolute; top: 3px; left: {{stOwnKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span><b style="font-size: 13.5px; color: #14161A">It’s all my own work</b></button>
<template data-for="{{stSources}}" data-as="s">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid #ECECE6; background: #FBFBF8">
<span style="font-size: 12px; font-weight: 700; color: #62676F">{{s.n}}</span>
<label for="{{s.idw}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">What you used</label><input id="{{s.idw}}" value="{{s.what}}" onInput="{{s.setWhat}}" placeholder="What you used, e.g. background music" style="min-height: 36px; box-sizing: border-box; width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid #DCDCD3; background: #FFFFFF; color: #14161A; font-size: 13px">
<label for="{{s.idl}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Where it came from</label><input id="{{s.idl}}" value="{{s.link}}" onInput="{{s.setLink}}" placeholder="Link, or where you found it" style="min-height: 36px; box-sizing: border-box; width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid #DCDCD3; background: #FFFFFF; color: #14161A; font-size: 13px">
<div style="display: flex; gap: 6px; align-items: center"><label for="{{s.ids}}" style="font-size: 12px; font-weight: 600; color: #62676F">Licence</label><select id="{{s.ids}}" value="{{s.lic}}" onChange="{{s.setLic}}" style="flex: 1 1 auto; min-height: 36px; padding: 0 8px; border-radius: 8px; border: 1px solid #DCDCD3; background: #FFFFFF; color: #14161A; font-size: 13px"><template data-for="{{stLicOpts}}" data-as="o"><option value="{{o.v}}">{{o.t}}</option></template></select><button type="button" onClick="{{s.drop}}" aria-label="Remove {{s.n}}" style="flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid #E2E2DA; background: #FFFFFF; color: #62676F; cursor: pointer">×</button></div>
</div>
</template>
<button type="button" onClick="{{stAddSource}}" style="align-self: flex-start; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 12.5px; cursor: pointer">+ I used something made by someone else</button>
<button type="button" role="switch" aria-checked="{{stAi}}" onClick="{{stFlipAi}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 1px solid #ECECE6; background: #FBFBF8; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; position: relative; width: 38px; height: 22px; border-radius: 999px; background: {{stAiTrack}}"><span style="position: absolute; top: 3px; left: {{stAiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span><b style="font-size: 13.5px; color: #14161A">An AI tool helped make this</b></button>

<p style="margin: 0; font-size: 11.5px; line-height: 1.45; color: #62676F">Think something on Vachuo uses your work without permission? Write to hello@vachuo.com and we take it down while we check.</p>
</section>
</aside>
</template>
</div>
</template>

        pages: [
          pg('Chapter 1: A bottle that counts rain\nOn Monday, Mwalimu Nduta gave our club a strange job: catch the rain and count it. Juma cut the top off a plastic bottle and turned it upside down like a funnel. I drew a ruler on a strip of tape, one line for every five millimetres, and stuck it on the side. We put the gauge in the middle of the field, far from the roofs and trees, so the drips couldn’t cheat. “Every morning at seven,” said Juma, “we read it and empty it.” We shook hands. We were the Rain Gauge Crew.', 'rain-gauge'),
          pg('Chapter 2: Wednesday’s storm\nTuesday gave us twelve millimetres, which felt like a lot. Then came Wednesday. The sky went the colour of a cooking pot, and the rain hammered the tin roofs so loudly that our teacher stopped talking. Thirty-one millimetres! The water was nearly at the top line. Juma wanted to call the newspaper. I wanted to know why. If Tuesday was twelve and Wednesday was thirty-one, would Thursday be even more? I wrote my guess in my notebook: fifty.'),
