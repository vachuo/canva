<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:30px;padding:3px 0;box-sizing:border-box;font-size:13.5px;line-height:1.3;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}
.rm{display:flex;flex-direction:column;gap:18px;outline:none}.rm:focus-visible{outline:2px solid #7FA2EE;outline-offset:8px;border-radius:24px}.rm-rail{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.rm-line{position:absolute;left:12.5%;right:12.5%;top:21px;height:3px;border-radius:2px;background:#E2E2DA;overflow:hidden}.rm-line span{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .4s ease}.rm-step{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px 4px;border:none;background:transparent;color:#14161A;font-family:Inter,system-ui,sans-serif;cursor:pointer;text-align:center}.rm-dot{width:42px;height:42px;border-radius:50%;border:2px solid;display:inline-flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;transition:background-color .35s ease,border-color .35s ease,color .35s ease,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}.rm-step[aria-current="true"] .rm-dot{transform:scale(1.12);box-shadow:0 8px 18px -10px rgba(20,22,26,.55)}.rm-step:hover .rm-dot{transform:scale(1.08)}.rm-sl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#62676F}.rm-st{font-size:13.5px;font-weight:600;line-height:1.3}.rm-here{position:absolute;top:-6px;left:calc(50% + 12px);padding:1px 7px;border-radius:999px;background:#14161A;color:#FFFFFF;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap}.rm-view{position:relative;overflow:hidden;padding:10px 0 26px;margin:-10px 0 -26px;touch-action:pan-y;user-select:none}.rm-track{list-style:none;margin:0;padding:0;display:flex;gap:16px;transition:transform .65s cubic-bezier(.2,.8,.2,1)}.rm-card{flex:0 0 min(420px,86%);box-sizing:border-box;position:relative;display:flex;flex-direction:column;gap:12px;padding:26px 26px 22px;border-radius:22px;background:#FFFFFF;border:1px solid #E2E2DA;overflow:hidden;cursor:pointer;transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .5s ease,box-shadow .5s ease}.rm-card.on{cursor:default;box-shadow:0 30px 60px -34px rgba(20,22,26,.45)}.rm-card.off{transform:scale(.93);opacity:.5}.rm-card.off:hover{opacity:.75}.rm-card .rm-in{display:flex;flex-direction:column;gap:12px;flex:1}.rm-card.on .rm-in>*{animation:rmUp .55s cubic-bezier(.2,.8,.2,1) both}.rm-card.on .rm-in>*:nth-child(2){animation-delay:.06s}.rm-card.on .rm-in>*:nth-child(3){animation-delay:.12s}.rm-card.on .rm-in>*:nth-child(4){animation-delay:.18s}@keyframes rmUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes rmPulse{0%{box-shadow:0 0 0 0 rgba(249,168,38,.55)}70%{box-shadow:0 0 0 8px rgba(249,168,38,0)}100%{box-shadow:0 0 0 0 rgba(249,168,38,0)}}.rm-live{width:8px;height:8px;border-radius:50%;background:#14161A;animation:rmPulse 1.8s ease-out infinite}.rm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;min-width:42px;padding:0 14px;border-radius:999px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font-family:Inter,system-ui,sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background-color .2s ease,transform .15s ease}.rm-btn:hover{background:#F4F4EF}.rm-btn:active{transform:scale(.96)}.rm-btn[aria-pressed="true"]{background:#14161A;border-color:#14161A;color:#FFFFFF}.rm-pip{height:8px;border:none;padding:0;border-radius:999px;cursor:pointer;transition:width .35s ease,background-color .35s ease}.rm-prog{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.85}.rm-card.on .rm-prog.run{animation:rmProg 5s linear both}@keyframes rmProg{from{width:0}to{width:100%}}[data-theme="dark"] .rm-card,[data-theme="dark"] .rm-btn{background:#1A1D22;border-color:#2B3038;color:#EDEDE8}[data-theme="dark"] .rm-step{color:#EDEDE8}[data-theme="dark"] .rm-line{background:#2B3038}@media (max-width:640px){.rm-st{display:none}.rm-here{display:none}.rm-card{padding:22px 20px 18px}}@media (prefers-reduced-motion:reduce){.rm-track,.rm-card,.rm-dot,.rm-line span{transition:none}.rm-card.on .rm-in>*,.rm-live,.rm-card.on .rm-prog.run{animation:none}}.wd-li{display:flex;gap:10px;align-items:flex-start}.dk-front .wd-li{animation:rmUp .5s cubic-bezier(.2,.8,.2,1) both}.dk-front .wd-li:nth-child(2){animation-delay:.05s}.dk-front .wd-li:nth-child(3){animation-delay:.1s}.dk-front .wd-li:nth-child(4){animation-delay:.15s}.dk-front .wd-li:nth-child(5){animation-delay:.2s}@media (prefers-reduced-motion:reduce){.dk-front .wd-li{animation:none}}
.dk-card{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease,box-shadow .4s ease,background-color .4s ease;transform-origin:50% 100%}.dk-in{transition:opacity .3s ease}.dk-back:hover{box-shadow:0 16px 30px -20px rgba(20,22,26,.5)!important}.dk-stack:focus-visible{outline:2px solid #7FA2EE;outline-offset:8px;border-radius:26px}.dk-ix{transition:background-color .2s ease,border-color .2s ease}.dk-ix:hover{background:#FFFFFF!important;border-color:#CFCFC6!important}.dk-dot{transition:width .3s ease,background-color .3s ease}.dk-btn:hover{background:#F4F4EF!important}.dk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[data-theme="dark"] .dk-btn{background:#22262D!important;border-color:#3A4049!important;color:#EDEDE8!important}@media (max-width:760px){.dk-index{display:none!important}}@media (max-width:520px){.dk-lbl{display:none}.dk-btn{padding:0 12px!important}}@media (prefers-reduced-motion:reduce){.dk-card,.dk-in,.dk-dot{transition:none}}
</style>

<body>
<div id="app"></div>
<template id="dc-About">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, sans-serif">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA">
<div lang="{{svChromeLang}}" dir="{{svDir}}" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="index.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navPricing}}</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #1E40AF">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>
<main id="top">
<section aria-labelledby="ab-h" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 7vw, 104px) clamp(16px, 5vw, 72px); display: flex; flex-direction: column; gap: 22px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1E40AF">Company · About</span><h1 id="ab-h" style="margin: 0; max-width: 1100px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(44px, 6vw, 84px); line-height: 0.98; letter-spacing: -0.025em; font-weight: 600; text-wrap: balance">Vachuo builds tools that give learning back to learners, and to the people who love them.</h1><p style="margin: 0; max-width: 820px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(20px, 1.8vw, 26px); line-height: 1.45; color: #3F444C">Every child is born able to learn. Our mission is to give every learner a companion that asks, a web of real people and places, and a record that is theirs, with the learner and the people who love them in charge.</p><nav aria-label="On this page" style="display: flex; flex-wrap: wrap; gap: 8px"><a href="#plan" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">Our plan</a><a href="#charter" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">The Vachuo Charter</a></nav></section>
<section id="plan" aria-labelledby="plan-h" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px); display: flex; flex-direction: column; gap: 24px; scroll-margin-top: 80px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #115E59">Our plan</span><h2 id="plan-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 56px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">Our plan for AI school, education and personalised learning</h2><p style="margin: 0; max-width: 820px; font-size: 18px; line-height: 1.6; color: #3F444C">Everyone will soon have an AI tutor. A tutor is not enough. Learning also needs the learner’s own questions, people and places, rest, and a record she owns. Vachuo builds those, one step at a time, and only moves to the next step when the evidence says the last one worked.</p><div class="rm" role="region" aria-roledescription="carousel" aria-label="Our plan, step by step" tabindex="0" onKeyDown="{{rmKey}}"><ol class="rm-rail" aria-label="Stages of the plan"><li aria-hidden="true" style="display: contents"><span class="rm-line"><span style="width: {{rmFill}}; background: {{rmFillC}}"></span></span></li><template data-for="{{rmSteps}}" data-as="x"><li style="position: relative"><button type="button" class="rm-step" aria-current="{{x.cur}}" aria-label="{{x.aria}}" onClick="{{x.go}}"><span class="rm-dot" style="background: {{x.bg}}; border-color: {{x.bd}}; color: {{x.fg}}">{{x.n}}</span><span class="rm-sl">{{x.when}}</span><span class="rm-st">{{x.title}}</span><template data-if="{{x.here}}"><span class="rm-here">We are here</span></template></button></li></template></ol><div class="rm-view" onPointerDown="{{rmDown}}" onPointerUp="{{rmUp}}"><ol class="rm-track" style="transform: {{rmTf}}"><template data-for="{{rmCards}}" data-as="c"><li class="rm-card {{c.cls}}" role="group" aria-roledescription="slide" aria-label="{{c.aria}}" aria-hidden="{{c.hid}}" onClick="{{c.go}}" style="color: {{c.ac}}"><span aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; height: 5px; background: {{c.ac}}"></span><div class="rm-in" style="color: #14161A"><span style="display: flex; align-items: center; gap: 10px"><span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; font-weight: 600; color: #62676F">{{c.n}}</span><span style="display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 999px; background: {{c.pbg}}; color: {{c.pfg}}; font-size: 12px; font-weight: 700"><template data-if="{{c.now}}"><span class="rm-live" aria-hidden="true"></span></template>{{c.when}}</span><span style="margin-left: auto; font-size: 12px; color: #62676F">{{c.state}}</span></span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(28px, 2.6vw, 34px); font-weight: 600; line-height: 1.05; letter-spacing: -0.01em">{{c.title}}</span><span style="font-size: 16px; line-height: 1.55; color: #3F444C">{{c.text}}</span><span style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: {{c.tint}}; font-size: 14px; line-height: 1.5; color: #23272E"><span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: {{c.ac}}; display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg></span><span><strong>Before the next step:</strong> {{c.gate}}</span></span></div><span class="rm-prog {{c.run}}" aria-hidden="true"></span></li></template></ol></div><div style="display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 10px"><button type="button" class="rm-btn" onClick="{{rmPrev}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: center"><div role="group" aria-label="Choose a step" style="display: flex; align-items: center; gap: 6px"><template data-for="{{rmSteps}}" data-as="x"><button type="button" class="rm-pip" aria-label="{{x.aria}}" aria-current="{{x.cur}}" onClick="{{x.go}}" style="width: {{x.pw}}; background: {{x.pc}}"></button></template><span style="margin-left: 6px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #62676F">{{rmCount}}</span></div><button type="button" class="rm-btn" aria-pressed="{{rmPlayP}}" onClick="{{rmPlay}}">{{rmPlayL}}</button></div><button type="button" class="rm-btn" onClick="{{rmNext}}" aria-label="Next step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div><p class="dk-sr" role="status" aria-live="polite">{{rmLive}}</p></div><h3 style="margin: 8px 0 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Who does what</h3><div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-family: Inter, system-ui, sans-serif"><span style="font-size: 13.5px; color: #62676F">{{wdHint}}</span><button type="button" aria-pressed="{{wdAllA}}" onClick="{{wdToggleAll}}" class="dk-btn" style="display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{wdAllLabel}}</button></div>
<template data-if="{{wdDeck}}">

-ui, sans-serif; font-size: 16px; line-height: 1.45; color: #14161A"><template data-for="{{c.items}}" data-as="t"><li class="wd-li"><span aria-hidden="true" style="flex: none; margin-top: 2px; width: 20px; height: 20px; border-radius: 50%; background: {{c.ac}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>{{t.t}}</span></li></template></ul></div></article></template></div>

<section id="charter" aria-labelledby="ch-h" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA; scroll-margin-top: 80px"><div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; gap: 40px"><div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #92400E">The Vachuo Charter</span><h2 id="ch-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 56px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">The principles we hold ourselves to</h2><p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3F444C">The charter guides what we build, who we partner with and what we will not do. When a decision is hard, it is the test we use.</p><p style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #F4F4EF; font-size: 14.5px; line-height: 1.55; color: #3F444C">We publish a report against this charter every year. To raise a concern, write to <a href="mailto:hello@vachuo.com">hello@vachuo.com</a>.</p></div><ol style="flex: 2 1 560px; list-style: none; margin: 0; padding: 0"><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">1</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Learners come first</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">We judge every decision by what a learner can do afterwards, not by how long they spent on a screen.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">2</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">People decide</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Socrates proposes. A learner, a parent or a guide decides. AI never has the last word about a child.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">3</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Children’s safety before growth</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Anything public, paid or in person waits for a guardian. Strangers never reach a child directly. Every reply passes a safety check before and after the model.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">4</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Privacy by default</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">A child’s data belongs to the family. We collect only what teaching needs, never sell it, never advertise, and make export and deletion easy.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">5</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Evidence over engagement</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">We measure mastery and wellbeing, and we don’t use streaks, badges or dark patterns to keep anyone hooked. Open hours stay unobserved.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">6</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Available to every family</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Prices in local currency, a free tier, low-bandwidth and offline use, and learning in Kiswahili and other local languages.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">7</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Honest about limits</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Socrates can be wrong, and we say so. We publish how it performs on our safety and accuracy checks, including where it falls short.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">8</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">With teachers, not around them</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">The human work of teaching stays with people. We build tools for guides and partner with schools and governments rather than replace them.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">9</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Stewardship for the long term</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">We report against this charter every year and change course when the evidence says we should.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">10</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">We never diagnose or sort children</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">No ability labels and no ranking of learners against each other. Personality questionnaires are optional, belong to the learner, and are never used to place, grade or sort. Biometric sign-off is optional, needs a guardian’s consent and the child’s own agreement, and a person can always check a learner in instead. Levels describe a piece of work, never a child.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">11</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Leisure is protected</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Open time is the centre of a learner’s week. We never schedule over it, track it, score it or report it.</span></span></li><li style="display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; padding: 22px 0; border-top: 1px solid #E2E2DA"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; color: #1D4ED8">12</span><span style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.15">Talking with Socrates is free</span><span style="font-size: 16.5px; line-height: 1.6; color: #3F444C">Asking questions should never depend on a family’s budget. Socrates’ Ask mode is free on every plan, without limit; we charge for the tools around it.</span></span></li></ol></div></section>

in-top: 6px; font-size: 14px; font-weight: 600; color: #1D4ED8">Read →</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; color: #14161A; text-decoration: none"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Careers</span><span style="font-size: 14.5px; line-height: 1.5; color: #3F444C">Build the school with us.</span><span style="margin-top: 6px; font-size: 14px; font-weight: 600; color: #1D4ED8">Read →</span></a></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; padding: 24px; border-radius: 22px; background: #14161A; color: #EDEDE8"><span style="flex: 1 1 320px; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">Bring Vachuo to your family or school.</span><a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 700; text-decoration: none">Request early access</a></div></section>
