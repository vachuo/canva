<article style="max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 24px) 72px; display: flex; flex-direction: column; gap: 22px; font-size: 20px; line-height: 1.65; color: #23272E">

<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #DDF4F1; color: #115E59">Workforce development</span>
<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Workforce Development Needs a Theory of Learning, Not a List of Skills</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Skills taxonomies keep getting longer. The programmes that actually raise earnings share something different: they are built around how adults learn to do real work.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 6 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #0D9488">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 18px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/22033daaf123028b1b5f7e201a7028b0.svg" alt="" style="display: block; height: 99%; width: auto">
<img src="assets/img/833820258e37ce20207dcea925e35f1c.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>

<p style="margin: 0">Workforce policy has never had more lists. The European Union’s ESCO classification describes more than thirteen thousand skills and competences. The US O*NET database profiles hundreds of occupations by the knowledge, abilities and tasks they involve. Every year, reports on the future of work publish rankings of the skills employers say they will need. These are useful maps. But a map of the destination is not a route, and a list of skills is not a theory of how anyone acquires them.</p>
<p style="margin: 0">The evidence on what actually works in workforce development points to a more demanding conclusion. Programmes succeed when they are designed around how people learn to do real work, in context, with feedback, connected to employers who will hire them.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What the evaluations say</h2>
<p style="margin: 0">The most comprehensive review of active labour market programmes, a meta-analysis by David Card, Jochen Kluve and Andrea Weber covering more than two hundred evaluations, found a pattern that should temper expectations. Average effects are close to zero in the first year after a programme ends and become more positive two to three years later. Training programmes, in particular, tend to have small short-run effects but larger medium-run gains, while job search assistance helps more quickly but fades. Effects also vary by participant: gains are larger for the long-term unemployed and for women, and smaller for young people and older workers.</p>
<p style="margin: 0">Two lessons follow. Judging programmes on six-month outcomes undervalues the ones that build lasting skill. And the average hides enormous variation: some programmes work very well, many do little, and design explains much of the difference.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The sectoral exception</h2>
<p style="margin: 0">The strongest recent evidence comes from sectoral employment programmes in the United States, such as Project QUEST, Year Up, Per Scholas and WorkAdvance. Lawrence Katz, Jonathan Roth, Richard Hendra and Kelsey Schaberg reviewed randomised trials of these programmes and found earnings gains of 14 to 39 percent in the year after training, among the largest ever measured for workforce programmes. Long-term follow-ups of several of them show gains persisting for years.</p>
<p style="margin: 0">What distinguishes them? Katz and colleagues point to a common design. The programmes target sectors with real demand for middle-skill workers, such as IT, health care and advanced manufacturing. They screen applicants for readiness and motivation. They teach occupational skills employers have helped specify, alongside the soft skills of professional work. They offer wraparound support, such as advice and help with transport or childcare. And they connect graduates directly to employers. They are, in effect, carefully engineered learning environments that end in a job.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">A skills taxonomy tells you what to learn. It says nothing about how anyone learns it.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">A theory of learning at work</h2>
<p style="margin: 0">Learning science explains why this design works. Jean Lave and Etienne Wenger described learning as legitimate peripheral participation: newcomers learn by taking part, at first in small and supported ways, in the real practice of a community, gradually moving towards full participation. Allan Collins, John Seely Brown and Susan Newman translated the old craft apprenticeship into a teaching model, cognitive apprenticeship, in which experts model a task, coach learners as they attempt it, provide scaffolding that is withdrawn as competence grows, and ask learners to articulate and reflect on their reasoning.</p>
<p style="margin: 0">Both accounts emphasise what skills lists leave out: authentic tasks, expert feedback, gradual release of responsibility and membership of a community that values the work. Skills learned in the abstract often fail to transfer to the job, while skills learned in the context of real practice come with the judgement of when and how to use them.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Apprenticeship as a system</h2>
<p style="margin: 0">Some countries have built this logic into national institutions. Germany’s dual system combines training in a company with part-time vocational school, governed jointly by employers, unions and the state, and it is widely credited with easing young people’s transition into work. Other countries have found it hard to copy. England’s apprenticeship levy, introduced in 2017 as a charge on large employers’ pay bills, was followed by a fall in apprenticeship starts, and the government has since moved to reform it into a broader growth and skills levy. Kenya has moved its technical and vocational system towards competency-based education and training, assessing trainees on what they can demonstrably do. The lesson from all three is that apprenticeship depends less on funding mechanisms than on employers who are willing to teach.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The hiring side</h2>
<p style="margin: 0">Learning is only half the system; the other half is whether employers recognise it. Many large employers have announced that they are dropping degree requirements in favour of skills-based hiring. A 2024 study by Joseph Fuller, Christina Langer and Matt Sigelman of Harvard Business School and the Burning Glass Institute found that the practice lags far behind the rhetoric: across the firms studied, the change affected fewer than one in seven hundred hires a year. Without trusted ways of showing what a candidate can do, employers fall back on the degree as a proxy.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What this means in the AI era</h2>
<p style="margin: 0">AI will accelerate the churn in which tasks jobs involve, making continuous learning unavoidable. The response should not be a longer list of skills. It should be learning systems that put people into authentic practice early, with expert guidance and honest feedback, and records of competence that employers can trust. That principle shapes Vachuo’s design: learning projects anchored in real work, Connects, through which learners can find practitioners willing to teach, and a Portfolio that records what a learner can do rather than what seat they occupied. Workforce development, done well, begins long before the workforce.</p>
