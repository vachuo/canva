<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Parent copilot</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Copilot">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Parent workspace" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px"><a href="copilot.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><span style="align-self: flex-start; margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-size: 12px; font-weight: 600">Parent workspace</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Family</div><a href="copilot.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="parent-approvals.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>Approvals<span style="margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700; text-align: center">2</span></a><a href="copilot.html#calendar" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17v15.5h-17zM3.5 9.5h17M8 3v4M16 3v4"/></svg>Calendar</a><a href="messages.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>Messages</a><a href="parent-money.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6 7v10M18 7v10"/></svg>Money</a><a href="parent-family.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Family and settings</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomParent}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Sit in on a session<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Your learners</div><a href="learner.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #E4ECFD">Amani<span style="margin-left: auto; font-size: 12.5px; color: #62676F">12</span></a><a href="learner.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><img src="assets/img/725b564d3bb6eb6c8797c70a327e8bf7.svg" alt="" style="flex: none; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #E4ECFD">Johari<span style="margin-left: auto; font-size: 12.5px; color: #62676F">13</span></a><a href="learner.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><img src="assets/img/ee935388d47b6bf0d509293d4cba8892.svg" alt="" style="flex: none; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #E4ECFD">Bob<span style="margin-left: auto; font-size: 12.5px; color: #62676F">9</span></a><a href="learner.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><img src="assets/img/52e1a52609aabe6b6af1b8329af92b96.svg" alt="" style="flex: none; width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #E4ECFD">Kim<span style="margin-left: auto; font-size: 12.5px; color: #62676F">19</span></a><a href="onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Set up a learner</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learner view</div><a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>See Amani’s Today</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #DDF4F1; color: #115E59; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">W</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Wanjiru M.</span><span style="font-size: 12.5px; color: #62676F">Parent · 4 learners</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="parent-family.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #F4F7FE"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="sign-in.html" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Parent copilot · Sunday briefing, week 9</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 900px; text-wrap: balance">Good evening, Wanjiru. Two things need you this week. Everything else is handled.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 720px; text-wrap: pretty">Vachuo runs instruction, scheduling and records for your four learners. Here’s what changed, what Vachuo did about it, and where only a parent will do.</p>
</div>
<figure aria-hidden="true" style="margin: 0; flex: 1 1 280px; max-width: 380px; height: 200px; position: relative; overflow: hidden; border-radius: 20px; background: #1D4ED8">
<span style="position: absolute; width: 360px; height: 360px; right: -130px; top: -210px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 620px; height: 620px; left: -300px; top: -460px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -70px; height: 120px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 12px; bottom: 10px; display: flex; justify-content: center; align-items: flex-end; gap: 2px">
<img src="assets/img/22033daaf123028b1b5f7e201a7028b0.svg" alt="" style="display: block; height: 92%; width: auto">
<img src="assets/img/cc13f9d919b0933cc82b960722e0d690.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/267b7a442640f30304c2f6baf1e79fcb.svg" alt="" style="display: block; height: 89%; width: auto">
<img src="assets/img/0a1435c5059775e636726ec8ea6ae1bf.svg" alt="" style="display: block; height: 75%; width: auto">
</div>
</figure>
</header>

<dc-import name="Approvals" area="parent" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>
<div id="calendar" style="scroll-margin-top: 16px"><dc-import name="Calendar" focus="all" ui-theme="{{uiTheme}}"></dc-import></div>

<nav aria-label="Your learners" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px">
<template data-for="{{kids}}" data-as="k">
<button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.open}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 18px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: #14161A; text-align: left; cursor: pointer">
<img src="{{k.face}}" alt="" style="flex: none; width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: top; background: {{k.tint}}; box-shadow: 0 0 0 3px {{k.ring}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{k.name}}</span><span style="font-size: 12.5px; color: #62676F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.meta}}</span></span>
<span style="flex: none; font-size: 12.5px; font-weight: 600; color: #1E40AF">Profile →</span>
</button>
</template>
</nav>
<a href="onboarding.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a learner</a>

<template data-if="{{showMsgTop}}">
<dc-import name="Messages" contact="{{msgWith}}" viewer="parent" embedded="{{ true }}" ui-theme="{{uiTheme}}" on-close="{{closeMsg}}" on-profile="{{openProf}}"></dc-import>
</template>

<template data-if="{{learnerOpen}}">
<dc-import name="Learner" lid="{{learnerId}}" embedded="{{ true }}" ui-theme="{{uiTheme}}" on-back="{{closeLearner}}" on-message="{{openMsgTop}}" on-pick="{{pickLearner}}"></dc-import>
</template>

<template data-if="{{briefing}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ask" style="font-size: 13px; font-weight: 600; color: #3F444C">Ask about your children’s learning</label>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<input id="ask" type="text" value="{{ask}}" onInput="{{setAsk}}" placeholder="Is Bob ready for long division?" style="flex: 1 1 320px; min-width: 0; min-height: 50px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
<button type="button" onClick="{{askGo}}" style="min-height: 50px; padding: 0 22px; border-radius: 14px; border: none; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 600; cursor: pointer">Ask Vachuo</button>
</div>
<template data-if="{{hasAnswer}}"><p role="status" style="margin: 4px 0 0; padding: 12px 16px; border-radius: 14px; background: #E4ECFD; color: #172F73; font-size: 15.5px; line-height: 1.5">{{answer}}</p></template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<template data-if="{{profOpen}}">
<dc-import name="Profile" pid="{{profId}}" embedded="{{ true }}" ui-theme="{{uiTheme}}" on-back="{{closeProf}}" on-open="{{openProf}}"></dc-import>
</template>

<template data-if="{{cardsOpen}}">
<template data-for="{{cards}}" data-as="c">
<article aria-label="{{c.name}}" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<button type="button" aria-label="Open {{c.name}}’s profile" onClick="{{c.open}}" style="flex: none; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 2px solid {{c.ring}}; overflow: hidden; background: {{c.tint}}; cursor: pointer"><img src="{{c.face}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: top"></button>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 600"><button type="button" onClick="{{c.open}}" style="padding: 0; border: none; background: transparent; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: #CFCFC6; text-underline-offset: 4px">{{c.name}}</button></h2><span style="font-size: 13px; color: #62676F">{{c.meta}}</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{c.tagFg}}; background: {{c.tagBg}}; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{c.tagDot}}"></span>{{c.tag}}</span>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; text-wrap: pretty">{{c.text}}</p>

<template data-if="{{c.isJohari}}">
<div role="radiogroup" aria-label="How to respond to Johari" style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{c.johariOptions}}" data-as="o">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; font-size: 14.5px; text-align: left; cursor: pointer">

</template>

<template data-if="{{c.hasDid}}">

</ul>
</div>
</template>
<button type="button" onClick="{{c.open}}" style="align-self: flex-start; padding: 0; border: none; background: transparent; color: #1D4ED8; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">{{c.link}}</button>
</article>

</template>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<span style="flex: 1 1 120px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #62676F">{{p.role}}</span></span>

</div>
</template>

</template>
</section>

<section aria-labelledby="handled" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">

<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Attendance and learning hours logged for your records</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Portfolios updated with 9 new demonstrations</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Standards alignment report refreshed (CBC and Common Core)</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Term reports drafted, ready on 18 December</li>
</ul>
</section>

<section aria-labelledby="see" style="background: #14161A; color: #EDEDE8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="see" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">What you see, and what you don’t</h2>

<p style="margin: 0; font-size: 15.5px; line-height: 1.55; color: #C9CCD0">Amani, Johari and Bob can read everything this page says about them. Kim decides what he shares.</p>
</section>
</aside>
</div>
</template>

</div>

<footer style="margin-top: 56px; padding-top: 12px; border-top: 1px solid #E2E2DA; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F"><nav aria-label="{{svT.policies}}" style="display: flex; flex-wrap: wrap; gap: 0 18px"><a href="mailto:hello@vachuo.com?subject=Help" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.help}}</a><a href="privacy.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.privacy}}</a><a href="terms.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.terms}}</a><a href="mailto:hello@vachuo.com" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.contact}}</a></nav><span style="margin-left: auto">© 2026 Vachuo™</span><div style="position: relative"><button type="button" aria-haspopup="true" aria-expanded="{{svLangOpen}}" aria-label="{{svT.langMenu}}" onClick="{{svLangToggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{svLangName}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{svLangOpen}}"><div class="vlang-list" role="menu" aria-label="{{svT.langMenu}}" style="position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 70; width: 250px; max-height: 340px; overflow-y: auto; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5)"><template data-for="{{svLangs}}" data-as="l"><button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: {{l.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{l.name}}</span><span style="font-size: 11.5px; color: #62676F">{{l.sub}}</span></span><span aria-hidden="true" style="color: #1D4ED8; font-weight: 700">{{l.mark}}</span></button></template></div></template></div></footer>

<template id="dc-Approvals">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

<template data-if="{{isParent}}">
<section aria-labelledby="ap-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="ap-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Waiting for your approval</h2>
<span style="font-size: 13px; color: #62676F">{{pendingCount}}</span>
</div>
<p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; line-height: 1.5; color: #3F444C">Alignment plans, Showcase listings, in-person sessions and job applications for your learners land here. Nothing goes live, gets paid or meets anyone until you say yes.</p>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px"><span style="padding: 2px 9px; border-radius: 999px; background: {{a.kBg}}; color: {{a.kFg}}; font-size: 12px; font-weight: 700">{{a.kind}}</span><span style="font-size: 12.5px; color: #3F444C">From {{a.from}} · {{a.at}}</span></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.25">{{a.title}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{a.detail}}</span>
<template data-if="{{a.hasAreas}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{a.areas}}" data-as="r"><span style="padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 12px; color: #3F444C">{{r.t}}</span></template></div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{a.approve}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 13.5px; font-weight: 700; cursor: pointer">Approve</button><button type="button" onClick="{{a.decline}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Decline</button></div>
</div>
</template>
<template data-if="{{noPending}}"><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F4EF; font-size: 14px; color: #3F444C">Nothing is waiting. Requests from My assessments, Portfolio, Clubs and Showcase will appear here.</p></template>
<template data-if="{{hasDone}}">

<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Decided</span>
<template data-for="{{done}}" data-as="d"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8; font-size: 13.5px"><span style="padding: 2px 8px; border-radius: 999px; background: {{d.sBg}}; color: {{d.sFg}}; font-size: 12px; font-weight: 700">{{d.status}}</span><span style="flex: 1 1 200px">{{d.title}}</span><button type="button" onClick="{{d.undo}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; text-decoration: underline; cursor: pointer">Undo</button></div></template>
</div>
</template>
</section>
</template>

<template data-if="{{isStrip}}">
<section aria-label="{{stripTitle}}" style="background: {{stripBg}}; border: 1px solid {{stripBd}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{chipBg}}; color: {{chipFg}}; font-size: 12px; font-weight: 700">{{chip}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600">{{stripTitle}}</span><span style="font-size: 12.5px; color: #62676F">{{stripSub}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{stripItems}}" data-as="s"><div style="flex: 1 1 240px; min-width: 0; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{s.t}}</span><span style="font-size: 12.5px; line-height: 1.45; color: #3F444C">{{s.w}}</span></div></template>
</div>
</section>
</template>

</div>
</template>
<template id="dc-Calendar">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, sans-serif">
<section aria-labelledby="cal2-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cal2-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">{{title}}</h2><span style="font-size: 13px; color: #62676F">One calendar for lesson premieres, club sessions and assessments</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<div role="group" aria-label="View" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{views}}" data-as="v"><button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: none; background: {{v.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{v.label}}</button></template></div>
<button type="button" aria-label="{{prevLabel}}" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; opacity: {{prevOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<button type="button" aria-label="{{nextLabel}}" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; opacity: {{nextOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div></div>

</div>

</div></template>
</div></div>
</template>

<div style="overflow-x: auto"><div style="min-width: 700px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<template data-for="{{dow}}" data-as="w"><span style="padding: 0 4px; font-size: 12px; font-weight: 600; color: #62676F">{{w}}</span></template>
<template data-for="{{cells}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" aria-label="{{c.aria}}" onClick="{{c.pick}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-height: 92px; padding: 6px; border-radius: 12px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer; opacity: {{c.op}}"><span style="font-size: 13px; font-weight: 600">{{c.n}}</span><template data-for="{{c.ev}}" data-as="e"><span style="display: block; padding: 2px 6px; border-radius: 6px; background: {{e.bg}}; color: {{e.fg}}; font-size: 11px; font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span></template><template data-if="{{c.hasMore}}"><span style="font-size: 11px; color: #62676F">{{c.more}}</span></template></button></template>
</div></div>
<template data-if="{{hasDay}}"><div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 15px; font-weight: 600">{{dayLabel}}</h3><template data-for="{{dayEv}}" data-as="e"><button type="button" aria-pressed="{{e.on}}" onClick="{{e.pick}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 1.5px solid {{e.bd}}; background: {{e.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="font-weight: 700; color: {{e.fg}}">{{e.time}} · {{e.kindShort}}</span><span>{{e.title}}</span></button></template><template data-if="{{dayEmpty}}"><p style="margin: 0; font-size: 14px; color: #62676F">Nothing on this day.</p></template></div></template>
</template>
<template data-if="{{hasSel}}">
<div aria-live="polite" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 16px; border-radius: 14px; background: {{sel.bg}}">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{sel.fg}}">{{sel.kindLabel}} · {{sel.subject}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.2">{{sel.title}}</span><span style="font-size: 13.5px; color: #3F444C">{{sel.when}} · {{sel.where}}</span><template data-if="{{sel.hasNote}}"><span style="font-size: 13.5px; color: {{sel.fg}}; font-weight: 600">{{sel.note}}</span></template></div>
<template data-if="{{sel.useBtn}}"><button type="button" onClick="{{sel.open}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{sel.openLabel}}</button></template>
<template data-if="{{sel.useLink}}"><a href="{{sel.href}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; text-decoration: none">{{sel.openLabel}}</a></template>
</div>
</template>
</section>
</div>
</template>
<template id="dc-Messages">
<div data-theme="{{uiTheme}}" style="height: {{rootH}}; box-sizing: border-box; display: flex; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: {{rootRadius}}; border: {{rootBorder}}; overflow: hidden">

<template data-if="{{showList}}">
<aside aria-label="Conversations" style="flex: 0 0 300px; display: flex; flex-direction: column; border-right: 1px solid #E2E2DA; background: #FAFAF7; min-width: 0">
<div style="padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Messages</h1>
<div role="group" aria-label="Viewing as" style="display: flex; gap: 6px">
<template data-for="{{viewers}}" data-as="v"><button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{v.bd}}; background: {{v.bg}}; color: {{v.fg}}; font-size: 13px; font-weight: 500; cursor: pointer">{{v.label}}</button></template>
</div>
</div>
<ul style="list-style: none; margin: 0; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto">
<template data-for="{{threads}}" data-as="t">
<li><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: none; background: {{t.bg}}; color: #14161A; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: {{t.tint}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px"><template data-if="{{t.hasFace}}"><img src="{{t.face}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top"></template><template data-if="{{t.noFace}}">{{t.ini}}</template></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="flex: none; font-size: 12px; color: #62676F">{{t.when}}</span></span><span style="font-size: 13px; color: #62676F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.last}}</span></span>
<template data-if="{{t.unread}}"><span aria-label="Unread" style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: #1D4ED8"></span></template>
</button></li>
</template>
</ul>
</aside>
</template>

<section aria-label="{{convAria}}" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<header style="flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E2E2DA; background: #FFFFFF">
<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: {{c.tint}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 600"><template data-if="{{c.hasFace}}"><img src="{{c.face}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top"></template><template data-if="{{c.noFace}}">{{c.ini}}</template></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2">{{c.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #62676F"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>{{c.status}}</span>
</div>
<template data-if="{{c.hasProfile}}"><button type="button" onClick="{{c.profile}}" style="flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; font-weight: 500; cursor: pointer">Profile</button></template>
<template data-if="{{canClose}}"><button type="button" aria-label="Close messages" onClick="{{close}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></template>
</header>
<p style="flex: none; margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #F4F7FE; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; line-height: 1.4; color: #1E40AF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>{{c.safety}}</p>

<div role="log" aria-live="polite" aria-label="Conversation" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FAFAF7">
<template data-for="{{msgs}}" data-as="m">
<template data-if="{{m.isDay}}"><div style="align-self: center; font-size: 12px; font-weight: 500; color: #62676F; padding: 2px 10px; border-radius: 999px; background: #ECECE6">{{m.day}}</div></template>
<template data-if="{{m.isMsg}}">
<div style="display: flex; flex-direction: column; align-items: {{m.align}}; gap: 3px">
<template data-if="{{m.showWho}}"><span style="font-size: 12px; font-weight: 600; color: #62676F; padding: 0 4px">{{m.who}}</span></template>
<div style="max-width: 82%; padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere">{{m.text}}<template data-if="{{m.hasFile}}"><span style="display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: {{m.fileBg}}; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>{{m.file}}</span></template><template data-if="{{m.hasImg}}"><img src="{{m.img}}" alt="{{m.file}}" style="display: block; margin-top: 8px; max-width: 220px; max-height: 180px; border-radius: 10px; object-fit: cover"></template></div>
<template data-if="{{m.hasSlots}}">
<div role="group" aria-label="Suggested times" style="display: flex; flex-wrap: wrap; gap: 6px; max-width: 82%">
<template data-for="{{m.slots}}" data-as="s"><button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 500; cursor: pointer">{{s.label}}</button></template>
</div>
</template>
<span style="font-size: 11.5px; color: #8A8F96; padding: 0 4px">{{m.time}}</span>
</div>
</template>
</template>
<template data-if="{{typing}}"><div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; font-size: 13.5px; color: #62676F"><span aria-hidden="true" style="display: flex; gap: 3px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8A8F96"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #A3A8AE"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #CFCFC6"></span></span>{{typingText}}</div></template>
<div ref="{{endRef}}" style="height: 1px; flex: none"></div>
</div>

<div style="flex: none; border-top: 1px solid #E2E2DA; background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Quick replies" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
<template data-for="{{quick}}" data-as="q"><button type="button" onClick="{{q.send}}" style="flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #93BBF3; background: #F4F7FE; color: #1E40AF; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap">{{q.label}}</button></template>
</div>
<template data-if="{{hasPending}}"><div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #F4F4EF; font-size: 13px; color: #3F444C"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{pendingName}}</span><button type="button" aria-label="Remove attachment" onClick="{{clearPending}}" style="border: none; background: transparent; color: #62676F; cursor: pointer; font-size: 13px; min-height: 28px">Remove</button></div></template>
<div style="display: flex; align-items: flex-end; gap: 8px">
<label style="position: relative; flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: flex; align-items: center; justify-content: center; cursor: pointer" title="Attach a file"><input type="file" aria-label="Attach a file" onChange="{{attach}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.7a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></label>
<label for="msg-draft" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message {{c.first}}</label>
<textarea id="msg-draft" rows="1" value="{{draft}}" onInput="{{setDraft}}" placeholder="{{placeholder}}" style="flex: 1; min-width: 0; min-height: 44px; max-height: 120px; box-sizing: border-box; padding: 11px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FAFAF7; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4; resize: vertical"></textarea>
<button type="button" onClick="{{send}}" aria-label="Send message" style="flex: none; height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>Send</button>
</div>
</div>
</section>
</div>
</template>
<template id="dc-Learner">
<div data-theme="{{uiTheme}}" style="background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; box-sizing: border-box; padding: {{rootPad}}">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<template data-if="{{embedded}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<button type="button" onClick="{{goBack}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Back to the briefing</button>
<span style="font-size: 13.5px; color: #62676F">Parent copilot / Learners / {{L.name}}</span>
</div>
</template>

<nav aria-label="Your learners" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; margin-right: 6px">Your learners</span>
<template data-for="{{pickers}}" data-as="p">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 4px; border-radius: 999px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 500; cursor: pointer"><img src="{{p.face}}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: {{p.tint}}">{{p.name}}</button>
</template>
</nav>

<section aria-labelledby="lp-name" style="position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 24px">
<div aria-hidden="true" style="height: 120px; position: relative; overflow: hidden; background: {{L.band}}"><span style="position: absolute; width: 420px; height: 420px; right: -120px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span><span style="position: absolute; width: 720px; height: 720px; left: -260px; top: -560px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span></div>
<div style="padding: 0 clamp(18px, 3vw, 32px) 26px; display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; margin-top: -64px; position: relative">
<img src="{{L.face}}" alt="{{L.name}}" style="flex: none; width: 128px; height: 128px; border-radius: 50%; object-fit: cover; object-position: top; background: {{L.tint}}; border: 5px solid #FFFFFF; box-shadow: 0 10px 24px -14px rgba(20,22,26,0.5)">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h1 id="lp-name" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.05; font-weight: 600; letter-spacing: -0.015em">{{L.name}}</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{L.statusFg}}; background: {{L.statusBg}}; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{L.statusDot}}"></span>{{L.status}}</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F444C">{{L.meta}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{L.interests}}" data-as="i"><span style="font-size: 12.5px; font-weight: 500; color: #115E59; background: #DDF4F1; padding: 4px 10px; border-radius: 999px">{{i}}</span></template></div>
</div>
<div style="flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{messageGuide}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>{{L.msgLabel}}</button>
<button type="button" aria-pressed="{{talkPressed}}" onClick="{{toggleTalk}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{talkBd}}; background: {{talkBg}}; color: {{talkFg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{talkLabel}}</button>
</div>
</div>
<template data-if="{{hasNote}}"><p role="status" style="margin: 0 clamp(18px, 3vw, 32px) 20px; padding: 10px 14px; border-radius: 12px; background: #DDF4F1; color: #115E59; font-size: 14.5px; line-height: 1.45">{{note}}</p></template>
<div style="border-top: 1px solid #ECECE6; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr))">
<template data-for="{{L.stats}}" data-as="s">
<div style="padding: 16px clamp(18px, 3vw, 32px); display: flex; flex-direction: column; gap: 4px; border-right: 1px solid #ECECE6">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{s.label}}</span>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1">{{s.value}}</span>
<span style="font-size: 12.5px; color: {{s.noteFg}}">{{s.note}}</span>
</div>
</template>
</div>
</section>

<div role="tablist" aria-label="Profile sections" style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; overflow-x: auto">
<template data-for="{{tabs}}" data-as="t">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="flex: 1 0 auto; min-height: 42px; padding: 0 16px; border-radius: 10px; border: none; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap">{{t.label}}<template data-if="{{t.locked}}"> · private</template></button>
</template>
</div>

<template data-if="{{tabOverview}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="lp-now" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Right now</span>
<h2 id="lp-now" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{L.focus.title}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">{{L.focus.text}}</p>
<template data-if="{{L.focus.hasLoop}}">

<section aria-labelledby="ov-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="ov-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{aboutTitle}}</h2>
<template data-for="{{about}}" data-as="a"><p style="margin: 0; font-size: 18px; line-height: 1.6; color: #23272E">{{a}}</p></template>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; padding-top: 4px">
<template data-for="{{facts}}" data-as="f">
<div style="border-radius: 14px; background: #F4F4EF; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{f.k}}</span><span style="font-size: 17px; line-height: 1.35">{{f.v}}</span></div>
</template>
</div>
</section>
<section aria-labelledby="of-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="of-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{offersTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px">
<template data-for="{{offers}}" data-as="o">
<li style="border: 1px solid #ECECE6; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 600; line-height: 1.3">{{o.t}}</span><span style="font-size: 16px; line-height: 1.45; color: #3F444C">{{o.d}}</span></li>
</template>
</ul>
</section>
<template data-if="{{hasNotes}}">
<section aria-labelledby="lg-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 id="lg-h" style="margin: 0 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Logged by learners</h2>
<template data-for="{{notes}}" data-as="n">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 0; border-top: 1px solid #ECECE6"><span style="flex: none; min-width: 120px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: {{ink}}">{{n.who}}</span><span style="flex: 1 1 260px; font-size: 17px; line-height: 1.45">{{n.text}}</span></div>
</template>
<p style="margin: 4px 0 0; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">Entries are evidence learners chose to log. Nothing here is a rating.</p>
</section>
</template>
</template>

<template data-if="{{tabSchedule}}">
<section aria-labelledby="sc-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="sc-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">{{schedTitle}}</h2>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{spotsText}}</span>
</div>
<div role="group" aria-label="Week at a glance" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<template data-for="{{week}}" data-as="w">
<div style="border-radius: 12px; padding: 10px 4px; text-align: center; background: {{w.bg}}; color: {{w.fg}}; border: 1px solid {{w.bd}}; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600">{{w.d}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px">{{w.t}}</span></div>
</template>
</div>
<template data-if="{{notSent}}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{slots}}" data-as="s">
<li style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid {{s.bd}}; background: {{s.bg}}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 600">{{s.date}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">{{s.time}} · {{s.label}}</span></span>
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.btnBd}}; background: {{s.btnBg}}; color: {{s.btnFg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{s.btn}}</button>
</li>
</template>
</ul>
<template data-if="{{picking}}">
<div style="border-radius: 16px; background: #F4F7FE; border: 1px solid #DCE6FD; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 17px; line-height: 1.5"><b style="font-weight: 600">{{reqTitle}}</b></p>
<label for="req-msg" style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">A note for {{shortName}} (optional)</label>
<textarea id="req-msg" rows="3" value="{{msg}}" onChange="{{setMsg}}" placeholder="{{msgHint}}" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #14161A; resize: vertical"></textarea>
<p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; line-height: 1.5; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z"/></svg>Because you’re under 18, this goes to your parent first. Nothing is confirmed until they approve it.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{sendReq}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{sendLabel}}</button>
<button type="button" onClick="{{cancelReq}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Cancel</button>
</div>
</div>
</template>
</template>
<template data-if="{{sent}}">
<div role="status" style="border-radius: 16px; background: #DDF4F1; border: 1px solid #8FD3C9; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 19px; font-weight: 600; color: #115E59">Sent to your parent for approval</p>
<p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: #134E4A">{{sentText}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{undoReq}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #8FD3C9; background: #FFFFFF; color: #115E59; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Withdraw request</button></div>
</div>
</template>
</section>
</template>

<template data-if="{{tabMap}}">
<section aria-labelledby="mp-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="mp-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">How this counts on your map</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #3F444C">Time here can count as evidence for these skills, if you choose to log it. Your current estimates:</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="{{skills}}" data-as="k">
<li style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1px solid #ECECE6">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 18px; font-weight: 600">{{k.name}} <span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 500; color: #62676F">{{k.subj}}</span></span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 14px">{{k.score}}</span></span>
<span aria-hidden="true" style="position: relative; height: 8px; border-radius: 4px; background: #ECECE6; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{k.pct}}%; border-radius: 4px; background: {{k.bar}}"></span></span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{k.note}}</span>
</li>
</template>
</ul>
<a href="map.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #E4ECFD; color: #1E40AF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; text-decoration: none">Open My learning map</a>
</section>
</template>

<template data-if="{{tabSafety}}">
<section aria-labelledby="sf-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="sf-h" style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Safety and visiting</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-for="{{safety}}" data-as="s">
<li style="display: flex; gap: 12px; align-items: flex-start; font-size: 17.5px; line-height: 1.45"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>{{s}}</li>
</template>
</ul>
<div style="border-radius: 14px; background: #F4F4EF; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Where you meet</span><span style="font-size: 17px; line-height: 1.45">{{meets}}</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<button type="button" onClick="{{reportGo}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #F9A826; background: #FEF1D9; color: #92400E; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Report a concern</button>
<span role="status" style="font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #115E59">{{reportText}}</span>

</section>
</template>
</div>

<aside aria-label="At a glance" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="gl-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="gl-h" style="margin: 0; font-size: 20px; font-weight: 600">{{hoursTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-for="{{hours}}" data-as="h">
<li style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid #ECECE6; font-family: Inter, system-ui, sans-serif; font-size: 13.5px"><span style="font-weight: 600">{{h.days}}</span><span style="text-align: right; color: #3F444C">{{h.time}}<br><span style="color: #62676F">{{h.label}}</span></span></li>
</template>
</ul>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Times are Nairobi time. Status updates live.</p>
</section>
<template data-if="{{hasMap}}">
<section aria-labelledby="loc-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="loc-h" style="margin: 0; font-size: 20px; font-weight: 600">{{locTitle}}</h2>
<div aria-hidden="true" style="position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 14px; background: #EFECE3">
<img src="assets/img/60e878ab3c78d12a0a8b08b442faa70f.svg" alt="" style="position: absolute; width: 300%; height: 300%; left: calc(50% - {{mapX}}%); top: calc(50% - {{mapY}}%); max-width: none">
<template data-if="{{exact}}"><span style="position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: {{band}}; border: 3px solid #FFFFFF; box-shadow: 0 6px 14px -6px rgba(20,22,26,0.6)"></span></template>
<template data-if="{{approx}}"><span style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(29,78,216,0.14); border: 2px dashed #1D4ED8"></span></template>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3F444C">{{locText}}</p>
</section>
</template>
<section aria-labelledby="rel-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 id="rel-h" style="margin: 0; font-size: 20px; font-weight: 600">{{relTitle}}</h2>
<template data-for="{{related}}" data-as="r">
<button type="button" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 10px; border-radius: 14px; border: 1px solid #ECECE6; background: #FFFFFF; color: #14161A; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: {{r.bg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{r.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 17px; font-weight: 600; line-height: 1.2">{{r.name}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">{{r.sub}}</span></span>
</button>
</template>
</section>
</aside>
</div>

</div>
</div>
</template>
