<link rel="icon" type="image/png" href="assets/img/mark.png">

<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Copilot">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Vachuo" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="today.html" aria-label="Vachuo, back to Today" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto">
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div>
<a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a>
<a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>Tutor session</a>
<a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My map</a>
<a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M3.5 7.5h5M3.5 12h5M3.5 16.5h5M11 8h5M11 12h5"/></svg>My notes</a>
<a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/></svg>Passport</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div>
<a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Family</div>
<a href="copilot.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.3"/><path d="M16.5 14.2c2.4.3 4 2.4 4 5.3"/></svg>Parent copilot</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div>
<a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5V9h-4.5"/></svg>The loop</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 16px 12px 0; border-top: 1px solid #E2E2DA">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #DDF4F1; color: #115E59; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">W</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Wanjiru M.</span><span style="font-size: 12.5px; color: #62676F">Parent · 4 learners</span></span>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Parent copilot · Sunday briefing, week 9</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 900px; text-wrap: balance">Good evening, Wanjiru. Two things need you this week. Everything else is handled.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 720px; text-wrap: pretty">Vachuo runs instruction, scheduling and records for your four learners. Here’s what changed, what Vachuo did about it, and where only a parent will do.</p>
</div>
<figure aria-hidden="true" style="margin: 0; flex: 1 1 280px; max-width: 380px; height: 200px; position: relative; overflow: hidden; border-radius: 20px; background: #1D4ED8">
<span style="position: absolute; width: 360px; height: 360px; right: -130px; top: -210px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 620px; height: 620px; left: -300px; top: -460px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -70px; height: 120px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 12px; bottom: 10px; display: flex; justify-content: center; align-items: flex-end; gap: 2px">
<img src="assets/img/22033daaf123028b1b5f7e201a7028b0.svg" alt="" style="display: block; height: 92%; width: auto">
<img src="assets/img/cc13f9d919b0933cc82b960722e0d690.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/267b7a442640f30304c2f6baf1e79fcb.svg" alt="" style="display: block; height: 89%; width: auto">
<img src="assets/img/0a1435c5059775e636726ec8ea6ae1bf.svg" alt="" style="display: block; height: 75%; width: auto">
</div>
</figure>
</header>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ask" style="font-size: 13px; font-weight: 600; color: #3F444C">Ask about your children’s learning</label>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<input id="ask" type="text" placeholder="Is James ready for long division?" style="flex: 1 1 320px; min-width: 0; min-height: 50px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
<button type="button" style="min-height: 50px; padding: 0 22px; border-radius: 14px; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">Ask Vachuo</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<article aria-labelledby="sarah" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4F4EF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-weight: 700; font-size: 18px; overflow: hidden; background: #FEF1D9"><img src="assets/img/725b564d3bb6eb6c8797c70a327e8bf7.svg" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><h2 id="sarah" style="margin: 0; font-size: 18px; font-weight: 600">Sarah</h2><span style="font-size: 13px; color: #62676F">13 · Writing L8 · Science L9</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #92400E; background: #FEF1D9; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #F9A826"></span>Your call</span>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; text-wrap: pretty">Sarah has avoided writing assignments for four days. She can do the work, and her last two essays were strong, so this looks like motivation rather than a knowledge gap. Vachuo won’t push harder on its own. Which would you like?</p>
<div role="radiogroup" aria-label="How to respond to Sarah" style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{sarahOptions}}" data-as="o">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; font-size: 14.5px; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; border: {{o.ring}}; background: #FFFFFF"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{o.title}}</span><span style="font-size: 13px; color: #62676F">{{o.detail}}</span></span>
</button>
</template>
</div>
<template data-if="{{sarahPicked}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #E4ECFD">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span style="flex: 1 1 300px; font-size: 15.5px; line-height: 1.5; color: #172F73">{{sarahConfirm}}</span>
</div>
</template>
</article>

<article aria-labelledby="amani" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #E4ECFD; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-weight: 700; font-size: 18px; overflow: hidden"><img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><h2 id="amani" style="margin: 0; font-size: 18px; font-weight: 600">Amani</h2><span style="font-size: 13px; color: #62676F">12 · Math L6 · Reading L8</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #92400E; background: #FEF1D9; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #F9A826"></span>Approval needed</span>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; text-wrap: pretty">Amani’s question about scaling recipes became a week on ratios. Today Vachuo found she adds when she should multiply, a common and very fixable misconception, and she caught the contradiction herself during the session.</p>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: #FAFAF7; border: 1px solid #ECECE6">
<span style="font-size: 15px; font-weight: 600">Visit: Achieng’s tailoring workshop</span>
<span style="font-size: 15.5px; line-height: 1.5; color: #3F444C">Thursday 5 November, 2–4 pm · 2.1 km · a group of three learners scaling a shirt pattern. Achieng is ID-verified and background-checked.</span>
</div>
<template data-if="{{amaniOpen}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{approve}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Approve visit</button>
<button type="button" onClick="{{decline}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Decline</button>
<button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Ask about the host</button>
</div>
</template>
<template data-if="{{amaniDone}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: {{amaniBg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{amaniFg}}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span style="flex: 1; font-size: 15.5px; line-height: 1.5; color: {{amaniFg}}">{{amaniConfirm}}</span>
<button type="button" onClick="{{undo}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Undo</button>
</div>
</template>
</article>

<article aria-labelledby="james" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4F4EF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-weight: 700; font-size: 18px; overflow: hidden; background: #E4ECFD"><img src="assets/img/ee935388d47b6bf0d509293d4cba8892.svg" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><h2 id="james" style="margin: 0; font-size: 18px; font-weight: 600">James</h2><span style="font-size: 13px; color: #62676F">9 · Math L4 · Reading L5</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #1E40AF; background: #E4ECFD; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #1D4ED8"></span>No action needed</span>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; text-wrap: pretty">James mastered multiplication this week but keeps confusing what to do with division remainders. His confidence drops when a word problem has more than two steps.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">What Vachuo did</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.5; color: #3F444C">
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Added three short prerequisite lessons on remainders to next week</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Kept word problems to two steps until his success rate recovers</li>
<li style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Moved his football-stats project earlier, because that’s where he tries hardest</li>
</ul>
</div>
<a href="session.html" style="align-self: flex-start; font-size: 14px; font-weight: 500">See James’s sessions</a>
</article>

<article aria-labelledby="baraka" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4F4EF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-weight: 700; font-size: 18px; overflow: hidden; background: #DDF4F1"><img src="assets/img/52e1a52609aabe6b6af1b8329af92b96.svg" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><h2 id="baraka" style="margin: 0; font-size: 18px; font-weight: 600">Baraka</h2><span style="font-size: 13px; color: #62676F">19 · Engineering pathway, level 14 of K→16</span></div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #3F444C; background: #F4F4EF; padding: 5px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #8A8F96"></span>Self-directed</span>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.6; text-wrap: pretty">Baraka runs his own learning now. He chose to share a monthly summary with you, and the next one arrives on 1 December. Oversight ends where independence begins.</p>
<a href="passport.html" style="align-self: flex-start; font-size: 14px; font-weight: 500">Read his October summary</a>
</article>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<section aria-labelledby="handled" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="handled" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Handled this week</h2>

<script>
DC.component("Copilot", function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sarah: null, amani: 'open' };
  }
  renderVals() {
    const options = [
      { id: 'animals', title: 'Rebuild her writing around animals', detail: 'Her strongest interest. Same skills, new projects from Monday.', confirm: 'Done. Sarah’s next three writing projects now start from animals she chooses. You’ll hear how it went on Friday.' },
      { id: 'talk', title: 'Book a 10-minute talk, just you two', detail: 'Vachuo suggests a time and a gentle opening question.', confirm: 'Booked for Tuesday after lunch. Vachuo sent you three opening questions; none of them mention the missed work.' },
      { id: 'coach', title: 'Connect her with a writing coach', detail: 'Found through Connects. You approve the coach first.', confirm: 'Three verified coaches near you are waiting for your review in Connects.' }
    ];
    const sarahOptions = options.map((o) => {
      const on = this.state.sarah === o.id;
      return Object.assign({}, o, {
        checked: on ? 'true' : 'false',
        bg: on ? '#E4ECFD' : '#FFFFFF',
        bd: on ? '#1D4ED8' : '#E2E2DA',
        ring: on ? '6px solid #1D4ED8' : '1.5px solid #8A8F96',
        pick: () => this.setState({ sarah: o.id })
      });
    });
    const picked = options.filter((o) => o.id === this.state.sarah)[0];
    const a = this.state.amani;
    return {
      sarahOptions,
      sarahPicked: !!picked,
      sarahConfirm: picked ? picked.confirm : '',
      amaniOpen: a === 'open',
      amaniDone: a !== 'open',
      amaniBg: a === 'approved' ? '#E4ECFD' : '#F4F4EF',
      amaniFg: a === 'approved' ? '#172F73' : '#3F444C',
      amaniConfirm: a === 'approved'
        ? 'Approved. Amani’s group is confirmed for Thursday. Afterwards Vachuo will ask her whether she wants the visit counted.'
        : 'Declined. Vachuo will suggest another real-world way to practise ratios this week.',
      approve: () => this.setState({ amani: 'approved' }),
      decline: () => this.setState({ amani: 'declined' }),
      undo: () => this.setState({ amani: 'open' })
    };
  }
}
return Component;
});

DC.mount("Copilot");
</script>
