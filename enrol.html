<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Set up learners in bulk</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.acard{transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.55)}
.calpill{transition:transform .15s ease,box-shadow .15s ease}
.calpill:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(20,22,26,.45)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slidein{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.mdrop{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:28px 18px;border-radius:16px;border:2px dashed #93BBF3;background:#F8FAFF;transition:background-color .2s ease,border-color .2s ease,transform .2s ease}.mdrop.on{border-color:#1D4ED8;background:#E4ECFD;transform:scale(1.01)}.mdrop-ic{width:56px;height:56px;border-radius:50%;background:#FFFFFF;color:#1D4ED8;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -16px rgba(29,78,216,.6)}.mdrop.on .mdrop-ic{animation:mbob .9s ease-in-out infinite}@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
[data-theme="dark"] .mdrop{background:#151B29;border-color:#2F4F86}[data-theme="dark"] .mdrop.on{background:#1B2540;border-color:#8EB0FF}[data-theme="dark"] .mdrop-ic{background:#171A1F;color:#8EB0FF}
.enflow-i{animation:enup .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes enup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.enflow-n{animation:enpulse 3.6s ease-in-out infinite;animation-delay:var(--p,0s)}
@keyframes enpulse{0%,30%,100%{box-shadow:0 0 0 0 rgba(29,78,216,0);transform:none}12%{box-shadow:0 0 0 7px rgba(29,78,216,.16);transform:scale(1.08)}}
.enflow-i:not(:last-child)::after{content:"";position:absolute;top:34px;right:-12px;width:12px;height:2px;background:repeating-linear-gradient(90deg,#93BBF3 0 4px,transparent 4px 7px)}
@media (max-width:720px){.enflow-i:not(:last-child)::after{display:none}}
.enrow{animation:fadein .3s ease both}
.en-st{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.en-st-ok{background:#DDF4F1;color:#115E59}.en-st-warn{background:#FEF1D9;color:#92400E}.en-st-bad{background:#FBE1DF;color:#A3271F}
[data-theme="dark"] .en-st-ok{background:#123A36;color:#7DD5CA}[data-theme="dark"] .en-st-warn{background:#3A2C12;color:#F4C77A}[data-theme="dark"] .en-st-bad{background:#3D1C1E;color:#F5A3A0}
.en-msg-bad{color:#A3271F}.en-msg-warn{color:#92400E}.en-msg-ok{color:#3F444C}
[data-theme="dark"] .en-msg-bad{color:#F5A3A0}[data-theme="dark"] .en-msg-warn{color:#F4C77A}[data-theme="dark"] .en-msg-ok{color:#B8BDC5}
.en-dot{display:inline-block;width:9px;height:9px;border-radius:50%}.en-dot-ok{background:#0D9488}.en-dot-warn{background:#F9A826}.en-dot-bad{background:#D4483E}
.entable th{position:sticky;top:0;z-index:1;text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#62676F;padding:10px 8px;background:#FAFAF7;border-bottom:1px solid #E2E2DA;white-space:nowrap}
.entable td{padding:6px 6px;border-bottom:1px solid #ECECE6;vertical-align:middle;background:#FFFFFF}.entable tr.hasmsg td{border-bottom:none}
.entable .stk{position:sticky;z-index:1}.entable th.stk{z-index:3}.entable .stk0{left:0;width:58px;min-width:58px}.entable .stk1{left:70px;box-shadow:6px 0 8px -8px rgba(20,22,26,.35)}
.entable td input{min-width:112px}.entable td.w-d input{min-width:118px}.entable td.w-n input{min-width:150px}.entable td.w-e input{min-width:206px}
.entable tr.en-r-bad td{background:#FFF6F5}.entable tr.en-r-warn td{background:#FEF9EE}
[data-theme="dark"] .entable td{background:#171A1F}[data-theme="dark"] .entable tr.en-r-bad td{background:#26171A}[data-theme="dark"] .entable tr.en-r-warn td{background:#211C12}
.entable tr:last-child td{border-bottom:none}
[data-theme="dark"] .entable th{background:#13161A;color:#959AA3;border-color:#2A2E35}[data-theme="dark"] .entable td{border-color:#23262C}
.enseg{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.enbar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.entrk{animation:fadein .35s ease both}
.enmap{animation:fadein .3s ease both}
@media (max-width:720px){.enwho,.entrk{grid-template-columns:minmax(0,1fr)!important}.entrk>span:last-child{justify-content:flex-start!important}.enmap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.enmap select{grid-column:1/-1}}
.encount{transition:transform .25s ease}.encount:hover{transform:translateY(-1px)}
.enletter{break-inside:avoid}
@media print{body *{visibility:hidden!important}.enletters,.enletters *{visibility:visible!important}.enletters{position:absolute!important;left:0;top:0;width:100%;display:grid!important;grid-template-columns:1fr 1fr!important}.enletter{border:1px dashed #8A8F96!important}}
@media (prefers-reduced-motion:reduce){.enflow-i,.enflow-n,.enrow,.entrk,.enmap,.mdrop.on .mdrop-ic{animation:none}.enseg,.enbar{transition:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Enrol">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">


<main style="flex: 1 1 100%; min-width: 0; box-sizing: border-box; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header style="position: sticky; top: 0; z-index: 40; background: #FAFAF7; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1320px; margin: 0 auto; padding: 10px clamp(16px, 3vw, 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px">
<a href="landing.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: #14161A"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 700">V</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Vachuo<sup style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; margin-left: 1px">™</sup></span></a>
<span style="font-size: 14px; color: #3F444C">Set up learners in bulk</span>
<div style="flex: 1 1 200px; display: flex; align-items: center; gap: 10px"><div role="progressbar" aria-label="Bulk set-up progress" aria-valuetext="{{enPctLabel}}" style="flex: 1; height: 8px; border-radius: 999px; background: #E2E2DA; overflow: hidden"><div style="width: {{enPct}}; height: 100%; border-radius: 999px; background: #1D4ED8; transition: width .3s ease"></div></div><span style="font-size: 12.5px; color: #62676F; white-space: nowrap">{{enPctLabel}}</span></div>
<button type="button" onClick="{{enSample}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Try with a sample class</button>
<button type="button" role="switch" aria-checked="{{uiOn}}" aria-label="Dark theme" onClick="{{uiToggle}}" style="position: relative; width: 44px; height: 26px; border-radius: 999px; border: none; background: {{uiTrack}}; cursor: pointer"><span aria-hidden="true" style="position: absolute; top: 3px; left: {{uiKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFE; transition: left .2s ease"></span></button>
<a href="onboarding.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13.5px">Set up one learner instead</a>
</div>
</header>

<div style="max-width: 1320px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">

<nav aria-label="Bulk set-up steps" style="flex: 1 1 230px; max-width: 280px; position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{enRail}}" data-as="r"><button type="button" aria-current="{{r.current}}" onClick="{{r.go}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: none; background: {{r.rowBg}}; color: #14161A; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transition: background-color .25s ease, color .25s ease">{{r.n}}</span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; color: #62676F">{{r.sub}}</span></span></button></template>
</nav>

<section aria-labelledby="step-h" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">{{enPctLabel}}</span><h1 id="step-h" style="margin: 0; font-size: clamp(28px, 3vw, 38px); line-height: 1.1; font-weight: 600">{{enStepT}}</h1><p style="margin: 0; font-size: 17px; color: #3F444C">{{enStepS}}</p></div>

<template data-if="{{en_who}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 18px; line-height: 1.55; max-width: 720px">Add a whole class, a learning pod or all your children in one go. You start each profile with the basics; then a parent, a guide or the learner, with someone looking over their shoulder, finishes it. Nothing goes live until a parent or guardian gives consent.</p>
<ol aria-label="How bulk set-up works" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; font-family: Inter, system-ui, sans-serif"><li class="enflow-i" style="--d: 0s; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; align-items: center; gap: 10px"><span class="enflow-n" aria-hidden="true" style="--p: 0s; flex: none; width: 34px; height: 34px; border-radius: 50%; background: #F4F7FE; color: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg></span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Step 1</span></div><strong style="font-size: 15.5px; line-height: 1.3; color: #14161A">You add the basics</strong><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">Names, dates of birth and a parent’s contact, from an Excel sheet, a CSV, a paste or typed in.</span></li><li class="enflow-i" style="--d: .12s; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; align-items: center; gap: 10px"><span class="enflow-n" aria-hidden="true" style="--p: 1.2s; flex: none; width: 34px; height: 34px; border-radius: 50%; background: #F4F7FE; color: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11.5a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6"/></svg></span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Step 2</span></div><strong style="font-size: 15.5px; line-height: 1.3; color: #14161A">Each profile goes to the right person</strong><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">Parents for younger children. Learners 13 and over, supervised. Or a guide you name.</span></li><li class="enflow-i" style="--d: .24s; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA"><div style="display: flex; align-items: center; gap: 10px"><span class="enflow-n" aria-hidden="true" style="--p: 2.4s; flex: none; width: 34px; height: 34px; border-radius: 50%; background: #F4F7FE; color: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Step 3</span></div><strong style="font-size: 15.5px; line-height: 1.3; color: #14161A">Families agree, profiles go live</strong><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">See who has opened, started and finished, and send reminders to the rest.</span></li></ol>
<div role="group" aria-label="Who is adding the learners?" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; font-family: Inter, system-ui, sans-serif"><template data-for="{{enWhoOpts}}" data-as="o"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 2px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; text-align: left; cursor: pointer; transition: border-color .2s ease, background-color .2s ease"><span aria-hidden="true" style="flex: none; margin-top: 1px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{o.bd}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #1D4ED8">{{o.mark}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600; line-height: 1.3">{{o.label}}</span><span style="font-size: 13px; line-height: 1.4; color: #3F444C">{{o.sub}}</span></span></button></template></div>
<label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C; max-width: 460px">{{enOrgLabel}}<input id="en-org" type="text" value="{{enOrg}}" onChange="{{enSetOrg}}" placeholder="{{enOrgPh}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: #62676F; max-width: 720px">Only you see the list you upload. Families see their own child’s profile and nobody else’s.</p>
</div>
</template>

<template data-if="{{en_add}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<template data-if="{{enShowAdd}}"><div style="display: flex; flex-direction: column; gap: 16px"><div role="group" aria-label="How do you want to add learners?" style="display: flex; flex-wrap: wrap; gap: 8px"><template data-for="{{enMethods}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.label}}</button></template></div>
<template data-if="{{enIsUpload}}"><div style="display: flex; flex-direction: column; gap: 12px"><div class="mdrop {{enDropCls}}" role="group" aria-label="Spreadsheet upload area" onDragOver="{{enDragOver}}" onDragEnter="{{enDragOver}}" onDragLeave="{{enDragLeave}}" onDrop="{{enDrop}}"><span class="mdrop-ic" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg></span><p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 17px; font-weight: 600">{{enDropT}}</p><p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">Excel (.xlsx), CSV or TSV, with one learner per row and the column names in the first row.</p><button type="button" onClick="{{enPick}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4 M7 9l5-5 5 5 M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Choose a file</button><input id="en-file" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt,.xls,.ods,.numbers,text/csv" onChange="{{enFileIn}}" aria-hidden="true" tabindex="-1" style="display: none"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Using Google Sheets? File › Download › Microsoft Excel (.xlsx) or CSV.</span></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif"><span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14.5px">Start from our template</strong><span style="font-size: 13px; line-height: 1.45; color: #3F444C">Column names already in place, two example rows, and a second sheet that explains each column.</span></span><a href="{{enTplX}}" download="Vachuo learner list.xlsx" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>Excel template</a><a href="{{enTplC}}" download="Vachuo learner list.csv" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>CSV</a><button type="button" onClick="{{enSample}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border-color: #93BBF3; color: #1E40AF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>Try a sample class</button></div></div></template>
