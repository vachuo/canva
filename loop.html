<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 80px">

<header style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1D4ED8">Inside Vachuo · Pedagogy control</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 56px); line-height: 1.02; letter-spacing: -0.015em; font-weight: 600; max-width: 900px; text-wrap: balance">The loop is the school. Everything else is a view of it.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3F444C; max-width: 720px; text-wrap: pretty">Every lesson, project and workshop visit runs the same closed loop against one learner model per child. The tutor is not the moat; everyone will have a tutor. The moat is running this loop well across every subject, standard, level and pedagogy, for every learner.</p>
</header>

<div style="position: absolute; left: 512px; top: 201px; width: 132px; height: 60px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #93BBF3; display: flex; align-items: center; justify-content: center; text-align: center"><span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #1D4ED8">03</span><br>Teach</span></div>

<div style="position: absolute; left: 472px; top: 482px; width: 132px; height: 60px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #93BBF3; display: flex; align-items: center; justify-content: center; text-align: center"><span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #1D4ED8">05</span><br>Assess</span></div>

<div style="position: absolute; left: 200px; top: 561px; width: 132px; height: 60px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #93BBF3; display: flex; align-items: center; justify-content: center; text-align: center"><span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #1D4ED8">07</span><br>Remediate</span></div>
<div style="position: absolute; left: 76px; top: 482px; width: 132px; height: 60px; box-sizing: border-box; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #93BBF3; display: flex; align-items: center; justify-content: center; text-align: center"><span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #1D4ED8">08</span><br>Reassess</span></div>

</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">

<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">Every concept carries its prerequisites, objectives, standards, examples, known misconceptions, difficulty levels and real-world uses.</p>
</article>
