<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 80px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1D4ED8">Inside Vachuo · Pedagogy control</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(34px, 4vw, 56px); line-height: 1.02; letter-spacing: -0.015em; font-weight: 600; max-width: 900px; text-wrap: balance">The loop is the school. Everything else is a view of it.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3F444C; max-width: 720px; text-wrap: pretty">Every lesson, project and workshop visit runs the same closed loop against one learner model per child. The tutor is not the moat; everyone will have a tutor. The moat is running this loop well across every subject, standard, level and pedagogy, for every learner.</p>
</header>

<p style="margin: 0; font-size: 16.5px; line-height: 1.55; color: #3F444C; max-width: 720px">Content, Assessment and Pedagogy, kept as linked graphs rather than a library of lessons.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
<article style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px">

<h3 style="margin: 0; font-size: 19px; font-weight: 600">What there is to learn</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">Every concept carries its prerequisites, objectives, standards, examples, known misconceptions, difficulty levels and real-world uses.</p>
</article>
<article style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #1D4ED8">Assessment graph</span>
<h3 style="margin: 0; font-size: 19px; font-weight: 600">What this learner knows</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">Every interaction updates P(understands skill). A wrong answer is diagnosed, not just scored, because each cause needs a different response.</p>
</article>
<article style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #1D4ED8">Pedagogy graph</span>
<h3 style="margin: 0; font-size: 19px; font-weight: 600">What to do next</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3F444C">What to teach, how, how hard, in which modality and with which example. When to step in, when to review, and when mastery is real.</p>

<h2 id="deschool" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600; letter-spacing: -0.02em">Deschooling constraints: rules the loop must obey</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #3F444C; max-width: 760px; text-wrap: pretty">A closed loop this powerful could become the most total school ever built. Illich warned that schooling teaches people to confuse being taught with learning, and a diploma with competence. These rules keep Vachuo a tool for learners, not an institution that manages them. Every model, metric and screen is checked against them.</p>
</div>
