<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">K–12 After the Pandemic: The Recovery That Stalled, and the One That Could Work</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Scores and attendance have not returned to where they were. Intensive, individualised instruction is the best-evidenced lever we have.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 6 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>

<p style="margin: 0">In 2020 school closures disrupted the education of most of the world’s children. Six years on, the hoped-for recovery remains incomplete in many systems. The details differ by country, but the pattern is consistent: average achievement has not returned to pre-pandemic levels, gaps between advantaged and disadvantaged students have widened, attendance has become more fragile, and the emergency money that paid for recovery has largely run out.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What the data show</h2>
<p style="margin: 0">In the United States, the 2024 National Assessment of Educational Progress, released in early 2025, showed reading scores falling again for fourth- and eighth-graders, with the share of eighth-graders below the NAEP Basic level the largest in the assessment’s history. Mathematics improved modestly for fourth-graders but little for older students, and the gap between the highest and lowest performers widened. Chronic absenteeism, usually defined as missing at least a tenth of the school year, rose sharply during the pandemic and remains well above pre-2020 levels. Federal emergency relief funds, which financed much of the recovery effort, reached their final obligation deadline in September 2024.</p>
<p style="margin: 0">Analyses by Thomas Kane, Sean Reardon and colleagues in the Education Recovery Scorecard project suggest that many districts regained part of the lost ground but few regained all of it, and that recovery was weakest where losses had been greatest. In low- and middle-income countries the picture is starker, layered on top of pre-existing learning poverty.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Why recovery stalled</h2>
<p style="margin: 0">Three factors stand out. The losses were large relative to what typical interventions achieve; a district that lost half a year of learning cannot recover it with a summer programme. Many recovery efforts were too thin: tutoring offered once a week, optionally, after school, reached few of the students who needed it most. And attendance collapsed for a subset of students, so even good instruction did not reach them.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">Tutoring works when it is frequent, scheduled and part of the school day. Most recovery tutoring was none of these.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What works: intensive, individualised instruction</h2>
<p style="margin: 0">The best-evidenced way to accelerate learning is high-dosage tutoring. In a large randomised study in Chicago, published in 2023, Jonathan Guryan and colleagues found that daily small-group mathematics tutoring for ninth- and tenth-graders raised test scores by 0.18 to 0.40 standard deviations, substantial effects for adolescents who were far behind. The 2020 meta-analysis by Andre Nickow, Philip Oreopoulos and Vincent Quan found that tutoring effects are largest when sessions are frequent, delivered by trained tutors and held during the school day. The hard part has always been cost and staffing. Tutoring every struggling student daily requires more trained adults than most systems can hire.</p>
<p style="margin: 0">Technology-aided instruction offers part of the answer. Karthik Muralidharan, Abhijeet Singh and Alejandro Ganimian’s 2019 study of the personalised software Mindspark in Delhi found large gains in mathematics and Hindi over four and a half months, largely because the software let students work at their actual level rather than their grade level. The finding echoes Teaching at the Right Level, the approach developed by Pratham and evaluated widely in India and Africa: many students fall so far behind the curriculum that instruction pitched at their grade passes them by entirely.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Grade level is the wrong unit</h2>
<p style="margin: 0">The deepest lesson of the post-pandemic data is that the age-graded classroom was already failing many students, and the pandemic made the failure visible. When one class contains students working three or four grade levels apart, instruction pitched at the middle serves almost no one well. Placing students by what they know, moving them on when they demonstrate mastery and filling prerequisite gaps directly are not radical ideas. They are what the evidence on tutoring and targeted instruction implies.</p>
<p style="margin: 0">AI changes the economics. A well-designed AI tutor can provide daily, individualised practice and explanation at a marginal cost far below that of a human tutor, freeing scarce human time for motivation, relationships and judgement. The early randomised evidence on AI tutoring is encouraging but also cautionary, because unguarded AI assistance can reduce learning. The recovery that could work combines the two: AI for dosage and diagnosis, adults for meaning and accountability.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Beyond recovery</h2>
<p style="margin: 0">The same logic applies to systems in the middle of reform. Kenya’s transition to competency-based education, whose first cohort entered senior school in 2026, rests on assessing what students can do rather than how long they have studied. That ambition depends on assessment and individualisation at a scale that has been hard to achieve with paper and overcrowded classrooms.</p>
<p style="margin: 0">The goal should not be a return to 2019. It should be K–12 systems that meet every child at her actual level, every day, and know whether she is learning. That was always the promise of tutoring. It may finally be affordable.</p>

  }

}
