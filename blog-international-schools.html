<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">The International School Boom, and What It Teaches Everyone Else</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Fifteen thousand schools, 7.7 million students and nearly $70 billion in annual fees: the sector has become a laboratory for curriculum, credentials and mobility.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 6 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/3131eb41702479241dc132be8c19c769.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/734c48226a9d32aaeebc02194bddd245.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/3438b0a8fc256476ded0a4a58bd42512.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>

<p style="margin: 0">Half a century ago an international school was typically a small institution serving the children of diplomats, missionaries and multinational employees. Today it is one of the fastest-growing segments of education anywhere. According to ISC Research’s 2026 global snapshot, there are 15,075 international schools teaching 7.7 million students, employing about 730,000 staff and generating some US$69.3 billion in annual fee income. Asia accounts for 58% of the schools and Africa for 12%. The United Arab Emirates, Indonesia and Kazakhstan are among the fastest-growing markets, and the number of accredited schools has risen sharply.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">From expatriates to local families</h2>
<p style="margin: 0">The most important change is in who attends. Analysts have documented for more than a decade that most international-school students are now local children, usually from affluent or aspiring middle-class families, rather than expatriates. Parents are buying several things at once: instruction in English, a curriculum recognised abroad, smaller classes, and a pathway to universities in the United Kingdom, North America, Europe and, increasingly, Asia.</p>
<p style="margin: 0">In other words, the international school sells credentials as much as it sells education. The International Baccalaureate, Cambridge International qualifications and American-style diplomas function as passports: portable signals that a student’s learning will be recognised wherever she goes next.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">The international school sells credentials as much as it sells education.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What is “international” about them?</h2>
<p style="margin: 0">Tristan Bunnell, Michael Fertig and Chris James have argued that international schools gain legitimacy less from any single definition than from the institutional signals they display: accreditation, recognised curricula, internationally recruited staff and the language of global citizenship. The rise in accreditation fits that account; as the market fills, schools compete on verified quality. Mary Hayden and Jeff Thompson’s work for UNESCO traced how the sector’s growth has been driven by the globalisation of both the middle classes and the labour market for teachers.</p>
<p style="margin: 0">That labour market is itself a fault line. Many international schools depend on teachers recruited from a handful of English-speaking countries, at salaries local schools cannot match. Rapid expansion strains supply and can pull experienced local teachers away from public systems.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The equity question</h2>
<p style="margin: 0">Critics argue that the sector deepens stratification. It gives a privileged minority a parallel system with global currency while public schools serve everyone else, and it can weaken the constituency for improving national education. Defenders respond that international schools also import teaching practices, raise expectations and train teachers who later move into local systems. Both effects are real, and the balance varies by country.</p>
<p style="margin: 0">For families in much of Africa, including Kenya, international curricula carry particular weight. They offer continuity during national curriculum reforms, recognised university pathways and, for home-educating families, a route to credentials when the national system does not accommodate them. They are also expensive, which confines them to a small fraction of children.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Three lessons for everyone else</h2>
<p style="margin: 0"><b style="font-weight: 600">Portability matters.</b> Families value credentials that travel. Any education system, including AI-supported home education, should produce records of learning that can be verified and recognised across borders, not merely certificates issued by a single institution.</p>
<p style="margin: 0"><b style="font-weight: 600">Mapping curricula is infrastructure.</b> International schools routinely translate between frameworks, matching a student’s prior learning in one system to expectations in another. A learning platform built on a standards graph that maps concepts across national curricula, the IB, Cambridge and others can do this automatically, making transitions cheaper for mobile families.</p>
<p style="margin: 0"><b style="font-weight: 600">Quality signals must be earned.</b> As the market grows, accreditation and evidence become the differentiators. The same will be true of AI-supported schooling: claims will be cheap, and verified outcomes will not.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">An international education for more children</h2>
<p style="margin: 0">The most interesting question is whether the core of what international schools offer (globally recognised learning, strong English and pathways to opportunity) can be made available to children whose families will never pay their fees. AI-supported instruction, competence-based records and verifiable credentials make that more plausible than at any time before. It is a goal worth pursuing carefully, with rigour about quality, so that the passport an education provides is not reserved for those who can already afford to travel.</p>
