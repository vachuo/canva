<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Join as a guide or school</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.fl{color:#C9CCD0;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:34px;font-size:13.5px;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Join">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, sans-serif">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="index.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navPricing}}</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #3F444C">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>
<main style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 5vw, 72px) clamp(16px, 5vw, 72px) clamp(64px, 8.4vw, 120px); display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1E40AF">Join Vachuo</span><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(40px, 4.6vw, 64px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600">{{jTitle}}</h1><p style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; line-height: 1.55; color: #3F444C">{{jLede}}</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; color: #23272E"><template data-for="{{jPoints}}" data-as="p"><li>{{p.t}}</li></template></ul><p style="margin: 0; font-size: 14px; color: #62676F">Families sign up differently: <a href="onboarding.html">set up a learner</a>.</p></div>
<section id="school" aria-labelledby="j-h" style="flex: 2 1 560px; min-width: 0; padding: 24px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 18px"><div role="group" aria-label="I am joining as" style="align-self: flex-start; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{roles}}" data-as="r"><button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: {{r.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{r.label}}</button></template></div><ol aria-label="Steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{steps}}" data-as="t"><li aria-current="{{t.cur}}" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12.5px; font-weight: 600"><span>{{t.n}}</span>{{t.label}}</li></template></ol><h2 id="j-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">{{stepTitle}}</h2><template data-if="{{isGuide}}"><template data-if="{{g0}}"><div style="display: flex; flex-direction: column; gap: 14px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Full name<input type="text" value="{{f.gName}}" onChange="{{f.set_gName}}" placeholder="Nduta Kamau" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Phone<input type="tel" value="{{f.gPhone}}" onChange="{{f.set_gPhone}}" placeholder="+254 7XX XXX XXX" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Email<input type="email" value="{{f.gEmail}}" onChange="{{f.set_gEmail}}" placeholder="you@example.com" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Where you work<input type="text" value="{{f.gArea}}" onChange="{{f.set_gArea}}" placeholder="Online, or a Nairobi neighbourhood" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label></div></template><template data-if="{{g1}}"><div style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13.5px; font-weight: 600">Subjects</span><div role="group" aria-label="Subjects" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{gSubjects}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13.5px; font-weight: 600">Levels</span><div role="group" aria-label="Levels" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{gLevels}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13.5px; font-weight: 600">Curricula you know</span><div role="group" aria-label="Curricula you know" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{gCurricula}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div></div></div></template><template data-if="{{g2}}"><div style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><span style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Certificate of Good Conduct</span><span style="font-size: 12.5px; color: #62676F">From the DCI, issued in the last 12 months</span><span style="font-size: 12.5px; font-weight: 600; color: #115E59">{{f.gConduct}}</span></span><label style="position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Upload<input type="file" onChange="{{f.up_gConduct}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-radius: 12px; background: #FBFBF8; border: 1px solid #ECECE6"><span style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">A teaching or subject qualification</span><span style="font-size: 12.5px; color: #62676F">Degree, diploma or TSC number if you have one</span><span style="font-size: 12.5px; font-weight: 600; color: #115E59">{{f.gQual}}</span></span><label style="position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; font-size: 13.5px; font-weight: 600; cursor: pointer">Upload<input type="file" onChange="{{f.up_gQual}}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Two referees (names and phones)<input type="text" value="{{f.gRefs}}" onChange="{{f.set_gRefs}}" placeholder="We call them; we never share your details" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Every guide also completes Vachuo’s safeguarding course before meeting a learner. It takes about 90 minutes.</p></div></template><template data-if="{{g3}}"><div style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13.5px; font-weight: 600">Days you can work</span><div role="group" aria-label="Days you can work" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{gDays}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Your rate for a 45-minute session, in shillings<input type="number" value="{{f.gRate}}" onChange="{{f.set_gRate}}" placeholder="e.g. 1000" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #3F444C">Families see your rate before they book. Vachuo keeps [PLATFORM FEE] and pays you weekly by M-Pesa.</p></div></template><template data-if="{{g4}}"><div style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><template data-for="{{review}}" data-as="r"><div style="display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 0; border-top: 1px solid #ECECE6; font-size: 14px"><span style="flex: 0 0 200px; color: #62676F">{{r.k}}</span><span style="flex: 1 1 240px; font-weight: 600">{{r.v}}</span></div></template></div></div></template></template><template data-if="{{isSchool}}"><template data-if="{{s0}}"><div style="display: flex; flex-direction: column; gap: 14px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">School name<input type="text" value="{{f.sName}}" onChange="{{f.set_sName}}" placeholder="Kilimani Learning Hub" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13.5px; font-weight: 600">Type of school</span><div role="group" aria-label="Type of school" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{sTypes}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div></div><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Where it is<input type="text" value="{{f.sArea}}" onChange="{{f.set_sArea}}" placeholder="Town and neighbourhood" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">How many learners<input type="number" value="{{f.sCount}}" onChange="{{f.set_sCount}}" placeholder="e.g. 24" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label></div></template><template data-if="{{s1}}"><div style="display: flex; flex-direction: column; gap: 14px"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">Lead’s full name<input type="text" value="{{f.sLead}}" onChange="{{f.set_sLead}}" placeholder="Otieno A." style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></label><label style="display: flex; flex-direction: co       jPoints: (role === 'guide' ? ['Mark with Socrates’ suggestion beside you. Your mark is the one that counts.', 'Book online check-ins; in-person sessions wait for a parent’s yes.', 'Every guide is identity-checked and completes safeguarding training.'] : ['Microschools work in cohorts; larger schools can add departments.', 'Families see only their own child, always.', 'Start with a pilot cohort and add the rest when you are ready.']).map((t) => ({ t })),
      steps: ST.map((label, i) => ({ n: String(i + 1), label, cur: i === step ? 'step' : 'false', bg: i === step ? '#14161A' : (i < step ? '#DDF4F1' : '#F4F4EF'), fg: i === step ? '#FFFFFF' : (i < step ? '#115E59' : '#3F444C') })),
      stepTitle: done ? 'Sent' : ST[step], f: F,
      g0: role === 'guide' && step === 0 && !done, g1: role === 'guide' && step === 1 && !done, g2: role === 'guide' && step === 2 && !done, g3: role === 'guide' && step === 3 && !done, g4: role === 'guide' && step === 4 && !done,
      s0: role === 'school' && step === 0 && !done, s1: role === 'school' && step === 1 && !done, s2: role === 'school' && step === 2 && !done, s3: role === 'school' && step === 3 && !done, s4: role === 'school' && step === 4 && !done,
      gSubjects: chipList('gSubjects', ['Maths', 'English', 'Kiswahili', 'Science', 'Social Studies', 'Making', 'Music']), gLevels: chipList('gLevels', ['Pre-primary', 'Grades 1–6', 'Grades 7–9', 'Grades 10–12', 'Adults']), gCurricula: chipList('gCurricula', ['Kenya CBC', '8-4-4', 'IGCSE', 'US Common Core', 'IB']),
      gDays: chipList('gDays', ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']), sTypes: chipList('sTypes', ['Microschool', 'Private school', 'International school', 'Learning pod', 'Public school pilot'], true),
      sCurricula: chipList('sCurricula', ['Kenya CBC', 'IGCSE', 'IB', 'US Common Core', 'Montessori']), sDept: chipList('sDept', ['Cohorts only', 'Departments and cohorts'], true),
      plans: [['micro', 'Microschool', 'KSh 900 per learner a month', 'Minimum 5 learners'], ['systems', 'Schools and systems', 'Custom annual agreement', 'For larger schools and networks']].map(([id, name, price, note]) => ({ name, price, note, on: (s.plan || 'micro') === id ? 'true' : 'false', bd: (s.plan || 'micro') === id ? '#1D4ED8' : '#E2E2DA', pick: () => set({ plan: id }) })),
      review: [['Name', v.gName], ['Phone', v.gPhone], ['Subjects', (s.sel.gSubjects || []).join(', ')], ['Levels', (s.sel.gLevels || []).join(', ')], ['Good conduct certificate', v.gConduct ? 'Uploaded' : 'Missing'], ['Rate', v.gRate ? 'KSh ' + v.gRate : 'Not set']].map(([k, val]) => ({ k, v: val || '—' })),
      notDone: !done, done, back: () => set({ step: Math.max(0, step - 1), err: '' }), backOp: step === 0 ? 0.4 : 1,
      next: () => { if (step === 0) { const need = role === 'guide' ? [v.gName, v.gPhone] : [v.sName, (s.sel.sTypes || [])[0]]; if (need.some((x) => !x)) { set({ err: role === 'guide' ? 'Add your name and phone first.' : 'Add the school name and type first.' }); return; } }
        if (step < 4) set({ step: step + 1, err: '' }); else { const d = Object.assign({}, s.done); d[role] = true; set({ done: d, err: '' }); } },
      nextLabel: step < 4 ? 'Next' : (role === 'guide' ? 'Send my application' : 'Set up the school'), err: s.err || '',
      doneTitle: role === 'guide' ? 'Application sent' : 'Your school is set up',
      doneText: role === 'guide' ? 'We check documents and call your referees within [N] working days. Next comes the safeguarding course, then your first learners.' : 'Invite your guides next, then add your first cohort. Families join by invitation and set up their own learners.',
      doneHref: role === 'guide' ? 'guide.html' : 'school.html', doneLink: role === 'guide' ? 'Preview the guide workspace' : 'Open the school console'
    });
  }
}
return Component;
});
