<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Set up a learner</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.acard{transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.55)}
.calpill{transition:transform .15s ease,box-shadow .15s ease}
.calpill:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(20,22,26,.45)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slidein{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.paper-lined{background-color:#FFFFFE;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#C9D6F2 33px,#C9D6F2 34px),linear-gradient(to right,transparent 40px,#F2B8B5 40px,#F2B8B5 41px,transparent 41px);background-position:0 10px,0 0}
@media (prefers-reduced-motion:reduce){.fadein,.slidein,.livedot{animation:none}.acard:hover,.calpill:hover{transform:none}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vq{display:flex;flex-direction:column;gap:1px;align-self:stretch;box-sizing:border-box;width:100%;margin:0 0 6px;padding:5px 9px;border:none;border-left:3px solid currentColor;border-radius:6px;background:rgba(127,127,127,.14);color:inherit;font-family:Inter,system-ui,sans-serif;font-size:12.5px;line-height:1.35;text-align:left;white-space:normal;cursor:pointer}div.vq{cursor:default}.vq .vq-w{font-weight:600;opacity:.8}.vq .vq-t,.vq-bar .vq-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vq .vq-t{opacity:.92}.vq:focus-visible,.vq-rb:focus-visible,.vq-x:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}.vq-rb{display:inline-flex;align-items:center;min-height:28px;padding:0 6px;border:none;border-radius:999px;background:transparent;color:#1E40AF;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600;cursor:pointer}.vq-rb:hover{background:#F4F7FE}.vq-bar{display:flex;align-items:flex-start;gap:8px;padding:7px 6px 7px 10px;border-left:3px solid #1D4ED8;border-radius:8px;background:#F4F7FE;color:#14161A;font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.4}.vq-bar .vq-w{font-weight:600}.vq-bar .vq-t{color:#3F444C}.vq-x{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:transparent;color:#3F444C;font-size:17px;line-height:1;cursor:pointer}.vq-x:hover{background:rgba(127,127,127,.18)}[data-theme="dark"] .vq-bar{background:#1B2333;color:#EDEDE8}[data-theme="dark"] .vq-bar .vq-t{color:#C9CCD1}[data-theme="dark"] .vq-rb{color:#AFD0FF}[data-theme="dark"] .vq-rb:hover{background:#22262D}[data-theme="dark"] .vq-x{color:#C9CCD1}
.mdrop{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:26px 18px;border-radius:16px;border:2px dashed #93BBF3;background:#F8FAFF;transition:background-color .2s ease,border-color .2s ease,transform .2s ease}.mdrop.on{border-color:#1D4ED8;background:#E4ECFD;transform:scale(1.01)}.mdrop-ic{width:56px;height:56px;border-radius:50%;background:#FFFFFF;color:#1D4ED8;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -16px rgba(29,78,216,.6)}.mdrop.on .mdrop-ic{animation:mbob .9s ease-in-out infinite}@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.mbar.run{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%)!important;background-size:16px 16px!important;animation:mstripe .8s linear infinite}@keyframes mstripe{to{background-position:16px 0}}.mrow,.mpop{animation:fadein .35s ease}@media (max-width:720px){.mrow{grid-template-columns:auto minmax(0,1fr) auto!important}.mrow select{grid-column:2/3}.mcrow{grid-template-columns:1fr 1fr!important}.mlrow{grid-template-columns:1fr!important}}@media (prefers-reduced-motion:reduce){.mdrop.on .mdrop-ic,.mbar.run{animation:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Onboarding">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">


<main style="flex: 1 1 100%; min-width: 0; box-sizing: border-box; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header style="position: sticky; top: 0; z-index: 40; background: #FAFAF7; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1320px; margin: 0 auto; padding: 10px clamp(16px, 3vw, 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px">
<a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: #14161A"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 700">V</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Vachuo<sup style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; margin-left: 1px">™</sup></span></a>
<span style="font-size: 14px; color: #3F444C">Set up a learner</span>
<div style="flex: 1 1 200px; display: flex; align-items: center; gap: 10px"><div role="progressbar" aria-label="Setup progress" aria-valuetext="{{pctLabel}}" style="flex: 1; height: 8px; border-radius: 999px; background: #E2E2DA; overflow: hidden"><div style="width: {{pct}}; height: 100%; border-radius: 999px; background: #1D4ED8; transition: width .3s ease"></div></div><span style="font-size: 12.5px; color: #62676F; white-space: nowrap">{{pctLabel}}</span></div>
<button type="button" onClick="{{fillSample}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Fill with a sample family</button>
<button type="button" role="switch" aria-checked="{{uiOn}}" aria-label="Dark theme" onClick="{{uiToggle}}" style="position: relative; width: 44px; height: 26px; border-radius: 999px; border: none; background: {{uiTrack}}; cursor: pointer"><span aria-hidden="true" style="position: absolute; top: 3px; left: {{uiKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFE; transition: left .2s ease"></span></button>
<a href="copilot.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13.5px">Save and finish later</a>
</div>
</header>

<div style="max-width: 1320px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">

<nav aria-label="Setup steps" style="flex: 1 1 230px; max-width: 280px; position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{rail}}" data-as="r"><button type="button" aria-current="{{r.current}}" onClick="{{r.go}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: none; background: {{r.rowBg}}; color: #14161A; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{r.n}}</span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; color: #62676F">{{r.sub}}</span></span></button></template>
</nav>

<section aria-labelledby="step-h" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<template data-if="{{invOn}}"><div class="fadein" role="status" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F4F7FE; border: 1px solid #93BBF3; font-family: Inter, system-ui, sans-serif"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; color: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><strong style="font-size: 15px; color: #14161A">{{invTitle}}</strong><span style="font-size: 14px; line-height: 1.5; color: #1E3A8A">{{invText}}</span></span><button type="button" onClick="{{invDismiss}}" aria-label="Hide this note" style="flex: none; width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: #3F444C; font-size: 18px; line-height: 1; cursor: pointer">×</button></div></template>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">{{pctLabel}}</span><h1 id="step-h" style="margin: 0; font-size: clamp(28px, 3vw, 38px); line-height: 1.1; font-weight: 600">{{stepTitle}}</h1><p style="margin: 0; font-size: 17px; color: #3F444C">{{stepSub}}</p></div>

<template data-if="{{is_start}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 18px; line-height: 1.55; max-width: 720px">This builds one profile that every part of Vachuo uses: Socrates, the learning map, classes and assessments. The learner, a parent, Socrates and, if you have one, an independent tutor all agree on the placement before anything is set.</p>
<div role="group" aria-label="Who is setting up?" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; font-family: Inter, system-ui, sans-serif"><template data-for="{{whoOpts}}" data-as="o"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 2px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; margin-top: 1px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{o.bd}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #1D4ED8">{{o.mark}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600; line-height: 1.3">{{o.label}}</span><span style="font-size: 13px; line-height: 1.4; color: #3F444C">{{o.sub}}</span></span></button></template></div>
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F7FE; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #1E3A8A">{{whoNote}}</p>
<p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #3F444C">Setting up a class, a learning pod or several children? <a href="enrol.html">Add them all at once from a spreadsheet</a>.</p>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Consent</h2>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cData}}" onChange="{{tData}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">I’m the parent or legal guardian, and I agree that Vachuo may process my child’s data to teach, assess and report on their learning, as Kenya’s Data Protection Act, 2019 requires for children.</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cTerms}}" onChange="{{tTerms}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">I accept the family terms and the community rules (Clubs, Connects and Showcase).</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cAi}}" onChange="{{tAi}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">Socrates may use anonymised practice data to get better at teaching. (Optional; you can change this later.)</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cComms}}" onChange="{{tComms}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">Send me the Sunday letter and the weekly briefing. (Optional)</label>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">You can download or delete everything from Parent copilot at any time.</span>
</div>
</div>
</template>

<template data-if="{{is_family}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Main parent or guardian</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">First name<input type="text" autocomplete="given-name" value="{{gFirst}}" onChange="{{gSetFirst}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Last name<input type="text" autocomplete="family-name" value="{{gLast}}" onChange="{{gSetLast}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Relationship<select value="{{gRel}}" onChange="{{gSetRel}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gRelOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Mobile (for M-Pesa and codes)<input type="tel" inputmode="tel" autocomplete="tel" value="{{gPhone}}" onChange="{{gSetPhone}}" placeholder="0712 345 678" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Email<input type="email" autocomplete="email" value="{{gEmail}}" onChange="{{gSetEmail}}" placeholder="name@example.com" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Language for messages<select value="{{gLang}}" onChange="{{gSetLang}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gLangOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<template data-if="{{gVerified}}"><span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700">✓ Phone verified</span></template>
<template data-if="{{gNotVerified}}"><div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; font-family: Inter, system-ui, sans-serif"><button type="button" onClick="{{gSendCode}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer">Send a code by SMS</button><template data-if="{{gSent}}"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">6-digit code<input type="text" inputmode="numeric" autocomplete="one-time-code" value="{{gCode}}" onChange="{{gSetCode}}" style="min-height: 44px; width: 140px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 16px; letter-spacing: 0.2em; font-family: ui-monospace, monospace"></label><button type="button" onClick="{{gCheckCode}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Verify</button></template></div></template>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-size: 22px; font-weight: 600">Second parent or guardian</h2><label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{g2}}" onChange="{{toggleG2}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Add another</label></div>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Either guardian can approve listings, clubs and plan changes. Payments go to the main guardian.</span>
<template data-if="{{g2}}"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">First name<input type="text" value="{{g2First}}" onChange="{{g2SetFirst}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Last name<input type="text" value="{{g2Last}}" onChange="{{g2SetLast}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Relationship<select value="{{g2Rel}}" onChange="{{g2SetRel}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gRelOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Mobile<input type="tel" inputmode="tel" value="{{g2Phone}}" onChange="{{g2SetPhone}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label></div></template>
</div>
</div>
</template>

<template data-if="{{is_learner}}">

olumn; gap: 10px; padding: 14px; border-radius: 14px; background: #FAFAF7; border: 1px solid #ECECE6; font-family: Inter, system-ui, sans-serif"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #62676F">{{trBarsTitle}}</span><template data-for="{{trBars}}" data-as="b"><div style="display: grid; grid-template-columns: minmax(110px, 160px) 1fr minmax(110px, 160px); align-items: center; gap: 10px; font-size: 13px"><span style="text-align: right; color: #3F444C">{{b.l}}</span><span role="img" aria-label="{{b.aria}}" style="position: relative; display: block; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #DDF4F1, #E4ECFD)"><span style="position: absolute; top: -4px; left: calc({{b.pos}}% - 9px); width: 18px; height: 18px; border-radius: 50%; background: #1D4ED8; border: 2px solid #FFFFFF; box-shadow: 0 1px 3px rgba(20,22,26,0.35)"></span></span><span style="color: #3F444C">{{b.r}}</span></div></template><span style="font-size: 12.5px; color: #62676F">A snapshot, not a verdict. Children change, so Vachuo asks again every six months and older answers fade.</span></div></template></div>

-as="r"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: {{r.bg}}"><span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{r.fg}}">{{r.rank}} · {{r.code}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; color: #14161A">{{r.name}}</span><span style="font-size: 13.5px; line-height: 1.5; color: #3F444C">{{r.d}}</span><span style="font-size: 13px; line-height: 1.5; color: #14161A"><strong>Try:</strong> {{r.try}}</span><a href="{{r.href}}" style="align-self: flex-start; font-size: 13px; font-weight: 600">{{r.link}} →</a></div></template></div></template></div>

ize: 13px; font-weight: 600; color: #3F444C">What it found, in a sentence<input value="{{trOtherResult}}" onChange="{{trSetOtherResult}}" placeholder="e.g. strong in empathy and planning" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label></div></div>

<div style="display: flex; flex-direction: column; gap: 6px; font-family: Inter, system-ui, sans-serif"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Mastery bar</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{threshOpts}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}}</button></template></div><span style="font-size: 13px; color: #62676F">{{pThreshNote}}</span></div>
</div>
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #DDF4F1; font-size: 17px; line-height: 1.5; color: #134E4A">{{pSummary}}</p>
</div>
</template>

<template data-if="{{is_place}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 17px; line-height: 1.55; max-width: 760px">Three questions a subject, from Grade 5 to Grade 7, stopping where it gets hard. It isn’t a test: it tells Socrates where to start, and the first two weeks refine it.</p>
<div role="tablist" aria-label="Subjects" style="display: flex; flex-wrap: wrap; gap: 6px; font-family: Inter, system-ui, sans-serif"><template data-for="{{subjTabs}}" data-as="c"><button type="button" role="tab" aria-selected="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; cursor: pointer">{{c.label}} <span style="opacity: 0.7; font-size: 12.5px">{{c.done}}</span></button></template></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<template data-if="{{qShow}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; color: #1E40AF">{{qLine}}</span><p style="margin: 0; font-size: 22px; line-height: 1.35">{{qText}}</p><div role="group" aria-label="Answers" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; font-family: Inter, system-ui, sans-serif"><template data-for="{{qOpts}}" data-as="o"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 2px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; font-size: 15px; text-align: left; cursor: pointer">{{o.label}}</button></template></div></template>
<template data-if="{{qDone}}"><p style="margin: 0; font-size: 18px; font-weight: 600">{{qDoneLine}}</p><button type="button" onClick="{{qRedo}}" style="align-self: flex-start; min-height: 40px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; text-decoration: underline; cursor: pointer">Try this subject again</button></template>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid #ECECE6; font-family: Inter, system-ui, sans-serif"><span style="font-size: 13.5px; color: #3F444C">{{selfQ}}</span><template data-for="{{selfOpts}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}}</button></template><template data-if="{{qHasPrev}}"><button type="button" onClick="{{qPrev}}" style="margin-left: auto; min-height: 36px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-size: 13px; text-decoration: underline; cursor: pointer">Back a question</button></template></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 21px; font-weight: 600">Starting points so far</h2><div role="table" style="display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif"><template data-for="{{resultRows}}" data-as="r"><div role="row" style="display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid #ECECE6"><span role="cell" style="flex: 0 0 110px; font-size: 14px; font-weight: 600">{{r.subj}}</span><span role="cell" style="flex: 1; font-size: 13.5px; color: {{r.fg}}">{{r.line}}</span><span role="cell" style="font-family: ui-monospace, monospace; font-size: 13.5px">{{r.lvl}}</span></div></template></div></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 21px; font-weight: 600">Other evidence</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: Inter, system-ui, sans-serif"><label style="position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Upload the last report card<input type="file" accept="image/*,application/pdf" onChange="{{rUpload}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden"></label><span style="font-size: 13.5px; color: #3F444C">{{rName}}</span></div>
<label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Teacher’s or tutor’s comments (optional)<textarea rows="3" value="{{rNotes}}" onChange="{{rSetNotes}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400; line-height: 1.45"></textarea></label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cSkip}}" onChange="{{cToggleSkip}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">Skip the check for now and let Socrates place {{pvName}} during the first week.</label>
</div>
</div>
</template>

<template data-if="{{is_team}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 17px; line-height: 1.55; max-width: 760px">Everyone who teaches {{pvName}} agrees on where to start. <span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #1E40AF">{{tmSigned}}</span></p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Learner</span><h2 style="margin: 0; font-size: 21px; font-weight: 600">{{tmLearnerName}}: how does this feel?</h2><div style="display: flex; flex-wrap: wrap; gap: 6px; font-family: Inter, system-ui, sans-serif"><template data-for="{{tmLearnerOpts}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}}</button></template></div><template data-if="{{tmLearnerDone}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #115E59">✓ Heard</span></template></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Socrates</span><h2 style="margin: 0; font-size: 21px; font-weight: 600">Placement reasoning</h2><template data-if="{{tmSocNot}}"><button type="button" onClick="{{tmSocRun}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Ask Socrates to review</button></template><template data-if="{{tmSocDone}}"><p style="margin: 0; font-size: 16px; line-height: 1.5">{{tmSocText}}</p><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #115E59">✓ Reviewed</span></template></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Independent tutor</span><template data-if="{{tmHasTutor}}"><h2 style="margin: 0; font-size: 21px; font-weight: 600">{{tmTutorName}}</h2><template data-if="{{tmTutorNot}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #92400E">Waiting for their review</span><button type="button" onClick="{{tmTutorDemo}}" style="align-self: flex-start; min-height: 40px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-family: Inter, system-ui, sans-serif; font-size: 13px; text-decoration: underline; cursor: pointer">The tutor reviews (demo)</button></template><template data-if="{{tmTutorDone}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #115E59">✓ Reviewed</span></template></template><template data-if="{{tmNoTutor}}"><p style="margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #3F444C">{{tmNoTutorText}}</p></template></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Parent</span><h2 style="margin: 0; font-size: 21px; font-weight: 600">{{tmParentName}} approves</h2><template data-if="{{tmParentNot}}"><button type="button" onClick="{{tmParentOk}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Approve the placement and plan</button></template><template data-if="{{tmParentDone}}"><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #115E59">✓ Approved</span></template></div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 21px; font-weight: 600">Starting level by subject</h2><span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Change a level and the parent approval resets, so everyone sees the change.</span><div style="display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif"><template data-for="{{levelRows}}" data-as="r"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; border-top: 1px solid #ECECE6"><span style="flex: 0 0 110px; font-size: 14px; font-weight: 600">{{r.subj}}</span><label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F444C"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">{{r.subj}} level</span><select value="{{r.val}}" onChange="{{r.set}}" style="min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><template data-for="{{r.opts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><span style="font-size: 12.5px; color: #62676F">{{r.src}}</span></div></template></div></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 21px; font-weight: 600">Notes</h2>
<template data-if="{{hasComments}}"><div style="display: flex; flex-direction: column; gap: 6px"><template data-for="{{comments}}" data-as="c"><div id="{{c.domId}}" style="margin-left: {{c.indent}}; padding: 8px 12px; border-left: {{c.rule}}; border-radius: 12px; background: #F4F4EF; display: flex; flex-direction: column; gap: 2px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; color: #3F444C">{{c.who}}</span><template data-if="{{c.hasQ}}"><button type="button" class="vq" onClick="{{c.qGo}}" aria-label="{{c.qAria}}"><span class="vq-w">↩ Replying to {{c.qWho}}:</span><span class="vq-t">{{c.qText}}</span></button></template><span style="font-size: 16px; line-height: 1.4">{{c.t}}</span><span style="display: flex"><template data-if="{{c.canReply}}"><button type="button" class="vq-rb" onClick="{{c.replyGo}}" aria-label="{{c.replyAria}}">↩ Reply</button></template></span></div></template></div></template>
<template data-if="{{oqBar}}"><div class="vq-bar" role="status" aria-live="polite"><span aria-hidden="true" style="font-weight: 700">↩</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span class="vq-w">Replying to {{oqBarWho}}:</span><span class="vq-t">{{oqBarText}}</span></span><button type="button" class="vq-x" aria-label="Send without quoting this message" title="Send without a quote" onClick="{{oqBarX}}">×</button></div></template><div style="display: flex; gap: 8px; align-items: flex-end; font-family: Inter, system-ui, sans-serif"><label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Add a note for the team<textarea id="onb-note" rows="2" value="{{tmNote}}" onChange="{{tmSetNote}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 400"></textarea></label><button type="button" onClick="{{tmAddNote}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer">Add</button></div>
</div>
</div>
</template>

<p style="margin: 0; font-size: 18px; line-height: 1.55; max-width: 760px">{{readyLead}}</p>

<template data-for="{{areas}}" data-as="a"><div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E4ECFD; color: #1E40AF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icon}}"/></svg></span><div style="display: flex; flex-direction: column"><h2 style="margin: 0; font-size: 21px; font-weight: 600">{{a.t}}</h2><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">{{a.who}}</span></div></div><ul style="margin: 0; padding-left: 18px; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.55; color: #14161A"><template data-for="{{a.lines}}" data-as="l"><li>{{l.t}}</li></template></ul><template data-if="{{finished}}"><a href="{{a.href}}" style="display: inline-flex; align-items: center; min-height: 44px; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">{{a.cta}} →</a></template></div></template>
</div>

<template data-if="{{finished}}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #DDF4F1; font-family: Inter, system-ui, sans-serif"><span style="font-size: 16px; font-weight: 700; color: #115E59">✓ All set.</span><a href="today.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14.5px; font-weight: 600">Go to Today</a><a href="copilot.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14.5px">Open Parent copilot</a></div></template>
</div>
</template>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; font-family: Inter, system-ui, sans-serif"><template data-if="{{hasBack}}"><button type="button" onClick="{{back}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; cursor: pointer">Back</button></template><template data-if="{{hasNext}}"><button type="button" onClick="{{next}}" style="min-height: 48px; padding: 0 24px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">{{nextLabel}}</button></template></div>
</section>
