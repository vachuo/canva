<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Set up a learner</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.acard{transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.55)}
.calpill{transition:transform .15s ease,box-shadow .15s ease}
.calpill:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(20,22,26,.45)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slidein{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.paper-lined{background-color:#FFFFFE;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#C9D6F2 33px,#C9D6F2 34px),linear-gradient(to right,transparent 40px,#F2B8B5 40px,#F2B8B5 41px,transparent 41px);background-position:0 10px,0 0}
@media (prefers-reduced-motion:reduce){.fadein,.slidein,.livedot{animation:none}.acard:hover,.calpill:hover{transform:none}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Onboarding">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">


<main style="flex: 1 1 100%; min-width: 0; box-sizing: border-box; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header style="position: sticky; top: 0; z-index: 40; background: #FAFAF7; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1320px; margin: 0 auto; padding: 10px clamp(16px, 3vw, 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px">
<a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: #14161A"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 20px; font-weight: 700">V</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Vachuo<sup style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; margin-left: 1px">™</sup></span></a>
<span style="font-size: 14px; color: #3F444C">Set up a learner</span>
<div style="flex: 1 1 200px; display: flex; align-items: center; gap: 10px"><div role="progressbar" aria-label="Setup progress" aria-valuetext="{{pctLabel}}" style="flex: 1; height: 8px; border-radius: 999px; background: #E2E2DA; overflow: hidden"><div style="width: {{pct}}; height: 100%; border-radius: 999px; background: #1D4ED8; transition: width .3s ease"></div></div><span style="font-size: 12.5px; color: #62676F; white-space: nowrap">{{pctLabel}}</span></div>
<button type="button" onClick="{{fillSample}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Fill with a sample family</button>
<button type="button" role="switch" aria-checked="{{uiOn}}" aria-label="Dark theme" onClick="{{uiToggle}}" style="position: relative; width: 44px; height: 26px; border-radius: 999px; border: none; background: {{uiTrack}}; cursor: pointer"><span aria-hidden="true" style="position: absolute; top: 3px; left: {{uiKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFE; transition: left .2s ease"></span></button>
<a href="copilot.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13.5px">Save and finish later</a>
</div>
</header>

<div style="max-width: 1320px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">

<nav aria-label="Setup steps" style="flex: 1 1 230px; max-width: 280px; position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{rail}}" data-as="r"><button type="button" aria-current="{{r.current}}" onClick="{{r.go}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 12px; border: none; background: {{r.rowBg}}; color: #14161A; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{r.n}}</span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; color: #62676F">{{r.sub}}</span></span></button></template>
</nav>

<section aria-labelledby="step-h" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">{{pctLabel}}</span><h1 id="step-h" style="margin: 0; font-size: clamp(28px, 3vw, 38px); line-height: 1.1; font-weight: 600">{{stepTitle}}</h1><p style="margin: 0; font-size: 17px; color: #3F444C">{{stepSub}}</p></div>

<template data-if="{{is_start}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 18px; line-height: 1.55; max-width: 720px">This builds one profile that every part of Vachuo uses: Socrates, the learning map, classes and assessments. The learner, a parent, Socrates and, if you have one, an independent tutor all agree on the placement before anything is set.</p>
<div role="group" aria-label="Who is setting up?" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; font-family: Inter, system-ui, sans-serif"><template data-for="{{whoOpts}}" data-as="o"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 2px solid {{o.bd}}; background: {{o.bg}}; color: #14161A; text-align: left; cursor: pointer"><span aria-hidden="true" style="flex: none; margin-top: 1px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{o.bd}}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #1D4ED8">{{o.mark}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600; line-height: 1.3">{{o.label}}</span><span style="font-size: 13px; line-height: 1.4; color: #3F444C">{{o.sub}}</span></span></button></template></div>
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #F4F7FE; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #1E3A8A">{{whoNote}}</p>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Consent</h2>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cData}}" onChange="{{tData}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">I’m the parent or legal guardian, and I agree that Vachuo may process my child’s data to teach, assess and report on their learning, as Kenya’s Data Protection Act, 2019 requires for children.</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cTerms}}" onChange="{{tTerms}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">I accept the family terms and the community rules (Clubs, Connects and Showcase).</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cAi}}" onChange="{{tAi}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">Socrates may use anonymised practice data to get better at teaching. (Optional; you can change this later.)</label>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #14161A; cursor: pointer"><input type="checkbox" checked="{{cComms}}" onChange="{{tComms}}" style="flex: none; margin-top: 3px; width: 19px; height: 19px; accent-color: #1D4ED8">Send me the Sunday letter and the weekly briefing. (Optional)</label>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">You can download or delete everything from Parent copilot at any time.</span>
</div>
</div>
</template>

<template data-if="{{is_family}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Main parent or guardian</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">First name<input type="text" autocomplete="given-name" value="{{gFirst}}" onChange="{{gSetFirst}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Last name<input type="text" autocomplete="family-name" value="{{gLast}}" onChange="{{gSetLast}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Relationship<select value="{{gRel}}" onChange="{{gSetRel}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gRelOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Mobile (for M-Pesa and codes)<input type="tel" inputmode="tel" autocomplete="tel" value="{{gPhone}}" onChange="{{gSetPhone}}" placeholder="0712 345 678" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Email<input type="email" autocomplete="email" value="{{gEmail}}" onChange="{{gSetEmail}}" placeholder="name@example.com" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Language for messages<select value="{{gLang}}" onChange="{{gSetLang}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gLangOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<template data-if="{{gVerified}}"><span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700">✓ Phone verified</span></template>
<template data-if="{{gNotVerified}}"><div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; font-family: Inter, system-ui, sans-serif"><button type="button" onClick="{{gSendCode}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer">Send a code by SMS</button><template data-if="{{gSent}}"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">6-digit code<input type="text" inputmode="numeric" autocomplete="one-time-code" value="{{gCode}}" onChange="{{gSetCode}}" style="min-height: 44px; width: 140px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 16px; letter-spacing: 0.2em; font-family: ui-monospace, monospace"></label><button type="button" onClick="{{gCheckCode}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Verify</button></template></div></template>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px"><h2 style="margin: 0; font-size: 22px; font-weight: 600">Second parent or guardian</h2><label style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{g2}}" onChange="{{toggleG2}}" style="width: 18px; height: 18px; accent-color: #1D4ED8">Add another</label></div>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Either guardian can approve listings, clubs and plan changes. Payments go to the main guardian.</span>
<template data-if="{{g2}}"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">First name<input type="text" value="{{g2First}}" onChange="{{g2SetFirst}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Last name<input type="text" value="{{g2Last}}" onChange="{{g2SetLast}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Relationship<select value="{{g2Rel}}" onChange="{{g2SetRel}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{gRelOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Mobile<input type="tel" inputmode="tel" value="{{g2Phone}}" onChange="{{g2SetPhone}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label></div></template>
</div>
</div>
</template>

<template data-if="{{is_learner}}">
<div class="fadein" style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px"><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">First name<input type="text" value="{{lFirst}}" onChange="{{lSetFirst}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Name Socrates should use<input type="text" value="{{lPref}}" onChange="{{lSetPref}}" placeholder="Optional nickname" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Date of birth<input type="date" value="{{lDob}}" onChange="{{lSetDob}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"></label><label style="display: flex; flex-direction: column; gap: 5px; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #3F444C">Gender<select value="{{lGender}}" onChange="{{lSetGender}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15px; font-weight: 400; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; width: 100%"><template data-for="{{lGenderOpts}}" data-as="o"><option value="{{o.v}}">{{o.label}}</option></template></select></label></div>
<p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #F4F7FE; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #1E3A8A">{{lAgeLine}}</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 22px; font-weight: 600">Languages at home</h2><div style="display: flex; flex-wrap: wrap; gap: 6px; font-family: Inter, system-ui, sans-serif"><template data-for="{{langChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; cursor: pointer">{{c.label}}</button></template></div></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 18px; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 22px; font-weight: 600">Supports that help</h2><span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Only what you choose to share. These shape how Socrates teaches and how assessments are set.</span><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; font-family: Inter, system-ui, sans-serif"><template data-for="{{needs}}" data-as="o"><label style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #E2E2DA; cursor: pointer"><input type="checkbox" checked="{{o.checked}}" onChange="{{o.toggle}}" style="margin-top: 2px; width: 18px; height: 18px; accent-color: #1D4ED8"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{o.label}}</span><span style="font-size: 12.5px; color: #62676F">{{o.sub}}</span></span></label></template></div></div>
