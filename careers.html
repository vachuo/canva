<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers at Vachuo</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
html.rv-on [data-rv]{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
html.rv-on [data-rv]:not([data-shown]){opacity:0;transform:translateY(28px)}
.role{transition:border-color .2s ease,box-shadow .2s ease}.role:hover{border-color:#93BBF3;box-shadow:0 18px 40px -30px rgba(20,22,26,.4)}
@keyframes vfade{from{opacity:0}to{opacity:1}}@keyframes vrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.v-overlay{animation:vfade .2s ease}.v-dialog{animation:vrise .25s ease}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.v-overlay,.v-dialog{animation:none}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.fl{color:#C9CCD0;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Careers">
<div data-theme="{{uiTheme}}" style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA; box-shadow: {{headShadow}}">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px">
<a href="index.html" aria-label="Vachuo home" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Geist, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">How the system works</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">Pricing</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #1E40AF">About<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel" style="flex-direction: column; min-width: 260px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">White paper</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">The full argument and the evidence</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">Blog</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">The Vachuo Journal</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">Newsroom</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">News, press kit and channels</span></a><a href="careers.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">Careers</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">Build the school with us</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">Vision, mission &amp; values</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">Why we exist and how we work</span></a></div></details>
</nav>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">Sign in</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #1D4ED8; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Request early access</a>
<button type="button" aria-label="Dark mode" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>

<main>
<section aria-labelledby="careers-title" style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 6vw, 80px) clamp(16px, 4vw, 48px) 40px; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<div style="flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Careers · Palo Alto and Nairobi</span>
<h1 id="careers-title" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">Build the school every child deserves.</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3F444C; max-width: 620px; text-wrap: pretty">Vachuo is a seed-stage company building the operating system for individualised education: an AI school that knows each child, and a web of people who help them grow. We are backed by [INVESTOR NAMES] and hiring our founding team.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="#roles" style="display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; background: #1D4ED8; color: #FFFFFF; font-family: Geist, system-ui, sans-serif; font-size: 15.5px; font-weight: 600; text-decoration: none">See open roles<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
<button type="button" onClick="{{applyGeneral}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 15.5px; font-weight: 500; cursor: pointer">General application</button>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; position: relative">
<img src="assets/img/827a1ca470366ddf9133088b3b15d8eb.webp" alt="A night map of the world linking learners, parents and teachers across continents to an AI tutor at the centre" style="display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 26px">
<span style="position: absolute; left: 16px; bottom: 16px; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #14161A">One loop, every continent</span>
</div>
</section>

<section aria-labelledby="values-title" style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 24px clamp(16px, 4vw, 48px) clamp(48px, 6vw, 80px); display: flex; flex-direction: column; gap: 22px">
<h2 id="values-title" style="margin: 0; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.06; font-weight: 600">How we work</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px">
<template data-for="{{values}}" data-as="v">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DA">
<img src="{{v.img}}" alt="" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: {{v.tint}}">
<h3 style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 600">{{v.title}}</h3>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C">{{v.text}}</p>
</article>
</template>
</div>
<a href="vision.html" style="align-self: flex-start; font-family: Geist, system-ui, sans-serif; font-size: 15px; font-weight: 600">Read our vision, mission and values</a>
</section>

<section id="roles" aria-labelledby="roles-title" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px">
<h2 id="roles-title" style="margin: 0; font-size: clamp(34px, 4vw, 54px); line-height: 1.02; font-weight: 600">Open roles</h2>
<span role="status" style="font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">{{countNote}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
<label for="role-search" style="font-size: 13px; font-weight: 600; color: #3F444C">Search roles</label>
<input id="role-search" type="search" value="{{query}}" onChange="{{setQuery}}" placeholder="Machine learning, design, Nairobi…" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
</div>
<div style="flex: 0 1 220px; display: flex; flex-direction: column; gap: 6px">
<label for="role-loc" style="font-size: 13px; font-weight: 600; color: #3F444C">Location</label>
<select id="role-loc" value="{{loc}}" onChange="{{setLoc}}" style="min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 15px; color: #14161A">
<option value="All">All locations</option>
<option value="Palo Alto">Palo Alto, CA</option>
<option value="Remote (US)">Remote (US)</option>
<option value="Nairobi">Nairobi, Kenya</option>
</select>
</div>
</div>
<div role="group" aria-label="Filter by team" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{teamChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{c.label}}</button></template>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<template data-for="{{roles}}" data-as="r">
<article class="role" aria-labelledby="{{r.hid}}" style="border-radius: 20px; border: 1px solid #E2E2DA; background: #FFFFFF; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 20px 22px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.team}}</span>
<h3 id="{{r.hid}}" style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600">{{r.title}}</h3>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #3F444C">{{r.meta}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 13.5px; color: #14161A; padding: 8px 12px; border-radius: 10px; background: #F4F4EF">{{r.pay}}</span>
<button type="button" aria-expanded="{{r.expanded}}" aria-controls="{{r.pid}}" onClick="{{r.toggle}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">{{r.toggleLabel}}</button>
<button type="button" onClick="{{r.apply}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Apply</button>
</div>
</div>
<template data-if="{{r.open}}">
<div id="{{r.pid}}" style="display: flex; flex-wrap: wrap; gap: 20px 40px; padding: 4px 22px 24px; border-top: 1px solid #ECECE6">
<p style="flex: 1 1 100%; margin: 16px 0 0; font-size: 19px; line-height: 1.6; color: #23272E">{{r.about}}</p>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h4 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">What you’ll do</h4>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 17.5px; line-height: 1.5; color: #3F444C"><template data-for="{{r.do}}" data-as="x"><li>{{x}}</li></template></ul>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h4 style="margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #115E59">What you bring</h4>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 17.5px; line-height: 1.5; color: #3F444C"><template data-for="{{r.bring}}" data-as="x"><li>{{x}}</li></template></ul>
</div>
<p style="flex: 1 1 100%; margin: 0; font-family: Geist, system-ui, sans-serif; font-size: 13.5px; line-height: 1.5; color: #62676F">{{r.payNote}}</p>
</div>
</template>
</article>
</template>
<template data-if="{{noRoles}}">
<div style="padding: 28px; border-radius: 20px; background: #F4F4EF; font-size: 19px; color: #3F444C">No roles match those filters. Try another team or location, or send a general application.</div>
</template>
</div>
</div>
</section>

<section aria-labelledby="benefits-title" style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 88px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 22px">
<span style="font-family: Geist, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #115E59">Benefits</span>
<h2 id="benefits-title" style="margin: 0; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; font-weight: 600; max-width: 760px">We take care of the people who take care of learners.</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
<template data-for="{{benefits}}" data-as="b">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA">
<span style="font-size: 21px; line-height: 1.2; font-weight: 600">{{b.t}}</span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #3F444C">{{b.d}}</span>
</div>
</template>
</div>
</section>

<section aria-labelledby="process-title" style="background: #111315; color: #EDEDE8">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 88px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 24px">
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #7DB4FF">HOW WE HIRE</span>
<h2 id="process-title" style="margin: 0; font-size: clamp(32px, 3.6vw, 48px); line-height: 1.05; font-weight: 600; max-width: 760px">Five steps, about three weeks, no surprises.</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
<template data-for="{{steps}}" data-as="s">
<li style="display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 18px; background: #1A1D20; border: 1px solid #2A2E33">
<span style="font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #AFD0FF">{{s.n}}</span>
<span style="font-size: 23px; line-height: 1.15; font-weight: 600">{{s.t}}</span>
<span style="font-family: Geist, system-ui, sans-serif; font-size: 14.5px; line-height: 1.5; color: #B8BCC2">{{s.d}}</span>
</li>
</template>
</ol>
</div>
</section>

<section aria-labelledby="eeo-title" style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 28px 56px; align-items: center">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 id="eeo-title" style="margin: 0; font-size: clamp(28px, 3vw, 40px); line-height: 1.08; font-weight: 600">Every learner, every background, every continent.</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3F444C">Vachuo is an equal opportunity employer. We hire on skill and evidence, not pedigree, and we welcome people of every race, colour, religion, sex, gender identity, sexual orientation, age, national origin, disability and veteran status. If you need an accommodation at any stage, tell us and we will arrange it.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3F444C">Roles that involve working with children require identity verification and background checks where the law allows. Pay ranges for US roles follow California’s pay transparency law; final offers depend on location and experience.</p>
</div>
<img src="assets/img/80b06694a121b52e5cf0510bfda36f44.svg" alt="Illustrated learners from all seven continents standing together" style="flex: 1 1 420px; min-width: 0; width: 100%; height: auto">
</section>
</main>

<footer class="vfoot" style="background: #0B0D10; color: #EDEDE8; font-family: Geist, system-ui, sans-serif">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 6vw, 80px) clamp(16px, 4vw, 48px) 28px; display: flex; flex-direction: column; gap: 48px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 36px 28px">
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0"><a href="index.html" aria-label="Vachuo home" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none"><span style="display: inline-flex; padding: 5px; border-radius: 10px; background: #FFFFFE"><img src="assets/img/mark.png" alt="" style="display: block; width: 28px; height: auto"></span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Vachuo<sup style="font-family: Geist, system-ui, sans-serif; font-size: 11px; font-weight: 600; margin-left: 1px">™</sup></span></a><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #A3A8AE">The operating system for individualised learning.</p><span title="Real Intelligence: building where education meets AI, bringing intelligence closer to people" style="align-self: flex-start; padding: 3px 9px; border-radius: 999px; border: 1px solid #2B4A94; color: #AFD0FF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em">REAL</span></div>

<script>
DC.component("Careers", function () {
class Component extends DCLogic {
  themeVals() {
    if (this._uiT === undefined) {
      let t = 'light';
      try { if (window.localStorage.getItem('vachuo-theme') === 'dark') t = 'dark'; } catch (e) {}
      this._uiT = t;
      this._uiSync = (e) => { if (e && e.key === 'vachuo-theme') { const n = e.newValue === 'dark' ? 'dark' : 'light'; if (n !== this._uiT) { this._uiT = n; this.forceUpdate(); } } };
      try { window.addEventListener('storage', this._uiSync); } catch (e) {}
      this._uiFlip = () => { this._uiT = this._uiT === 'dark' ? 'light' : 'dark'; try { window.localStorage.setItem('vachuo-theme', this._uiT); } catch (e) {} this.forceUpdate(); };
    }
    const p = (this.props || {}).uiTheme, t = p === 'dark' || p === 'light' ? p : this._uiT, d = t === 'dark';
    return { uiTheme: t, uiDark: d, uiLight: !d, uiOn: d ? 'true' : 'false', uiToggle: this._uiFlip, uiTrack: d ? '#1D4ED8' : '#8A8F96', uiKnob: d ? '19px' : '3px' };
  }
  themeOff() { try { window.removeEventListener('storage', this._uiSync); } catch (e) {} }
  constructor(props) {
    super(props);
    this.state = { team: 'All', loc: 'All', query: '', open: 'ml', modal: null, sent: false, tried: false,
      fName: '', fEmail: '', fLoc: '', fLink: '', fWhy: '', fFile: '', fConsent: false, scrolled: false, showTop: false };
  }
  componentDidMount() {
    this._onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = 0;
        const y = window.scrollY || 0;
        const scrolled = y > 8, showTop = y > 900;
        if (scrolled !== this.state.scrolled || showTop !== this.state.showTop) this.setState({ scrolled, showTop });
      });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    if (window.innerHeight < 1600 && 'IntersectionObserver' in window && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      const vh = window.innerHeight;
      this._io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { e.target.setAttribute('data-shown', ''); this._io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll('main > section').forEach((el) => {
        if (el.getBoundingClientRect().top > vh * 0.9) { el.setAttribute('data-rv', ''); this._io.observe(el); }
      });
      document.documentElement.classList.add('rv-on');
    }
  }
  componentWillUnmount() { this.themeOff();
    window.removeEventListener('scroll', this._onScroll);
    if (this._io) this._io.disconnect();
    document.documentElement.classList.remove('rv-on');
  }
  openApply(title) {
    this._lastFocus = document.activeElement;
    this.setState({ modal: title, sent: false, tried: false });
    setTimeout(() => { const el = document.getElementById('f-name'); if (el) el.focus(); }, 60);
  }
  closeApply() {
    this.setState({ modal: null });
    setTimeout(() => { if (this._lastFocus && this._lastFocus.focus) this._lastFocus.focus(); }, 30);
  }
  renderVals() { return Object.assign(this.themeVals(), this.pageVals()); }
  pageVals() {
    const T = {
      Engineering: ['#E4ECFD', '#1E40AF'], Learning: ['#DDF4F1', '#115E59'], Design: ['#FEF1D9', '#92400E'],
