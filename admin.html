<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Admin dashboard</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Admin">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: Inter, system-ui, sans-serif">
<nav aria-label="Admin" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px"><a href="admin.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><span style="align-self: flex-start; margin-left: 12px; padding: 3px 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-size: 12px; font-weight: 600">Organisation admin</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Admin</div><template data-for="{{tabs}}" data-as="t"><button type="button" aria-current="{{t.cur}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer"><span style="flex: 1">{{t.label}}</span><template data-if="{{t.hasN}}"><span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700; text-align: center">{{t.n}}</span></template></button></template></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Internal tools</div><a href="ops.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Ops console</a><a href="admin.html" aria-current="page" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #1E40AF; background: #E4ECFD">Admin dashboard</a><a href="super-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Super admin</a><a href="blog-admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Blog admin</a><a href="studio.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; color: #3F444C; background: transparent">Vachuo Studio</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #ECECE6; color: #3F444C; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">O</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Otieno A.</span><span style="font-size: 12.5px; color: #62676F">Admin · Kilimani Learning Hub</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="admin.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="index.html#signed-out" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div><div data-quick="1" role="group" aria-label="Leave this workspace" style="display: flex; gap: 6px; padding: 8px 4px 0"><a href="index.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #3F444C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="index.html#signed-out" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #E2E2DA; background: #FFFFFF; text-decoration: none; font-size: 13.5px; font-weight: 600; color: #92400E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</a></div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3vw, 40px); line-height: 1.08; font-weight: 600">Admin dashboard</h1><span style="padding: 4px 10px; border-radius: 999px; background: #DDF4F1; color: #115E59; font-size: 12.5px; font-weight: 700">Organisation admin</span></div><p style="margin: 0; max-width: 820px; font-size: 15px; line-height: 1.5; color: #3F444C">Kilimani Learning Hub · microschool. You manage your organisation’s people, roles, policies, connections and billing here. Vachuo’s own staff use the separate ops and super admin tools.</p></header><template data-if="{{is_overview}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px"><template data-for="{{ovKpis}}" data-as="k"><div style="padding: 16px 18px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #62676F">{{k.label}}</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 600">{{k.value}}</span><span style="font-size: 12.5px; color: {{k.fg}}">{{k.note}}</span></div></template></div><div style="display: flex; flex-wrap: wrap; gap: 14px"><section style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Set-up checklist</h2></div><template data-for="{{checklist}}" data-as="c"><div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE6"><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{c.mark}}</span><span style="flex: 1; font-size: 14px">{{c.t}}</span><button type="button" onClick="{{c.go}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{c.cta}}</button></div></template></section><section style="flex: 1 1 380px; min-width: 0; padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Recent activity</h2></div><template data-for="{{auditTop}}" data-as="a"><div style="display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE6; font-size: 13.5px"><span style="flex: none; width: 108px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #62676F">{{a.at}}</span><span><strong>{{a.who}}</strong> {{a.what}}</span></div></template></section></div></div>
</template>
<template data-if="{{is_users}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><input aria-label="Search" value="{{uQ}}" onChange="{{uSetQ}}" placeholder="Search people" style="flex: 1 1 240px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"><button type="button" onClick="{{ux_invite}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Invite people</button><button type="button" onClick="{{ux_import}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Import from a spreadsheet</button></div><div role="group" aria-label="Role" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="min-width: 70px; font-size: 12.5px; font-weight: 600; color: #62676F">Role</span><template data-for="{{uRoles}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{c.t}}</button></template></div><div style="overflow-x: auto; border-radius: 14px; border: 1px solid #E2E2DA"><table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; background: #FFFFFF"><thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Name</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Role</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Cohort</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Two-step sign-in</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Last active</th><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; white-space: nowrap">Status</th><th scope="col" style="padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F; text-align: right">Actions</th></tr></thead><tbody><template data-for="{{users}}" data-as="r"><tr><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 600">{{r.name}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 3px 9px; border-radius: 999px; background: {{r.roleBg}}; color: {{r.roleFg}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.role}}</span></td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.cohort}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.mfa}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6;">{{r.last}}</td><td style="padding: 10px 12px; border-bottom: 1px solid #ECECE6"><span style="padding: 3px 9px; border-radius: 999px; background: {{r.statusBg}}; color: {{r.statusFg}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.status}}</span></td><td style="padding: 6px 12px; border-bottom: 1px solid #ECECE6; text-align: right; white-space: nowrap"><template data-for="{{r.acts}}" data-as="x"><button type="button" onClick="{{x.go}}" style="min-height: 36px; margin-left: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{x.t}}</button></template></td></tr></template></tbody></table></div><p style="margin: 0; font-size: 12.5px; color: #62676F">Learners under 13 have no login of their own; they appear under their family. Changing a guide’s role needs their consent to the new terms.</p></div>
</template>
<template data-if="{{is_roles}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Roles and permissions</h2><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #62676F">Built-in roles can’t lose the safety rules. Custom roles can only narrow access.</p></div><div style="overflow-x: auto; border-radius: 14px; border: 1px solid #E2E2DA"><table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; background: #FFFFFF"><thead><tr><th scope="col" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F">Permission</th><template data-for="{{roleCols}}" data-as="c"><th scope="col" style="padding: 10px 12px; border-bottom: 1px solid #E2E2DA; font-size: 12.5px; color: #62676F">{{c}}</th></template></tr></thead><tbody><template data-for="{{perms}}" data-as="p"><tr><th scope="row" style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #ECECE6; font-weight: 500">{{p.t}}</th><template data-for="{{p.cells}}" data-as="c"><td style="padding: 6px 12px; border-bottom: 1px solid #ECECE6; text-align: center"><button type="button" role="switch" aria-checked="{{c.on}}" aria-label="{{c.aria}}" onClick="{{c.flip}}" style="min-width: 44px; min-height: 36px; border-radius: 10px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 700; cursor: {{c.cursor}}">{{c.mark}}</button></td></template></tr></template></tbody></table></div><span role="status" style="font-size: 13px; color: #92400E">{{permMsg}}</span></div>
</template>
<template data-if="{{is_policies}}">
<div style="display: flex; flex-direction: column; gap: 18px"><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 14px"><section style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Approvals</h2><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #62676F">Vachuo’s minimum rules always apply. You can make them stricter for your school.</p></div><template data-for="{{polApprovals}}" data-as="r"><div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #ECECE6"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">{{r.t}}</span><span style="font-size: 13px; color: #62676F">{{r.d}}</span></span><button type="button" role="switch" aria-checked="{{r.on}}" aria-label="{{r.aria}}" onClick="{{r.flip}}" style="flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #3F444C; font-family: Inter, system-ui, sans-serif; font-size: 13px; cursor: pointer"><span>{{r.label}}</span><span aria-hidden="true" style="position: relative; width: 38px; height: 22px; border-radius: 999px; background: {{r.track}}"><span style="position: absolute; top: 3px; left: {{r.knob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button></div></template></section><section style="padding: 18px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-family:
