<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">What the Science of Learning Asks of Every Teacher and Tutor</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Retrieval, spacing, worked examples and well-judged feedback are among the best-replicated findings in education research. Most classrooms and apps still underuse them.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/028366707734272954ecc6309a373201.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/1653e814680e71213ad5bbf83b9efca2.svg" alt="" style="display: block; height: 84%; width: auto">
</div>
</figure>

<p style="margin: 0">Education research has a reputation for fads, but a handful of findings from cognitive psychology have been replicated across decades, age groups and subjects. They are not secret. They are routinely ignored, in classrooms and even more in educational software, because they make learning feel harder in the moment even as they make it more durable. An AI tutor is the most consistent implementer of pedagogy ever built. If it implements the wrong pedagogy, it will do so at scale.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Memory is built by retrieval</h2>
<p style="margin: 0">In a widely cited 2006 study, Henry Roediger and Jeffrey Karpicke asked students to read prose passages and then either reread them or take recall tests. Rereading produced slightly better performance five minutes later; testing produced markedly better retention a week later. This testing effect, since replicated many times, shows that pulling information out of memory strengthens it more than putting it in again. In a 2013 review of ten popular study techniques, John Dunlosky and colleagues rated only two as having high utility: practice testing and distributed practice. Highlighting and rereading, the techniques students use most, rated low.</p>
<p style="margin: 0">The implication for tutors, human or machine, is uncomfortable. Explaining well is not enough. Learners must be asked to produce: to recall, to solve, to explain in their own words. A tutor that answers every question fluently may be depriving the learner of the very effort that makes learning stick.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Space it out, and mix it up</h2>
<p style="margin: 0">The spacing effect is one of the oldest findings in experimental psychology, traceable to Hermann Ebbinghaus in the 1880s. A 2006 meta-analysis by Nicholas Cepeda and colleagues confirmed that distributing practice over time produces better long-term retention than massing it, and that the best gap grows with how long the material must be remembered. Interleaving, mixing different problem types rather than practising one type in a block, has a related benefit. In a 2007 study by Doug Rohrer and Kelli Taylor, students who practised mixed mathematics problems did far better on a delayed test than those who practised in blocks, despite doing worse during practice itself.</p>
<p style="margin: 0">Both effects create what Robert Bjork called desirable difficulties: conditions that slow apparent progress but improve durable learning. They also set a trap.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">Learners, teachers and product managers all judge learning by how fluent it feels. Fluency is a poor guide.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Novices need guidance; experts need room</h2>
<p style="margin: 0">The debate between discovery learning and direct instruction has generated more heat than light, but cognitive load theory, developed by John Sweller from the late 1980s, offers a principled answer. Working memory is severely limited. Novices, who lack organised knowledge in long-term memory, are overwhelmed by unguided problem-solving and learn more from studying worked examples. Paul Kirschner, Sweller and Richard Clark argued in 2006 that minimally guided instruction is less effective for novices for exactly this reason.</p>
<p style="margin: 0">The same research identifies an expertise reversal effect: as learners gain knowledge, worked examples become redundant and can even impede learning, while independent problem-solving becomes more productive. Good instruction is therefore not a fixed method but a fading one, moving from heavy guidance toward independence as competence grows. Few teachers can calibrate that fading for thirty students at once. A well-designed adaptive system can.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Feedback is powerful, and risky</h2>
<p style="margin: 0">John Hattie and Helen Timperley’s 2007 review placed feedback among the most powerful influences on achievement. Less often quoted is the earlier meta-analysis by Avraham Kluger and Angelo DeNisi, which found that in over a third of the cases they examined, feedback interventions actually reduced performance. Feedback that directs attention to the self (“you’re clever”, “wrong again”) tends to hurt; feedback about the task and how to improve it tends to help. Timing and specificity matter, and so does diagnosis. Telling a learner the right answer does little if her error came from a misconception she still holds.</p>
<p style="margin: 0">This is why diagnosis must come before feedback. Errors caused by carelessness, a missing prerequisite, a misreading of the question or a genuine conceptual misconception look identical on a scoresheet, and each needs a different response.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Active is not the same as constructive</h2>
<p style="margin: 0">Michelene Chi and Ruth Wylie’s ICAP framework distinguishes four modes of engagement: passive (receiving), active (manipulating, such as highlighting), constructive (generating something new, such as a self-explanation) and interactive (building understanding with a partner). Learning outcomes generally rise across that sequence. Clicking through an app is active; explaining why a method works is constructive; defending it to a peer or a Socratic tutor is interactive. Engagement metrics that count clicks measure the wrong thing.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What this asks of AI tutors</h2>
<p style="margin: 0">Taken together, the evidence implies design rules that many consumer learning products break. Ask before telling. Schedule retrieval and spaced review instead of waiting for the learner to come back. Interleave once the basics are secure. Begin with worked examples for novices and fade them deliberately. Diagnose the cause of an error before responding to it. Resist optimising for the feeling of fluency or for time spent. Ask learners to explain, not merely to answer.</p>
<p style="margin: 0">None of this requires artificial intelligence. Good teachers have done most of it for generations. What AI changes is the possibility of doing it consistently, for every learner, at the right moment, without exhausting the teacher. Whether that possibility is realised depends on whether the people building these systems read the research or the engagement dashboard.</p>
