<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · The Vachuo Journal</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.feat-text{max-width:min(640px,calc(100% - 240px))}
.feat-figs{position:absolute;right:20px;bottom:0;height:80%;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
@media (max-width:899px){.feat-text{max-width:640px}.feat-figs{position:relative;right:auto;height:230px;align-self:center;margin-bottom:calc(-1 * clamp(24px,3vw,40px))}}
html.rv-on [data-rv]{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}html.rv-on [data-rv]:not([data-shown]){opacity:0;transform:translateY(28px)}
.post{transition:transform .25s ease,box-shadow .25s ease}.post:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(20,22,26,.45)}.post img{transition:transform .4s ease}.post:hover img{transform:translateY(-8px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.post,.post:hover,.post img,.post:hover img{transition:none;transform:none}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.fl{color:#C9CCD0;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:34px;font-size:13.5px;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Blog">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA; box-shadow: {{headShadow}}">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="index.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navPricing}}</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #1E40AF">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>

<main>
<section aria-labelledby="journal-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 6vw, 80px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-end">
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Blog · The Vachuo Journal</span>
<h1 id="journal-title" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">Research and ideas on learning in the age of AI.</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3F444C; max-width: 680px; text-wrap: pretty">Long-form essays from Vachuo Research on education, policy, technology and work, written for parents, educators, builders and policymakers. Every claim is sourced.</p>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="journal-search" style="font-size: 13.5px; font-weight: 600; color: #3F444C">Search the Journal</label>
<input id="journal-search" type="search" value="{{query}}" onChange="{{setQuery}}" placeholder="Tutoring, privacy, careers…" style="min-height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #CFCFC6; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; color: #14161A">
</div>
</section>

<section aria-label="Featured essays" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-wrap: wrap; gap: 18px">
<a href="blog-ai-education.html" style="flex: 2 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 360px; padding: clamp(24px, 3vw, 40px); border-radius: 24px; background: #F9A826; color: #14161A; text-decoration: none; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; width: 560px; height: 560px; right: -220px; top: -340px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.28)"></span>
<span aria-hidden="true" style="position: absolute; width: 980px; height: 980px; left: -460px; top: -720px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>
<span style="position: relative; align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #DCE6FD">Featured · AI and education</span>
<span class="feat-text" style="position: relative; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: clamp(32px, 3.6vw, 48px); line-height: 1.04; font-weight: 600; text-wrap: balance">Can AI Tutors Teach? What the First Rigorous Trials Show</span>
<span style="font-size: 20px; line-height: 1.45; font-style: italic; color: #E4ECFD">Well-designed AI tutors can produce large gains; poorly designed ones can quietly harm learning. Design is the variable.</span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF">Read the essay · 7 min</span>
</span>
<span class="feat-figs" aria-hidden="true"><img src="assets/img/e1b79eb4952f14718c70fb2b72622cc1.svg" alt="" style="display: block; height: 100%; width: auto"><img src="assets/img/d5b3c1bf64b6df3171cd40d4ea6cd3d7.svg" alt="" style="display: block; height: 100%; width: auto"></span>
</a>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<a href="blog-education.html" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DA; color: #14161A; text-decoration: none">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #E4ECFD; color: #1E40AF">Education</span><img src="assets/img/d2a1b6a6b98dc6c01a65bc72956a63ce.svg" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #E4ECFD"></span>
<span style="font-size: 26px; line-height: 1.12; font-weight: 600">What Is Education For? Three Purposes, One Child</span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Vachuo Research · 7 min</span>
</a>
<a href="blog-child-safety.html" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DA; color: #14161A; text-decoration: none">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #FEF1D9; color: #92400E">Children’s safety</span><img src="assets/img/ee935388d47b6bf0d509293d4cba8892.svg" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #FEF1D9"></span>
<span style="font-size: 26px; line-height: 1.12; font-weight: 600">Keeping Children Safe in AI-Powered Learning: A Practical Framework</span>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Vachuo Research · 7 min</span>
</a>
</div>
</section>

<section aria-labelledby="all-title" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="all-title" style="margin: 0; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; font-weight: 600">All essays</h2>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F" aria-live="polite">{{countNote}}</span>
</div>
<div role="group" aria-label="Filter by topic" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{chips}}" data-as="c">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px">
<template data-for="{{posts}}" data-as="p">
<a href="{{p.href}}" class="post" style="display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 18px; background: #F4F4EF; color: #14161A; text-decoration: none; overflow: hidden">
<span aria-hidden="true" style="position: relative; display: block; height: 150px; margin: -22px -22px 8px; overflow: hidden; background: {{p.band}}"><span style="position: absolute; width: 300px; height: 300px; left: -120px; top: -190px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span><span style="position: absolute; width: 520px; height: 520px; left: -300px; top: -380px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span><img src="{{p.img}}" alt="" style="position: absolute; right: 28px; top: 16px; height: 290px; width: auto"></span>
<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{p.chipBg}}; color: {{p.chipFg}}">{{p.topic}}</span>
<span style="font-size: 25px; line-height: 1.12; font-weight: 600">{{p.title}}</span>
<span style="font-size: 17.5px; line-height: 1.45; color: #3F444C">{{p.dek}}</span>
<span style="margin-top: auto; padding-top: 6px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F">Vachuo Research · {{p.mins}} min read</span>
</a>
</template>
</div>
<template data-if="{{noPosts}}"><div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 24px; border-radius: 18px; background: #F4F4EF; font-size: 19px; color: #3F444C">No essays match that search yet.<button type="button" onClick="{{clearFilters}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; font-weight: 500; cursor: pointer">Clear filters</button></div></template>
</div>
</section>

<section aria-labelledby="sub-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px)">
<div style="border-radius: 24px; background: #1D4ED8; color: #FFFFFF; padding: clamp(24px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-end">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 id="sub-title" style="margin: 0; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.05; font-weight: 600">The Journal, in your inbox.</h2>
<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #E4ECFD">New essays, the Vachuo Podcast and Weekly Forum topics. Unsubscribe whenever you like.</p>
</div>
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="sub-email" style="font-size: 13.5px; font-weight: 600; color: #DCE6FD">Email</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<input id="sub-email" type="email" placeholder="you@example.com" style="flex: 1 1 200px; min-width: 0; min-height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #7FA2EE; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 15px; color: #14161A">
<button type="button" onClick="{{ux_sub}}" style="min-height: 50px; padding: 0 20px; border-radius: 14px; border: none; background: #F9A826; color: #14161A; font-size: 15px; font-weight: 600; cursor: pointer">Subscribe</button>
</div>
</div>
</div>
</section>
</main>

<footer class="vfoot" style="background: #0B0D10; color: #EDEDE8; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 48px clamp(16px, 5vw, 72px) 24px; display: flex; flex-direction: column; gap: 32px">

      social: ['LinkedIn', 'Facebook', 'Instagram', 'X', 'TikTok', 'YouTube', 'WhatsApp Channel', 'Threads', 'Spotify', 'Apple Podcasts']
    };
  }
}
return Component;
});

DC.mount("Blog");
</script>
