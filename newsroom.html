<style>
html.rv-on [data-rv]{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}html.rv-on [data-rv]:not([data-shown]){opacity:0;transform:translateY(28px)}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.eq{display:inline-block;width:3px;height:12px;background:#F9A826;border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite}.eq:nth-child(2){animation-delay:.2s}.eq:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.eq{animation:none}}
.chcard{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.chcard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.5);border-color:#CFCFC6}
@media (prefers-reduced-motion:reduce){.chcard:hover{transform:none}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.fl{color:#C9CCD0;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:34px;font-size:13.5px;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Newsroom">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA; box-shadow: {{headShadow}}">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="index.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<nav aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navPricing}}</a>
<details class="vmenu"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #1E40AF">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="index.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>

<main>
<section aria-labelledby="news-title" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 6vw, 80px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 24px 56px; align-items: flex-end">
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Newsroom</span>
<h1 id="news-title" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance">News, voices and gatherings from Vachuo.</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.5; color: #3F444C; max-width: 680px">Announcements, the Vachuo Podcast, the Expert Series, the Weekly Forum and Vachuo Fest Global, all in one place.</p>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px">
<a href="#media-kit" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 999px; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; font-weight: 600; text-decoration: none">Media kit</a>
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14.5px; font-weight: 500; text-decoration: none">Media portal sign-in</a>
</div>
</div>

<span style="position: absolute; width: 1300px; height: 1300px; left: -540px; top: -1000px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.18)"></span>

<div style="position: absolute; left: 4%; right: 4%; top: 22px; bottom: 16px; display: flex; justify-content: space-around; align-items: flex-end; gap: 4px">

<img src="assets/img/3131eb41702479241dc132be8c19c769.svg" alt="" style="display: block; height: 82%; width: auto">

</div>

<nav aria-label="Campaigns" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
<a href="#podcast" style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 18px; background: #0A1430; color: #FFFFFF; text-decoration: none"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #7DB4FF">LISTEN</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 25px; font-weight: 600">The Vachuo Podcast</span></a>
<a href="#experts" style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 18px; background: #E4ECFD; color: #172F73; text-decoration: none"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #1E40AF">WATCH</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 25px; font-weight: 600">Vachuo Expert Series</span></a>

</nav>
</section>

<section aria-labelledby="latest-title" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; border-bottom: 1px solid #E2E2DA">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4.2vw, 60px) clamp(16px, 5vw, 72px) clamp(32px, 4.2vw, 60px); display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="latest-title" style="margin: 0; font-size: clamp(30px, 3vw, 40px); line-height: 1.1; font-weight: 600">Latest announcements</h2>
<span style="font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Press enquiries: [PRESS EMAIL]</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-for="{{releases}}" data-as="r">
<li style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; padding: 20px 0; border-top: 1px solid #E2E2DA">
<span style="flex: 0 0 120px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #62676F">[DATE]</span>

<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #CAD3EA">Hosted by [HOST NAME]. Each episode takes one hard question about children, schools and technology, with a guest who has lived it: parents, teachers, researchers, founders and policymakers.</p>

<a href="#" role="button" onClick="{{ux_pod}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2B4A94; color: #EEF2FB; font-family: Inter, system-ui, sans-serif; font-size: 14px; text-decoration: none">YouTube</a>
<a href="#" role="button" onClick="{{ux_rss}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2B4A94; color: #EEF2FB; font-family: Inter, system-ui, sans-serif; font-size: 14px; text-decoration: none">RSS</a>

<figure aria-hidden="true" style="margin: 8px 0 0; position: relative; height: 220px; border-radius: 20px; overflow: hidden; background: #13204A">

<span style="position: absolute; width: 640px; height: 640px; left: -320px; top: -470px; border-radius: 50%; border: 1.5px solid rgba(125,180,255,0.22)"></span>

<img src="assets/img/028366707734272954ecc6309a373201.svg" alt="" style="display: block; height: 86%; width: auto">
<img src="assets/img/5ed81cefbac0e2d592ae2dd5b0d48280.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>
</div>
<ol aria-label="Episodes" style="flex: 2 1 520px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
