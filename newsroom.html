.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}

.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}

      return { n: String(n).padStart(2, '0'), title, text, on, off: !on, pressed: on ? 'true' : 'false', label: (on ? 'Pause episode ' : 'Play episode ') + n, bg: on ? '#F9A826' : '#13204A', fg: on ? '#14161A' : '#EEF2FB', toggle: () => this.setState({ playing: on ? 0 : n }) };
    };
    const status = { Announced: ['#E4ECFD', '#1E40AF'], Open: ['#DDF4F1', '#115E59'], Upcoming: ['#ECECE6', '#3F444C'] };
    const up = (n, title, s, i) => ({ n: String(n).padStart(2, '0'), title, status: s, bg: status[s][0], fg: status[s][1], bt: i === 0 ? 'none' : '1px solid #ECECE6' });
    return {
      swatches: [['Royal blue', '#1D4ED8'], ['Sky', '#1684E8'], ['Teal', '#0D9488'], ['Amber', '#F9A826']].map((w) => ({ name: w[0], hex: w[1], note: this.state.copied === w[1] ? this.state.copyMsg : 'Click to copy', copy: () => this.copyText(w[1], w[1]) })),

      copyBoiler: () => { const el = document.getElementById('boilerplate'); this.copyText(el ? el.innerText : '', 'boiler'); },
      headShadow: this.state.scrolled ? '0 10px 30px -18px rgba(20,22,26,0.35)' : 'none',
      showTop: this.state.showTop,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      releases: [
        rel('Announcement', 'Vachuo publishes “A Primer for Every Child”', 'A white paper on deschooled, closed-loop AI education, drawing on Socrates, Aristotle, Dewey and Ivan Illich.', 'white-paper.html'),
        rel('Product', 'Early-access list opens for homeschooling families', 'Families can now register interest in Vachuo’s first cohorts.', 'index.html'),
        rel('Podcast', 'Introducing the Vachuo Podcast', 'A new show on learning in the age of AI, with guests from classrooms, kitchens, labs and ministries.', '#podcast'),
        rel('Expert Series', 'The Vachuo Expert Series opens with a season on assessment', 'Monthly masterclasses begin with what wrong answers reveal about how children think.', '#experts'),
        rel('Forum', 'The Vachuo Weekly Forum launches', 'An open hour every week for parents, guides and educators.', '#forum'),
        rel('Fest', 'Vachuo Fest Global: save the date and call for speakers', 'A festival of learning for families, educators, builders and policymakers.', '#fest')
      ],
      episodes: [
        ep(1, 'Everyone will have an AI tutor. Then what?', 'Why the loop around the tutor matters more than the tutor itself.'),
        ep(2, 'Socrates had a point', 'Teaching by asking, and why an AI that hands over answers can harm learning.'),
        ep(3, 'Homeschooling, reinvented', 'The second wave of home education and the support it actually needs.'),
        ep(4, 'What Illich got right about school', 'Learning webs, credentials, and the difference between being taught and learning.'),
        ep(5, 'Your child’s data, explained', 'Privacy, AI and the rights children should have over their learning records.'),
        ep(6, 'Careers when machines can write', 'What today’s twelve-year-olds should learn for work that doesn’t exist yet.')
      ],
      talks: [
        { n: '01', c: '#1D4ED8', title: 'What wrong answers reveal', text: 'Misconceptions, prerequisite gaps and slips, and why each needs a different response.' },
        { n: '02', c: '#1684E8', title: 'Designing for motivation', text: 'Interest, autonomy and relationships in self-directed learning.' },
        { n: '03', c: '#0D9488', title: 'Assessment without seat time', text: 'Competence-based records that families, schools and employers can trust.' },
        { n: '04', c: '#F9A826', title: 'Safeguarding learning networks', text: 'Vetting, consent and supervision when children learn beyond home.' }
      ],
      forum: [
        { when: 'THIS WEEK', title: 'Getting started with home education', text: 'Records, routines and the first month.' },
        { when: 'NEXT WEEK', title: 'Screens, AI and attention', text: 'Healthy limits for AI-supported learning.' },
        { when: 'IN 2 WEEKS', title: 'Getting started with Connects', text: 'Workshops, mentors and peers near you.' },
        { when: 'IN 3 WEEKS', title: 'Talking to children about AI', text: 'Honest answers to the questions they ask.' }
      ],
      tracks: ['Learning science', 'AI schools', 'Policy and funding', 'Children’s safety', 'Careers and skills', 'Makers’ market'],
      updates: [
        up(1, 'Save the date', 'Announced', 0), up(2, 'Call for speakers', 'Open', 1), up(3, 'Programme announced', 'Upcoming', 2),
        up(4, 'Registration opens', 'Upcoming', 3), up(5, 'Vachuo Fest Global', 'Upcoming', 4)
      ],
    };
  }
}
return Component;
});
