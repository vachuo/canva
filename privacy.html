<main id="top" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 5vw, 72px) clamp(16px, 5vw, 72px) clamp(64px, 8.4vw, 120px); display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 860px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1E40AF">Legal</span><span style="padding: 3px 10px; border-radius: 999px; background: #FEF1D9; color: #78350F; font-size: 12.5px; font-weight: 600">Draft · not yet in force</span></div><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(44px, 5.2vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600">Privacy policy</h1><p style="margin: 0; font-size: 19px; line-height: 1.55; color: #3F444C">What Vachuo collects about your family, why, who sees it, and how to change your mind. Children’s data gets the strongest protection we can give it.</p><p style="margin: 0; font-size: 14px; color: #62676F">Last updated <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[DATE]</span> · Applies to vachuo.com and the Vachuo apps</p></div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px">
<nav aria-label="On this page" class="ltoc" style="flex: 1 1 240px; max-width: 320px; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">On this page</span><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-left: 1px solid #E2E2DA; padding-left: 14px"><li><a href="#controller" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Who is responsible for your data</a></li><li><a href="#collect" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">What we collect</a></li><li><a href="#why" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Why we use it</a></li><li><a href="#children" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Children’s data</a></li><li><a href="#ai" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">AI and Socrates</a></li><li><a href="#share" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Who sees it</a></li><li><a href="#where" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Where it is stored and for how long</a></li><li><a href="#rights" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Your rights</a></li><li><a href="#cookies" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Cookies</a></li><li><a href="#abroad" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Families outside Kenya</a></li><li><a href="#changes" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Changes to this policy</a></li></ol><a href="terms.html" style="margin-top: 8px; font-size: 14.5px; font-weight: 600">Read the terms of use</a></nav>
<article style="flex: 999 1 560px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 40px"><section aria-labelledby="short-h" style="padding: 22px 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 id="short-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">The short version</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>We collect what we need to teach your child and keep them safe, and nothing for advertising.</li><li>We never sell personal data, and we never use a child’s data to market to them.</li><li>A guardian consents for each learner and can see, download, correct or delete their data.</li><li>Socrates conversations are checked for safety and used only to teach your child.</li><li>Analytics cookies stay off unless you turn them on.</li></ul></section><section id="controller" aria-labelledby="controller-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="controller-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Who is responsible for your data</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E"><span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[COMPANY LEGAL NAME]</span> is the data controller, registered with the Office of the Data Protection Commissioner of Kenya (registration <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[ODPC NUMBER]</span>). Our data protection officer is <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[DPO NAME]</span>, reachable at <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[PRIVACY EMAIL]</span>.</p></section><section id="collect" aria-labelledby="collect-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="collect-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">What we collect</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li><strong>Family account:</strong> guardians’ names, phone numbers and email addresses, and who has which learner.</li><li><strong>Learner profile:</strong> name, date of birth, curriculum and grade, and a school if you link one.</li><li><strong>Learning evidence:</strong> answers, drawings, recordings, marks, Socrates conversations and what a guide writes.</li><li><strong>Community activity:</strong> clubs joined, listings and messages, with contact details hidden.</li><li><strong>Payments:</strong> handled by <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[PAYMENTS PROVIDER]</span>. We see the amount and status, not your full card or M-Pesa details.</li><li><strong>Optional signatures</strong> (photo, voice, handwriting, typing) only with a guardian’s explicit consent, and not until our data protection impact assessment is complete.</li></ul></section><section id="why" aria-labelledby="why-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="why-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Why we use it</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>To teach: plan the path, adapt lessons and track mastery. Legal basis: our contract with you, and your consent for your child.</li><li>To keep children safe: approvals, moderation and safety checks on every Socrates reply. Legal basis: legitimate interest and legal duty.</li><li>To run the service: sign-in, security, support and payments. Legal basis: contract.</li><li>To improve Vachuo, using analytics only if you allow it. Legal basis: consent.</li></ul></section><section id="children" aria-labelledby="children-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="children-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Children’s data</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">A guardian gives consent for each learner. Children under 13 have no login of their own and use Vachuo through the family account. We don’t show advertising, we don’t sell data, and we don’t build profiles to market to children. The learner model that tracks what your child knows is used only for their learning, and you can see everything in it.</p></section><section id="ai" aria-labelledby="ai-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="ai-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">AI and Socrates</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Socrates runs on AI models from <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[AI MODEL PROVIDERS]</span>. Every request passes a safety check before and after the model, and conversations flagged by those checks are reviewed by a person. Our contracts with these providers <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[CONFIRM: DO NOT ALLOW TRAINING ON CUSTOMER DATA]</span>.</p></section><section id="share" aria-labelledby="share-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="share-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Who sees it</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>You, and any second guardian you add.</li><li>Guides and schools your family chooses to work with, for the learners they support.</li><li>Service providers who process data for us under contract: hosting, payments, messaging and AI models (<span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[PROCESSOR LIST]</span>).</li><li>Authorities, only when the law requires it or a child is at risk.</li></ul></section><section id="where" aria-labelledby="where-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="where-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Where it is stored and for how long</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Data is stored in <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[HOSTING REGION]</span>. When it leaves Kenya, we use the safeguards required by the Data Protection Act, 2019. We keep data while your account is open and delete or anonymise it within <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[RETENTION PERIOD]</span> after you close it, unless the law requires us to keep something longer.</p></section><section id="rights" aria-labelledby="rights-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="rights-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Your rights</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>See and download what we hold about you and your learners.</li><li>Correct anything that is wrong, and object to or restrict how we use it.</li><li>Delete a learner’s data or the whole account.</li><li>Withdraw consent at any time, without affecting what was done before.</li><li>Complain to the Office of the Data Protection Commissioner at <a href="https://www.odpc.go.ke">odpc.go.ke</a>.</li></ul></section><section id="cookies" aria-labelledby="cookies-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="cookies-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Cookies</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Essential cookies keep you signed in and remember your theme and language. Analytics cookies count page visits without identifying you and stay off unless you turn them on. We don’t use advertising cookies.</p><button type="button" onClick="{{svCkOpen}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer">Open cookie choices</button></section><section id="abroad" aria-labelledby="abroad-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="abroad-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Families outside Kenya</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">If you live in the European Union or the United Kingdom, the GDPR or UK GDPR also applies and gives you the same rights listed above. In the United States, we collect information from children under 13 only with verifiable parental consent, as COPPA requires.</p></section><section id="changes" aria-labelledby="changes-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="changes-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Changes to this policy</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">If we change how we use your family’s data, we will tell you before the change takes effect and ask for your consent again where the law requires it.</p></section><p style="margin: 0; padding-top: 20px; border-top: 1px solid #E2E2DA; font-size: 14.5px; line-height: 1.55; color: #62676F">Questions about this page: <a href="mailto:hello@vachuo.com">hello@vachuo.com</a>. Items marked like <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[THIS]</span> are details still to be confirmed before this page takes effect.</p></article></div>

<footer class="vfoot" style="background: #0B0D10; color: #EDEDE8; font-family: Inter, system-ui, sans-serif">
