<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Coming soon</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.cs{--bg:#F4F4EF;--ink:#14161A;--muted:#3F444C;--soft:#62676F;--card:#FFFFFF;--line:#E2E2DA;--field:#FFFFFF;--blue:#1D4ED8;--blue-ink:#1E40AF;--tint:#E4ECFD;--amber:#F9A826;--amber-tint:#FEF1D9;--amber-ink:#92400E;--teal:#0D9488;--teal-tint:#DDF4F1;--teal-ink:#115E59;--ring:#DCE3F3;--foot:#0B0D10;--wa:#1DA851;--wa-hover:#178A43;--shadow:0 30px 60px -36px rgba(20,22,26,.45)}
@media (prefers-color-scheme:dark){.cs:not([data-theme="light"]){--bg:#0E1013;--ink:#EDEDE8;--muted:#C4C8CE;--soft:#9AA0A8;--card:#171A1F;--line:#2B3038;--field:#1E2228;--blue:#5B8DF5;--blue-ink:#AFC6F7;--tint:#1B2741;--amber-tint:#3A2C12;--amber-ink:#F7C873;--teal-tint:#12302D;--teal-ink:#7EDBD0;--ring:#232A36;--foot:#07080A;--shadow:0 30px 60px -36px rgba(0,0,0,.8)}}
.cs[data-theme="dark"]{--bg:#0E1013;--ink:#EDEDE8;--muted:#C4C8CE;--soft:#9AA0A8;--card:#171A1F;--line:#2B3038;--field:#1E2228;--blue:#5B8DF5;--blue-ink:#AFC6F7;--tint:#1B2741;--amber-tint:#3A2C12;--amber-ink:#F7C873;--teal-tint:#12302D;--teal-ink:#7EDBD0;--ring:#232A36;--foot:#07080A;--shadow:0 30px 60px -36px rgba(0,0,0,.8)}
.cs *,.cs *::before,.cs *::after{box-sizing:border-box}
.cs{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
.cs a{color:var(--blue)}
.cs :focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.cs .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cs .wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.cs .page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.cs .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cs .deco span{position:absolute;border-radius:50%;border:1.5px solid var(--ring)}
.cs .deco .r1{width:900px;height:900px;right:-380px;top:-460px;animation:drift 26s ease-in-out infinite alternate}
.cs .deco .r2{width:560px;height:560px;right:-140px;top:-220px;animation:drift 21s ease-in-out infinite alternate-reverse}
.cs .deco .r3{width:1100px;height:1100px;left:-760px;bottom:-760px;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,18px)}}
.cs header,.cs main,.cs footer,.cs .learners{position:relative;z-index:1}
.cs .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:clamp(12px,2.4vh,22px);padding-bottom:6px}
.cs .brand{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);min-height:44px}
.cs .brand .wm{display:block;height:clamp(30px,4.4vh,38px);width:auto}
.cs .brand .mk{display:none;align-items:center;gap:10px}
.cs .brand .mk span:first-child{display:inline-flex;padding:5px;border-radius:10px;background:#FFFFFE}
.cs .brand .mk img{display:block;width:26px;height:auto}
.cs .brand .mk b,.cs .fb b{font-family:'EB Garamond',Garamond,Georgia,serif;font-size:24px;font-weight:600}
.cs .brand sup,.cs .fb sup{font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:600;margin-left:1px}
.cs[data-theme="dark"] .brand .wm{display:none}.cs[data-theme="dark"] .brand .mk{display:inline-flex}
.cs .alpha{margin-left:auto;font-size:8px;line-height:1.2;letter-spacing:.04em;color:#4E535A;text-decoration:none}.cs .alpha:hover,.cs .alpha:focus-visible{color:#B5B9BF;text-decoration:underline}
.cs main{flex:1;display:flex;align-items:center}
.cs .hero{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:clamp(24px,4vw,56px);align-items:center;padding-top:clamp(8px,2vh,24px);padding-bottom:clamp(8px,2vh,24px)}
.cs .soon-h{position:relative;margin:0;font-family:'EB Garamond',Garamond,Georgia,serif;font-weight:600;font-size:min(5.9vw,11.4vh,90px);line-height:.98;letter-spacing:-.025em}
.cs[lang="sw"] .soon-h{font-size:min(4.1vw,7.8vh,60px)}
.cs .soon-h .w1{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.cs .soon-h .w2{position:relative;display:inline-block;font-style:italic;padding-right:.06em;background:linear-gradient(100deg,#1D4ED8 0%,#2563EB 18%,#0D9488 38%,#14B8A6 50%,#0D9488 62%,#2563EB 82%,#1D4ED8 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .12s cubic-bezier(.2,.8,.2,1) both,shine 7s 1s linear infinite}
@keyframes shine{from{background-position:0% 50%}to{background-position:220% 50%}}
.cs .swoosh{position:absolute;left:2%;right:-4%;bottom:-.2em;width:102%;height:.32em;overflow:visible;pointer-events:none}
.cs .swoosh path{fill:none;stroke:var(--amber);stroke-width:7;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .7s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cs .nw{white-space:nowrap}.cs .dots{display:inline-flex;gap:.09em;margin-left:.08em;vertical-align:baseline}
.cs .dots i{display:inline-block;width:.13em;height:.13em;border-radius:50%;animation:hop 1.4s ease-in-out infinite}
.cs .dots i:nth-child(1){background:var(--blue)}.cs .dots i:nth-child(2){background:var(--teal);animation-delay:.18s}.cs .dots i:nth-child(3){background:var(--amber);animation-delay:.36s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.22em)}}
.cs .spark{position:absolute;width:.26em;height:.26em;animation:twinkle 2.6s ease-in-out infinite}
.cs .spark path{fill:currentColor}
.cs .s1{color:var(--amber);top:-.14em;right:-.36em}.cs .s2{color:var(--blue);top:.52em;right:-.62em;width:.17em;height:.17em;animation-delay:.8s}.cs .s3{color:var(--teal);top:-.32em;left:-.2em;width:.18em;height:.18em;animation-delay:1.5s}
@keyframes twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.35}50%{transform:scale(1.08) rotate(25deg);opacity:1}}
.cs .sub{margin:clamp(14px,2.6vh,26px) 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;animation:rise .8s .22s cubic-bezier(.2,.8,.2,1) both}
.cs .sub b{font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(24px,3.6vh,34px);font-weight:600;line-height:1.1}
.cs .sub i{font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(20px,3vh,28px);line-height:1.1;color:var(--blue-ink)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cs .card{margin-top:clamp(14px,2.8vh,28px);padding:clamp(14px,2.2vh,22px) 20px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);max-width:640px;animation:rise .8s .32s cubic-bezier(.2,.8,.2,1) both}
.cs .card h2{margin:0 0 clamp(8px,1.4vh,12px);font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(21px,3vh,26px);font-weight:600;line-height:1.15}
.cs .wa{position:relative;display:flex;align-items:center;gap:14px;min-height:clamp(54px,7.4vh,62px);padding:8px 18px 8px 10px;border-radius:16px;background:var(--wa);color:#FFFFFF;text-decoration:none;overflow:hidden;transition:background-color .2s ease,transform .15s ease,box-shadow .2s ease}
.cs .wa:hover{background:var(--wa-hover);box-shadow:0 14px 26px -16px rgba(23,138,67,.8);transform:translateY(-1px)}
.cs .wa:active{transform:scale(.99)}
.cs .wa::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:sweep 4.5s 1.6s ease-in-out infinite}
@keyframes sweep{0%,70%{left:-40%}100%{left:130%}}
.cs .wa .ic{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.cs .wa .ic img{width:22px;height:22px;display:block}
.cs .wa .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.cs .wa .tx b{font-size:16px;font-weight:700}
.cs .wa .tx span{font-size:13px;opacity:.92}
.cs .wa .one{flex:none;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.2);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cs .wa .arr{flex:none;font-size:20px;transition:transform .2s ease}.cs .wa:hover .arr{transform:translateX(4px)}
.cs .or{display:flex;align-items:center;gap:12px;margin:clamp(8px,1.5vh,14px) 0;font-size:12.5px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.cs .or::before,.cs .or::after{content:"";flex:1;height:1px;background:var(--line)}
.cs .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.cs .field input,.cs .field select{width:100%;min-height:clamp(44px,6vh,48px);padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:400 15.5px Inter,system-ui,sans-serif;transition:border-color .2s ease,box-shadow .2s ease}
.cs .field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.cs .field input:focus,.cs .field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}
.cs .field input[aria-invalid="true"]{border-color:#DC2626}
.cs .cta{min-height:clamp(44px,6vh,48px);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font:600 15px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .15s ease,box-shadow .2s ease}
.cs .cta:hover{box-shadow:0 12px 24px -14px rgba(20,22,26,.6);transform:translateY(-1px)}.cs .cta:active{transform:scale(.98)}.cs .cta[disabled]{opacity:.7;cursor:progress}
.cs .note{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--soft)}
.cs .status{margin:6px 0 0;font-size:13.5px;font-weight:600}
.cs .status:empty{display:none}
.cs .status.err{color:#DC2626}
.cs .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.cs .done{display:flex;gap:14px;align-items:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.cs .done .ok{flex:none;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#FFFFFF;display:grid;place-items:center}
.cs .done .ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:tick .6s .15s ease forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.cs .done b{display:block;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:22px;font-weight:600;line-height:1.15}
.cs .done p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.cs .ghost{margin-left:auto;flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13.5px Inter,system-ui,sans-serif;cursor:pointer}
.cs .ghost:hover{background:var(--bg)}
.cs .coming h2{margin:0 0 clamp(8px,1.6vh,14px);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.cs .cards{display:flex;flex-direction:column;gap:clamp(8px,1.5vh,12px)}
.cs .c{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;padding:clamp(11px,1.8vh,18px) 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;animation:slidein .8s cubic-bezier(.2,.8,.2,1) both;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.cs .c:nth-child(1){animation-delay:.3s}.cs .c:nth-child(2){animation-delay:.42s}.cs .c:nth-child(3){animation-delay:.54s}
.cs .c:hover{transform:translateX(-4px);box-shadow:var(--shadow)}
.cs .c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.cs .c .ic{grid-row:1/4;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tnt);color:var(--acc)}
.cs .c .k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cs .c h3{margin:0;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(19px,2.6vh,22px);font-weight:600;line-height:1.15}
.cs .c p{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.cs .learners{display:flex;justify-content:center;margin-top:-4px;pointer-events:none}
.cs .learners svg{display:block;height:clamp(76px,14.5vh,150px);width:auto;max-width:94vw}
.cs .learners .kid{transform-box:fill-box;transform-origin:50% 100%;animation:bob 5.2s ease-in-out infinite}
.cs .learners .kid:nth-child(2n){animation-duration:6.1s}.cs .learners .kid:nth-child(3n){animation-duration:4.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cs footer{background:var(--foot);color:#EDEDE8}
.cs .fin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px;padding-top:clamp(10px,1.8vh,16px);padding-bottom:clamp(8px,1.2vh,12px)}
.cs .fb{display:flex;align-items:center;gap:10px}
.cs .fb span{display:inline-flex;padding:4px;border-radius:9px;background:#FFFFFE}
.cs .fb img{display:block;width:22px;height:auto}
.cs .fb b{font-size:21px}
.cs .fb em{margin-left:6px;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:17px;font-style:normal;color:#A3A8AE}
.cs .mails{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:0;padding:0;list-style:none}
.cs .mails a{display:inline-flex;align-items:baseline;gap:7px;min-height:30px;align-items:center;color:#D5D8DC;text-decoration:none;font-size:13.5px}
.cs .mails a small{color:#8A8F96;font-size:11.5px}
.cs .mails a:hover{color:#FFFFFF}
.cs .follow{display:flex;align-items:center;gap:10px}
.cs .follow h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8A8F96;white-space:nowrap}
.cs .soc{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.cs .soc a{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;opacity:.82;transition:opacity .2s ease,background-color .2s ease,transform .2s ease}
.cs .soc a:hover{opacity:1;background:#1A1D20;transform:translateY(-2px)}
.cs .soc img{display:block;width:19px;height:19px}
.cs .fbot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding-top:7px;padding-bottom:clamp(10px,1.6vh,14px);border-top:1px solid #2A2E33;font-size:12px;color:#8A8F96}
.cs .fbot .prev{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;border:1px dashed #3A4049;color:#B5B9BF;text-decoration:none}
@media (min-width:1021px) and (max-height:780px){.cs .note{font-size:11.5px;margin-top:6px}.cs .c p{font-size:13px;line-height:1.4}.cs .learners svg{height:clamp(68px,12.5vh,150px)}.cs .card h2{margin-bottom:8px}}
@media (max-width:1020px){.cs .hero{grid-template-columns:1fr}.cs .soon-h{font-size:min(13vw,96px)}.cs[lang="sw"] .soon-h{font-size:min(10vw,76px)}.cs .card{max-width:none}}
@media (max-width:640px){.cs .follow{flex-direction:column;align-items:flex-start;gap:6px}.cs .fin{flex-direction:column;align-items:flex-start}.cs .row{grid-template-columns:1fr}.cs .cta{width:100%}.cs .wa .one{display:none}.cs .done{flex-wrap:wrap}.cs .ghost{margin-left:62px}}
@media (prefers-reduced-motion:reduce){.cs *,.cs *::before,.cs *::after{animation:none!important;transition:none!important}.cs .swoosh path{stroke-dashoffset:0}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-ComingSoon">
<div class="cs" id="top" data-theme="{{theme}}" lang="{{lang}}">
<div class="deco" aria-hidden="true"><span class="r1"></span><span class="r2"></span><span class="r3"></span></div>
<div class="page">
<header class="wrap top">
  <a class="brand" href="#top" aria-label="Vachuo home">
    <img class="wm" src="assets/img/e0af82b30a4eeb607758deb8d0aec685.png" alt="Vachuo" width="138" height="38">
    <span class="mk" aria-hidden="true"><span><img src="assets/img/40e7316fb5e40464f30512802d95dfe5.png" alt=""></span><b>Vachuo<sup>™</sup></b></span>
  </a>
</header>

<main>
  <div class="wrap hero">
    <section aria-labelledby="h1">
      <h1 id="h1" class="soon-h"><span class="w1">{{t.h1a}}</span> <span class="nw"><span class="w2"><span>{{t.h1b}}</span><svg class="swoosh" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M6 30 C 90 8, 230 4, 394 22"/></svg><svg class="spark s1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg><svg class="spark s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg><svg class="spark s3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span></h1>
      <p class="sub"><b>{{t.slogan}}</b><i>{{t.tagline}}</i></p>

      <div class="card" id="access">
        <h2>{{t.formT}}</h2>
        <a class="wa" href="https://whatsapp.com/channel/0029VbDze0y1t90g4CHIst0Q" target="_blank" rel="noopener">
          <span class="ic" aria-hidden="true"><img src="assets/img/02cb270e9aa344d86b990f381e3016c0.png" alt=""></span>
          <span class="tx"><b>{{t.waT}}</b><span>{{t.waD}}</span></span>
          <span class="one">{{t.waBadge}}</span><span class="arr" aria-hidden="true">→</span>
        </a>
        <p class="or">{{t.or}}</p>
        <template data-if="{{showForm}}">
        <form name="early-access" onSubmit="{{submit}}" novalidate>
          <div class="row">
            <label class="field"><span class="sr">{{t.email}}</span><input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="{{t.emailPh}}" value="{{email}}" onInput="{{setEmail}}" aria-invalid="{{emailBad}}" aria-describedby="cs-status"></label>
            <label class="field"><span class="sr">{{t.role}}</span>
              <select name="role" value="{{role}}" onChange="{{setRole}}">
                <option value="parent">{{t.r1}}</option>
                <option value="guide">{{t.r2}}</option>
                <option value="school">{{t.r3}}</option>
                <option value="partner">{{t.r4}}</option>
              </select></label>
            <button class="cta" type="submit"><span>{{t.cta}}</span></button>
          </div>
          <p class="{{statusCls}}" id="cs-status" role="status" aria-live="polite">{{statusMsg}}</p>
          <p class="note">{{t.note}}</p>
        </form>
        </template>
        <template data-if="{{showDone}}">
        <div class="done">
          <span class="ok" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <div><b>{{doneT}}</b><p>{{doneD}}</p></div>
          <button type="button" class="ghost" onClick="{{share}}">{{shareLabel}}</button>
        </div>
        </template>
      </div>
    </section>

    <section class="coming" aria-labelledby="coming-h">
      <h2 id="coming-h">{{t.comingT}}</h2>

      if (e.key === 'vachuo-theme') { this._theme = e.newValue === 'dark' || e.newValue === 'light' ? e.newValue : ''; this.forceUpdate(); }
    };
    try { window.addEventListener('storage', this._sync); } catch (e) {}
    this.forceUpdate();
  }
