<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">

<body>
<div id="app"></div>
<template id="dc-Passport">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Vachuo" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 24px">
<a href="today.html" aria-label="Vachuo, back to Today" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A">
<span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 10.5px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div>
<a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a>
<a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a>
<a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a>
<a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="13" rx="2"/><path d="M10.5 8.5v5l4-2.5z"/><path d="M8 20.5h8"/></svg>My classes</a>
<a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M9 14.6l2 2 4-4.2"/></svg>My assessments</a>
<a href="passport.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h2.5"/><path d="M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Portfolio</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div>
<a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a>
<a href="clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a>
<a href="showcase.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0z"/><path d="M5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div>
<a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5V9h-4.5"/></svg>The loop</a>
</div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}; transition: background 160ms ease"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35); transition: left 160ms ease"></span></span></button>
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 12px 0; border-top: 1px solid #E2E2DA">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Portfolio · Amani M.</span>
<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 860px; text-wrap: balance">Competence you can show, not hours you sat.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 720px; text-wrap: pretty">Amani’s Portfolio records what she can do and the evidence behind it. It belongs to her: she decides who sees it, and it leaves with her to any school, programme or employer.</p>
</header>

<section aria-label="Ownership and sharing" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="Amani" style="flex: none; width: 72px; height: 72px; border-radius: 50%; object-fit: cover; object-position: top; background: #E4ECFD; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #93BBF3">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Owner</span><span style="font-size: 15px; font-weight: 600">Amani, who controls sharing</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Shared with</span><span style="font-size: 15px">Wanjiru (parent), Nduta (guide)</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Format</span><span style="font-size: 15px">Open Badges 3.0, verifiable without an account</span></div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-expanded="{{shareOpenA}}" onClick="{{toggleShare}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Share a link</button>
<button type="button" aria-expanded="{{dlOpenA}}" onClick="{{toggleDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download</button>
</div>
</section>

<template data-if="{{shareOpen}}">
<section aria-labelledby="share-h" style="background: #FFFFFF; border: 1px solid #93BBF3; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="share-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Share Amani’s Portfolio</h2><p style="margin: 0; font-size: 14.5px; color: #62676F">Amani owns this record. She chooses what’s in the link and can switch it off at any time.</p></div>
<button type="button" aria-label="Close sharing" onClick="{{toggleShare}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; font-size: 16px">×</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px 24px">
<div role="radiogroup" aria-label="Who can open it" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Who can open it</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{audiences}}" data-as="o"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer">{{o.label}}</button></template></div></div>
<div role="radiogroup" aria-label="Link expires" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Link expires</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{expiries}}" data-as="o"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer">{{o.label}}</button></template></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">What’s included</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{includes}}" data-as="o"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer"><span aria-hidden="true">{{o.mark}}</span>{{o.label}}</button></template></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" onClick="{{createLink}}" style="min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 600; cursor: pointer">Create link</button><span style="font-size: 13.5px; color: #62676F">{{shareSummary}}</span></div>
<template data-if="{{hasLinks}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<template data-for="{{links}}" data-as="k">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: {{k.bg}}; border: 1px solid {{k.bd}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<input readOnly="{{ true }}" aria-label="Share link" value="{{k.url}}" ref="{{k.ref}}" onFocus="{{k.selectAll}}" style="flex: 1 1 260px; min-width: 0; min-height: 42px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: {{k.urlFg}}; text-decoration: {{k.strike}}">
<template data-if="{{k.live}}"><button type="button" onClick="{{k.copy}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #1D4ED8; background: #FFFFFF; color: #1E40AF; font-size: 13.5px; font-weight: 600; cursor: pointer">{{k.copyLabel}}</button><button type="button" onClick="{{k.revoke}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Revoke</button></template>
</div>
<span style="font-size: 12.5px; color: #62676F">{{k.meta}}</span>
</div>
</template>
</div>
</template>
</section>
</template>

<template data-if="{{dlOpen}}">
<section aria-labelledby="dl-h" style="background: #FFFFFF; border: 1px solid #F9A826; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="dl-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Download Amani’s Portfolio</h2><p style="margin: 0; font-size: 14.5px; color: #62676F">A readable PDF for people, and signed Open Badges for systems that verify credentials.</p></div>
<button type="button" aria-label="Close downloads" onClick="{{toggleDl}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; font-size: 16px">×</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
<article style="border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px"><img src="assets/img/35286e9d35a8c3bfddb51ae192d80cbc.png" alt="Page 1 of the Portfolio PDF" style="width: 46%; height: auto; border: 1px solid #E2E2DA; border-radius: 6px; background: #FFFFFF"><img src="assets/img/8de417944faa9d50d78a315dad95000d.png" alt="Page 2 of the Portfolio PDF" style="width: 46%; height: auto; border: 1px solid #E2E2DA; border-radius: 6px; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 600">Portfolio · PDF</span><span style="font-size: 13px; color: #62676F">2 pages · 157 KB · issued 2 November 2026</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="assets/files/36ccdad735817c86ae00f1fcf4e84332.pdf" download="Amani-M-Portfolio.pdf" onClick="{{noteDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download PDF</a><button type="button" aria-pressed="{{pdfPrevA}}" onClick="{{togglePdfPrev}}" style="min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">{{pdfPrevLabel}}</button></div>
</article>
<article style="border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<pre aria-label="Open Badges preview" style="margin: 0; height: 200px; overflow: auto; padding: 12px; border-radius: 10px; background: #14161A; color: #AFD0FF; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap">{{jsonPreview}}</pre>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 600">Open Badges 3.0 · JSON</span><span style="font-size: 13px; color: #62676F">4 signed credentials · 7 KB · for schools and employers</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="assets/files/64a88e9264f2ec15180d42750c1127bf.json" download="Amani-M-Open-Badges.json" onClick="{{noteDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download badges</a></div>
</article>
</div>
<template data-if="{{pdfPrev}}">
<div aria-label="Portfolio preview" style="display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: #ECECE6">
<img src="assets/img/35286e9d35a8c3bfddb51ae192d80cbc.png" alt="Portfolio, page 1" style="width: 100%; max-width: 760px; height: auto; background: #FFFFFF; box-shadow: 0 8px 24px -14px rgba(20,22,26,0.5)">
<img src="assets/img/8de417944faa9d50d78a315dad95000d.png" alt="Portfolio, page 2" style="width: 100%; max-width: 760px; height: auto; background: #FFFFFF; box-shadow: 0 8px 24px -14px rgba(20,22,26,0.5)">
</div>
</template>
<template data-if="{{hasDlNote}}"><p role="status" style="margin: 0; font-size: 13.5px; color: #115E59">{{dlNote}}</p></template>

    const SCALE = [['#FBFBF8', '#62676F'], ['#FEF9EE', '#78350F'], ['#FEF1D9', '#78350F'], ['#F9A826', '#14161A'], ['#B45309', '#FFFFFF']];
    const W = ['Wk 4', 'Wk 5', 'Wk 6', 'Wk 7', 'Wk 8', 'Wk 9'];
    const SUB = {}; D.forEach((d) => { SUB[d.id] = d; });
    const rows = this.misc().filter((m) => !sub || m[0] === sub).map((m) => { const c = m[2]; const last = c[5], prev = c[3] + c[4];
      const trend = last === 0 ? 'Gone' : (last > c[4] ? 'Rising' : (last < c[4] || prev > last * 2 ? 'Fading' : 'Steady'));
      return { subject: SUB[m[0]].name, ink: SUB[m[0]].ink, text: m[1], trend, tfg: trend === 'Rising' ? '#92400E' : (trend === 'Gone' || trend === 'Fading' ? '#115E59' : '#3F444C'),
        cells: c.map((v, i) => ({ n: v ? String(v) : '', bg: SCALE[Math.min(4, v)][0], fg: SCALE[Math.min(4, v)][1], aria: W[i] + ': seen ' + v + (v === 1 ? ' time' : ' times') })) }; });
    return Object.assign(this.themeVals(), { title: sub ? (list[0] ? list[0].name : '') + ' at a glance' : 'Strengths by subject', radars, rows, weeks: W, legend: SCALE.map((x) => x[0]), cardMin: sub ? '320px' : '250px', svgMax: sub ? '360px' : '260px' });
  }
}
return Component;
}, {"subject": "all"});

DC.mount("Passport");
</script>
