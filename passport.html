<header style="display: flex; flex-direction: column; gap: 12px">

<h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; max-width: 860px; text-wrap: balance">Competence you can show, not hours you sat.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 720px; text-wrap: pretty">Amani’s Portfolio records what she can do and the evidence behind it. It belongs to her: she decides who sees it, and it leaves with her to any school, programme or employer.</p>
</header>

<section aria-label="Ownership and sharing" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px">
<img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="Amani" style="flex: none; width: 72px; height: 72px; border-radius: 50%; object-fit: cover; object-position: top; background: #E4ECFD; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #93BBF3">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Owner</span><span style="font-size: 15px; font-weight: 600">Amani, who controls sharing</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Shared with</span><span style="font-size: 15px">Wanjiru (parent), Nduta (guide)</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Format</span><span style="font-size: 15px">Open Badges 3.0, verifiable without an account</span></div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-expanded="{{shareOpenA}}" onClick="{{toggleShare}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Share a link</button>
<button type="button" aria-expanded="{{dlOpenA}}" onClick="{{toggleDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download</button>
</div>
</section>

<template data-if="{{shareOpen}}">
<section aria-labelledby="share-h" style="background: #FFFFFF; border: 1px solid #93BBF3; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="share-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Share Amani’s Portfolio</h2><p style="margin: 0; font-size: 14.5px; color: #62676F">Amani owns this record. She chooses what’s in the link and can switch it off at any time.</p></div>
<button type="button" aria-label="Close sharing" onClick="{{toggleShare}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; font-size: 16px">×</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px 24px">
<div role="radiogroup" aria-label="Who can open it" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Who can open it</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{audiences}}" data-as="o"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer">{{o.label}}</button></template></div></div>
<div role="radiogroup" aria-label="Link expires" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Link expires</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{expiries}}" data-as="o"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer">{{o.label}}</button></template></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">What’s included</span><div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{includes}}" data-as="o"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 13.5px; cursor: pointer"><span aria-hidden="true">{{o.mark}}</span>{{o.label}}</button></template></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" onClick="{{createLink}}" style="min-height: 46px; padding: 0 20px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14.5px; font-weight: 600; cursor: pointer">Create link</button><span style="font-size: 13.5px; color: #62676F">{{shareSummary}}</span></div>
<template data-if="{{hasLinks}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<template data-for="{{links}}" data-as="k">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: {{k.bg}}; border: 1px solid {{k.bd}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<input readOnly="{{ true }}" aria-label="Share link" value="{{k.url}}" ref="{{k.ref}}" onFocus="{{k.selectAll}}" style="flex: 1 1 260px; min-width: 0; min-height: 42px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: {{k.urlFg}}; text-decoration: {{k.strike}}">
<template data-if="{{k.live}}"><button type="button" onClick="{{k.copy}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #1D4ED8; background: #FFFFFF; color: #1E40AF; font-size: 13.5px; font-weight: 600; cursor: pointer">{{k.copyLabel}}</button><button type="button" onClick="{{k.revoke}}" style="min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">Revoke</button></template>
</div>
<span style="font-size: 12.5px; color: #62676F">{{k.meta}}</span>
</div>
</template>
</div>
</template>
</section>
</template>

<template data-if="{{dlOpen}}">
<section aria-labelledby="dl-h" style="background: #FFFFFF; border: 1px solid #F9A826; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="dl-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600">Download Amani’s Portfolio</h2><p style="margin: 0; font-size: 14.5px; color: #62676F">A readable PDF for people, and signed Open Badges for systems that verify credentials.</p></div>
<button type="button" aria-label="Close downloads" onClick="{{toggleDl}}" style="flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; font-size: 16px">×</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px">
<article style="border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px"><img src="assets/img/35286e9d35a8c3bfddb51ae192d80cbc.png" alt="Page 1 of the Portfolio PDF" style="width: 46%; height: auto; border: 1px solid #E2E2DA; border-radius: 6px; background: #FFFFFF"><img src="assets/img/8de417944faa9d50d78a315dad95000d.png" alt="Page 2 of the Portfolio PDF" style="width: 46%; height: auto; border: 1px solid #E2E2DA; border-radius: 6px; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 600">Portfolio · PDF</span><span style="font-size: 13px; color: #62676F">2 pages · 157 KB · issued 2 November 2026</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="assets/files/36ccdad735817c86ae00f1fcf4e84332.pdf" download="Amani-M-Portfolio.pdf" onClick="{{noteDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download PDF</a><button type="button" aria-pressed="{{pdfPrevA}}" onClick="{{togglePdfPrev}}" style="min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; cursor: pointer">{{pdfPrevLabel}}</button></div>
</article>
<article style="border: 1px solid #E2E2DA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<pre aria-label="Open Badges preview" style="margin: 0; height: 200px; overflow: auto; padding: 12px; border-radius: 10px; background: #14161A; color: #AFD0FF; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap">{{jsonPreview}}</pre>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 600">Open Badges 3.0 · JSON</span><span style="font-size: 13px; color: #62676F">4 signed credentials · 7 KB · for schools and employers</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="assets/files/64a88e9264f2ec15180d42750c1127bf.json" download="Amani-M-Open-Badges.json" onClick="{{noteDl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>Download badges</a></div>
</article>
</div>
<template data-if="{{pdfPrev}}">
<div aria-label="Portfolio preview" style="display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: #ECECE6">
<img src="assets/img/35286e9d35a8c3bfddb51ae192d80cbc.png" alt="Portfolio, page 1" style="width: 100%; max-width: 760px; height: auto; background: #FFFFFF; box-shadow: 0 8px 24px -14px rgba(20,22,26,0.5)">
<img src="assets/img/8de417944faa9d50d78a315dad95000d.png" alt="Portfolio, page 2" style="width: 100%; max-width: 760px; height: auto; background: #FFFFFF; box-shadow: 0 8px 24px -14px rgba(20,22,26,0.5)">
</div>
</template>
<template data-if="{{hasDlNote}}"><p role="status" style="margin: 0; font-size: 13.5px; color: #115E59">{{dlNote}}</p></template>
</section>
</template>

<section aria-labelledby="work-h" data-rail="1" style="display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 6px"><h2 id="work-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">The work itself, and who saw it</h2><p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: #3F444C; max-width: 760px">A credential is a claim; the work is the evidence. Each piece here is something Amani made, with a word from someone who saw it done. Badges come second, for systems that need them.</p></div><div style="display: flex; justify-content: flex-end"><span class="railnav" style="display: inline-flex; align-items: center; gap: 10px"><span style="font-size: 13.5px; color: #62676F">Swipe or use the arrows.</span><span style="display: inline-flex; gap: 6px"><button type="button" class="railbtn" aria-label="Scroll back" onClick="{{railPrev}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="railbtn" aria-label="Scroll forward" onClick="{{railNext}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span></span></div><div class="rail rail-sm" aria-label="Work Amani made"><article style="display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #115E59; background: #DDF4F1; align-self: flex-start; padding: 3px 9px; border-radius: 999px">Science · Making</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.2">A calibrated rain gauge</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">Built with Tomás and Neema at Kilimani Makerspace, then checked against the school’s gauge after three storms.</p><p style="margin: 4px 0 0; padding-top: 10px; border-top: 1px solid #ECECE6; font-size: 14px; line-height: 1.5; color: #14161A">“It read true through three storms. She found the calibration error herself.” <span style="display: block; margin-top: 2px; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Vouched by Dr. Wairimu, soil scientist</span></p></article><article style="display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #1E40AF; background: #E4ECFD; align-self: flex-start; padding: 3px 9px; border-radius: 999px">Science</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.2">A working moon-phase model</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">A lamp, a ball and a recorded explanation.</p><p style="margin: 4px 0 0; padding-top: 10px; border-top: 1px solid #ECECE6; font-size: 14px; line-height: 1.5; color: #14161A">“She explained it to her little cousin without notes.” <span style="display: block; margin-top: 2px; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Vouched by Nduta Kamau, her guide</span></p></article><article style="display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E; background: #FEF1D9; align-self: flex-start; padding: 3px 9px; border-radius: 999px">Kiswahili</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.2">Insha: why we should stop burning plastic</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">A persuasive essay, read aloud to her grandmother.</p><p style="margin: 4px 0 0; padding-top: 10px; border-top: 1px solid #ECECE6; font-size: 14px; line-height: 1.5; color: #14161A">“The argument held up to her grandmother’s objections.” <span style="display: block; margin-top: 2px; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Vouched by Nduta Kamau, her guide</span></p></article><article style="display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E2DA"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #3F444C; background: #F4F4EF; align-self: flex-start; padding: 3px 9px; border-radius: 999px">Maths</span><h3 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600; line-height: 1.2">Chapati for 40</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #3F444C">In progress: the recipe scaled, to be tested at Grace’s bakery.</p><p style="margin: 4px 0 0; padding-top: 10px; border-top: 1px solid #ECECE6; font-size: 14px; line-height: 1.5; color: #14161A">“The proof will be in the chapati.” <span style="display: block; margin-top: 2px; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">Amani, before the test · not vouched yet, waiting for Grace</span></p></article></div></section>
<section aria-labelledby="placement" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="placement" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Where Amani works, subject by subject, on the K→16 path</h2>
<p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: #62676F">Placed by what she can do, not by her age. Her age-grade is drawn for reference only. This chart stays with Amani: it is left out of shared links unless she adds it.</p>
</div>
<div style="display: flex; gap: 14px">
<div style="flex: none; width: 116px; display: flex; flex-direction: column; gap: 14px; padding-top: 26px">
<template data-for="{{subjects}}" data-as="s"><span style="height: 24px; display: flex; align-items: center; font-size: 14px; font-weight: 500">{{s.name}}</span></template>
</div>
<div style="flex: 1 1 auto; min-width: 0; position: relative; display: flex; flex-direction: column; gap: 14px; padding-top: 26px">
<div aria-hidden="true" style="position: absolute; left: 37.5%; top: 0; bottom: 66px; border-left: 2px dashed #F9A826"></div>
<span style="position: absolute; left: calc(37.5% + 8px); top: 0; font-size: 12px; font-weight: 500; color: #92400E; white-space: nowrap">Age-grade 6</span>
<template data-for="{{subjects}}" data-as="s">
<div style="position: relative; height: 24px; display: flex; align-items: center">
<div style="position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: #ECECE6"></div>
<div style="position: absolute; left: 0; width: {{s.pct}}; height: 8px; border-radius: 4px; background: #93BBF3"></div>
<div style="position: absolute; left: {{s.pct}}; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #1D4ED8; box-shadow: 0 0 0 3px #FFFFFF"></div>
</div>
</template>
<div aria-hidden="true" style="position: relative; height: 18px; margin-top: 2px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; color: #62676F">
<template data-for="{{ticks}}" data-as="t"><span style="position: absolute; left: {{t.left}}; transform: translateX(-50%)">{{t.label}}</span></template>
</div>
<div aria-hidden="true" style="display: flex; gap: 4px; font-size: 12px; color: #3F444C">
<span style="flex: 0 0 calc(40.6% - 4px); padding-top: 6px; border-top: 2px solid #CFCFC6">Early years &amp; primary</span>
<span style="flex: 0 0 calc(37.5% - 4px); padding-top: 6px; border-top: 2px solid #CFCFC6">Secondary</span>
<span style="flex: 1 1 auto; padding-top: 6px; border-top: 2px solid #CFCFC6">University</span>
</div>
</div>
<div style="flex: none; width: 40px; display: flex; flex-direction: column; gap: 14px; padding-top: 26px">
<template data-for="{{subjects}}" data-as="s"><span style="height: 24px; display: flex; align-items: center; justify-content: flex-end; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px">L{{s.level}}</span></template>
</div>
</div>
</section>

<dc-import name="Compare" ctx="report" learner="amani" embedded="{{ true }}" ui-theme="{{uiTheme}}"></dc-import>

<dc-import name="Strengths" subject="all" ui-theme="{{uiTheme}}"></dc-import>

<section aria-labelledby="shown" data-rail="1" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="shown" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">What Amani has shown</h2>
<div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{filters}}" data-as="f"><button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 13.5px; cursor: pointer">{{f.label}}<span style="font-size: 12px; padding: 1px 7px; border-radius: 999px; background: {{f.cbg}}">{{f.count}}</span></button></template>

<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="st-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">{{title}}</h2><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #62676F">Each point is a skill. The further out, the stronger. The dashed ring is 85%, where a skill counts as secure.</p></div>
<template data-if="{{multi}}"><div class="st-railnav" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px"><span style="font-size: 13.5px; color: #62676F">Swipe or use the arrows.</span><span style="display: inline-flex; gap: 6px"><button type="button" class="st-railbtn" aria-label="Scroll back" onClick="{{railPrev}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="st-railbtn" aria-label="Scroll forward" onClick="{{railNext}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span></div></template>
<div class="st-rail {{railCls}}" aria-label="Strengths by subject">
<template data-for="{{radars}}" data-as="r"><div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FBFBF8; border: 1px solid #ECECE6">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{r.color}}"></span>{{r.name}}</span><span style="font-size: 12px; color: #62676F">{{r.done}}</span></div>
<svg viewBox="0 0 240 220" role="img" aria-label="{{r.aria}}" style="color: #3F444C; width: 100%; max-width: {{svgMax}}; height: auto; align-self: center">
<template data-for="{{r.rings}}" data-as="g"><polygon points="{{g.pts}}" fill="none" stroke="#9A9E95" stroke-opacity="0.45" stroke-width="1"></polygon></template>
<polygon points="{{r.secure}}" fill="none" stroke="#9A9E95" stroke-width="1.2" stroke-dasharray="4 3"></polygon>
<template data-for="{{r.axes}}" data-as="a"><line x1="120" y1="110" x2="{{a.x2}}" y2="{{a.y2}}" stroke="#9A9E95" stroke-opacity="0.45" stroke-width="1"></line><text x="{{a.lx}}" y="{{a.ly}}" text-anchor="{{a.anchor}}" font-size="10.5" font-family="Inter, system-ui, sans-serif" fill="currentColor">{{a.short}}</text></template>
<polygon points="{{r.poly}}" fill="{{r.color}}" fill-opacity="0.22" stroke="{{r.color}}" stroke-width="2"></polygon>
<template data-for="{{r.dots}}" data-as="d"><circle cx="{{d.x}}" cy="{{d.y}}" r="3.2" fill="{{r.color}}"></circle></template>
</svg>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<template data-for="{{r.skills}}" data-as="k"><li style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #3F444C">{{k.name}}</span><span style="font-weight: 600; color: {{k.fg}}">{{k.pct}}%</span></li></template>
</ul>
</div></template>
</div>
</section>
<section aria-labelledby="mis-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 id="mis-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Things I’m untangling</h2><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #62676F">Mistakes are information. Each row is a tangle that showed up in your practice and assessments; darker means more often. When you think you’ve sorted one out, say so: Socrates will check with one fresh question, not a test.</p></div>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 740px; border-collapse: separate; border-spacing: 4px; font-size: 13px">
<thead><tr><th scope="col" style="text-align: left; padding: 4px 6px; font-weight: 600; color: #62676F">Misconception</th><template data-for="{{weeks}}" data-as="w"><th scope="col" style="width: 52px; padding: 4px; font-weight: 600; color: #62676F">{{w}}</th></template><th scope="col" style="width: 76px; padding: 4px 6px; text-align: left; font-weight: 600; color: #62676F">Trend</th><th scope="col" style="width: 120px; padding: 4px 6px; text-align: left; font-weight: 600; color: #62676F">You say</th></tr></thead>
<tbody><template data-for="{{rows}}" data-as="m"><tr><th scope="row" style="text-align: left; padding: 6px; font-weight: 500; line-height: 1.35"><span style="display: block; font-size: 11.5px; font-weight: 600; color: {{m.ink}}">{{m.subject}}</span>{{m.text}}</th><template data-for="{{m.cells}}" data-as="c"><td aria-label="{{c.aria}}" style="height: 38px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; text-align: center; font-weight: 600">{{c.n}}</td></template><td style="padding: 4px 6px; font-weight: 600; color: {{m.tfg}}">{{m.trend}}</td><td style="padding: 4px 6px"><button type="button" aria-pressed="{{m.mine}}" onClick="{{m.mark}}" style="min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid {{m.bd}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap">{{m.markLabel}}</button></td></tr></template></tbody>
</table></div>
<div aria-hidden="true" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: #62676F"><span>Less often</span><template data-for="{{legend}}" data-as="l"><span style="width: 22px; height: 14px; border-radius: 4px; background: {{l}}; border: 1px solid #ECECE6"></span></template><span>More often</span></div>
</section>
</div>
</template>
