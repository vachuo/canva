<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Clubs</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=Caveat:wght@500;600&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.acard{transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -24px rgba(20,22,26,.55)}
.calpill{transition:transform .15s ease,box-shadow .15s ease}
.calpill:hover{transform:translateY(-1px);box-shadow:0 6px 12px -8px rgba(20,22,26,.45)}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slidein{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.livedot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.paper-lined{background-color:#FFFFFE;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#C9D6F2 33px,#C9D6F2 34px),linear-gradient(to right,transparent 40px,#F2B8B5 40px,#F2B8B5 41px,transparent 41px);background-position:0 10px,0 0}
@media (prefers-reduced-motion:reduce){.fadein,.slidein,.livedot{animation:none}.acard:hover,.calpill:hover{transform:none}}
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Clubs">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">

<nav aria-label="Learner workspace" class="vside" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 24px 12px; background: #FAFAF7; border-right: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 22px; font-family: Inter, system-ui, sans-serif">
<a href="today.html" aria-label="Vachuo home" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; text-decoration: none; color: #14161A"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 40px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Learn</div><a href="today.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</a><a href="session.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>My tutor</a><a href="map.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM18 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM9 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM8.5 6.3l7 .5M7 8.4l1.4 7.2M16.5 9.1l-5.8 7"/></svg>My learning map</a><a href="notes.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h18v13H3zM10.5 8.5v5l4-2.5zM8 20.5h8"/></svg>My classes</a><a href="assessments.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17v15.5h-17zM3.5 9.5h17M8 3v4M16 3v4M9 14.6l2 2 4-4.2"/></svg>My assessments</a><a href="passport.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5zM8.5 8h7M8.5 12h7M8.5 16h2.5M13.5 16.3l1.4 1.4 2.4-2.7"/></svg>Portfolio</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Live</div><a href="live-room.html" onClick="{{roomLearner}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg>Live room<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #FEF1D9; color: #92400E; font-size: 11.5px; font-weight: 700"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #B45309"></span>Live</span></a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Community</div><a href="connects.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>Connects</a><a href="clubs.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; background: #E4ECFD; color: #1E40AF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20h6M8 17h8l-1-6h-6zM10 11V8h4v3M12 4v4M10.5 5.5h3"/></svg>Clubs</a><a href="showcase.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0zM5.5 12.5V20h13v-7.5M10 20v-4h4v4"/></svg>Showcase</a></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F; padding: 0 12px 6px">Inside Vachuo</div><a href="loop.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 500; color: #3F444C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4.5V9h-4.5"/></svg>The loop</a></div>
<button type="button" role="switch" aria-checked="{{uiOn}}" onClick="{{uiToggle}}" style="margin-top: auto; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: #3F444C; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span style="flex: 1">Dark mode</span><span aria-hidden="true" style="position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: {{uiTrack}}"><span style="position: absolute; top: 3px; left: {{uiKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #FDFDFD; box-shadow: 0 1px 2px rgba(20,22,26,0.35)"></span></span></button>
<div style="position: relative; border-top: 1px solid #E2E2DA; padding-top: 12px"><button type="button" aria-haspopup="true" aria-expanded="{{navMenuOpen}}" onClick="{{navMenuToggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 12px; border: none; border-radius: 12px; background: transparent; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><img src="assets/img/22d577aff3134a6d7b711af0ce472bd6.svg" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #E4ECFD"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">Amani M.</span><span style="font-size: 12.5px; color: #62676F">Learner · K→16 pathway</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{navMenuShown}}"><div role="menu" style="position: absolute; left: 4px; right: 4px; bottom: calc(100% + 6px); z-index: 70; padding: 8px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5); display: flex; flex-direction: column; gap: 2px; font-family: Inter, system-ui, sans-serif"><a href="learner.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: #14161A; font-size: 14px; font-weight: 600">Profile and settings</a><span style="padding: 8px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">Switch workspace</span><a href="today.html" aria-current="page" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #F4F7FE"><span style="font-size: 14px; font-weight: 600">Learner workspace</span><span style="font-size: 12px; color: #62676F">Amani · Today</span></a><a href="copilot.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Parent workspace</span><span style="font-size: 12px; color: #62676F">Wanjiru · Parent copilot</span></a><a href="guide.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Guide workspace</span><span style="font-size: 12px; color: #62676F">Nduta · learners and marking</span></a><a href="school.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">School console</span><span style="font-size: 12px; color: #62676F">Kilimani Learning Hub</span></a><a href="admin.html" style="display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: #14161A; background: #FFFFFF"><span style="font-size: 14px; font-weight: 600">Admin dashboard</span><span style="font-size: 12px; color: #62676F">Users, roles, policies</span></a><a href="sign-in.html" style="display: flex; align-items: center; min-height: 40px; margin-top: 4px; padding: 0 10px; border-top: 1px solid #ECECE6; text-decoration: none; color: #92400E; font-size: 14px; font-weight: 600">Sign out</a></div></template></div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 72px">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">Clubs</span>
<h1 style="margin: 0; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.08; letter-spacing: -0.015em; font-weight: 600; text-wrap: balance">Play, make and compete, on your own or together.</h1>
<p style="margin: 0; font-size: 17.5px; line-height: 1.55; color: #3F444C; max-width: 700px; text-wrap: pretty">Coding, chess, art, music, sport, languages, debate and the games your grandparents played. Join online or in person, practise in a simulator, climb a ladder or play in a league. In-person sessions for under-18s always need a parent’s OK.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<template data-for="{{stats}}" data-as="s"><div style="min-width: 112px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1">{{s.v}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; color: #62676F">{{s.l}}</span></div></template>
</div>
</header>

<template data-if="{{hasMy}}">
<section aria-labelledby="my-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px"><h2 id="my-h" style="margin: 0; font-size: 24px; font-weight: 600">My clubs</h2><button type="button" onClick="{{openHost}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer">Host or post something</button></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{myClubs}}" data-as="m"><div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{m.color}}"></span><span style="flex: 1; font-size: 14px; font-weight: 600; line-height: 1.3">{{m.t}}</span></div><span style="font-size: 12.5px; color: #3F444C">{{m.sub}}</span><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="padding: 2px 8px; border-radius: 999px; background: {{m.stBg}}; color: {{m.stFg}}; font-size: 12px; font-weight: 700">{{m.st}}</span><button type="button" onClick="{{m.open}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 12.5px; cursor: pointer">{{m.cta}}</button></div></div></template>
</div>
</section>
</template>
<dc-import name="Calendar" focus="club" ui-theme="{{uiTheme}}"></dc-import>


<section aria-label="Filter clubs" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="{{catChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; cursor: pointer"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: {{c.dot}}"></span>{{c.label}} <span style="opacity: 0.7">{{c.n}}</span></button></template>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px"><span style="width: 78px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Who</span><template data-for="{{whoChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; cursor: pointer">{{c.label}}</button></template><span style="width: 10px"></span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Where</span><template data-for="{{whereChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; cursor: pointer">{{c.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px"><span style="width: 78px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Play</span><template data-for="{{playChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; cursor: pointer">{{c.label}}</button></template><span style="width: 10px"></span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Compete</span><template data-for="{{compChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; cursor: pointer">{{c.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px"><span style="width: 78px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">Age</span><template data-for="{{ageChips}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; cursor: pointer">{{c.label}}</button></template>
<label style="flex: 1 1 220px; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #62676F"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search clubs</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search: chess, guitar, Mandarin…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #14161A"></label>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span aria-live="polite" style="font-size: 13px; color: #62676F">{{resultText}}</span><button type="button" onClick="{{clear}}" style="min-height: 32px; padding: 0 6px; border: none; background: transparent; color: #1D4ED8; font-size: 13px; text-decoration: underline; cursor: pointer">Clear filters</button></div>
</section>

<section aria-label="Catalogue" style="display: flex; flex-direction: column; gap: 12px">

<template data-if="{{dbAsk}}">

<p class="fadein" style="margin: 0; align-self: flex-start; max-width: 600px; padding: 12px 16px; border-radius: 4px 16px 16px 16px; background: #172F73; color: #FFFFFF; font-size: 16px; line-height: 1.45">Socrates: {{dbQ}}</p>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Your answer<textarea rows="3" value="{{dbAns}}" onChange="{{dbSetAns}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 2px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16.5px"></textarea></label>
<button type="button" onClick="{{dbReply}}" style="align-self: flex-start; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: #14161A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Answer</button>
</template>
<template data-if="{{dbDone}}">
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 21px; font-weight: 600">Socrates’ scorecard · {{dbTotal}}</span>
<template data-for="{{dbScores}}" data-as="s"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: #FBFBF8"><div style="display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 80px; font-size: 13.5px; font-weight: 600">{{s.k}}</span><span aria-hidden="true" style="flex: 1; height: 8px; border-radius: 999px; background: #ECECE6; overflow: hidden"><span style="display: block; height: 100%; width: {{s.w}}%; background: #1D4ED8"></span></span><span style="flex: 0 0 56px; font-size: 13px; text-align: right">{{s.v}}</span></div><span style="font-size: 12.5px; color: #3F444C">{{s.tip}}</span></div></template>
<button type="button" onClick="{{dbAgain}}" style="align-self: flex-start; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px; cursor: pointer">Debate again</button>
</template>
</template>

<template data-if="{{isCircuit}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600">Battery<select value="{{ckV}}" onChange="{{ckSetV}}" style="min-height: 38px; padding: 0 8px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><option value="1.5">1.5 V</option><option value="3">3 V</option><option value="4.5">4.5 V</option><option value="6">6 V</option><option value="9">9 V</option></select></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600">Bulbs<select value="{{ckN}}" onChange="{{ckSetN}}" style="min-height: 38px; padding: 0 8px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
<div style="display: flex; gap: 4px"><template data-for="{{ckPar}}" data-as="p"><button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{p.label}}</button></template></div>
<button type="button" role="switch" aria-checked="{{ckOn}}" onClick="{{ckToggle}}" style="min-height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Switch</button>
</div>
<div style="padding: 22px 16px; border-radius: 16px; background: #14161A; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px"><template data-for="{{ckBulbs}}" data-as="b"><span role="img" aria-label="Bulb {{b.n}}" style="width: 54px; height: 54px; border-radius: 50%; background: #F9A826; opacity: {{b.glow}}; box-shadow: {{b.ring}}"></span></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px"><span style="font-family: ui-monospace, Menlo, monospace">{{ckI}}</span><span style="font-family: ui-monospace, Menlo, monospace">{{ckP}}</span></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">{{ckNote}} Each bulb is 6 Ω in this simulator.</p>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #3F444C">Challenges</span><template data-for="{{ckCh}}" data-as="c"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #FBFBF8"><span style="flex: 1 1 240px; font-size: 13.5px">{{c.t}}</span><span style="font-size: 12.5px; font-weight: 700; color: {{c.fg}}">{{c.done}}</span><button type="button" onClick="{{c.check}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 12.5px; font-weight: 700; cursor: pointer">Check</button></div></template></div>
</template>

<template data-if="{{isPiano}}">
<span role="status" style="font-size: 14px; color: #3F444C">{{pnMsg}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 4px"><template data-for="{{pnSong}}" data-as="n"><span style="min-width: 28px; padding: 4px 6px; border-radius: 6px; background: {{n.bg}}; color: {{n.fg}}; font-family: ui-monospace, Menlo, monospace; font-size: 13px; text-align: center">{{n.n}}</span></template></div>
<div style="position: relative; height: 180px; display: flex; border-radius: 10px; overflow: hidden; border: 2px solid #14161A">
<template data-for="{{pnKeys}}" data-as="k"><button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; border: none; border-right: 1px solid #9A9E95; background: {{k.bg}}; color: #3F444C; font-size: 13px; font-weight: 600; cursor: pointer">{{k.k}}</button></template>
<template data-for="{{pnBlack}}" data-as="k"><button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="position: absolute; top: 0; left: {{k.left}}%; width: 7%; height: 60%; border: none; border-radius: 0 0 6px 6px; background: #14161A; cursor: pointer"></button></template>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><button type="button" onClick="{{pnRestart}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13px; cursor: pointer">Start again</button><span style="font-size: 12.5px; color: #62676F">Sound plays from this page; turn your volume up. A connected keyboard works too in the full app.</span></div>
</template>

<template data-if="{{isVocab}}">
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{vcLangs}}" data-as="l"><button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{l.bd}}; background: {{l.bg}}; color: {{l.fg}}; font-size: 13px; cursor: pointer">{{l.label}}</button></template></div>
<template data-if="{{vcStarted}}">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #3F444C"><span>{{vcProg}}</span><span role="timer" style="font-family: ui-monospace, Menlo, monospace; font-weight: 700">{{vcLeft}}</span></div>
<span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 40px; font-weight: 600; text-align: center">{{vcWord}}</span>
<div style="display: flex; flex-direction: column; gap: 6px"><template data-for="{{vcOpts}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="min-height: 48px; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 16px; cursor: pointer">{{o.t}}</button></template></div>
</template>
<template data-if="{{vcHasLast}}"><p role="status" style="margin: 0; padding: 8px 12px; border-radius: 10px; background: {{vcLastBg}}; color: {{vcLastFg}}; font-size: 14px">{{vcMsg}}</p></template>
<template data-if="{{vcDone}}"><span style="font-size: 18px; font-weight: 700">{{vcScore}}</span><button type="button" onClick="{{vcAgain}}" style="align-self: flex-start; min-height: 42px; padding: 0 16px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Play again</button></template>
<template data-if="{{vcStartShow}}"><button type="button" onClick="{{vcStart}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">Start: 6 seconds a word</button></template>
</template>
</div>
</div>
</template>

<template data-if="{{hOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="h-h" style="position: fixed; inset: 0; z-index: 80; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div class="fadein" style="width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: #FFFFFF; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-start; gap: 10px"><h2 id="h-h" style="flex: 1; margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600">Host or post</h2><button type="button" aria-label="Close" onClick="{{hClose}}" style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 18px; cursor: pointer">×</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{hKinds}}" data-as="k"><button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{k.label}}</button></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 5px"><template data-for="{{hCats}}" data-as="k"><button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 12.5px; cursor: pointer">{{k.label}}</button></template></div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Title<input type="text" value="{{hT}}" onChange="{{hSetT}}" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14.5px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Details<textarea rows="3" value="{{hD}}" onChange="{{hSetD}}" style="padding: 10px 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></textarea></label>
<template data-if="{{hNotPost}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px 16px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; font-weight: 600; color: #3F444C">Where</span><div style="display: flex; gap: 4px"><template data-for="{{hWhere}}" data-as="k"><button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 12.5px; cursor: pointer">{{k.label}}</button></template></div></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; font-weight: 600; color: #3F444C">Who</span><div style="display: flex; gap: 4px"><template data-for="{{hWho}}" data-as="k"><button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 12.5px; cursor: pointer">{{k.label}}</button></template></div></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; font-weight: 600; color: #3F444C">Ages</span><div style="display: flex; gap: 4px"><template data-for="{{hAges}}" data-as="k"><button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 12.5px; cursor: pointer">{{k.label}}</button></template></div></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><label style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">When<input type="datetime-local" value="{{hWhen}}" onChange="{{hSetWhen}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label><label style="flex: 0 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Places<input type="number" min="2" max="60" value="{{hCap}}" onChange="{{hSetCap}}" style="min-height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></div>
<template data-if="{{hIsInPerson}}"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #3F444C">Public venue<input type="text" value="{{hPlace}}" onChange="{{hSetPlace}}" placeholder="e.g. Kilimani Library" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 14px"></label></template>
</template>
<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #FEF9EE; font-size: 13px; line-height: 1.5; color: #3F444C">{{hNote}}</p>
<button type="button" onClick="{{hSubmit}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; cursor: pointer">{{hSubmitLabel}}</button>
</div>
</div>
</template>

<template data-if="{{gOpen}}">
<div role="dialog" aria-modal="true" aria-labelledby="g-h" style="position: fixed; inset: 0; z-index: 80; background: rgba(11,13,16,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">

</div>
</div>

<footer style="margin-top: 56px; padding-top: 12px; border-top: 1px solid #E2E2DA; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #62676F"><nav aria-label="{{svT.policies}}" style="display: flex; flex-wrap: wrap; gap: 0 18px"><a href="mailto:hello@vachuo.com?subject=Help" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.help}}</a><a href="privacy.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.privacy}}</a><a href="terms.html" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.terms}}</a><a href="mailto:hello@vachuo.com" style="color: #3F444C; display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">{{svT.contact}}</a></nav><span style="margin-left: auto">© 2026 Vachuo™</span><div style="position: relative"><button type="button" aria-haspopup="true" aria-expanded="{{svLangOpen}}" aria-label="{{svT.langMenu}}" onClick="{{svLangToggle}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span>{{svLangName}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><template data-if="{{svLangOpen}}"><div class="vlang-list" role="menu" aria-label="{{svT.langMenu}}" style="position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 70; width: 250px; max-height: 340px; overflow-y: auto; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -16px rgba(20,22,26,0.5)"><template data-for="{{svLangs}}" data-as="l"><button type="button" role="menuitemradio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: none; border-radius: 10px; background: {{l.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 14px; cursor: pointer"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">{{l.name}}</span><span style="font-size: 11.5px; color: #62676F">{{l.sub}}</span></span><span aria-hidden="true" style="color: #1D4ED8; font-weight: 700">{{l.mark}}</span></button></template></div></template></div></footer>
</main>

</div>
</template>
<template id="dc-Calendar">
