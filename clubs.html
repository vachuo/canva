<template id="dc-Calendar">
<div data-theme="{{uiTheme}}" style="color: #14161A; font-family: Inter, system-ui, sans-serif">
<section aria-labelledby="cal2-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cal2-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">{{title}}</h2><span style="font-size: 13px; color: #62676F">One calendar for lesson premieres, club sessions and assessments</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<div role="group" aria-label="View" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #ECECE6"><template data-for="{{views}}" data-as="v"><button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: none; background: {{v.bg}}; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{v.label}}</button></template></div>
<button type="button" aria-label="{{prevLabel}}" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; opacity: {{prevOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<button type="button" aria-label="{{nextLabel}}" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; cursor: pointer; opacity: {{nextOp}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div></div>

</div>
<template data-if="{{isWeek}}">
<div style="overflow-x: auto"><div style="min-width: 700px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">

<template data-for="{{d.ev}}" data-as="e"><button type="button" aria-pressed="{{e.on}}" onClick="{{e.pick}}" style="display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 6px 8px; border-radius: 10px; border: 1.5px solid {{e.bd}}; background: {{e.bg}}; color: #14161A; text-align: left; font-family: Inter, system-ui, sans-serif; cursor: pointer"><span style="font-size: 11.5px; font-weight: 700; color: {{e.fg}}">{{e.time}} · {{e.kindShort}}</span><span style="font-size: 12.5px; line-height: 1.3">{{e.title}}</span></button></template>
</div></template>
</div></div>
</template>
<template data-if="{{isMonth}}">

<template data-if="{{sel.useLink}}"><a href="{{sel.href}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-size: 13.5px; font-weight: 600; text-decoration: none">{{sel.openLabel}}</a></template>
</div>
</template>
</section>
</div>
</template>

  circuit(g) {
    const R = 6; const n = g.n; const V = g.on ? g.v : 0; let I, P;
    if (g.par) { P = (V * V) / R; I = n * V / R; } else { const i = V / (n * R); I = i; P = i * i * R; }
    const one = (3 * 3) / R; const b = Math.min(1, P / (one * 1.6));
    return { I: Math.round(I * 100) / 100, P: Math.round(P * 100) / 100, b };
  }

  scoreDebate(text) {
    const t = String(text || ''); const words = t.trim() ? t.trim().split(/\s+/).length : 0; const sents = t.split(/[.!?]+/).filter((x) => x.trim()).length || 1;
    const claim = /\b(should|must|because|therefore|so)\b/i.test(t) ? (/\bbecause\b/i.test(t) ? 4 : 3) : (words > 20 ? 2 : 1);
    const evid = (/\d/.test(t) ? 1 : 0) + (/for example|for instance|such as|research|study|survey|in 20\d\d|when i|my /i.test(t) ? 2 : 0) + (words > 60 ? 1 : 0);
    const reb = /\b(however|but|although|some people|opponents|others say|critics|on the other hand)\b/i.test(t) ? 4 : (/\b(not|no)\b/i.test(t) ? 2 : 1);
    const avg = words / sents; const clar = avg >= 8 && avg <= 24 ? 4 : (avg < 30 ? 3 : 2);
    return [['Claim', Math.max(1, Math.min(4, claim))], ['Evidence', Math.max(1, Math.min(4, evid))], ['Rebuttal', reb], ['Clarity', words < 15 ? 1 : clar]];
  }

    return [
      G('g-bao', 'Bao la kujifunza (learners’ Bao)', 'East African coast and Tanzania; played across Kenya', '2', '8+', 'In person or online', 'A board of 4 rows × 8 pits (or 32 cups), 64 seeds or stones', ['Put 2 seeds in every pit. You own the two rows nearest you.', 'Pick up all the seeds from one of your pits that has two or more, and sow them one by one into the next pits of your own two rows, going round in a circle.', 'If your last seed lands in a pit that already had seeds, pick them all up and keep sowing.', 'Capture: if your last seed lands in an occupied pit in your front row and the opponent’s pit straight across has seeds, take them and sow them into your front row from one end.', 'You lose when your front row is empty or you can’t make a move.'], 'Many regions add the nyumba (house) and a starting phase with seeds in hand. Play the learners’ version first.'),
      G('g-oware', 'Oware (abapa)', 'Ghana and the Akan people; played across West Africa and the Caribbean', '2', '7+', 'In person or online', '2 rows of 6 pits, 48 seeds', ['Put 4 seeds in each of the 12 pits. Your row is the one nearest you.', 'Take all the seeds from one of your pits and sow one per pit anticlockwise. Skip the pit you started from if you go all the way round.', 'If your last seed makes 2 or 3 in an opponent’s pit, capture them, and keep capturing backwards while the pits hold 2 or 3.', 'If your opponent has no seeds, you must make a move that gives them some.', 'The first player to capture 25 seeds wins.'], ''),
