<html lang="en">
<head>

<link rel="stylesheet" href="assets/css/site.css">

<style>
html.rv-on [data-rv]{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
html.rv-on [data-rv]:not([data-shown]){opacity:0;transform:translateY(28px)}
.plan{transition:transform .25s ease,box-shadow .25s ease}
.plan:hover{transform:translateY(-4px);box-shadow:0 24px 48px -28px rgba(20,22,26,.35)}
.faq-q{transition:background .2s ease}.faq-q:hover{background:#F4F4EF}
@keyframes bot-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bot-hover{animation:bot-hover 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.plan,.plan:hover{transition:none;transform:none}.bot-hover{animation:none}}
.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}
.vmenu[open]>.vm-panel{display:flex}
@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}
.vm-chev{transition:transform .2s ease}.vmenu[open] .vm-chev{transform:rotate(180deg)}
.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}
.vlang-list button:hover{background:#F4F4EF!important}[data-theme="dark"] .vlang-list button:hover{background:#22262D!important}
.vfoot a.fl{display:inline-flex;align-items:center;min-height:30px;padding:3px 0;box-sizing:border-box;font-size:13.5px;line-height:1.3;color:#B5B9BF;text-decoration:none}.vfoot a.fl:hover{color:#FFFFFF;text-decoration:underline;text-underline-offset:3px}
.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}
/* v324-mob */.hb-x{display:none}.vs-open .hb-x,.vside-open .hb-x{display:block}.vs-open .hb-m,.vside-open .hb-m{display:none}.vs-burger:hover,.vside-burger:hover{border-color:#8A8F96!important}.vmenu::details-content{content-visibility:visible}.vmenu.vm-on>.vm-panel{display:flex}.vmenu.vm-on .vm-chev{transform:rotate(180deg)}.vm-panel::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}.vs-burger{display:none}@media (max-width:1023.98px){.vs-hdr.vs-open{z-index:96!important;max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain}[data-theme="dark"] .vs-hdr.vs-open{background-color:#0F1114!important}.vs-hdr.vs-open[style*="255"]{background-color:#FFFFFF}.vs-bar{flex-wrap:wrap!important;row-gap:0!important}.vs-bar>.vs-burger{display:inline-flex;margin-left:auto}.vs-bar>.vs-nav,.vs-bar>.vs-act{display:none!important}.vs-hdr.vs-open .vs-bar>.vs-nav{display:flex!important;flex:1 0 100%;flex-direction:column;align-items:stretch!important;flex-wrap:nowrap!important;gap:0!important;margin:10px 0 0!important;padding:6px 0 0;border-top:1px solid rgba(127,127,127,.25);font-size:16px!important}.vs-hdr.vs-open .vs-nav>a{min-height:48px!important}.vs-hdr.vs-open .vs-nav .vmenu>summary{display:flex!important;min-height:48px!important;pointer-events:none}.vs-hdr.vs-open .vs-nav .vm-chev{display:none}.vs-hdr.vs-open .vs-nav .vm-panel.vm-panel{display:flex!important;position:static!important;min-width:0!important;margin:0 0 8px 2px!important;padding:0 0 0 8px!important;border:none!important;border-left:2px solid rgba(127,127,127,.25)!important;border-radius:0!important;box-shadow:none!important;background:transparent!important}.vs-hdr.vs-open .vs-nav .vm-panel::before{display:none}.vs-hdr.vs-open .vs-nav .vm-panel a{padding:11px 12px!important}.vs-hdr.vs-open .vs-nav .vm-panel a>span+span{display:none}.vs-hdr.vs-open .vs-bar>.vs-act{display:flex!important;flex:1 0 100%;flex-wrap:wrap;gap:10px!important;padding:14px 0 6px!important;margin-top:4px;border-top:1px solid rgba(127,127,127,.25)}.vs-hdr.vs-open .vs-act>a{flex:1 1 150px;justify-content:center}}
.co-step[aria-current="step"]{background:#14161A!important;color:#FFFFFF!important;border-color:#14161A!important}
.co-card{transition:border-color .15s ease,box-shadow .15s ease}
.co-card[aria-checked="true"]{border-color:#1D4ED8!important;box-shadow:0 0 0 3px rgba(29,78,216,.18)}
.co-tab[aria-selected="true"]{background:#FFFFFF!important;color:#14161A!important;box-shadow:0 1px 2px rgba(20,22,26,.12)}
.co-in{width:100%;box-sizing:border-box;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font:16px Inter,system-ui,sans-serif}
.co-in:focus{outline:3px solid rgba(29,78,216,.35);outline-offset:1px;border-color:#1D4ED8}
.co-in[aria-invalid="true"]{border-color:#B42318}
[data-theme="dark"] .co-in{background:#171A1F;border-color:#3A4049;color:#EDEDE8}
.co-pin{display:flex;gap:10px;justify-content:center}.co-pin span{width:14px;height:14px;border-radius:50%;border:2px solid #9AA0A6}.co-pin span.on{background:#14161A;border-color:#14161A}
.co-key{min-height:44px;border:none;border-radius:10px;background:#EEF0F2;color:#14161A;font:600 17px Inter,system-ui,sans-serif;cursor:pointer}
.co-key:active{background:#DADDE1}
@keyframes co-spin{to{transform:rotate(360deg)}}.co-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(29,78,216,.25);border-top-color:#1D4ED8;animation:co-spin .8s linear infinite;flex:none}
@keyframes co-pulse{0%,100%{opacity:1}50%{opacity:.45}}.co-pulse{animation:co-pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.co-spin,.co-pulse{animation:none}}
.co-tl{display:flex;gap:0;align-items:flex-start}.co-tl>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.co-tl>div:not(:last-child)::after{content:"";position:absolute;top:9px;left:calc(50% + 12px);right:calc(-50% + 12px);height:2px;background:var(--ln,#E2E2DA)}
@media print{body *{visibility:hidden}#co-receipt,#co-receipt *{visibility:visible}#co-receipt{position:absolute;left:0;top:0;width:100%}}
@media (max-width:760px){.co-sum{position:static!important}}
/* v325-states */[data-pgs-root]:has(.pgs)>:not(.pgs):not(:has(.pgs)):not(footer):not(.vside):not(:has(.vside)):not(.vs-hdr):not(:has(.vs-hdr)):not([data-sf]){display:none!important}@keyframes pgs-sh{0%{background-position:-300px 0}100%{background-position:300px 0}}.pgs-sk{border-radius:14px;background:linear-gradient(90deg,#ECECE6 0,#F6F6F1 50%,#ECECE6 100%);background-size:600px 100%;animation:pgs-sh 1.2s linear infinite}[data-theme="dark"] .pgs-sk{background:linear-gradient(90deg,#1B1E23 0,#262A31 50%,#1B1E23 100%);background-size:600px 100%}.pgs button[aria-pressed="true"]{background:#14161A!important;color:#FFFFFF!important;border-color:#14161A!important}@media (prefers-reduced-motion:reduce){.pgs-sk{animation:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-Checkout">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="background: #F4F4EF; color: #14161A; font-family: 'EB Garamond', Garamond, Georgia, serif">
<header class="vs-hdr {{svHbCls}}" style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E2E2DA; box-shadow: {{headShadow}}" onClick="{{svHbNav}}" onKeyDown="{{svHbKey}}">
<div class="vs-bar" lang="{{svChromeLang}}" dir="{{svDir}}" style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 10px clamp(16px, 5vw, 72px); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<a href="landing.html" aria-label="{{svT.home}}" style="display: flex; align-items: center; min-height: 44px; text-decoration: none"><span style="display: inline-flex; align-items: flex-start; gap: 1px; flex: none"><img src="assets/img/logo.png" alt="Vachuo" style="display: block; height: 44px; width: auto"><span aria-hidden="true" style="font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; line-height: 1; color: #3F444C">™</span></span></a><button type="button" id="vs-burger" class="vs-burger" aria-label="{{svHbLabel}}" aria-expanded="{{svHbOpen}}" aria-controls="vs-menu" onClick="{{svHbToggle}}" style="flex: none; width: 44px; height: 44px; padding: 0; border-radius: 12px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; align-items: center; justify-content: center; cursor: pointer"><svg class="hb-m" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="hb-x" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<nav class="vs-nav" aria-label="Site" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; font-size: 14.5px; font-weight: 500" id="vs-menu">
<a href="how-it-works.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navHow}}</a>
<a href="pricing.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #3F444C; text-decoration: none">{{svT.navPricing}}</a>
<details class="vmenu {{svVmCls}}" onPointerEnter="{{svVmEnter}}" onPointerLeave="{{svVmLeave}}" onClick="{{svVmClick}}"><summary style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #3F444C">{{svT.navCompany}}<svg class="vm-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="vm-panel vm-right" style="flex-direction: column; min-width: 300px; padding: 8px; margin-top: 2px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2E2DA; box-shadow: 0 18px 40px -20px rgba(20,22,26,0.45)"><a href="about.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coAbout}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coAboutD}}</span></a><a href="about.html#charter" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.coCharter}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.coCharterD}}</span></a><a href="vision.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abVis}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abVisD}}</span></a><a href="white-paper.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abWp}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abWpD}}</span></a><a href="blog.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abBlog}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abBlogD}}</span></a><a href="newsroom.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abNews}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abNewsD}}</span></a><a href="careers.html" style="display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-radius: 10px; color: #14161A; text-decoration: none"><span style="font-size: 14.5px; font-weight: 600">{{svT.abCar}}</span><span style="font-size: 12.5px; font-weight: 400; color: #62676F">{{svT.abCarD}}</span></a></div></details>
</nav>
<div class="vs-act" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 8px">
<a href="sign-in.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.signIn}}</a>
<a href="landing.html#access" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600; text-decoration: none">{{svT.access}}</a>
<button type="button" aria-label="{{svT.darkMode}}" aria-pressed="{{uiOn}}" onClick="{{uiToggle}}" style="flex: none; align-self: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><template data-if="{{uiLight}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></template><template data-if="{{uiDark}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
</div>
</div>
</header>
<template data-if="{{svSwNotice}}"><p role="note" lang="{{svNoticeLang}}" dir="{{svNoticeDir}}" style="margin: 0; padding: 10px clamp(16px, 5vw, 72px); background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; text-align: center">{{svNoticeText}}</p></template>

<main data-pgs-root><template data-if="{{pgsOn}}"><section class="pgs" aria-label="Page state preview" style="box-sizing: border-box; width: 100%; max-width: 720px; margin: clamp(24px, 6vh, 64px) auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; font-family: Inter, system-ui, sans-serif; color: #14161A"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #62676F">Preview · {{pgsKindLabel}}</span><div role="group" aria-label="Preview a page state" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{pgsKinds}}" data-as="s"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 12.5px; font-weight: 600; cursor: pointer">{{s.t}}</button></template><button type="button" onClick="{{pgsLeave}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; font-weight: 600; cursor: pointer">Leave preview</button></div></div><template data-if="{{pgsLoading}}"><div role="status" aria-busy="true" aria-label="{{pgsLoadLabel}}" style="display: flex; flex-direction: column; gap: 12px"><div class="pgs-sk" style="height: 46px; width: 62%"></div><div class="pgs-sk" style="height: 130px"></div><div style="display: flex; gap: 12px"><div class="pgs-sk" style="flex: 1; height: 90px"></div><div class="pgs-sk" style="flex: 1; height: 90px"></div></div><div class="pgs-sk" style="height: 90px"></div></div></template><template data-if="{{pgsCard}}"><div role="{{pgsRole}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: clamp(28px, 5vw, 48px) 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2E2DA; text-align: center"><span aria-hidden="true" style="font-size: 44px; line-height: 1">{{pgsIcon}}</span><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 3vw, 34px); line-height: 1.1; font-weight: 600">{{pgsTitle}}</h2><p style="margin: 0; max-width: 520px; font-size: 16px; line-height: 1.55; color: #3F444C">{{pgsBody}}</p><div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center"><template data-if="{{pgsIsEmpty}}"><a href="{{pgsActHref}}" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; background: #14161A; color: #FFFFFF">{{pgsActT}}</a></template><template data-if="{{pgsNotEmpty}}"><button type="button" onClick="{{pgsRetry}}" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; background: #14161A; color: #FFFFFF">Try again</button><a href="status.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A">Service status</a></template></div><template data-if="{{pgsHasRef}}"><span style="font-size: 12.5px; color: #62676F">{{pgsRef}}</span></template></div></template></section></template><template data-if="{{pgsOffline}}"><div role="status" style="position: fixed; left: 16px; bottom: 16px; z-index: 99; box-sizing: border-box; max-width: min(460px, calc(100% - 32px)); display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 14px; border-radius: 14px; background: #14161A; color: #FFFFFF; font: 600 13.5px/1.4 Inter, system-ui, sans-serif; box-shadow: 0 16px 34px -14px rgba(20,22,26,.6)"><span aria-hidden="true">📴</span><span style="flex: 1">{{pgsOffText}}</span><button type="button" aria-label="Dismiss" onClick="{{pgsDismiss}}" style="flex: none; width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(255,255,255,.12); color: #FFFFFF; font-size: 16px; cursor: pointer">×</button></div></template>
<section aria-labelledby="co-h" style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: clamp(28px, 4vw, 56px) clamp(16px, 5vw, 72px) 8px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px">
<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #0F766E">Checkout</span>
<h1 id="co-h" style="margin: 0; font-size: clamp(36px, 4.4vw, 58px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 600">{{coTitle}}</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #3F444C">Pay with M-Pesa or a card. Every payment gets a receipt, and you can ask for a full refund within 14 days.</p>
</div>
<ol aria-label="Checkout steps" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{coSteps}}" data-as="s"><li><button type="button" class="co-step" aria-current="{{s.cur}}" disabled="{{s.off}}" onClick="{{s.go}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 14px; font-weight: 600; cursor: pointer">{{s.n}} · {{s.t}}</button></li></template>
</ol>
</div>
<div role="note" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; background: #FEF1D9; color: #78350F; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45"><strong style="flex: none">Demo</strong><span>Nothing is charged and nothing you type leaves this page. In the live app, card details go straight to the payment provider and M-Pesa requests come from Safaricom’s Daraja service.</span></div>
</section>

<section aria-label="Checkout" style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 8px clamp(16px, 5vw, 72px) clamp(32px, 4vw, 56px); display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; font-family: Inter, system-ui, sans-serif">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<template data-if="{{coStepPlan}}">
<div style="display: flex; flex-direction: column; gap: 18px; padding: clamp(18px, 2.4vw, 28px); border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E2DA">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 30px; font-weight: 600">Choose a plan</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">

<template data-if="{{coRfTrack}}">

</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px; padding-top: 6px">
