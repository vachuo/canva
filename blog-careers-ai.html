<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Careers in the Age of AI: Advice for a Twelve-Year-Old</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">The evidence on AI and work is early but instructive. It points less to “safe” jobs than to durable capacities and the habit of learning.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #0D9488">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 18px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/028366707734272954ecc6309a373201.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/833820258e37ce20207dcea925e35f1c.svg" alt="" style="display: block; height: 95%; width: auto">
</div>
</figure>

<p style="margin: 0">A twelve-year-old today will enter the full-time labour market in the mid-2030s and may still be working in the 2070s. No one can say with confidence which occupations will exist by then. That uncertainty tempts adults into two unhelpful responses: anxious lists of “future-proof” jobs, and breezy assurances that technology always creates more work than it destroys. The emerging evidence on generative AI supports neither. It does suggest some durable advice.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What the evidence says so far</h2>
<p style="margin: 0"><b style="font-weight: 600">Exposure is broad.</b> Tyna Eloundou and colleagues, writing in <i>Science</i> in 2024, estimated that around 80% of US workers could have at least a tenth of their tasks affected by large language models, and about 19% could see at least half their tasks affected. Exposure is highest in occupations built on writing, analysis and information processing, many of them well-paid jobs that earlier waves of automation spared.</p>
<p style="margin: 0"><b style="font-weight: 600">Productivity effects can be large, and uneven.</b> In a study of more than 5,000 customer-support agents, Erik Brynjolfsson, Danielle Li and Lindsey Raymond found that an AI assistant raised productivity by about 14% on average and by about 34% for novice and lower-skilled workers, largely by spreading the practices of top performers. In a controlled experiment on professional writing tasks, Shakked Noy and Whitney Zhang found that ChatGPT cut the time taken by about 40% and raised quality by about 18%.</p>
<p style="margin: 0"><b style="font-weight: 600">Early careers may be hit hardest.</b> Using payroll data, Brynjolfsson, Bharat Chandar and Ruyu Chen reported in 2025 that employment of 22- to 25-year-olds in the most AI-exposed occupations had fallen by about 13% relative to less-exposed peers since late 2022, while older workers in the same occupations held steady. If that pattern holds, AI is substituting for the codifiable work traditionally handed to beginners, the very tasks through which people used to learn their trades.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">The risk is not only that AI replaces jobs, but that it removes the beginner tasks through which people used to learn.</blockquote>
<p style="margin: 0">At the global scale, the World Economic Forum’s <i>Future of Jobs Report 2025</i>, based on employer surveys, projected that 170 million jobs would be created and 92 million displaced by 2030, and that about 39% of workers’ core skills would change over that period. Such projections are uncertain, but the direction is consistent: substantial churn, and rising demand for skills that complement technology.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What tends to endure</h2>
<p style="margin: 0">Economic research before generative AI already pointed to the growing value of skills machines handle poorly. David Deming showed in 2017 that US jobs requiring both social and cognitive skills grew strongly in employment and pay from 1980, while jobs requiring cognitive skills alone grew more slowly. Coordination, negotiation, persuasion, care and teaching remain hard to automate. AI can produce the words; it cannot supply the trust, accountability and relationships these activities depend on.</p>
<p style="margin: 0">Judgement is the other durable asset. AI systems generate options; someone must decide which to act on and answer for the consequences. That requires domain knowledge deep enough to tell a plausible answer from a correct one. Here lies an uncomfortable implication for education: the more AI can do, the more valuable genuine expertise becomes, because expertise is what lets people use AI well rather than be misled by it.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Advice for a twelve-year-old</h2>
<p style="margin: 0"><b style="font-weight: 600">Go deep in something.</b> Breadth is cheap when AI can summarise anything; depth is what lets you check, extend and lead. Mathematics, writing, a science, a craft or a language: the subject matters less than the experience of real mastery, which transfers as a habit even when the content does not.</p>
<p style="margin: 0"><b style="font-weight: 600">Work with AI, not through it.</b> Use it as a sparring partner and tutor rather than an answer machine. Students who lean on AI without guardrails can perform worse once the tool is taken away. The goal is to be more capable with AI and still capable without it.</p>
<p style="margin: 0"><b style="font-weight: 600">Build things others can see.</b> A portfolio of real work, whether a project, a product, a published piece or a problem solved for a real client, is an increasingly valuable signal as conventional credentials lose their monopoly and the entry-level jobs that once proved competence become scarcer.</p>
<p style="margin: 0"><b style="font-weight: 600">Practise people skills on purpose.</b> Collaboration, explanation, persuasion and care are learnable, and they are learned with other people. That is one reason we think peers, mentors and learning webs belong at the centre of education rather than at its edges.</p>
<p style="margin: 0"><b style="font-weight: 600">Keep learning, deliberately.</b> The most reliable prediction is that the skills needed at forty will differ from those needed at twenty. People who know how to learn new things, and who enjoy it, will adapt. Those who learned only to pass tests will struggle.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What systems owe young people</h2>
<p style="margin: 0">Advice to individuals is not enough. If AI erodes entry-level work, societies will need new routes into skilled employment: apprenticeships, paid projects, and credentials based on demonstrated competence rather than seat time. Education systems that still measure success in hours and certificates will prepare children for a labour market that no longer exists. The better preparation is the one learning science has always recommended: deep understanding, real problems, honest feedback and human mentors.</p>
