<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo app · Learner (390)</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
html,body{margin:0;background:#F4F4EF}
.mb{font-family:Inter,system-ui,sans-serif;color:#14161A}
.mb button{font-family:inherit}
.mb-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:none;background:none;color:#62676F;font-size:11px;font-weight:600;cursor:pointer;position:relative}
.mb-tab[aria-selected="true"]{color:#1D4ED8}
.mb-tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:#1D4ED8}
.mb-card{background:#FFFFFF;border:1px solid #E2E2DA;border-radius:18px;padding:14px}
.mb-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.mb-btn{min-height:44px;padding:0 16px;border-radius:999px;border:none;background:#14161A;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer}
.mb-btn2{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font-size:14px;font-weight:600;cursor:pointer}
.mb-btn:disabled,.mb-btn2:disabled{opacity:.45;cursor:not-allowed}
.mb-in{width:100%;box-sizing:border-box;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font:15px Inter,system-ui,sans-serif}
.mb-ta{width:100%;box-sizing:border-box;min-height:140px;padding:12px;border-radius:14px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font:15px/1.5 Inter,system-ui,sans-serif;resize:none}
.mb-chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #CFCFC6;background:#FFFFFF;color:#3F444C;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.mb-chip[aria-pressed="true"]{background:#14161A;color:#FFFFFF;border-color:#14161A}
.mb-b{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-line}
.mb-in-b{align-self:flex-start;background:#FFFFFF;border:1px solid #E2E2DA;border-top-left-radius:5px}
.mb-out-b{align-self:flex-end;background:#1D4ED8;color:#FFFFFF;border-top-right-radius:5px}
.mb-err-b{align-self:flex-end;background:#FDECEA;color:#7A1D14;border:1px solid #F5C2BC;border-top-right-radius:5px;cursor:pointer}
.mb-sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:86%;overflow:auto;box-sizing:border-box;padding:16px 16px 22px;border-radius:22px 22px 0 0;background:#FFFFFF;box-shadow:0 -20px 40px -20px rgba(20,22,26,.45);display:flex;flex-direction:column;gap:12px}
.mb-scrim{position:absolute;inset:0;z-index:19;background:rgba(20,22,26,.4)}
.mb-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 4px;border:none;border-bottom:1px solid #ECECE6;background:none;color:inherit;text-align:left;font-size:15px;cursor:pointer;text-decoration:none;width:100%}
.mb-tg{position:relative;width:44px;height:26px;flex:none;border-radius:999px;border:none;background:#8A8F96;cursor:pointer;padding:0}
.mb-tg[aria-checked="true"]{background:#0F766E}
.mb-tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:left .15s}
.mb-tg[aria-checked="true"]::after{left:21px}
@keyframes mb-sh{0%{background-position:-200px 0}100%{background-position:200px 0}}
.mb-sk{border-radius:12px;background:linear-gradient(90deg,#ECECE6 0,#F6F6F1 50%,#ECECE6 100%);background-size:400px 100%;animation:mb-sh 1.1s linear infinite}
@keyframes mb-spin{to{transform:rotate(360deg)}}.mb-spin{flex:none;animation:mb-spin .8s linear infinite}
@media (prefers-reduced-motion:reduce){.mb-sk,.mb-spin{animation:none}.mb-tg::after{transition:none}}
.mb-dots{display:inline-flex;gap:3px}.mb-dots span{width:9px;height:9px;border-radius:50%;background:#E2E2DA}.mb-dots span.on{background:#0F766E}
[data-theme="dark"] .mb-card{background:#171A1F;border-color:#2B3038}
[data-theme="dark"] .mb-in,[data-theme="dark"] .mb-ta{background:#0F1114;border-color:#3A4049;color:#EDEDE8}
[data-theme="dark"] .mb-in-b{background:#171A1F;border-color:#2B3038;color:#EDEDE8}
[data-theme="dark"] .mb-sheet{background:#171A1F;color:#EDEDE8}
[data-theme="dark"] .mb-btn{background:#EDEDE8;color:#14161A}
[data-theme="dark"] .mb-btn2,[data-theme="dark"] .mb-chip{background:#171A1F;color:#EDEDE8;border-color:#3A4049}
[data-theme="dark"] .mb-chip[aria-pressed="true"]{background:#EDEDE8;color:#14161A}
[data-theme="dark"] .mb-row{border-color:#2B3038}
[data-theme="dark"] .mb-sk{background:linear-gradient(90deg,#1B1E23 0,#262A31 50%,#1B1E23 100%);background-size:400px 100%}
[data-theme="dark"] .mb-tab[aria-selected="true"]{color:#8EB0FF}[data-theme="dark"] .mb-tab[aria-selected="true"]::before{background:#8EB0FF}
/* v325-states */[data-pgs-root]:has(.pgs)>:not(.pgs):not(:has(.pgs)):not(footer):not(.vside):not(:has(.vside)):not(.vs-hdr):not(:has(.vs-hdr)):not([data-sf]){display:none!important}@keyframes pgs-sh{0%{background-position:-300px 0}100%{background-position:300px 0}}.pgs-sk{border-radius:14px;background:linear-gradient(90deg,#ECECE6 0,#F6F6F1 50%,#ECECE6 100%);background-size:600px 100%;animation:pgs-sh 1.2s linear infinite}[data-theme="dark"] .pgs-sk{background:linear-gradient(90deg,#1B1E23 0,#262A31 50%,#1B1E23 100%);background-size:600px 100%}.pgs button[aria-pressed="true"]{background:#14161A!important;color:#FFFFFF!important;border-color:#14161A!important}@media (prefers-reduced-motion:reduce){.pgs-sk{animation:none}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-MobileLearner">
<div data-theme="{{uiTheme}}" class="mb" lang="{{mbLang}}" style="position: relative; height: 100vh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: #F4F4EF; overflow: hidden">
<div aria-hidden="true" style="flex: none; height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 600"><span>9:41</span><span>{{mbNetIcon}}</span></div>
<header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 16px 10px">
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 12px; font-weight: 600; color: #62676F">{{mbKicker}}</span><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; line-height: 1.05; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{mbTitle}}</h1></div>
<button type="button" aria-label="{{mbThemeLabel}}" onClick="{{uiToggle}}" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 17px; cursor: pointer">{{mbThemeIcon}}</button>
</header>
<template data-if="{{mbNetBanner}}"><div role="status" style="flex: none; margin: 0 16px 8px; padding: 9px 12px; border-radius: 12px; background: {{mbNetBg}}; color: {{mbNetFg}}; font-size: 13px; line-height: 1.4; font-weight: 600">{{mbNetText}}</div></template>
<main id="mb-main" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px" data-pgs-root><template data-if="{{pgsOn}}"><section class="pgs" aria-label="Page state preview" style="box-sizing: border-box; width: 100%; max-width: 720px; margin: clamp(24px, 6vh, 64px) auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; font-family: Inter, system-ui, sans-serif; color: #14161A"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #62676F">Preview · {{pgsKindLabel}}</span><div role="group" aria-label="Preview a page state" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="{{pgsKinds}}" data-as="s"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #3F444C; font-size: 12.5px; font-weight: 600; cursor: pointer">{{s.t}}</button></template><button type="button" onClick="{{pgsLeave}}" style="min-height: 32px; padding: 0 10px; border: none; background: transparent; color: #1D4ED8; font-size: 12.5px; font-weight: 600; cursor: pointer">Leave preview</button></div></div><template data-if="{{pgsLoading}}"><div role="status" aria-busy="true" aria-label="{{pgsLoadLabel}}" style="display: flex; flex-direction: column; gap: 12px"><div class="pgs-sk" style="height: 46px; width: 62%"></div><div class="pgs-sk" style="height: 130px"></div><div style="display: flex; gap: 12px"><div class="pgs-sk" style="flex: 1; height: 90px"></div><div class="pgs-sk" style="flex: 1; height: 90px"></div></div><div class="pgs-sk" style="height: 90px"></div></div></template><template data-if="{{pgsCard}}"><div role="{{pgsRole}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: clamp(28px, 5vw, 48px) 24px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2E2DA; text-align: center"><span aria-hidden="true" style="font-size: 44px; line-height: 1">{{pgsIcon}}</span><h2 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 3vw, 34px); line-height: 1.1; font-weight: 600">{{pgsTitle}}</h2><p style="margin: 0; max-width: 520px; font-size: 16px; line-height: 1.55; color: #3F444C">{{pgsBody}}</p><div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center"><template data-if="{{pgsIsEmpty}}"><a href="{{pgsActHref}}" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; background: #14161A; color: #FFFFFF">{{pgsActT}}</a></template><template data-if="{{pgsNotEmpty}}"><button type="button" onClick="{{pgsRetry}}" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; background: #14161A; color: #FFFFFF">Try again</button><a href="status.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A">Service status</a></template></div><template data-if="{{pgsHasRef}}"><span style="font-size: 12.5px; color: #62676F">{{pgsRef}}</span></template></div></template></section></template><template data-if="{{pgsOffline}}"><div role="status" style="position: fixed; left: 16px; bottom: 16px; z-index: 99; box-sizing: border-box; max-width: min(460px, calc(100% - 32px)); display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 14px; border-radius: 14px; background: #14161A; color: #FFFFFF; font: 600 13.5px/1.4 Inter, system-ui, sans-serif; box-shadow: 0 16px 34px -14px rgba(20,22,26,.6)"><span aria-hidden="true">📴</span><span style="flex: 1">{{pgsOffText}}</span><button type="button" aria-label="Dismiss" onClick="{{pgsDismiss}}" style="flex: none; width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(255,255,255,.12); color: #FFFFFF; font-size: 16px; cursor: pointer">×</button></div></template>
<template data-if="{{mbLoading}}"><div aria-busy="true" aria-label="Loading" style="display: flex; flex-direction: column; gap: 12px"><div class="mb-sk" style="height: 96px"></div><div class="mb-sk" style="height: 64px"></div><div class="mb-sk" style="height: 64px"></div><div class="mb-sk" style="height: 120px"></div></div></template>
<template data-if="{{mbReady}}">
<template data-if="{{isToday}}">
<div class="mb-card" style="display: flex; flex-direction: column; gap: 10px; background: #1D4ED8; border-color: #1D4ED8; color: #FFFFFF">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .85">{{L.cont}} · {{L.ratios}}</span>
<strong style="font-size: 19px; line-height: 1.25">How do recipes scale for 40?</strong>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="mb-dots" aria-hidden="true"><span class="on" style="background: #F9A826"></span><span class="on" style="background: #F9A826"></span><span class="on" style="background: #F9A826"></span><span style="background: rgba(255,255,255,.35)"></span><span style="background: rgba(255,255,255,.35)"></span></span><span>3 of 5 steps · about 15 min</span></div>
<button type="button" class="mb-btn" onClick="{{goTutor}}" style="align-self: flex-start; background: #FFFFFF; color: #1E40AF">{{L.contBtn}}</button>
</div>
<h2 style="margin: 4px 0 0; font-size: 15px">{{L.plan}}</h2>
<div class="mb-card" style="padding: 4px 14px">
<template data-for="{{plan}}" data-as="p"><button type="button" class="mb-row" aria-pressed="{{p.done}}" onClick="{{p.flip}}"><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid {{p.ring}}; background: {{p.fill}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{p.tick}}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600; text-decoration: {{p.strike}}">{{p.t}}</span><span style="font-size: 12.5px; color: #62676F">{{p.d}}</span></span></button></template>
</div>
<div class="mb-card" style="display: flex; gap: 12px; align-items: center">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #FEF1D9; display: inline-flex; align-items: center; justify-content: center; font-size: 20px">🤖</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14.5px">Robotics club · 4:00 pm</strong><span style="font-size: 12.5px; color: #62676F">Live room with Nduta K. and 6 others</span></div>
<button type="button" class="mb-btn2" onClick="{{joinLive}}" disabled="{{mbOff}}">{{joinT}}</button>
</div>
<button type="button" class="mb-card" onClick="{{goMap}}" style="display: flex; justify-content: space-between; align-items: center; text-align: left; cursor: pointer; color: inherit"><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14.5px">{{L.week}}</strong><span style="font-size: 12.5px; color: #62676F">Ratios, fractions of amounts, bar charts, Kiswahili insha</span></span><span aria-hidden="true" style="font-size: 18px">›</span></button>
</template>

<template data-if="{{isTutor}}">
<div style="display: flex; gap: 8px; align-items: center"><span class="mb-pill" style="background: #E4ECFD; color: #1E40AF">Ratios</span><span style="font-size: 12.5px; color: #62676F">Socrates gives hints, not answers.</span></div>
<div role="log" aria-live="polite" aria-label="Conversation with Socrates" style="display: flex; flex-direction: column; gap: 8px">
<template data-for="{{chat}}" data-as="m"><div class="mb-b {{m.c}}" onClick="{{m.retry}}">{{m.t}}</div></template>
<template data-if="{{typing}}"><div class="mb-b mb-in-b" aria-label="Socrates is typing">…</div></template>
</div>
<div style="position: sticky; bottom: -20px; margin: 0 -16px -20px; padding: 10px 16px 14px; background: #F4F4EF; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #E2E2DA">
<template data-if="{{mbOff}}"><p style="margin: 0; font-size: 13px; color: #3F444C">Socrates needs a connection. You can still text your answer to the daily SMS, or dial *826#.</p></template>
<div style="display: flex; gap: 6px; overflow-x: auto"><template data-for="{{quick}}" data-as="q"><button type="button" class="mb-chip" onClick="{{q.go}}" disabled="{{mbOff}}">{{q.t}}</button></template></div>
<form onSubmit="{{send}}" style="display: flex; gap: 8px"><input class="mb-in" aria-label="Message Socrates" placeholder="{{inPh}}" value="{{draft}}" onChange="{{setDraft}}" disabled="{{mbOff}}"><button type="button" aria-label="Talk instead" onClick="{{mic}}" disabled="{{mbOff}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #CFCFC6; background: #FFFFFF; font-size: 17px; cursor: pointer">🎤</button><button type="submit" aria-label="Send" disabled="{{mbOff}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 16px; cursor: pointer">➤</button></form>
</div>
</template>

<template data-if="{{isMap}}">
<div role="group" aria-label="Subject" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px"><template data-for="{{subjects}}" data-as="s"><button type="button" class="mb-chip" aria-pressed="{{s.on}}" onClick="{{s.pick}}">{{s.t}}</button></template></div>
<div class="mb-card" style="display: flex; justify-content: space-around; text-align: center"><div><div style="font-size: 24px; font-weight: 700">{{mapSum.secure}}</div><div style="font-size: 12px; color: #62676F">secure</div></div><div><div style="font-size: 24px; font-weight: 700">{{mapSum.going}}</div><div style="font-size: 12px; color: #62676F">in progress</div></div><div><div style="font-size: 24px; font-weight: 700">{{mapSum.next}}</div><div style="font-size: 12px; color: #62676F">up next</div></div></div>
<div class="mb-card" style="padding: 4px 14px">
<template data-for="{{skills}}" data-as="k"><button type="button" class="mb-row" onClick="{{k.open}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{k.t}}</span><span style="font-size: 12.5px; color: {{k.ink}}">{{k.st}}</span></span><span class="mb-dots" role="img" aria-label="{{k.aria}}"><span class="{{k.d1}}"></span><span class="{{k.d2}}"></span><span class="{{k.d3}}"></span></span></button></template>
</div>
</template>

<template data-if="{{isNotes}}">
<template data-if="{{notesEmpty}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 16px; text-align: center"><span aria-hidden="true" style="font-size: 44px">📝</span><strong style="font-size: 17px">No notes yet</strong><span style="font-size: 14px; line-height: 1.5; color: #62676F">Write what you think, even when you’re not sure. It helps Socrates and your guide see how you think.</span><button type="button" class="mb-btn" onClick="{{newNote}}">Write your first note</button></div></template>
<template data-for="{{notes}}" data-as="n"><div class="mb-card" style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; gap: 8px"><strong style="font-size: 14.5px">{{n.title}}</strong><span style="font-size: 12px; color: #62676F">{{n.when}}</span></div><span style="font-size: 13.5px; line-height: 1.45; color: #3F444C">{{n.snip}}</span><span style="font-size: 12px; font-weight: 600; color: {{n.syncInk}}">{{n.sync}}</span></div></template>
<template data-if="{{notesAny}}"><button type="button" class="mb-btn" onClick="{{newNote}}" style="position: sticky; bottom: 0; align-self: flex-end; box-shadow: 0 10px 24px -10px rgba(20,22,26,.6)">+ New note</button></template>
</template>

<template data-if="{{isMe}}">
<div class="mb-card" style="display: flex; gap: 12px; align-items: center"><span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: #F9A826; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; color: #14161A">A</span><div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">Amani M.</strong><span style="font-size: 13px; color: #62676F">Learner · K→16 pathway · Nairobi</span></div></div>
<div class="mb-card" style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; justify-content: space-between"><strong style="font-size: 14.5px">This week’s lessons</strong><span style="font-size: 12.5px; color: #62676F">38 MB</span></div><div style="height: 8px; border-radius: 999px; background: #E2E2DA; overflow: hidden"><div style="height: 100%; width: {{dlPct}}%; background: #0F766E"></div></div><span style="font-size: 12.5px; color: #62676F">{{dlText}}</span><template data-if="{{dlCan}}"><button type="button" class="mb-btn2" onClick="{{dl}}" disabled="{{mbOff}}" style="align-self: flex-start">{{dlCta}}</button></template></div>
<div class="mb-card" style="padding: 4px 14px">
<div class="mb-row" style="cursor: default"><span style="flex: 1">Data saver</span><button type="button" role="switch" class="mb-tg" aria-label="Data saver" aria-checked="{{saver}}" onClick="{{saverFlip}}"></button></div>
<div class="mb-row" style="cursor: default"><label for="m-lang" style="flex: 1">Language</label><select id="m-lang" value="{{lang}}" onChange="{{setLang}}" style="min-height: 36px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font: 14px Inter, system-ui, sans-serif"><option value="en">English</option><option value="sw">Kiswahili</option></select></div>
<a class="mb-row" href="notifications.html#learner"><span style="flex: 1">Notifications</span><span aria-hidden="true">›</span></a>
<a class="mb-row" href="help.html"><span style="flex: 1">Help centre</span><span aria-hidden="true">›</span></a>
<a class="mb-row" href="status.html" style="border-bottom: none"><span style="flex: 1">Service status</span><span aria-hidden="true">›</span></a>
</div>
<div class="mb-card" style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #62676F">Demo: phone connection</span><div role="group" aria-label="Demo connection" style="display: flex; gap: 6px"><template data-for="{{mbNets}}" data-as="n"><button type="button" class="mb-chip" aria-pressed="{{n.on}}" onClick="{{n.pick}}">{{n.t}}</button></template></div></div>
<a href="landing.html#signed-out" class="mb-btn2" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none">Sign out</a>
</template>
</template>
</main>
