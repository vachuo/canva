<section aria-labelledby="agora-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; background: #F4F7FE; border-color: #DCE6FD"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">Free · any age · no marks</span><h2 id="agora-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">The Agora</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F444C">Socrates taught in the public square and never charged a fee. Each week, one open question and a circle of people of every age to think it through. Nobody is graded; Socrates only takes notes.</p><template data-for="{{agora}}" data-as="g"><div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE6FD"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.3">“{{g.q}}”</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #62676F">{{g.when}} · {{g.where}} · led by {{g.lead}}</span><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><button type="button" aria-pressed="{{g.on}}" onClick="{{g.join}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{g.bd}}; background: {{g.bg}}; color: {{g.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{g.label}}</button><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #115E59">{{g.note}}</span></div></div></template></section>
<section aria-labelledby="pair-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #115E59">Peers, by question</span><h2 id="pair-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Who else is asking?</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F444C">Partners are matched by the question you’re carrying, not by age-grade. Older and younger learners teach each other best.</p><template data-for="{{pairs}}" data-as="p"><div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #ECECE6"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 17px; font-weight: 600">{{p.q}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 13.5px; color: #3F444C">{{p.who}}</span><div><button type="button" aria-pressed="{{p.on}}" onClick="{{p.ask}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{p.label}}</button></div></div></template></section>
<section aria-labelledby="speak-h" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; background: #FBF7EE; border-color: #EFE6D2"><span style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #92400E">Speak up</span><h2 id="speak-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Something here should change</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3F444C">A board for local problems learners care about. Gather people, take it to the Agora, and turn it into a project. Moderated; under-18s post first names only, with a guardian’s yes.</p><template data-for="{{issues}}" data-as="x"><div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #EFE6D2"><span style="font-size: 15.5px; line-height: 1.45">{{x.t}}</span><span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #62676F">{{x.by}}</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="{{x.on}}" onClick="{{x.care}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{x.bd}}; background: {{x.bg}}; color: {{x.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{x.label}}</button></div></div></template></section>
</div></div>

</section>

      return Object.assign({}, s, { pressed: on ? 'true' : 'false', btn: on ? 'Selected' : btnWord, bg: on ? '#F4F7FE' : '#FFFFFF', bd: on ? '#1D4ED8' : '#ECECE6',
        btnBg: on ? '#1D4ED8' : '#FFFFFF', btnFg: on ? '#FFFFFF' : '#14161A', btnBd: on ? '#1D4ED8' : '#CFCFC6', pick: () => this.setState({ pick: on ? -1 : i }) });
    });
    const picked = this.state.pick >= 0 ? up[this.state.pick] : null;
    const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const today = this.nbo().day;
    const week = [1, 2, 3, 4, 5, 6, 0].map((dd, i) => {
      const ws = e.win.filter((w) => w[0].indexOf(dd) >= 0);
      const has = ws.length > 0, isToday = dd === today;
      return { d: DAYS[i], t: has ? this.hm(ws[0][1]) : '—', bg: has ? c.tint : '#FAFAF7', fg: has ? c.ink : '#8A8F96', bd: isToday ? '#14161A' : (has ? c.tint : '#ECECE6') };
    });

    const skills = e.skills.map((name) => {
      const s = SC[name] || ['', 0];
      const shown = s[1] >= 0.85;
      return { name, subj: s[0], score: s[1].toFixed(2), pct: Math.round(s[1] * 100), bar: shown ? '#93BBF3' : (s[1] < 0.3 ? '#B9BCB4' : '#1D4ED8'),
        note: shown ? 'Shown. Time here keeps it fresh.' : (s[1] < 0.3 ? 'Not yet on your path, but nothing is locked.' : 'Growing. One more kind of evidence would help.') };
    });

    const safetyBy = {
      org: ['Host is ID-verified and staff are background-checked', 'Learners come in groups or stay in public areas', 'A parent approves every visit for under-18s', 'Check-in and check-out are logged; your guide can see them'],
      thing: ['Loaned through a verified library', 'A parent co-signs loans for under-18s', 'Safety notes come with the kit'],
      event: ['Run by verified hosts in an open venue', 'Always a group event, never one-to-one', 'A parent approves attendance for under-18s', 'Check-in and check-out are logged'],
      adult: ['ID-verified and background-checked', 'Meets only in public places or in groups, never at a home', 'A parent approves every meeting', 'Messages go through Vachuo, and your parent can see them'],
      peer: ['Both families have approved the match', 'Peer profiles show first names and shared goals only', 'Meets in public places or Vachuo video rooms', 'Your guide can see every message'],
      staff: ['Vachuo staff, background-checked', 'Your parents can join any check-in', 'Notes from check-ins are shared with your family']
    };
    const safety = e.id === 'nduta' ? safetyBy.staff : (e.kind === 'org' ? safetyBy.org : (e.kind === 'thing' ? safetyBy.thing : (e.kind === 'event' ? safetyBy.event : (adult ? safetyBy.adult : safetyBy.peer))));

    const near = D.list.filter((x) => x.id !== e.id).map((x) => {
      let score;
      if (e.x !== null && x.x !== null) { const dx = (x.x - e.x) * 0.12, dy = (x.y - e.y) * 0.09; score = Math.sqrt(dx * dx + dy * dy); }
      else if (e.x !== null) score = 50;
      else score = (x.cat === e.cat ? 0 : 5) + (x.x === null ? 0 : 3) + x.name.length / 100;
      if (e.host && x.id === e.host) score = -1;
      return { x, score };
    }).sort((a, b) => a.score - b.score).slice(0, 4);
    const related = near.map(({ x }) => {
      const cc = COL[x.cat];
      const dd = this.dist(x);
      return { name: x.name, sub: SUB[x.sub] + ' · ' + (dd === null ? 'Online' : dd.toFixed(1) + ' km'), bg: cc.tint, fg: cc.ink, icon: I[x.sub], pick: () => this.open(x.id) };
    });

    const host = e.host ? D.map[e.host] : null;
    const shortName = e.name.split(',')[0].split(' · ')[0];
    const words = { org: 'visit', thing: 'loan', event: 'place', person: 'meeting', group: 'place in the group' }[e.kind];

    return {
      rootPad: embedded ? '0' : '28px clamp(16px, 4vw, 48px) 72px',
      embedded, standalone: !embedded,
      goBack: () => { if (this.props.onBack) this.props.onBack(); },
      dir,
      band: c.band, bandFg: c.bandFg, tint: c.tint, ink: c.ink, icon: I[e.sub],
      catLabel: c.label, subLabel: SUB[e.sub],
      name: e.name, role: e.role,
      hasFace: !!e.face, face: e.face, hasInitials: !e.face && !!e.ini, initials: e.ini, hasIcon: !e.face && !e.ini,
      liveText: lv.text, liveBg: lv.live ? '#DDF4F1' : '#F4F4EF', liveFg: lv.live ? '#115E59' : '#3F444C', liveDot: lv.live ? '#0D9488' : '#8A8F96',
      where: d === null ? 'Online' : 'Kilimani, Nairobi · ' + d.toFixed(1) + ' km from home',
      verified,
      hasMine: !!e.mine, mine: e.mine,
      cta: e.cta, ctaGo: () => this.setState({ tab: 'schedule' }),
      followPressed: followOn ? 'true' : 'false', followLabel: followOn ? '✓ ' + followWords[1] : followWords[0],
      followBg: followOn ? '#E4ECFD' : '#FFFFFF', followFg: followOn ? '#1E40AF' : '#14161A', followBd: followOn ? '#93BBF3' : '#CFCFC6',
      toggleFollow: () => { const f = Object.assign({}, this.state.follow); f[e.id] = !followOn; this.setState({ follow: f }); },
      hasHost: !!host, hostLabel: host ? 'Hosted at ' + host.name : '', openHost: () => { if (host) this.open(host.id); },
      tabs,
      tabOverview: this.state.tab === 'overview', tabSchedule: this.state.tab === 'schedule', tabMap: this.state.tab === 'map', tabSafety: this.state.tab === 'safety',
      aboutTitle: { org: 'About this place', thing: 'About this kit', event: 'About this event', person: 'About ' + shortName, group: 'About this group' }[e.kind],
      about: e.about,
      facts: e.facts.map((f) => ({ k: f[0], v: f[1] })),
      offersTitle: { org: 'What’s on offer', thing: 'In the kit', event: 'Programme', person: e.cat === 'peer' ? 'What you’d do together' : (e.cat === 'elder' ? 'How they help' : 'What they teach'), group: 'What we’re working on' }[e.kind],
      offers: e.offers.map((o) => ({ t: o[0], d: o[1] })),
      hasNotes: e.notes.length > 0, notes: e.notes.map((n) => ({ who: n[0], text: n[1] })),
      schedTitle: e.kind === 'thing' ? 'Choose a pick-up day' : (e.kind === 'event' ? 'Upcoming dates' : 'Upcoming times'),
      spotsText: e.spots ? spotsLeft + ' of ' + e.spots[1] + ' places left' : 'Times update live',
      week, slots, notSent: !this.state.sent, picking: !!picked && !this.state.sent,
      reqTitle: picked ? 'Request a ' + words + ': ' + picked.date + ', ' + picked.time : '',
      shortName,
      msg: this.state.msg, setMsg: (ev) => this.setState({ msg: ev.target.value }),
      msgHint: e.kind === 'event' ? 'Anything the hosts should know?' : 'What would you like to learn or bring?',
      sendLabel: 'Send for approval',
      sendReq: () => this.setState({ sent: true }),
      cancelReq: () => this.setState({ pick: -1, msg: '' }),
      sent: this.state.sent,
      sentText: picked ? 'Your request for ' + picked.date + ' at ' + picked.time.split('–')[0] + ' is with your parent. Once they approve it, ' + (e.kind === 'event' ? 'your place is held' : shortName + ' is asked to confirm') + ', and it appears in Today.' : '',
      undoReq: () => this.setState({ sent: false, pick: -1, msg: '' }),
      skills,
      safety, meets: e.meets || (host ? host.name + ', an open venue.' : (e.kind === 'org' || e.kind === 'thing' ? 'On site, in the public areas.' : 'A public place agreed in advance.')),
      reportGo: () => this.setState({ report: true }),
      reportText: this.state.report ? 'Thank you. Your guide and the Vachuo safety team have been told, and your parent can see this report.' : '',
      hoursTitle: e.kind === 'event' ? 'When' : (e.kind === 'org' || e.kind === 'thing' ? 'Opening hours' : 'Usually available'),
      hours: e.win.map((w) => ({ days: this.daysText(w[0]), time: this.hm(w[1]) + '–' + this.hm(w[2]), label: w[3] })),
      hasMap: e.x !== null, exact: e.x !== null && (e.kind !== 'person'), approx: e.x !== null && e.kind === 'person',
      mapX: e.x === null ? 0 : (e.x * 3).toFixed(1), mapY: e.y === null ? 0 : (e.y * 3).toFixed(1),
      locTitle: e.kind === 'person' ? 'Approximate area' : 'Location',
      locText: e.kind === 'person' ? 'People are shown by area only. You meet at: ' + (e.meets || 'a public place') : (d === null ? '' : d.toFixed(1) + ' km from home, Kilimani. Exact directions are shared once a visit is approved.'),
      relTitle: e.host ? 'Host and nearby' : (e.x === null ? 'More on Connects' : 'Nearby'),
      related
    };
  }
}
return Component;
}, {"pid": "makerspace", "embedded": false});

DC.mount("Webs");
</script>
