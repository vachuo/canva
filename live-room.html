<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Live room</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-LiveRoom">
<div data-theme="{{uiTheme}}" lang="{{svLang}}" style="min-height: 100vh; display: flex; flex-direction: column; background: #0B0D10; color: #EDEDE8; font-family: Inter, system-ui, sans-serif">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px clamp(16px, 3vw, 28px); border-bottom: 1px solid #2A2E33"><a href="{{backHref}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #C9CCD0; font-size: 14px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>{{backLabel}}</a><div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 22px; font-weight: 600; color: #FFFFFF">{{roomTitle}}</h1><span style="font-size: 12.5px; color: #A3A8AE">{{roomSub}}</span></div><div role="group" aria-label="Room type" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #1A1D20"><template data-for="{{modes}}" data-as="m"><button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: none; background: {{m.bg}}; color: {{m.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{m.label}}</button></template></div><div role="group" aria-label="Viewing as" style="display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: #1A1D20"><template data-for="{{roleOpts}}" data-as="r"><button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: none; background: {{r.bg}}; color: {{r.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">{{r.label}}</button></template></div><button type="button" onClick="{{ux_report}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #2A2E33; background: transparent; color: #F4C77A; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Report a problem</button><span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #1A1D20; font-size: 12.5px; color: #C9CCD0"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #0D9488"></span>Not recorded · parents can join</span></header>
<template data-if="{{roleBannerOn}}"><p role="status" style="margin: 0; padding: 10px clamp(16px, 3vw, 28px); background: #1A1D20; color: #EDEDE8; font-size: 13.5px; line-height: 1.45">{{roleBanner}}</p></template><template data-if="{{pausedOn}}"><p role="alert" style="margin: 0; padding: 10px clamp(16px, 3vw, 28px); background: #F9A826; color: #14161A; font-size: 14px; font-weight: 600">The room is paused by a Vachuo moderator while we check something. Please wait.</p></template><template data-if="{{hasNote}}"><p role="status" style="margin: 0; padding: 8px clamp(16px, 3vw, 28px); background: #0F2B28; color: #A6D8D1; font-size: 13px">{{roomNote}}</p></template>
<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px clamp(16px, 3vw, 28px)">
<section aria-label="Room" style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><template data-if="{{sharing}}"><div style="border-radius: 18px; background: #FFFFFF; color: #14161A; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{shareWho}} is sharing a screen</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">Ratio table: chapati for the whole class</span><div style="overflow-x: auto"><table style="border-collapse: collapse; font-size: 15px"><tbody><tr><th scope="row" style="text-align: left; padding: 8px 14px; border: 1px solid #E2E2DA; background: #FBFBF8">Chapati</th><td style="padding: 8px 14px; border: 1px solid #E2E2DA">8</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">16</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">20</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">40</td></tr><tr><th scope="row" style="text-align: left; padding: 8px 14px; border: 1px solid #E2E2DA; background: #FBFBF8">Cups of flour</th><td style="padding: 8px 14px; border: 1px solid #E2E2DA">3</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">6</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA; background: #FEF1D9">?</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA; background: #FEF1D9">?</td></tr></tbody></table></div></div></template><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px"><template data-for="{{tiles}}" data-as="t"><div style="position: relative; min-height: 150px; border-radius: 16px; overflow: hidden; background: {{t.bg}}; border: 2px solid {{t.bd}}; display: flex; align-items: center; justify-content: center"><template data-if="{{t.hasImg}}"><img src="{{t.img}}" alt="" style="width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: #1D2126"></template><template data-if="{{t.noImg}}"><span aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; background: {{t.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700">{{t.ini}}</span></template><span style="position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-size: 12.5px; font-weight: 600">{{t.name}}{{t.tag}}</span><template data-if="{{t.hand}}"><span style="position: absolute; right: 10px; top: 10px; padding: 4px 10px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700">Hand raised</span></template><template data-if="{{t.muted}}"><span style="position: absolute; right: 10px; bottom: 10px; padding: 4px 8px; border-radius: 999px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-size: 11.5px">Muted</span></template></div></template></div><div role="toolbar" aria-label="Room controls" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; border-radius: 18px; background: #14171B"><template data-for="{{controls}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.go}}" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 76px; min-height: 60px; padding: 6px 10px; border-radius: 14px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg>{{c.label}}</button></template><a href="{{backHref}}" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 76px; min-height: 60px; padding: 6px 10px; border-radius: 14px; background: #B91C1C; color: #FFFFFF; font-size: 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c5-4 13-4 18 0l-2.5 3-3.5-1.5V14c-2-.6-4-.6-6 0v2.5L5.5 18z"/></svg>Leave</a></div></section>
<aside aria-label="Room panel" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; color: #14161A; overflow: hidden"><div role="group" aria-label="Panel" style="display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid #ECECE6"><template data-for="{{panels}}" data-as="p"><button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="flex: 1 0 auto; min-height: 40px; padding: 0 12px; border-radius: 10px; border: none; background: {{p.bg}}; color: {{p.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{p.label}}</button></template></div><div style="height: 520px; overflow-y: auto; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><template data-if="{{pChat}}"><template data-for="{{msgs}}" data-as="m"><div style="align-self: {{m.align}}; max-width: 92%; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11.5px; font-weight: 600; color: #62676F">{{m.who}}</span><span style="padding: 8px 12px; border-radius: 12px; background: {{m.bg}}; font-size: 14px; line-height: 1.45; color: #14161A">{{m.text}}</span></div></template><span style="font-size: 12px; line-height: 1.45; color: #62676F">Phone numbers, emails and links are hidden automatically. Guides and parents can see this chat.</span></template><template data-if="{{pNotes}}"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1E40AF">Notes by Socrates · live</span><template data-for="{{notes}}" data-as="n"><div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><span style="flex: none; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #62676F">{{n.at}}</span><span>{{n.t}}</span></div></template><button type="button" onClick="{{saveNotes}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{saveLabel}}</button><span role="status" style="font-size: 13px; color: #115E59">{{saveMsg}}</span></template><template data-if="{{pPeople}}"><template data-if="{{hasLobby}}"><div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: #FEF9EE; border: 1px solid #F6DFAE"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #92400E">Waiting room</span><template data-for="{{lobby}}" data-as="w"><div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{w.n}}</span><span style="font-size: 12.5px; color: #62676F">{{w.d}}</span></span><button type="button" onClick="{{w.admit}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-size: 13px; font-weight: 600; cursor: pointer">Admit</button></div></template></div></template><template data-for="{{people}}" data-as="p"><div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #ECECE6"><span style="flex: 1; font-size: 14.5px; font-weight: 600">{{p.name}}</span><span style="font-size: 12.5px; color: #62676F">{{p.role}}</span></div></template></template></div><template data-if="{{pChat}}"><div style="display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #ECECE6"><label for="lrmsg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the room</label><input id="lrmsg" value="{{draft}}" onChange="{{setDraft}}" onKeyDown="{{draftKey}}" placeholder="Message the room…" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; border-radius: 999px"><button type="button" aria-label="Send" onClick="{{send}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; cursor: pointer">→</button></div></template></aside>
</div>

<template data-if="{{uxOpen}}"><div style="position: fixed; inset: 0; z-index: 95; box-sizing: border-box; padding: 16px; background: rgba(20,22,26,0.5); display: flex; align-items: center; justify-content: center"><section role="dialog" aria-modal="true" aria-labelledby="ux-h" style="width: 100%; max-width: 500px; max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; padding: 22px 24px; border-radius: 20px; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px"><h2 id="ux-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.15">{{uxTitle}}</h2><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F444C">{{uxText}}</p><template data-if="{{uxHasItems}}"><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column"><template data-for="{{uxItems}}" data-as="i"><li style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #ECECE6"><span style="font-size: 14.5px; font-weight: 600">{{i.t}}</span><span style="font-size: 13px; color: #62676F">{{i.d}}</span></li></template></ul></template><template data-if="{{uxShowFields}}"><div style="display: flex; flex-direction: column; gap: 10px"><template data-for="{{uxFields}}" data-as="x"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600">{{x.label}}<template data-if="{{x.isInput}}"><input type="{{x.type}}" value="{{x.v}}" onChange="{{x.set}}" placeholder="{{x.ph}}" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></template><template data-if="{{x.isArea}}"><textarea rows="3" value="{{x.v}}" onChange="{{x.set}}" placeholder="{{x.ph}}" style="min-height: 88px; box-sizing: border-box; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px"></textarea></template></label></template></div></template><span role="status" style="font-size: 13px; color: #92400E">{{uxErr}}</span><div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{uxClose}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{uxCloseLabel}}</button><template data-if="{{uxHasGo}}"><button type="button" onClick="{{uxGo}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{uxGoLabel}}</button></template><template data-if="{{uxHasLink}}"><a href="{{uxHref}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-size: 14px; font-weight: 700; text-decoration: none">{{uxLinkLabel}}</a></template></div></section></div></template>
<template data-if="{{uxToastOn}}"><div role="status" style="position: fixed; right: 16px; top: 88px; z-index: 96; max-width: min(420px, calc(100% - 32px)); box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: #14161A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; box-shadow: 0 16px 30px -16px rgba(0,0,0,0.6)"><span style="flex: 1">{{uxToast}}</span><button type="button" onClick="{{uxToastClose}}" style="flex: none; min-height: 36px; padding: 0 8px; border: none; background: transparent; color: #AFD0FF; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Dismiss</button></div></template>
</div>
</template>
<script>

class Component extends DCLogic {
