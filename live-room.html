<template id="dc-LiveRoom">

<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px clamp(16px, 3vw, 28px)">
<section aria-label="Room" style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><template data-if="{{sharing}}"><div style="border-radius: 18px; background: #FFFFFF; color: #14161A; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #62676F">{{shareWho}} is sharing a screen</span><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">Ratio table: chapati for the whole class</span><div style="overflow-x: auto"><table style="border-collapse: collapse; font-size: 15px"><tbody><tr><th scope="row" style="text-align: left; padding: 8px 14px; border: 1px solid #E2E2DA; background: #FBFBF8">Chapati</th><td style="padding: 8px 14px; border: 1px solid #E2E2DA">8</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">16</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">20</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">40</td></tr><tr><th scope="row" style="text-align: left; padding: 8px 14px; border: 1px solid #E2E2DA; background: #FBFBF8">Cups of flour</th><td style="padding: 8px 14px; border: 1px solid #E2E2DA">3</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA">6</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA; background: #FEF1D9">?</td><td style="padding: 8px 14px; border: 1px solid #E2E2DA; background: #FEF1D9">?</td></tr></tbody></table></div></div></template><div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px"><template data-for="{{tiles}}" data-as="t"><div style="position: relative; min-height: 150px; border-radius: 16px; overflow: hidden; background: {{t.bg}}; border: 2px solid {{t.bd}}; display: flex; align-items: center; justify-content: center"><template data-if="{{t.hasImg}}"><img src="{{t.img}}" alt="" style="width: 84px; height: 84px; border-radius: 50%; object-fit: cover; background: #1D2126"></template><template data-if="{{t.noImg}}"><span aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; background: {{t.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700">{{t.ini}}</span></template><span style="position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-size: 12.5px; font-weight: 600">{{t.name}}{{t.tag}}</span><template data-if="{{t.hand}}"><span style="position: absolute; right: 10px; top: 10px; padding: 4px 10px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700">Hand raised</span></template><template data-if="{{t.muted}}"><span style="position: absolute; right: 10px; bottom: 10px; padding: 4px 8px; border-radius: 999px; background: rgba(11,13,16,0.78); color: #FFFFFF; font-size: 11.5px">Muted</span></template></div></template></div><div role="toolbar" aria-label="Room controls" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; border-radius: 18px; background: #14171B"><template data-for="{{controls}}" data-as="c"><button type="button" aria-pressed="{{c.on}}" onClick="{{c.go}}" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 76px; min-height: 60px; padding: 6px 10px; border-radius: 14px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg>{{c.label}}</button></template><a href="{{backHref}}" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 76px; min-height: 60px; padding: 6px 10px; border-radius: 14px; background: #B91C1C; color: #FFFFFF; font-size: 12px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c5-4 13-4 18 0l-2.5 3-3.5-1.5V14c-2-.6-4-.6-6 0v2.5L5.5 18z"/></svg>Leave</a></div></section>

der: 1px solid #14161A; background: transparent; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{saveLabel}}</button><span role="status" style="font-size: 13px; color: #115E59">{{saveMsg}}</span></template><template data-if="{{pPeople}}"><template data-for="{{people}}" data-as="p"><div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #ECECE6"><span style="flex: 1; font-size: 14.5px; font-weight: 600">{{p.name}}</span><span style="font-size: 12.5px; color: #62676F">{{p.role}}</span></div></template></template></div><template data-if="{{pChat}}"><div style="display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #ECECE6"><label for="lrmsg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the room</label><input id="lrmsg" value="{{draft}}" onChange="{{setDraft}}" onKeyDown="{{draftKey}}" placeholder="Message the room…" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFC6; background: #FFFFFF; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 14px; border-radius: 999px"><button type="button" aria-label="Send" onClick="{{send}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: #F9A826; color: #14161A; cursor: pointer">→</button></div></template></aside>
</div>
</div>
</template>
<script>

class Component extends DCLogic {

  svDict() { return {"en": {"navHow": "How the system works", "navPricing": "Pricing", "navAbout": "About", "abWp": "White paper", "abWpD": "The full argument and the evidence", "abBlog": "Blog", "abBlogD": "The Vachuo Journal", "abNews": "Newsroom", "abNewsD": "News, press kit and channels", "abCar": "Careers", "abCarD": "Build the school with us", "abVis": "Vision, mission & values", "abVisD": "Why we exist and how we work", "signIn": "Sign in", "access": "Request early access", "darkMode": "Dark mode", "home": "Vachuo home", "tagline": "The operating system for individualised learning.", "fProduct": "Product", "fTour": "Product tour", "fLoop": "The loop inside Vachuo", "fCopilot": "Parent copilot", "fStart": "Get started", "fSetup": "Set up a learner", "fLearn": "Learn", "fToday": "Today", "fTutor": "My tutor", "fMap": "My learning map", "fClasses": "My classes", "fAssess": "My assessments", "fPortfolio": "Portfolio", "fCommunity": "Community", "fClubs": "Clubs", "fShowcase": "Showcase", "fConnects": "Connects", "fTrust": "Trust and safety", "fSafety": "Children’s safety", "fPrivacyAI": "AI and data privacy", "fApprovals": "How approvals work", "fAbout": "About", "fSupport": "Support", "fPress": "Press kit", "fFollow": "Follow Vachuo", "terms": "Terms of use", "privacy": "Privacy policy", "cookies": "Cookie choices", "language": "Language", "help": "Help", "contact": "Contact", "policies": "Help and policies", "swNotice": "", "ckTitle": "Cookie choices", "ckBody": "Vachuo uses essential cookies to keep you signed in and remember your settings. With your permission we would also use analytics cookies to learn which pages help families most. We never use advertising cookies.", "ckEss": "Essential only", "ckAll": "Allow analytics", "ckChoose": "Choose", "ckEssT": "Essential", "ckEssD": "Sign-in, security, and your theme and language.", "ckAlways": "Always on", "ckAnaT": "Analytics", "ckAnaD": "Counts of page visits that don’t identify you. Off unless you turn it on.   siteVals() {
    if (this._svOn === undefined) {
      this._svOn = true; this._svD = this.svDict();
      let lg = 'en', ck = null;
      try { if (window.localStorage.getItem('vachuo-lang') === 'sw') lg = 'sw'; } catch (e) {}
      try { ck = JSON.parse(window.localStorage.getItem('vachuo-cookies') || 'null'); } catch (e) {}
      this._svLg = lg; this._svCk = ck; this._svPanel = false; this._svAna = !!(ck && ck.analytics);
      const save = (k, v) => { try { window.localStorage.setItem(k, v); } catch (e) {} };
      const setLang = (l) => { this._svLg = l; save('vachuo-lang', l); this.forceUpdate(); };
      const setCk = (a) => { this._svCk = { analytics: a, decided: true }; this._svAna = a; this._svPanel = false; save('vachuo-cookies', JSON.stringify(this._svCk)); this.forceUpdate(); };
      this._svSync = (e) => {

      };

      svEnOn: sw ? 'false' : 'true', svSwOn: sw ? 'true' : 'false',

  themeVals() {

    const people = PEOPLE[mode];

    const clean = (t) => String(t).replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '[hidden]').replace(/(https?:\/\/|www\.)\S+/gi, '[hidden]').replace(/\+?\d[\d\s-]{7,}\d/g, '[hidden]');
    const seed = { class: [['Nduta K.', 'Welcome! Open the ratio table I’m sharing.'], ['Bob', 'Can I ask something about the 20?'], ['Socrates', 'Notes are on. They save to My classes when the class ends.']], club: [['Mzee Kariuki', 'Karibuni! Tunaanza ukurasa wa tatu.'], ['Johari', 'Nimefika!']], checkin: [['Nduta K.', 'Hi Amani! How did the reassessment feel?']] };
