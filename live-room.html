<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vachuo · Live room</title>
<link rel="icon" type="image/png" href="assets/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
@media (min-width:800px){.vside{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lr-ctl:hover{background:#2A2E33}
.vq{display:flex;flex-direction:column;gap:1px;align-self:stretch;box-sizing:border-box;width:100%;margin:0 0 6px;padding:5px 9px;border:none;border-left:3px solid currentColor;border-radius:6px;background:rgba(127,127,127,.14);color:inherit;font-family:Inter,system-ui,sans-serif;font-size:12.5px;line-height:1.35;text-align:left;white-space:normal;cursor:pointer}div.vq{cursor:default}.vq .vq-w{font-weight:600;opacity:.8}.vq .vq-t,.vq-bar .vq-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vq .vq-t{opacity:.92}.vq:focus-visible,.vq-rb:focus-visible,.vq-x:focus-visible{outline:2px solid #1D4ED8;outline-offset:2px}.vq-rb{display:inline-flex;align-items:center;min-height:28px;padding:0 6px;border:none;border-radius:999px;background:transparent;color:#1E40AF;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600;cursor:pointer}.vq-rb:hover{background:#F4F7FE}.vq-bar{display:flex;align-items:flex-start;gap:8px;padding:7px 6px 7px 10px;border-left:3px solid #1D4ED8;border-radius:8px;background:#F4F7FE;color:#14161A;font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.4}.vq-bar .vq-w{font-weight:600}.vq-bar .vq-t{color:#3F444C}.vq-x{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:transparent;color:#3F444C;font-size:17px;line-height:1;cursor:pointer}.vq-x:hover{background:rgba(127,127,127,.18)}[data-theme="dark"] .vq-bar{background:#1B2333;color:#EDEDE8}[data-theme="dark"] .vq-bar .vq-t{color:#C9CCD1}[data-theme="dark"] .vq-rb{color:#AFD0FF}[data-theme="dark"] .vq-rb:hover{background:#22262D}[data-theme="dark"] .vq-x{color:#C9CCD1}
</style>
<script src="assets/js/dc.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-LiveRoom">
<div data-theme="{{uiTheme}}" lang="en" style="height: 100vh; min-height: 760px; display: flex; flex-direction: column; background: #0B0D10; color: #EDEDE8; font-family: Inter, system-ui, sans-serif; overflow: hidden">
<template data-if="{{isPre}}"><div style="flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 32px; padding: 32px clamp(16px, 5vw, 64px); overflow-y: auto"><div style="flex: 1 1 480px; max-width: 720px; display: flex; flex-direction: column; gap: 12px"><template data-for="{{preTile}}" data-as="p"><div style="position: relative; aspect-ratio: 16 / 9; width: 100%; max-height: 100%; border-radius: 12px; overflow: hidden; background: #1A1D20; border: 2px solid {{p.bd}}; box-sizing: border-box; min-width: 0"><template data-if="{{p.showImg}}"><img src="{{p.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></template><template data-if="{{p.showIni}}"><span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28%; max-width: 110px; aspect-ratio: 1; border-radius: 50%; background: {{p.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 3vw, 44px); font-weight: 600">{{p.ini}}</span></span></template><template data-if="{{p.hand}}"><span style="position: absolute; top: 8px; left: 8px; padding: 3px 9px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700">✋ Hand raised</span></template><template data-if="{{p.hasReact}}"><span aria-label="Reaction" style="position: absolute; top: 6px; right: 10px; font-size: 40px">{{p.react}}</span></template><span style="position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.62); color: #FFFFFF; font-size: 13.5px; font-weight: 600"><template data-if="{{p.muted}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg></template><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span><span style="font-weight: 400; color: #C9CCD0; white-space: nowrap">{{p.tag}}</span></span></div></template><div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px"><template data-for="{{preCtl}}" data-as="c"><button type="button" aria-pressed="{{c.pressed}}" aria-disabled="{{c.dis}}" title="{{c.tip}}" onClick="{{c.go}}" style="position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 74px; min-height: 58px; padding: 6px 8px; border: none; border-radius: 10px; background: {{c.bg}}; color: {{c.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 500; cursor: pointer; opacity: {{c.op}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg><span style="white-space: nowrap">{{c.label}}</span><template data-if="{{c.hasBadge}}"><span style="position: absolute; top: 4px; right: 12px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center">{{c.badge}}</span></template></button></template></div></div><div style="flex: 1 1 340px; max-width: 460px; display: flex; flex-direction: column; gap: 14px"><a href="{{backHref}}" style="align-self: flex-start; color: #AFD0FF; font-size: 14px; font-weight: 600; text-decoration: none">← {{backLabel}}</a><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F9C66B">{{modeLabel}}</span><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3vw, 42px); line-height: 1.08; font-weight: 600">{{title}}</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #C9CCD0">{{sub}}</p><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px"><template data-for="{{checks}}" data-as="k"><li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45; color: #DADDE1"><span aria-hidden="true" style="color: #4ADE80; font-weight: 700">✓</span>{{k.t}}</li></template></ul><p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #1A1D20; border: 1px solid #2A2E33; font-size: 14px; line-height: 1.5; color: #DADDE1">{{preNote}}</p><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><button type="button" onClick="{{join}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">{{joinLabel}}</button><div role="group" aria-label="Viewing as" style="display: inline-flex; padding: 3px; border-radius: 999px; background: #1A1D20; border: 1px solid #2A2E33"><template data-for="{{roleOpts}}" data-as="o"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 34px; padding: 0 12px; border: none; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{o.label}}</button></template></div></div></div></div></template>
<template data-if="{{isLeft}}"><div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px"><div role="status" style="max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center"><span style="font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1.1">{{leftTitle}}</span><p style="margin: 0; font-size: 15.5px; line-height: 1.55; color: #C9CCD0">{{leftText}}</p><div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px"><template data-if="{{canRejoin}}"><button type="button" onClick="{{rejoin}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #F9A826; background: #F9A826; color: #14161A; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Rejoin</button></template><a href="{{backHref}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A2E33; background: transparent; color: #EDEDE8; font-family: Inter, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 48px; text-decoration: none">{{backLabel}}</a></div></div></div></template>
<template data-if="{{isIn}}"><div style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column"><header style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; border-bottom: 1px solid #1F2328"><a href="{{backHref}}" aria-label="{{backLabel}}" title="{{backLabel}}" style="flex: none; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #EDEDE8; background: #1A1D20; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><span title="Supervised room: contact details are hidden, recording is off" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #0F2A1E; color: #4ADE80; font-size: 12px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>Supervised</span><div style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px"><h1 style="margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</h1><span style="font-size: 12.5px; color: #A3A8AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sub}}</span></div><span style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; background: #1A1D20; font-family: ui-monospace, Menlo, monospace; font-size: 13px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #4ADE80"></span>{{clock}}</span><span style="font-size: 12.5px; color: #A3A8AE">{{countText}}</span><div role="group" aria-label="Layout" style="display: inline-flex; padding: 3px; border-radius: 999px; background: #1A1D20; border: 1px solid #2A2E33"><template data-for="{{viewOpts}}" data-as="o"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 34px; padding: 0 12px; border: none; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{o.label}}</button></template></div><div role="group" aria-label="Viewing as" style="display: inline-flex; padding: 3px; border-radius: 999px; background: #1A1D20; border: 1px solid #2A2E33"><template data-for="{{roleOpts}}" data-as="o"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 34px; padding: 0 12px; border: none; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer">{{o.label}}</button></template></div></header><template data-if="{{roleBannerOn}}"><p role="note" style="flex: none; margin: 0; padding: 8px 14px; background: #1E2A44; color: #CFE0FF; font-size: 13.5px; line-height: 1.45">{{roleBanner}}</p></template><template data-if="{{pausedOn}}"><p role="alert" style="flex: none; margin: 0; padding: 10px 14px; background: #4A2A06; color: #FDE3B8; font-size: 14px; font-weight: 600">This room is paused by a Vachuo moderator. Everyone’s audio and video are held. A guide will explain what happens next.</p></template><div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap"><main aria-label="Meeting stage" style="flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px"><template data-if="{{hasNote}}"><div role="status" style="position: absolute; z-index: 5; top: 16px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 10px 16px; border-radius: 12px; background: #EDEDE8; color: #0B0D10; font-size: 14px; font-weight: 600; box-shadow: 0 16px 30px -16px rgba(0,0,0,0.8)">{{roomNote}}</div></template><template data-if="{{lobbyToast}}"><div role="status" style="position: absolute; z-index: 5; right: 16px; top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 12px; background: #EDEDE8; color: #0B0D10; font-size: 14px; box-shadow: 0 16px 30px -16px rgba(0,0,0,0.8)"><span><strong>Kim</strong> is in the waiting room</span><button type="button" onClick="{{admitKim}}" style="min-height: 34px; padding: 0 12px; border: none; border-radius: 999px; background: #0B0D10; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">Admit</button><button type="button" onClick="{{openPeople}}" style="min-height: 34px; padding: 0 10px; border: none; background: transparent; color: #1E40AF; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">See waiting room</button></div></template><template data-if="{{isShare}}"><div style="flex: none; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px"><template data-for="{{tiles}}" data-as="t"><div style="flex: 0 0 176px"><div style="position: relative; aspect-ratio: 16 / 9;  border-radius: 12px; overflow: hidden; background: #1A1D20; border: 2px solid {{t.bd}}; box-sizing: border-box; min-width: 0"><template data-if="{{t.showImg}}"><img src="{{t.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></template><template data-if="{{t.showIni}}"><span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28%; max-width: 110px; aspect-ratio: 1; border-radius: 50%; background: {{t.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 1.6vw, 26px); font-weight: 600">{{t.ini}}</span></span></template><template data-if="{{t.hand}}"><span style="position: absolute; top: 8px; left: 8px; padding: 3px 9px; border-radius: 999px; background: #F9A826; color: #14161A; font-size: 12px; font-weight: 700">✋ Hand raised</span></template><template data-if="{{t.hasReact}}"><span aria-label="Reaction" style="position: absolute; top: 6px; right: 10px; font-size: 26px">{{t.react}}</span></template><span style="position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px; max-width: calc(100% - 16px); padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.62); color: #FFFFFF; font-size: 12px; font-weight: 600"><template data-if="{{t.muted}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg></template><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.name}}</span><span style="font-weight: 400; color: #C9CCD0; white-space: nowrap">{{t.tag}}</span></span></div></div></template></div><div style="flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #FFFFFF; color: #14161A"><div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0F2A1E; color: #4ADE80; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg><span>{{shareWho}}</span><template data-if="{{canStopShare}}"><button type="button" onClick="{{stopShare}}" style="margin-left: auto; min-height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: #DC2626; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer">Stop share</button></template></div><div style="flex: 1; min-height: 0; overflow: auto; padding: clamp(16px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px; font-family: 'EB Garamond', Garamond, Georgia, serif"><span style="font-size: clamp(22px, 2.4vw, 32px); font-weight: 600">{{shareTitle}}</span><template data-if="{{shareIsTable}}"><div style="overflow-x: auto"><table style="border-collapse: collapse; font-family: Inter, system-ui, sans-serif; font-size: clamp(15px, 1.6vw, 22px)"><tbody><template data-for="{{shareRows}}" data-as="r"><tr><th scope="row" style="text-align: left; padding: 10px 16px; border: 1px solid #CFCFC6; background: #F4F4EF">{{r.h}}</th><template data-for="{{r.cells}}" data-as="x"><td style="padding: 10px 22px; border: 1px solid #CFCFC6; text-align: center; font-weight: 600; background: {{x.bg}}">{{x.v}}</td></template></tr></template></tbody></table></div></template><p style="margin: 0; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.5; color: #3F444C">{{shareText}}</p></div></div></template><template data-if="{{isSpeaker}}"><div style="flex: none; display: flex; justify-content: center; gap: 8px; overflow-x: auto"><template data-for="{{others}}" data-as="t"><div style="flex: 0 0 168px"><div style="position: relative; aspect-ratio: 16 / 9;  border-radius: 12px; overflow: hidden; background: #1A1D20; border: 2px solid {{t.bd}}; box-sizing: border-box; min-width: 0"><template data-if="{{t.showImg}}"><img src="{{t.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></template><template data-if="{{t.showIni}}"><span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28%; max-width: 110px; aspect-ratio: 1; border-radius: 50%; background: {{t.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 1.6vw, 2
