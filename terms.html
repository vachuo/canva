<div style="display: flex; flex-direction: column; gap: 16px; max-width: 860px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1E40AF">Legal</span><span style="padding: 3px 10px; border-radius: 999px; background: #FEF1D9; color: #78350F; font-size: 12.5px; font-weight: 600">Draft · not yet in force</span></div><h1 style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(44px, 5.2vw, 76px); line-height: 1; letter-spacing: -0.02em; font-weight: 600">Terms of use</h1><p style="margin: 0; font-size: 19px; line-height: 1.55; color: #3F444C">The rules for using Vachuo, written to be read. A parent or guardian agrees to them for the whole family.</p><p style="margin: 0; font-size: 14px; color: #62676F">Last updated <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[DATE]</span> · Applies to vachuo.com and the Vachuo apps</p></div>

<nav aria-label="On this page" class="ltoc" style="flex: 1 1 240px; max-width: 320px; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #62676F">On this page</span><ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-left: 1px solid #E2E2DA; padding-left: 14px"><li><a href="#who" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Who we are</a></li><li><a href="#accounts" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Family accounts and who can use Vachuo</a></li><li><a href="#service" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">What Vachuo does, and what it doesn’t</a></li><li><a href="#approvals" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Approvals and safety rules</a></li><li><a href="#payments" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Payments</a></li><li><a href="#content" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Your child’s work and our content</a></li><li><a href="#use" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Acceptable use</a></li><li><a href="#ending" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Pausing or closing your account</a></li><li><a href="#liability" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Our responsibility to you</a></li><li><a href="#changes" style="display: flex; align-items: center; min-height: 40px; color: #3F444C; text-decoration: none; font-size: 14.5px">Changes, law and disputes</a></li></ol><a href="privacy.html" style="margin-top: 8px; font-size: 14.5px; font-weight: 600">Read the privacy policy</a></nav>
<article style="flex: 999 1 560px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 40px"><section aria-labelledby="short-h" style="padding: 22px 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E2DA; display: flex; flex-direction: column; gap: 12px"><h2 id="short-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 26px; font-weight: 600">The short version</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>A parent or guardian, 18 or over, opens the family account and is responsible for how the family uses Vachuo.</li><li>Learners under 13 use Vachuo only through the family account. They have no login of their own.</li><li>Socrates is an AI tutor. It can be wrong. A mark counts only after a guide has checked it.</li><li>Anything public, paid or in person waits for a guardian’s approval. Jobs are open from 16.</li><li>Your child’s work and Portfolio belong to your child. You can download it or close the account at any time.</li></ul></section><section id="who" aria-labelledby="who-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="who-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Who we are</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Vachuo is run by <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[COMPANY LEGAL NAME]</span>, a company registered in Kenya (company number <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[NUMBER]</span>) at <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[REGISTERED ADDRESS]</span>. In these terms, “we” means that company and “you” means the parent or guardian who holds the family account.</p></section><section id="accounts" aria-labelledby="accounts-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="accounts-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Family accounts and who can use Vachuo</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>Only a parent or legal guardian aged 18 or over can open a family account. You confirm your phone number when you do.</li><li>You add your learners and give consent for each one. You can add a second guardian, who gets the same approvals.</li><li>Learners aged 13 to 17 can have their own sign-in inside your family account. Under-13s sign in through the family account and never have a separate login.</li><li>Guides and schools join under their own agreement with us, as well as these terms.</li><li>Keep your passkey or password private. Tell us straight away if you think someone else has used your account.</li></ul></section><section id="service" aria-labelledby="service-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="service-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">What Vachuo does, and what it doesn’t</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Vachuo plans a learner’s path, teaches through Socrates, collects evidence of what they can do, and keeps you informed. Socrates is an AI tutor and can make mistakes. It does not give answers during assessments, and its marks are suggestions until a guide checks them.</p><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Curriculum comparisons and alignment plans are guidance, not an official decision by any school or exam board. Vachuo is not a source of medical, legal or financial advice.</p></section><section id="approvals" aria-labelledby="approvals-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="approvals-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Approvals and safety rules</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>Plan changes, in-person sessions, purchases, Showcase listings, paid challenges and job applications for under-18s wait for a guardian’s approval.</li><li>Phone numbers, emails and links are hidden in messages and listings. Buyers, sellers and employers message the guardian, never the child.</li><li>Job listings must show the pay and may never charge applicants. Under-18s can only see jobs with shifts of 8 hours or less and no night work.</li><li>Meet in public places only. Never share a home address in a listing.</li></ul></section><section id="payments" aria-labelledby="payments-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="payments-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Payments</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Subscription prices are on the Pricing page and are charged in advance for each period. Showcase payments are held until the buyer confirms receipt, then paid to the guardian. Card and M-Pesa payments are handled by <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[PAYMENTS PROVIDER]</span>. Our refund terms: <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[REFUND TERMS]</span>.</p></section><section id="content" aria-labelledby="content-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="content-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Your child’s work and our content</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Your child owns what they make: drawings, writing, recordings and projects. You give us permission to store it and show it only where your family chooses, for example in the Portfolio or, with your approval, in Showcase. You can take it with you by downloading the Portfolio.</p><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">Lessons, games and other materials on Vachuo are licensed to your family for personal learning. Please don’t copy or resell them.</p></section><section id="use" aria-labelledby="use-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="use-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Acceptable use</h2><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; line-height: 1.6; color: #23272E"><li>No bullying, harassment, hate or sexual content, and nothing that puts a child at risk.</li><li>No sharing other people’s personal details, photos or recordings without permission.</li><li>No trying to get answers during an assessment, or helping someone else do so.</li><li>No automated scraping, reverse engineering or attempts to get around our safety checks.</li></ul></section><section id="ending" aria-labelledby="ending-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="ending-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Pausing or closing your account</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">You can pause or close your family account at any time from Family settings. Download the Portfolio first if you want to keep it. We may suspend an account that breaks these terms or puts a child at risk, and we will tell you why unless the law or a child’s safety prevents it.</p></section><section id="liability" aria-labelledby="liability-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="liability-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Our responsibility to you</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">We work hard to keep Vachuo safe and accurate, but we can’t promise it will always be available or free of errors. Nothing in these terms limits rights you have under the Consumer Protection Act, 2012 or other laws that can’t be excluded. Our full liability terms: <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[LIABILITY CLAUSE, PENDING LEGAL REVIEW]</span>.</p></section><section id="changes" aria-labelledby="changes-h" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 96px"><h2 id="changes-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(26px, 2.4vw, 32px); line-height: 1.15; font-weight: 600">Changes, law and disputes</h2><p style="margin: 0; font-size: 16.5px; line-height: 1.65; color: #23272E">If we change these terms in a way that matters, we will tell you by email and in Parent copilot before the change takes effect. These terms are governed by the laws of Kenya. If you live elsewhere, you keep any consumer rights your local law gives you.</p></section><p style="margin: 0; padding-top: 20px; border-top: 1px solid #E2E2DA; font-size: 14.5px; line-height: 1.55; color: #62676F">Questions about this page: <a href="mailto:hello@vachuo.com">hello@vachuo.com</a>. Items marked like <span style="padding: 1px 6px; border-radius: 6px; background: #FEF1D9; color: #78350F; font-family: ui-monospace, Menlo, monospace; font-size: 14px">[THIS]</span> are details still to be confirmed before this page takes effect.</p></article></div>
