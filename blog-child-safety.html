<article style="max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 24px) 72px; display: flex; flex-direction: column; gap: 22px; font-size: 20px; line-height: 1.65; color: #23272E">

<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Keeping Children Safe in AI-Powered Learning: A Practical Framework</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Regulators on three continents have moved from guidance to enforcement. Safety for children can no longer be added after launch; it has to be designed in from the start.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #F9A826">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.45)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 40px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 12px">
<img src="assets/img/d5b3c1bf64b6df3171cd40d4ea6cd3d7.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/e6c36daf4c6b3251442416ab8a8e61b8.svg" alt="" style="display: block; height: 92%; width: auto">
</div>
</figure>

<p style="margin: 0">For most of the internet’s history, children’s safety online was governed by terms of service, parental controls and hope. That era is ending. In the United Kingdom, Ofcom’s Protection of Children Codes under the Online Safety Act came into force on 25 July 2025, requiring services likely to be accessed by children to assess risks and use highly effective age assurance where harmful content is present. Australia’s social media minimum age of 16 took effect on 10 December 2025. In the United States, amendments to the Children’s Online Privacy Protection Rule reached their compliance date on 22 April 2026. And in September 2025 the Federal Trade Commission opened an inquiry into AI chatbots that act as companions, asking how companies measure and limit harms to children and teenagers.</p>
<p style="margin: 0">Education platforms that use AI sit at the intersection of all of these concerns. They are designed for children, they hold detailed data about them, and they put children in conversation with systems that can be persuasive, wrong or inappropriate. What follows is a practical framework for getting this right.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Start with a map of risk</h2>
<p style="margin: 0">Sonia Livingstone and Mariya Stoilova’s “4Cs” classification offers a useful starting point. Content risks arise from what a child sees; contact risks from who a child interacts with; conduct risks from how a child behaves or is treated by peers; and contract risks from commercial exploitation and data practices. AI adds new variants to each category. A tutor may generate inaccurate or unsuitable content. A chatbot may become a form of contact, fostering emotional reliance. Peer features can expose children to bullying. And the business model behind a free product may depend on data that children cannot meaningfully consent to share.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Design principles</h2>
<p style="margin: 0"><b>Best interests by default.</b> The United Kingdom’s Age Appropriate Design Code, in force since 2021, requires online services likely to be used by children to put the child’s best interests first, starting with high privacy settings, minimal data collection and no nudging towards weaker protections. Australia’s eSafety Commissioner promotes a similar approach, Safety by Design, built on service provider responsibility, user empowerment and transparency.</p>
<p style="margin: 0"><b>A tutor, not a friend.</b> The most important design choice for AI in education may be what the AI is not. A learning companion should be warm and encouraging, but it should not present itself as a friend, invite secrecy, discourage children from talking to the adults in their lives, or optimise for time spent with it. When a conversation moves into areas of distress or danger, it should respond with care and bring in a trusted human rather than trying to handle it alone.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">The safest AI tutor is one that knows when to hand the conversation to a person.</blockquote>
<p style="margin: 0"><b>Know the age without knowing too much.</b> Age assurance is now expected in many contexts, but collecting identity documents from children creates its own risks. Systems should verify age in proportion to risk and with minimal data, and young learners should be able to sign in without an email address or phone number.</p>
<p style="margin: 0"><b>Visibility that grows into autonomy.</b> Parents need to see what matters about their children’s learning and safety. Children also have rights to privacy and a voice that grow with age. A good system makes oversight proportionate: detailed for a seven-year-old, increasingly summarised and consent-based for a sixteen-year-old, and always transparent to the child about what parents can see.</p>
<p style="margin: 0"><b>Test before and after launch.</b> AI systems for children should be tested adversarially for unsafe outputs before release and monitored continuously afterwards, with clear routes for children and parents to report problems and a commitment to act on them.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">When learning leaves the screen</h2>
<p style="margin: 0">Vachuo’s model includes Connects, through which children meet mentors, practitioners and peers in person. That brings the oldest safeguarding questions back into focus. Every adult who teaches through the platform should be identity-verified and checked under local safeguarding law, such as background checks where available. Meetings should take place in public or approved settings, be approved by a parent in advance, and follow clear conduct rules. In Kenya, the Children Act 2022 places the best interests of the child at the centre of decisions affecting children, a principle that should guide design everywhere.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The new frontier</h2>
<p style="margin: 0">Generative AI has also created new forms of abuse. The European Union has agreed to prohibit AI systems that generate child sexual abuse material or non-consensual intimate imagery, with the ban applying from 2 December 2026. Education providers should go further than the law requires: refusing to process children’s images for any purpose beyond what is strictly necessary, and preventing learners’ photographs from being used to train generative models.</p>
<p style="margin: 0">None of these measures is free, and some create friction. But the alternative, trusting that harm will be rare enough to manage after the fact, has already failed children in the first two decades of social media. AI in education has the chance to start differently.</p>
