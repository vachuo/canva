<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Children’s Data in the Age of AI: From Compliance to Custody</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">An AI tutor learns more about a child than any school ever recorded. The law sets a floor. The real question is who holds that knowledge, and for whom.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #F9A826">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.45)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/3131eb41702479241dc132be8c19c769.svg" alt="" style="display: block; height: 92%; width: auto">
<img src="assets/img/59378e91ed7d8157884f7cada1313235.svg" alt="" style="display: block; height: 100%; width: auto">
</div>
</figure>

<p style="margin: 0">A traditional school record contains a few hundred data points a year: attendance, grades, a handful of reports. An adaptive AI tutor can capture that many in an afternoon: every answer and hesitation, every error and correction, what a child asks about, how long they persist, when they give up. From this stream, models can infer far more than whether a child has mastered fractions. They may detect signs of a learning difficulty, changes in mood, gaps in sleep or food, or something about a child’s home life. Learning data, in the age of AI, is among the most intimate data that exists.</p>
<p style="margin: 0">Most of the debate about this data is framed as compliance: what does the law permit? That question matters, and the law is tightening. But it is not enough. The deeper question is one of custody: who holds a child’s learning record, who can use it, and in whose interest.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The legal floor</h2>
<p style="margin: 0">In Europe, Article 8 of the General Data Protection Regulation requires parental consent for online services offered directly to children below a national age threshold set between 13 and 16. Article 22 restricts decisions based solely on automated processing that significantly affect people, and the regulation’s recitals say such decisions should not concern children. The EU AI Act goes further for education specifically. Since 2 February 2025 it has prohibited AI systems that infer the emotions of students in educational institutions, except for medical or safety reasons. It also classifies AI used to admit, assess or place students as high-risk, with obligations for such systems now expected to apply from 2 December 2027.</p>
<p style="margin: 0">In the United States, amendments to the Children’s Online Privacy Protection Rule, with compliance required from 22 April 2026, require separate parental consent before children’s data is disclosed to third parties such as advertisers, and require written policies limiting how long data is kept. The Family Educational Rights and Privacy Act continues to govern student records held by schools and the vendors acting for them. In Kenya, section 33 of the Data Protection Act 2019 requires parental consent to process children’s data and requires that processing protect and advance the child’s rights and best interests.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Why compliance is not enough</h2>
<p style="margin: 0">These laws set important limits, but they share a weakness: they rely heavily on consent and on the good behaviour of data holders. A parent asked to approve a privacy policy in order to let their child learn is not making a free choice. And once data is held by a platform, the child and family usually have limited practical control over what happens to it next, or what happens if the company is sold or fails.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">A child’s learning record should belong to the child, held in trust by the family, and lent to institutions only when it helps.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">A custody model</h2>
<p style="margin: 0">We propose a different starting point. A child’s learning record belongs to the child. Until the child is old enough to manage it, the family holds it in trust. Schools, tutors and platforms are given access for specific purposes and limited periods, and that access can be withdrawn. Several principles follow.</p>
<p style="margin: 0"><b>Collect only what teaching needs.</b> Data minimisation is a legal requirement in many jurisdictions, but it is also a design discipline. If a piece of data does not improve a decision about what or how to teach, it should not be collected.</p>
<p style="margin: 0"><b>Never infer what was not asked.</b> Systems should not attempt to infer emotions, health conditions or family circumstances unless there is a clear, consented purpose and a qualified human involved. When a model detects signs of a possible safeguarding concern, the right response is a carefully designed escalation to a person, not a silent label in a database.</p>
<p style="margin: 0"><b>Process close to the learner.</b> Advances in efficient models make it increasingly possible to run parts of a tutor on the learner’s own device. Federated learning lets models improve from many devices without centralising raw data, and differential privacy, formalised by Cynthia Dwork and colleagues, provides mathematical limits on what aggregate statistics can reveal about any individual.</p>
<p style="margin: 0"><b>Explain to the child.</b> Children have a right to understand, in language suited to their age, what is recorded about them and why. UNICEF’s Policy Guidance on AI for Children makes protecting children’s data and privacy and providing transparency and accountability central requirements.</p>
<p style="margin: 0"><b>Assess before deploying.</b> A data protection impact assessment, required under the GDPR for high-risk processing, should be standard for any AI system used with children, and published wherever possible.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What this means at Vachuo</h2>
<p style="margin: 0">These principles shape our design commitments. The Learning Passport belongs to the learner, who controls who can see it, and it travels with them if they leave. We do not use emotion recognition, sell learner data or use it for advertising. Parents see what matters for their child’s learning and safety, and children can see what their parents see. Data is kept only as long as it serves learning, and families can export or delete it. The promise of AI in education depends on trust, and trust depends on families knowing that what a tutor learns about their child is used for that child and no one else.</p>
