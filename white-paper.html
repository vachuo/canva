<article style="flex: 999 1 560px; min-width: 0; max-width: 740px; display: flex; flex-direction: column">

<section aria-label="Abstract" style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 20px; padding: clamp(22px, 3vw, 32px); display: flex; flex-direction: column; gap: 14px">
<span style="font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #1D4ED8">Abstract</span>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #23272E; text-wrap: pretty">Every child deserves a tutor who knows them: what they understand, what they misunderstand, what they care about and what they are ready for next. For most of history that was a privilege of princes. For the first time, the technology exists to approach it for everyone. But a tutor alone is not an education, and a perfectly efficient tutor could become the most total school ever built.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #23272E; text-wrap: pretty">This paper argues for a different design. Every child is born able to learn, and much schooling teaches the opposite. We propose tools that give learning back: a loop that begins with the learner’s own question and ends in open time that is hers, and that diagnoses, plans, teaches, observes only with consent, assesses, untangles misconceptions, reassesses, updates a learner model she can see and correct, and talks it over with the family. The loop runs over three linked graphs of content, assessment and pedagogy. We then constrain it with ideas far older than software: Socrates’ insistence on questions, Aristotle’s account of habit and flourishing, Dewey’s conviction that education is experience, and Ivan Illich’s warning that schooling teaches us to confuse instruction with learning, John Taylor Gatto’s seven hidden lessons, Josef Pieper’s defence of leisure, Mortimer Adler’s three columns of teaching, Matthew Crawford on the dignity of the hands, Peter Gray on play, and Jacques Rancière’s challenge to every teacher who explains. The result is Vachuo. AI instructs and coaches; people and peers hold the conversation; the learner directs. Connects returns children to the world.</p>
</section>

<section id="primer" aria-labelledby="h-primer" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">01</span>
<h2 id="h-primer" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">The Primer problem</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty"><span aria-hidden="true" style="float: left; font-size: 76px; line-height: 0.82; padding: 6px 10px 0 0; font-weight: 600; color: #1D4ED8">I</span>n Neal Stephenson’s 1995 novel <i>The Diamond Age</i>, an engineer builds a book for a duke’s granddaughter: <i>A Young Lady’s Illustrated Primer</i>. It talks and it listens. It notices what its reader knows and what frightens her, and it folds its lessons into stories cast with the people and objects of her own life. A stolen copy falls into the hands of Nell, a four-year-old in a violent household, and the book raises her into a young woman of extraordinary capability.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Engineers have been chasing the Primer ever since, and most read the novel as a specification: adaptive content, a conversational interface, infinite patience. That reading misses the book’s quieter argument. Nell’s Primer is voiced, night after night, by the same human performer, Miranda, who comes to love a child she has never met. Meanwhile hundreds of thousands of mass-produced copies raise a generation of abandoned girls who become, in the story, an army devoted to Nell. The technology is the same in both cases. What differs is whether a person who cares is present, and whom the learning ultimately serves.</p>
<p style="margin: 8px 0; padding: 24px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: clamp(24px, 2.4vw, 30px); line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center; text-wrap: balance">The scarce thing is no longer the tutor. It is the school around the tutor.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">This is the Primer problem, and it is now a practical one. Language models can explain, question and adapt. Several companies already offer AI tutors to homeschooling families, and more will. What is scarce is an educational system around the tutor: one that is accurate, that knows a child over years rather than minutes, that keeps people in the places only people can fill, and that leaves the child more free, not less.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Vachuo’s thesis is that this system can be built, and that it must be built with limits. We call it an operating system for individualized K–12 education: a validated content, assessment and pedagogy (CAP) engine; a persistent learner model; autonomous AI teachers; automated school administration; a parent copilot; and human expertise available only when it adds value.</p>
</section>

<section id="schooling" aria-labelledby="h-schooling" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">02</span>
<h2 id="h-schooling" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">What schooling gets wrong</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In 1971 Ivan Illich published <i>Deschooling Society</i>, a short book that remains one of the most radical critiques of education ever written. His central charge was that school teaches its pupils to confuse process with substance: teaching with learning, promotion to the next grade with education, a diploma with competence, and fluency with the ability to say something new. Once that confusion takes hold, people believe that learning is the product of being taught, and that what has not been certified has not been learned.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Illich called the result the hidden curriculum. Children learn that knowledge is a commodity dispensed in measured units by licensed professionals. They learn that worth comes from climbing a ladder of grades, that time in a seat is evidence of growth, and that the right to learn depends on admission to an institution. None of these lessons appears on the timetable. All of them are taught.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">It is easy to read an AI school as Illich’s nightmare perfected: an institution that never closes, observes everything and can certify every keystroke. That risk is real, and sections 03 and 18 answer it directly. But Illich’s critique also cuts the other way. Much of what he condemned, from age-graded cohorts and fixed sequences to seat time and the credentialed monopoly over instruction, exists because until now it was the only way to educate at scale. A system that places each child by what they know rather than how old they are, that measures competence directly instead of inferring it from attendance, and that connects children to the people and things around them could do what Illich asked for. It could separate learning from schooling.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Vachuo is designed as that separation. The test we hold every feature to is simple: <b style="font-weight: 600">does this help a child learn, or does it help an institution manage a child?</b></p>
</section>

<section id="hidden" aria-labelledby="h-hidden" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">03</span>
<h2 id="h-hidden" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">What school teaches without meaning to: Gatto</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">John Taylor Gatto taught in New York City public schools for nearly thirty years and was named the state’s teacher of the year in 1991. In <i>Dumbing Us Down</i> (1992) he listed seven lessons he said he taught every day, whatever the subject: confusion, because facts arrive without connection; class position, because every child is numbered and kept in a place; indifference, because the bell ends every enthusiasm; emotional dependency, because stars and marks bend the will; intellectual dependency, because experts decide what is worth learning; provisional self-esteem, because worth is reported home by others; and that one can’t hide, because a child is always watched.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Gatto’s list is useful to us less as an indictment of teachers, whom he admired, than as an audit. Any learning system can teach these lessons, and a digital one can teach some of them more efficiently than any school: a leaderboard teaches class position, a streak teaches emotional dependency, and a model that observes everything teaches that one cannot hide. We check every Vachuo screen against the seven, and we have removed features that failed: learner leaderboards, star ratings, hours counted on a parent’s view, personality tests and biometrics for children.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In <i>Weapons of Mass Instruction</i> (2008) Gatto argued that genius is common, and that schooling, more than any lack of ability, suppresses it. Our slogan, “Honour every genius”, starts there. His history of how mass schooling came to be is more contested than his classroom observations, and we say so in section 20.</p>
</section>

<section id="leisure" aria-labelledby="h-leisure" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">04</span>
<h2 id="h-leisure" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Leisure, the root of school: Aristotle and Pieper</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The Greek word <i>scholē</i>, from which “school” descends, meant leisure: time free enough to think. In the <i>Politics</i> Aristotle argued that the aim of education is not only to make people useful but to prepare them to use leisure well, and he ranked the activities done for their own sake above those done for the sake of something else.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In 1948 the philosopher Josef Pieper warned that the modern world was becoming one of “total work”, in which every hour must justify itself by its output. Leisure, for Pieper, was not idleness or a break between tasks but an attitude of receptive attention, the condition in which we can see things as they are. A school day that is all task is a curious inheritance from a word that meant its opposite.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Vachuo takes this literally. Open time is the centre of a learner’s week, not what is left over. It is planned first, never scheduled over and never tracked, scored or reported. Families can pledge a weekly minimum. We cannot prove that leisure makes a better learner; we believe it makes a better life, and Aristotle thought that was the point.</p>
</section>

<section id="tools" aria-labelledby="h-tools" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">05</span>
<h2 id="h-tools" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">The lost tools of learning: Sayers, Adler and Montaigne</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In 1947 Dorothy Sayers told an Oxford audience that schools teach subjects but not how to learn, leaving students able to recite and unable to reason, and so open to propaganda. Her remedy was the medieval trivium, grammar, logic and rhetoric, treated not as subjects but as tools, and fitted loosely to stages of a child’s growth: the young love to memorise, adolescents love to argue, older students want to persuade.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Mortimer Adler’s <i>Paideia Proposal</i> (1982) gave the idea a modern form: three columns of teaching. Didactic instruction gives organised knowledge; coaching builds skills such as reading, writing, calculating and judging; and the Socratic seminar enlarges understanding through discussion of ideas. Adler thought the third column mattered most and was the one schools did least. Michel de Montaigne had said it four centuries earlier: better a well-made head than a well-filled one.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Vachuo’s division of labour follows Adler more than it follows the usual “AI instructs, humans motivate”. Socrates instructs and coaches, briefly and on request. Seminars belong to people: guides, elders and peers in the Agora. Every lesson moves through three movements, know it, question it, say it, and a “read it well” tool teaches Adler’s questions for any text.</p>
</section>

<section id="hands" aria-labelledby="h-hands" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">06</span>
<h2 id="h-hands" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Hands and heads: Crawford</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Matthew Crawford left a Washington think tank to repair motorcycles and wrote <i>Shop Class as Soulcraft</i> (2009) about what he found: that manual competence is a demanding form of knowledge, that a running engine is a harder judge than a grade, and that the long retreat from practical education in favour of credentials has impoverished both work and thinking.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Crawford’s point fits Gatto’s and Illich’s: a certificate is a claim, while a fixed engine is evidence. It also corrects a bias in most education technology, which can only see what happens on a screen. Vachuo records making, fixing and apprenticeship as fully as any lesson, puts the work itself and the word of the person who saw it at the front of the Portfolio, and lists apprenticeships and learning placements beside jobs.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Kim, our oldest sample learner, learns electrical engineering partly from Otieno, a solar installer. No model can tell Kim whether his wiring is right. The lamp can.</p>
</section>

<section id="play" aria-labelledby="h-play" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">07</span>
<h2 id="h-play" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Play: Gray and Holt</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The psychologist Peter Gray argues in <i>Free to Learn</i> (2013) that children are built to educate themselves, through curiosity, play and the company of others, and that they do it best in groups of mixed ages, where older children teach younger ones and grow by doing so. He draws on hunter-gatherer childhoods and on decades of observation at a democratic school in Massachusetts.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">John Holt, a teacher, had reached a related conclusion by watching his own pupils. In <i>How Children Fail</i> (1964) he described children who had learned to hunt for the answer the teacher wanted rather than to understand, because they were afraid of being wrong. Fear, not lack of ability, was the problem.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">So Vachuo keeps play free: personal bests instead of leaderboards for children, free-play clubs with no adult agenda, no limits on play in person, mixed-age matching in Connects, and practice games without stars or badges. In assessments, learners predict their result before they see it, and “I don’t know yet” is always an acceptable answer.</p>
</section>

<section id="ignorant" aria-labelledby="h-ignorant" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">08</span>
<h2 id="h-ignorant" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">The ignorant tutor: Rancière</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">In 1818 Joseph Jacotot, a French teacher exiled in Belgium, found himself teaching Flemish-speaking students who knew no French, while he knew no Flemish. He gave them a bilingual edition of a French novel and, through an interpreter, asked them to learn the French from it. They did, and wrote about it in French. Jacques Rancière’s <i>The Ignorant Schoolmaster</i> (1987) draws a radical lesson: all people have equal intelligence, and explanation, however kind, teaches the pupil that understanding must come from a master.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Rancière is the hardest critic of an AI named after Socrates. In the <i>Meno</i>, Socrates already knows the proof, and every question leads the boy toward it. A tutor with an answer key behind every question is still, in Rancière’s word, stultifying, however politely it asks.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">We accept the challenge rather than the name change. Learners can always ask Socrates where it is taking them and why it thinks what it thinks, and every challenge counts as evidence, not defiance. Two of Socrates’ modes hold no answer at all: an Ignorant mode, in which it gives the learner a text, numbers or a map and only asks what she sees, what she thinks of it and what she makes of it; and an Open question mode for questions nobody can settle.</p>
</section>

<section id="ownend" aria-labelledby="h-ownend" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">09</span>
<h2 id="h-ownend" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Knowledge as its own end: Newman and Hitz</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">John Henry Newman argued in <i>The Idea of a University</i> (1852) that knowledge is capable of being its own end: that a cultivated mind is good in itself, not only for what it can be used for. Zena Hitz, who left an academic career for a quieter life of study, makes a modern case in <i>Lost in Thought</i> (2020): that learning for its own sake is a hidden, inward good, and that it is corrupted when it is turned into display, status or a ranking.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Education technology is built to measure, and what it measures it tends to reward. That is a danger to the inner life Newman and Hitz defend. A child who reads about octopuses because she wants to does not need a badge for it, and should not have it turned into evidence for a skill.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">So some learning in Vachuo belongs to no one but the learner. Any skill or entry can be kept to oneself and never reaches the model, a guide or a parent. The Portfolio has a private shelf of things learned for no reason. The paper’s other chapters are about learning that counts; this one is about learning that does not have to.</p>
</section>

<section id="socrates" aria-labelledby="h-socrates" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">10</span>
<h2 id="h-socrates" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Learning as inquiry: Socrates</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Socrates wrote nothing, and he had a reason. In Plato’s <i>Phaedrus</i> he complains that written words seem intelligent, but when you question them they always give “one unvarying answer.” A book cannot notice that its reader has misunderstood, and it cannot ask what she meant. For twenty-four centuries every educational technology, from the scroll to the textbook to the video lecture, has shared that limitation.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Conversational AI is the first technology that answers back. That makes the Socratic method, long reserved for small seminars and expensive tutors, available at scale for the first time. The method has two movements. The first, the <i>elenchus</i>, leads a learner to discover a contradiction in what she believes. The second, which Socrates compares in the <i>Theaetetus</i> to the work of a midwife, helps her bring a better idea to birth by herself.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The most famous demonstration is in Plato’s <i>Meno</i>. Socrates questions an enslaved boy about how to double the area of a square. The boy answers confidently that you double the side, which is a proportional misconception, and Socrates does not correct him. He asks questions until the boy sees for himself that doubling the side quadruples the area, then guides him toward the diagonal. Vachuo’s tutor does the same thing with an eleven-year-old who adds when she should multiply. It chooses a case she already trusts, lets her find the contradiction, and only then shows her the double number line.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Socrates also warned of a danger. The same dialogue predicts that readers of books will have “the show of wisdom without the reality.” A fluent machine that produces answers on demand raises that risk at far greater scale. So Vachuo’s tutor asks more than it tells. It verifies understanding through transfer and application rather than accepting a confident reply, and it never treats a correct answer as proof of comprehension. The open-source Primer project (primer-ai.org) puts the principle plainly: it teaches by asking. We agree.</p>
</section>

<section id="aristotle" aria-labelledby="h-aristotle" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">11</span>
<h2 id="h-aristotle" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Learning as habit and flourishing: Aristotle</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Aristotle offers two correctives to a purely conversational picture of learning. The first concerns practice. In the <i>Nicomachean Ethics</i> he argues that we acquire excellences the way we acquire crafts: we become builders by building and harpists by playing the harp. Understanding a ratio in conversation is not the same as reasoning proportionally when you scale a recipe for forty, cut a shirt pattern or read a map. Competence is a disposition built through repeated, varied use. That is why Vachuo counts evidence from projects, workshops and real tasks, and why it does not mark a skill as shown until it has been demonstrated in more than one way.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The second concerns purpose. For Aristotle the aim of education is neither employability nor obedience but <i>eudaimonia</i>, a flourishing life lived well among others. The capacity that matters most for such a life, <i>phronesis</i> or practical wisdom, cannot be delivered as content. It grows from experience, under the eye of people who already have it. Aristotle himself spent years as tutor to the young Alexander of Macedon, the archetype of the private tutor that every adaptive learning system is trying to democratize. What Aristotle could offer one prince, we want to offer every child. But the part of his tutoring that formed character was never the syllabus.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Modern evidence supports both halves of the argument. In 1984 Benjamin Bloom reported that students tutored one-to-one with mastery learning performed about two standard deviations above students taught conventionally: the “two sigma problem” that has shaped educational technology ever since. Later reviews of rigorous trials find smaller but still substantial effects from tutoring. Individual attention combined with mastery works. Why it works is less settled, and much of the answer appears to be relational. We design accordingly.</p>
</section>

<section id="dewey" aria-labelledby="h-dewey" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">12</span>
<h2 id="h-dewey" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Learning as experience: John Dewey</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">John Dewey spent his life arguing that education is not a rehearsal for life but part of it. In <i>My Pedagogic Creed</i> (1897) he wrote that education is “a process of living and not a preparation for future living.” Children learn best, he believed, when inquiry starts from a real problem that matters to them, moves through action and reflection, and ends in understanding they can use. He distinguished experiences that are educative, which open the way to further growth, from those that are mis-educative, which narrow or deaden it.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Dewey gives Vachuo its daily rhythm. A learner’s day begins with her own question: why bridges stand, how recipes scale, why the moon changes shape. The system’s job is to find where that question lives on her map, build a path toward it, and tie the abstract skill to the concrete problem. A child who wants to build a scale-model bridge has a reason to care about ratios that no syllabus can supply.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Dewey also insisted that school is a community, and that education in a democracy must prepare people to share in common life. An individualized system risks sealing children into private tunnels of content. So Vachuo treats peers, families, neighbours and local experts as part of the school, and the rest of this paper turns the loop outward, toward the world.</p>
</section>

<section id="loop" aria-labelledby="h-loop" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">13</span>
<h2 id="h-loop" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">The closed loop</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Everyone will soon have an AI tutor. The lasting advantage is not the tutor but the system that governs it: a closed loop that runs every time a learner engages.</p>
<ol aria-label="The closed loop" style="list-style: none; margin: 4px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-family: Inter, system-ui, sans-serif">
<template data-for="{{loop}}" data-as="s">
<li style="display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 500; background: {{s.bg}}; color: {{s.fg}}"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; opacity: 0.8">{{s.n}}</span>{{s.name}}</li>
</template>
</ol>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Doing this well for one child in one subject is hard. Doing it from kindergarten to grade 12, across every subject, standard, learning level and pedagogy, for millions of learners, is an enormous systems problem. We treat it as three interconnected graphs.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-top: 3px solid #1D4ED8; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 21px; font-weight: 600">Content graph</span><span style="font-size: 17px; line-height: 1.5; color: #3F444C">Not “Grade 5 math” but a network of concepts, each with prerequisites, objectives, standards, examples, misconceptions, difficulty levels and applications.</span></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-top: 3px solid #1684E8; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 21px; font-weight: 600">Assessment graph</span><span style="font-size: 17px; line-height: 1.5; color: #3F444C">Every interaction updates P(student understands skill X). A wrong answer is evidence to be explained, not zero points.</span></div>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-top: 3px solid #0D9488; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 21px; font-weight: 600">Pedagogy graph</span><span style="font-size: 17px; line-height: 1.5; color: #3F444C">What to teach, how, how hard, in which modality and with which example; when to step in, when to review, and when mastery is real.</span></div>
</div>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The assessment graph is where most systems are weakest. A wrong answer might signal a conceptual misconception, a procedural mistake, a prerequisite gap, a misunderstanding of language, a lapse of attention, a calculation error or a guess, and each calls for a different response. Re-teaching a child who made an arithmetic slip wastes her time. Drilling a child who holds a misconception entrenches it. The pedagogy graph is harder still, and it is the least solved problem in the field.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Between these graphs and the child sits a validation layer. Generative models make mistakes, and a school cannot afford to. No lesson reaches a learner as raw model output. Content is generated inside the constraints of a validated curriculum graph, checked against standards and known misconceptions, and tested for validity before use. Mastery requires more than one kind of evidence. Around the loop sit the remaining layers of the system: a knowledge graph and learner model at the core, AI tutor agents that teach within its limits, an AI school manager for planning, records and compliance, human help on demand, and a parent operating system on top.</p>
</section>

<section id="webs" aria-labelledby="h-webs" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">14</span>
<h2 id="h-webs" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Connects: Illich’s learning webs, rebuilt</h2>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(220px, 30vw, 300px); border-radius: 22px; overflow: hidden; background: #0D9488">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 10px">
<img src="assets/img/028366707734272954ecc6309a373201.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/d21e7783f1935f06ae9fa2d66914be3f.svg" alt="" style="display: block; height: 87%; width: auto">
</div>
</figure>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Illich did more than criticize. He proposed an alternative: learning webs that would let anyone find the resources, people and partners they needed, without passing through a school. He described four networks. In 1971 they required infrastructure that did not exist. Today they need little more than a phone, a map and a model that understands what each learner is trying to learn.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px">
<li style="background: #DDF4F1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #115E59">NETWORK 1</span><span style="font-size: 23px; font-weight: 600; color: #134E4A">Resource services</span><span style="font-size: 17.5px; line-height: 1.5; color: #1F3B39">Access to the things and processes of learning: tools, books, laboratories, workshops, farms, markets and museums, many of which sit idle or behind institutional walls. Vachuo maps them and links each to the skills it can teach. A tailoring workshop is a lesson in ratio and geometry.</span></li>
<li style="background: #DDF4F1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #115E59">NETWORK 2</span><span style="font-size: 23px; font-weight: 600; color: #134E4A">Skill exchanges</span><span style="font-size: 17.5px; line-height: 1.5; color: #1F3B39">Directories where people list the skills they will teach and on what terms, often in exchange for something they want to learn. A solar installer teaches wiring in return for reading help for his son; a sixteen-year-old teaches coding in return for Kiswahili practice.</span></li>
<li style="background: #DDF4F1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #115E59">NETWORK 3</span><span style="font-size: 23px; font-weight: 600; color: #134E4A">Peer-matching</span><span style="font-size: 17.5px; line-height: 1.5; color: #1F3B39">A way for learners to find partners for an inquiry. Vachuo matches on shared questions and on neighbouring positions in the learner model, so two children both close to understanding ratios can learn it together and teach each other.</span></li>
<li style="background: #DDF4F1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #115E59">NETWORK 4</span><span style="font-size: 23px; font-weight: 600; color: #134E4A">Educator directory</span><span style="font-size: 17.5px; line-height: 1.5; color: #1F3B39">A directory of professionals, para-professionals and independent educators, Illich’s educators-at-large, whose experience can guide, critique and inspire: a retired surveyor, a hydrologist, a master craftsperson, a Vachuo guide.</span></li>
</ol>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The loop and Connects meet in one place: evidence. When a learner scales a pattern in a workshop or builds a rain gauge with peers, she, her host or her partners can record what happened, and her learner model updates as it would after any lesson. But only if she wants it to. Learning that happens in the world belongs to the learner first.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Children meeting adults outside the home demands serious safeguards, and Illich’s fully open webs would not pass a modern child-protection review. Vachuo’s webs are open in spirit and careful in practice. Hosts are identity-verified and background-checked, a parent approves every in-person meeting for learners under eighteen, and meetings happen in groups or public places.</p>
</section>

<section id="people" aria-labelledby="h-people" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">15</span>
<h2 id="h-people" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">People where people matter</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The most important lesson from today’s AI-first schools is that even the strongest believers in AI instruction keep adults. They change the adult’s role from teacher to guide. AI may soon handle content, explanation, assessment, grading, planning and administration better than most people can at scale. It is much further from answering the question every child eventually asks: why should I care about this today?</p>
<p style="margin: 8px 0; padding: 24px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: clamp(24px, 2.4vw, 30px); line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center; text-wrap: balance">AI instructs and coaches. People and peers hold the conversation: mentorship, relationships and meaning. The learner directs both.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Motivation is the layer most competitors underestimate, and it is where Dewey, Aristotle and <i>The Diamond Age</i> agree. Learning is sustained by relationships, by interest, and by the sense that someone notices. So we do not sell “no teachers.” We sell a division of labour. Every Vachuo learner has a named guide, close to what Illich called a pedagogical counsellor, whose job is not to deliver lessons but to know the child, help with big decisions and show up on bad days.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The same insight governs product design. Like the open Primer project, which commits never to maximize engagement, Vachuo has no feeds, streaks, points or manipulative notifications. Its north-star metric is not time on the platform. It is the learner’s growing ability to direct her own learning.</p>
</section>

<section id="family" aria-labelledby="h-family" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">16</span>
<h2 id="h-family" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">The family and the copilot</h2>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(220px, 30vw, 300px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 16px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 4px">
<img src="assets/img/0a1435c5059775e636726ec8ea6ae1bf.svg" alt="" style="display: block; height: 75%; width: auto">
<img src="assets/img/267b7a442640f30304c2f6baf1e79fcb.svg" alt="" style="display: block; height: 89%; width: auto">
<img src="assets/img/34ca7e8b43fa2c9e35ef5770834dbd3e.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/23ceaff40668bb318aa5bfebe6cc7af9.svg" alt="" style="display: block; height: 92%; width: auto">
</div>
</figure>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Homeschooling parents hold two jobs at once: teacher and principal. Most products help with neither. They show analytics (a percentage per subject, a count of completed lessons) and leave the interpretation to an exhausted parent. Vachuo’s Parent Copilot behaves instead like a good principal reporting to a family. It explains what happened, says what it has already done, and asks only when a parent’s judgment is needed.</p>
<div style="background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px; padding: clamp(18px, 3vw, 26px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #1E40AF; background: #E4ECFD; padding: 3px 10px; border-radius: 999px">No action needed</span>
<p style="margin: 0; font-size: 19px; line-height: 1.55; font-style: italic; color: #23272E">Bob mastered multiplication this week but is repeatedly confusing division remainders. His confidence drops when word problems contain more than two steps. Vachuo has therefore adjusted next week’s learning path and inserted three short prerequisite lessons. No intervention is required from you right now.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #ECECE6">
<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #92400E; background: #FEF1D9; padding: 3px 10px; border-radius: 999px">Your call</span>
<p style="margin: 0; font-size: 19px; line-height: 1.55; font-style: italic; color: #23272E">Johari has been avoiding writing assignments for four days. Academically she can perform them, so this appears behavioral rather than a knowledge gap. Would you like Vachuo to adjust her projects around her interest in animals, schedule a 10-minute conversation with you, or connect her with a writing coach?</p>
</div>
</div>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The copilot is bounded by the child’s dignity. Parents see learning (progress, plans and decisions), not surveillance. Unscheduled time is never tracked, children can read everything the copilot says about them, and oversight recedes as independence grows. By the time a learner reaches university, she shares with her family only what she chooses.</p>
</section>

<section id="passport" aria-labelledby="h-passport" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">17</span>
<h2 id="h-passport" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Competence, not credentials</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Illich argued that a society which certifies learning only through schools hands schools a monopoly over opportunity. The diploma becomes a proxy for competence and eventually a substitute for it. Vachuo replaces the transcript with a Portfolio: a record of what the learner can do, with the evidence behind each claim. That evidence can be tutor assessments, real-world demonstrations, peer reviews or endorsements from elders and masters.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The Portfolio records no seat time, rank or age-grade label. It belongs to the learner, anyone she shares it with can verify it, and it leaves with her to any school, programme or employer. Where a regulator or institution requires grades or a transcript, Vachuo generates them from the evidence on request, so the family never has to choose between principle and paperwork.</p>
</section>

<section id="constraints" aria-labelledby="h-constraints" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">18</span>
<h2 id="h-constraints" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Deschooling constraints</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">A closed loop this capable could become the most total school ever built: always on, all-seeing, quietly deciding who a child is. Good intentions are not a sufficient safeguard. We write the limits into the system as constraints that every model, metric and screen must satisfy.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2E2DA; border-radius: 18px">
<template data-for="{{rules}}" data-as="r">
<li style="display: flex; gap: 16px; padding: 16px 20px; border-top: {{r.bt}}">
<span style="flex: none; width: 28px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #92400E; padding-top: 4px">{{r.n}}</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 20px; font-weight: 600">{{r.title}}</span><span style="font-size: 17.5px; line-height: 1.5; color: #3F444C">{{r.text}}</span></span>
</li>
</template>
</ol>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The last constraint borrows Illich’s word from <i>Tools for Conviviality</i> (1973). A convivial tool enlarges what its user can do on her own terms; a manipulative one makes her depend on it. In the novel, the Primer was convivial for Nell and something closer to manipulative for the girls who became an army. The difference lay in choices of design and purpose, and those choices are ours to make.</p>
</section>

<section id="evidence" aria-labelledby="h-evidence" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">19</span>
<h2 id="h-evidence" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">How we will know</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">The AI-education market is full of company-reported usage figures and short of independent evidence that children learn more. Building content and assessment infrastructure is not the same as proving that it works. Vachuo commits to the following:</p>
<ul style="margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 12px; font-size: 19px; line-height: 1.55; color: #23272E">
<li>Pre-registered studies of learning gains, evaluated independently, beginning with our first cohorts and compared against well-matched alternatives.</li>
<li>Measures beyond test scores: transfer to new problems, retention over months, growth in self-direction, and learner wellbeing.</li>
<li>Calibration audits of the learner model. When Vachuo estimates an 85% chance that a child understands a skill, she should succeed about 85% of the time.</li>
<li>Published error rates for generated content and for the validation layer, with a public log of corrections.</li>
<li>Publication of results whether or not they flatter us.</li>
</ul>
</section>

<section id="risks" aria-labelledby="h-risks" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">20</span>
<h2 id="h-risks" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Risks, and how we answer them</h2>
<dl style="margin: 0; display: flex; flex-direction: column">
<template data-for="{{risks}}" data-as="k">
<div style="display: flex; flex-wrap: wrap; gap: 4px 24px; padding: 16px 0; border-top: 1px solid #E2E2DA">
<dt style="flex: 1 1 180px; font-size: 19px; font-weight: 600">{{k.risk}}</dt>
<dd style="flex: 3 1 360px; margin: 0; font-size: 18px; line-height: 1.55; color: #3F444C">{{k.answer}}</dd>
</div>
</template>
</dl>
</section>

<section id="scale" aria-labelledby="h-scale" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">21</span>
<h2 id="h-scale" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">From one family to a nation</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">We begin with homeschooling families because they feel the whole problem at once. They need instruction, administration and guidance together, and they will tell us quickly what fails. But the same infrastructure can serve families, then tutors, microschools, private schools, charter schools and eventually governments. A validated CAP engine with one learner model per child is as useful to a ministry of education as it is to a kitchen table.</p>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Our ambition is to make the best of one-to-one education, once the tutoring of princes, an ordinary public good. In that, at least, Illich and the engineers of the Primer would have agreed: what matters is not who owns the school, but whether every child can reach what she needs to learn.</p>
</section>

<section id="conclusion" aria-labelledby="h-conclusion" style="display: flex; flex-direction: column; gap: 20px; padding-top: 56px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #1D4ED8">22</span>
<h2 id="h-conclusion" style="margin: 0; font-size: clamp(32px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.01em; font-weight: 600">Conclusion</h2>
<p style="margin: 0; font-size: 20px; line-height: 1.65; color: #23272E; text-wrap: pretty">Stephenson imagined a book that could raise a child. We think the better ambition is both humbler and larger: a system that helps every child raise herself. That means a tutor that asks before it tells, a family that knows what matters, mentors who care, peers to learn alongside, a world full of things to learn from, and a record of what she can do that is hers to keep.</p>
<p style="margin: 8px 0 0; padding: 28px 24px; border-radius: 20px; background: #1D4ED8; color: #FFFFFF; font-size: clamp(25px, 2.6vw, 32px); line-height: 1.3; font-style: italic; text-align: center; text-wrap: balance">A Primer for every child, a guide for every Primer, and a web for every guide.</p>
</section>
