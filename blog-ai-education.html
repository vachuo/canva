<article style="max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 24px) 72px; display: flex; flex-direction: column; gap: 22px; font-size: 20px; line-height: 1.65; color: #23272E">

<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #E4ECFD; color: #1E40AF">AI and education</span>
<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">Can AI Tutors Teach? What the First Rigorous Trials Show</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Well-designed AI tutors can produce large gains; poorly designed ones can quietly harm learning. Design is the variable.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 7 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #1D4ED8">
<span style="position: absolute; width: 520px; height: 520px; right: -170px; top: -300px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3)"></span>
<span style="position: absolute; width: 900px; height: 900px; left: -400px; top: -640px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></span>
<span style="position: absolute; left: -25%; right: -25%; bottom: -84px; height: 150px; border-radius: 50%; background: #FBF7EE"></span>
<div style="position: absolute; left: 0; right: 0; top: 22px; bottom: 16px; display: flex; justify-content: center; align-items: flex-end; gap: 8px">
<img src="assets/img/d5b3c1bf64b6df3171cd40d4ea6cd3d7.svg" alt="" style="display: block; height: 92%; width: auto">
<img src="assets/img/267b7a442640f30304c2f6baf1e79fcb.svg" alt="" style="display: block; height: 100%; width: auto">
<img src="assets/img/e1b79eb4952f14718c70fb2b72622cc1.svg" alt="" style="display: block; height: 92%; width: auto">
</div>
</figure>

<p style="margin: 0">In 1984 Benjamin Bloom posed what he called the two sigma problem. Students tutored one-to-one with mastery learning, he reported, performed about two standard deviations above students taught in conventional classes; the average tutored student outperformed roughly 98% of the comparison group. Bloom’s challenge was to find methods of group instruction as effective as tutoring, because tutoring every child was unaffordable. Later research has found smaller average effects than Bloom’s headline figure, but tutoring remains one of the most effective interventions known. Generative AI raises the obvious question: can a machine be the tutor?</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">The first rigorous evidence</h2>
<p style="margin: 0">Until recently the answer rested on speculation and on studies of older adaptive software. That has begun to change. Three studies published in 2025 deserve particular attention because they used randomised designs in real educational settings.</p>
<p style="margin: 0">At Harvard, Gregory Kestin and colleagues randomly assigned physics students to learn material either in an in-class active-learning session led by experienced instructors or with an AI tutor built on research-based pedagogical principles. Students using the AI tutor learned significantly more, with gains more than double those of the comparison, in less time. They also reported feeling more engaged and motivated.</p>
<p style="margin: 0">In Nigeria, a World Bank-supported programme gave secondary students six weeks of after-school English sessions with a GPT-4-based assistant, guided by teachers. The evaluation by Martín De Simone and colleagues found improvements of about 0.3 standard deviations in English, a large effect by the standards of education interventions in low- and middle-income countries, along with gains in digital skills.</p>
<p style="margin: 0">In Turkey, Hamsa Bastani and colleagues ran a field experiment with nearly a thousand high-school mathematics students. One group used a standard GPT-4 chat interface during practice; another used a version designed as a tutor, which gave hints rather than answers. Both groups did much better during practice. But when the AI was removed for the exam, the group that had used the unrestricted assistant scored about 17% lower than the control group, while the tutor group performed about the same as the control. Students with unrestricted access had, it seems, used the AI as a crutch.</p>
<blockquote style="margin: 8px 0; padding: 20px 0; border-top: 1px solid #93BBF3; border-bottom: 1px solid #93BBF3; font-size: 26px; line-height: 1.3; font-style: italic; color: #1E3A8A; text-align: center">The same model can teach or can hollow out learning. The difference is pedagogy, not parameters.</blockquote>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What separates help from harm</h2>
<p style="margin: 0">Read together, these studies point to a clear conclusion: how a model is deployed matters more than which model it is. The successful designs share features. They were built on established pedagogy; they asked questions and offered hints instead of handing over solutions; they kept students doing the cognitive work; and some were embedded in structured settings with human oversight. The harmful design was simply a capable assistant made available to students under pressure to get answers right.</p>
<p style="margin: 0">This fits decades of learning science. Retrieval, effortful problem-solving and self-explanation build durable knowledge; receiving fluent explanations does not. An AI that removes productive struggle can make learning feel easier while making it shallower. Early studies of brain activity during chatbot-assisted essay writing have raised similar concerns about reduced engagement, though they are small and preliminary and deserve caution.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Five design principles</h2>
<p style="margin: 0"><b style="font-weight: 600">Ask before telling.</b> Lead with questions and make the learner produce. <b style="font-weight: 600">Hint, don’t solve.</b> Scaffold in graduated steps and hold back the full solution until the learner has tried. <b style="font-weight: 600">Verify through transfer.</b> Check understanding with new problems and explanations, never by accepting a confident answer. <b style="font-weight: 600">Diagnose before responding.</b> Distinguish misconceptions from missing prerequisites, misreadings and slips. <b style="font-weight: 600">Keep humans in the loop.</b> Teachers, guides and parents should see what the AI is doing and be able to step in.</p>
<p style="margin: 0">These principles are not unique to us. The open-source Primer project, inspired by Neal Stephenson’s fictional tutor, makes similar commitments: ask more than it answers, verify comprehension, and never maximise engagement. Convergence among people who take learning seriously is itself a signal.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">What we still don’t know</h2>
<p style="margin: 0">The evidence is promising but young. Most trials last weeks, not years. Few have tested effects on younger children, for whom UNESCO’s guidance urges caution with generative AI in classrooms below the age of 13. We know little about long-term retention, about effects on motivation and independence over years, or about how AI tutoring interacts with family and school contexts. And we need more trials run independently of the companies whose products are being tested.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Our commitment</h2>
<p style="margin: 0">Vachuo’s tutor is built on these principles, and our learner model tracks whether understanding is real, not merely whether answers were right. We will publish our evaluations, including pre-registered trials with independent partners, and report results that disappoint us as well as those that do not. The two sigma problem may finally be solvable. It will be solved by careful design and honest evidence, not by assuming that a capable model is a good teacher.</p>
