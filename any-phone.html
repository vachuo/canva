.vmenu{position:relative}.vmenu>summary{list-style:none;cursor:pointer}.vmenu>summary::-webkit-details-marker{display:none}
.vm-panel{display:none;position:absolute;left:-14px;top:100%;z-index:60}

@media (hover:hover) and (pointer:fine){.vmenu:hover>.vm-panel{display:flex}}
@media (max-width:640px){.vm-panel{left:auto;right:-8px}}

.vm-panel a:hover{background:#F4F4EF}[data-theme="dark"] .vm-panel a:hover{background:#22262D}
.vfoot a.soc{opacity:.78;transition:opacity .2s ease,background .2s ease}.vfoot a.soc:hover{opacity:1;background:#1A1D20}
@media (prefers-reduced-motion:reduce){.vm-chev{transition:none}}
.vm-right{left:auto;right:-8px}

.vfoot .soc{opacity:.85}.vfoot .soc:hover{opacity:1;background:#1A1D20}

top:4px;border-top:1px solid rgba(127,127,127,.25)}.vs-hdr.vs-open .vs-act>a{flex:1 1 150px;justify-content:center}}

.lb-fp{width:250px;box-sizing:border-box;padding:18px 16px 22px;border-radius:38px 38px 46px 46px;background:#2B2F36;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px rgba(20,22,26,.7)}

.lb-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lb-keys button{min-height:38px;border:none;border-radius:12px;background:#454B55;color:#FFFFFF;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
.lb-keys button:active{background:#5A616C}
.lb-net[aria-pressed="true"]{background:#14161A!important;color:#FFFFFF!important;border-color:#14161A!important}
@keyframes lb-prog{from{background-position:0 0}to{background-position:40px 0}}
.lb-prog{height:8px;border-radius:999px;background:#E2E2DA;overflow:hidden}.lb-prog>span{display:block;height:100%;background:#0F766E;transition:width .3s linear}
[data-theme="dark"] .lb-ph{background:#0F1114;color:#EDEDE8;border-color:#000}
[data-theme="dark"] .lb-in{background:#1B1E23;color:#EDEDE8}[data-theme="dark"] .lb-out{background:#124A3C;color:#EDEDE8}
[data-theme="dark"] .lb-qr{background:#171A1F;border-color:#2B3038}[data-theme="dark"] .lb-qr button{background:#171A1F;color:#5FD3B8;border-color:#5FD3B8}
.lb-txt{min-height:40px;flex:1;min-width:0;box-sizing:border-box;padding:0 12px;border-radius:999px;border:1px solid #CFCFC6;background:#FFFFFF;color:#14161A;font:13px Inter,system-ui,sans-serif}

/* v325-states */[data-pgs-root]:has(.pgs)>:not(.pgs):not(:has(.pgs)):not(footer):not(.vside):not(:has(.vside)):not(.vs-hdr):not(:has(.vs-hdr)):not([data-sf]){display:none!important}@keyframes pgs-sh{0%{background-position:-300px 0}100%{background-position:300px 0}}.pgs-sk{border-radius:14px;background:linear-gradient(90deg,#ECECE6 0,#F6F6F1 50%,#ECECE6 100%);background-size:600px 100%;animation:pgs-sh 1.2s linear infinite}[data-theme="dark"] .pgs-sk{background:linear-gradient(90deg,#1B1E23 0,#262A31 50%,#1B1E23 100%);background-size:600px 100%}.pgs button[aria-pressed="true"]{background:#14161A!important;color:#FFFFFF!important;border-color:#14161A!important}@media (prefers-reduced-motion:reduce){.pgs-sk{animation:none}}

<section aria-labelledby="lb-tbl-h" style="background: #FFFFFF; border-top: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: clamp(32px, 4vw, 56px) clamp(16px, 5vw, 72px); display: flex; flex-direction: column; gap: 16px">
<h2 id="lb-tbl-h" style="margin: 0; font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: clamp(30px, 3.2vw, 44px); font-weight: 600">What works where</h2>
<div style="position: relative; overflow-x: auto; border-radius: 18px; border: 1px solid #E2E2DA">
<table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14.5px">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">How each way of learning compares</caption>
<thead><tr style="background: #F4F4EF; text-align: left"><th scope="col" style="padding: 12px 16px"></th><th scope="col" style="padding: 12px">App, online</th><th scope="col" style="padding: 12px">App, offline</th><th scope="col" style="padding: 12px">WhatsApp</th><th scope="col" style="padding: 12px">SMS</th><th scope="col" style="padding: 12px">USSD</th></tr></thead>
<tbody><template data-for="{{lbRows}}" data-as="r"><tr style="border-top: 1px solid #ECECE6"><th scope="row" style="padding: 12px 16px; text-align: left; font-weight: 600">{{r.k}}</th><td style="padding: 12px">{{r.a}}</td><td style="padding: 12px">{{r.b}}</td><td style="padding: 12px">{{r.c}}</td><td style="padding: 12px">{{r.d}}</td><td style="padding: 12px">{{r.e}}</td></tr></template></tbody>
</table>
</div>
<p style="margin: 0; font-size: 13px; color: #62676F">Data figures are our design targets. Free SMS replies and USSD depend on agreements with mobile networks that are not yet in place. The USSD code shown in the demo is an example; the real one is assigned by the regulator.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; padding-top: 6px">
<div style="padding: 18px; border-radius: 18px; background: #F4F4EF; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Children use a parent’s number</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">Under-13s learn on WhatsApp and SMS through a parent’s phone, and only after the parent says yes.</p></div>
<div style="padding: 18px; border-radius: 18px; background: #F4F4EF; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Numbers stay private</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">Guides never see a family’s phone number. Calls and messages go through Vachuo’s number and are kept for safety review.</p></div>
<div style="padding: 18px; border-radius: 18px; background: #F4F4EF; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">One record everywhere</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">An answer by SMS, USSD or offline lands on the same learning map as one in the app, with the time it was done.</p></div>
<div style="padding: 18px; border-radius: 18px; background: #F4F4EF; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Stop any time</h3><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3F444C">Reply STOP to end texts, or change channels in <a href="notifications.html" style="color: #1D4ED8">notification settings</a>. Reply REPORT to flag a message.</p></div>
</div>
</div>
</section>
